<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Little World">
<meta name="theme-color" content="#a8dcf7">
<title>Little World — Thế Giới Nhỏ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #4b3a5e; --ink2: #6f5a8a; --cream: #fffaf2; --paper: #fff3dc;
  --sky: #a8dcf7; --mint: #a6e3c4; --yellow: #ffd96b; --orange: #ffac6b; --pink: #ffb8cb; --lav: #c7b5f0; --rose: #f58aa8;
  --shadow: 0 6px 0 rgba(76,56,118,.14), 0 12px 28px rgba(76,56,118,.18);
  --r: 20px;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #a8dcf7; color: var(--ink);
  font-family: 'Nunito', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#game { position: fixed; inset: 0; }
#game canvas { display: block; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }

/* ── thanh trên ── */
.topbar { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; right: 12px; z-index: 20;
  display: flex; align-items: center; gap: 10px; pointer-events: none; }
.topbar > * { pointer-events: auto; }
.back { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; text-decoration: none;
  background: var(--cream); color: var(--ink); font-size: 30px; font-weight: 900; line-height: 1; box-shadow: var(--shadow); padding-bottom: 3px; }
.brand { background: var(--cream); border-radius: 999px; padding: 6px 16px 6px 16px; box-shadow: var(--shadow); line-height: 1.05; }
.brand b { font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 20px; font-weight: 800; color: #f28a4e; display: block; }
.brand span { font-size: 11px; font-weight: 800; color: var(--ink2); }
.tabs { margin-left: auto; display: flex; gap: 4px; background: var(--cream); padding: 5px; border-radius: 999px; box-shadow: var(--shadow); }
.tabs button { border: 0; background: transparent; padding: 8px 14px; border-radius: 999px; font-weight: 900; font-size: 14px; color: var(--ink2); }
.tabs button.on { background: var(--yellow); color: var(--ink); box-shadow: inset 0 -3px 0 rgba(0,0,0,.08); }

/* ── bảng điều khiển ── */
.panel { position: fixed; z-index: 15; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); width: min(400px, calc(100vw - 24px));
  max-height: calc(100vh - 90px); overflow: auto; background: rgba(255,250,242,.96); border-radius: var(--r); box-shadow: var(--shadow);
  padding: 12px; display: flex; flex-direction: column; gap: 10px; border: 3px solid #fff; }
.panel.map-panel, .panel.island-panel { left: 12px; right: auto; width: min(560px, calc(100vw - 24px)); }

<section id="panel" class="panel" hidden></section>

<div id="toast"></div>
<div id="loading"><div class="ld-box"><div class="ld-orb"></div><div class="label">Đang tải thế giới nhỏ…</div><div class="bar"><i></i></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script>(function () {
'use strict';
const M = {};

/* ══════════ services/AssetLoader.ts ══════════ */
M.AssetLoader = (function () {
// ── Nạp tài sản Little World theo manifest ──
// public/assets/asset-manifest.json do art/build-manifest.mjs sinh ra.
// Mỗi scene chỉ nạp nhóm nó cần (lọc theo tiền tố category) để mở nhanh trên điện thoại.

                          

const ASSET_BASE = 'public/assets/';
const MANIFEST_KEY = 'lw-manifest';

                                                                                              
                             
                                                                                     
                                                                                         
                                                                
                                                                                     
 
                                                                                                

let manifest                  = null;
const byId = new Map                    ();

const AssetLoader = {
  /** Gọi trong preload() của scene khởi động. */
  queueManifest(scene     ) {
    scene.load.json(MANIFEST_KEY, ASSET_BASE + 'asset-manifest.json');
  },

  /** Gọi sau khi manifest đã nạp (create() của scene khởi động). */
  init(scene     )           {
    manifest = scene.cache.json.get(MANIFEST_KEY)            ;
    if (!manifest) throw new Error('Không đọc được asset-manifest.json');
    byId.clear();
    for (const e of manifest.entries) byId.set(e.id, e);
    return manifest;
  },

  get manifest()           { return manifest            ; },
  data(key        )      { return manifest ? manifest.data[key] : undefined; },
  entry(id        )                         { return byId.get(id); },
  url(id        )         { const e = byId.get(id); return e ? ASSET_BASE + e.file : ''; },
  byCategory(prefix        )               {
    return manifest ? manifest.entries.filter((e) => e.category === prefix || e.category.startsWith(prefix + '/')) : [];
  },

  /** Xếp hàng nạp các entry (bỏ qua cái đã có texture). Trả về số file đã xếp. */
  queue(scene     , entries              )         {
    let n = 0;
    for (const e of entries) {
      if (!e || scene.textures.exists(e.id)) continue;
      const url = ASSET_BASE + e.file;
      if (e.type === 'spritesheet') {
        scene.load.spritesheet(e.id, url, { frameWidth: e.frameWidth, frameHeight: e.frameHeight });
      } else if (e.type === 'image') {
        if (e.format === 'svg') scene.load.svg(e.id, url, { width: e.width, height: e.height });
        else scene.load.image(e.id, url);
      } else continue;
      n++;
    }
    return n;
  },
  queueIds(scene     , ids                               )         {
    return this.queue(scene, ids.filter(Boolean).map((id) => byId.get(id          )).filter(Boolean)                );
  },
  queueCategories(scene     , prefixes          )         {
    return this.queue(scene, prefixes.flatMap((p) => this.byCategory(p)));
  },

  /** Nạp ngay (ngoài preload), gọi cb khi xong. */
  loadNow(scene     , ids          , cb            ) {
    const n = this.queueIds(scene, ids);
    if (!n) { cb(); return; }
    scene.load.once('complete', () => { this.createAnimations(scene); cb(); });
    scene.load.start();
  },

  /** Tạo mọi animation khai báo trong manifest cho texture đã nạp. */
  createAnimations(scene     ) {
    if (!manifest) return;
    for (const e of manifest.entries) {
      if (!e.animations || !scene.textures.exists(e.id)) continue;
      for (const a of e.animations) {
        if (scene.anims.exists(a.key)) continue;
        scene.anims.create({
          key: a.key,
          frames: scene.anims.generateFrameNumbers(e.id, { frames: a.frames }),
          frameRate: a.frameRate || 8,
          repeat: a.repeat === undefined ? -1 : a.repeat,
        });
      }
    }
  },

  /** Đặt một ảnh theo đúng scale/origin của manifest. */
  image(scene     , id        , x        , y        )      {
    const e = byId.get(id);
    const img = scene.add.image(x, y, id);
    if (e) {
      img.setScale(e.scale ?? 1);
      img.setOrigin(e.origin?.[0] ?? 0.5, e.origin?.[1] ?? 0.5);
    }
    return img;
  },
  sprite(scene     , id        , x        , y        )      {
    const e = byId.get(id);
    const s = scene.add.sprite(x, y, id);
    if (e) {
      s.setScale(e.scale ?? 1);
      s.setOrigin(e.origin?.[0] ?? 0.5, e.origin?.[1] ?? 0.5);
      if (e.animations && e.animations.length && scene.anims.exists(e.animations[0].key)) s.play(e.animations[0].key);
    }
    return s;
  },
};
return { ASSET_BASE, MANIFEST_KEY, AssetLoader };
})();

/* ══════════ services/Ui.ts ══════════ */
M.Ui = (function () {
// ── Lớp giao diện HTML phủ trên canvas (nút, bảng, hộp thoại) ──
// Dùng DOM cho UI để chữ luôn sắc nét và thao tác chạm thoải mái trên điện thoại.

const $ = (sel        ) => document.querySelector(sel)               ;

const Ui = {
  setActiveTab(key        ) {
    document.querySelectorAll             ('.tabs button').forEach((b) => {
      b.classList.toggle('on', b.dataset.scene === key);
    });
  },

  /** Đặt nội dung bảng điều khiển của scene. Trả về phần tử để gắn sự kiện. */
  panel(html        , cls = '')              {
    const el = $('#panel');
    el.className = 'panel ' + cls;
    el.innerHTML = html;
    el.hidden = !html;
    return el;
  },
  clearPanel() { const el = $('#panel'); el.innerHTML = ''; el.hidden = true; },

  /** Thẻ thông tin nổi (ví dụ: vùng đang chọn). */
  card(html               )              {
    const el = $('#card');
    if (!html) { el.hidden = true; el.innerHTML = ''; return el; }
    el.innerHTML = html;
    el.hidden = false;
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    return el;
  },

  modal(html               )              {
    const el = $('#modal');
    if (!html) { el.hidden = true; el.innerHTML = ''; return el; }
    el.innerHTML = `<div class="modal-box">${html}<button class="modal-close" aria-label="Đóng">✕</button></div>`;
    el.hidden = false;
    const close = () => Ui.modal(null);
    el.querySelector('.modal-close') .addEventListener('click', close);
    el.onclick = (e) => { if (e.target === el) close(); };
    return el;
  },

  toast(msg        , ms = 1800) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout((el       )._t);
    (el       )._t = setTimeout(() => el.classList.remove('show'), ms);
  },

  loading(pct               , label = 'Đang tải thế giới nhỏ…') {
    const el = $('#loading');
    if (pct === null) { el.classList.add('done'); setTimeout(() => (el.hidden = true), 400); return; }
    el.hidden = false; el.classList.remove('done');
    (el.querySelector('.bar i')               ).style.width = Math.round(pct * 100) + '%';
    (el.querySelector('.label')               ).textContent = label;
  },

  esc(s        ) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }       )[c]);
  },
};
return { Ui };
})();

/* ══════════ services/CameraControls.ts ══════════ */
M.CameraControls = (function () {
// ── Kéo để di chuyển, chụm hai ngón / con lăn để phóng to ──
// Dùng chung cho bản đồ thế giới và đảo. Chạm nhẹ (không kéo) → onTap.

                          

                             
                                                                 
                                                                            
                                                   
                                             
 

class CameraControls {
  scene     ; cam     ; opts            ;
  minZoom = 0.1; maxZoom = 2;
  locked = false;                           // scene đang kéo một vật → không kéo camera
          downAt                                  = null;
          moved = false;
          pinch                                  = null;
          lastPan                                  = null;

  constructor(scene     , opts            ) {
    this.scene = scene; this.opts = opts; this.cam = scene.cameras.main;
    scene.input.addPointer(1);
    this.cam.setBounds(0, 0, opts.width, opts.height);
    this.refit(true);

    scene.scale.on('resize', this.onResize, this);
    scene.events.once('shutdown', () => scene.scale.off('resize', this.onResize, this));

    scene.input.on('pointerdown', (p     ) => {
      const pts = this.activePointers();
      if (pts.length >= 2) {
        this.pinch = { d: this.dist(pts[0], pts[1]), z: this.cam.zoom };
        this.moved = true;
        return;
      }
      this.downAt = { x: p.x, y: p.y };
      this.lastPan = { x: p.x, y: p.y };
      this.moved = false;
    });

    scene.input.on('pointermove', (p     ) => {
      if (this.opts.onHover && !p.isDown) {
        const w = this.cam.getWorldPoint(p.x, p.y);
        this.opts.onHover(w.x, w.y);
      }
      const pts = this.activePointers();
      if (pts.length >= 2 && this.pinch) {
        const d = this.dist(pts[0], pts[1]);
        const mx = (pts[0].x + pts[1].x) / 2, my = (pts[0].y + pts[1].y) / 2;
        this.zoomAt(this.pinch.z * d / this.pinch.d, mx, my);
        return;
      }
      if (!p.isDown || !this.downAt || this.locked) return;
      const thresh = 8 * (window.devicePixelRatio || 1);
      if (!this.moved && Math.hypot(p.x - this.downAt.x, p.y - this.downAt.y) > thresh) this.moved = true;
      if (this.moved && this.lastPan) {
        this.cam.scrollX -= (p.x - this.lastPan.x) / this.cam.zoom;
        this.cam.scrollY -= (p.y - this.lastPan.y) / this.cam.zoom;
      }
      this.lastPan = { x: p.x, y: p.y };
    });

    scene.input.on('pointerup', (p     ) => {
      if (this.activePointers().length < 2) this.pinch = null;
      if (this.downAt && !this.moved && !this.locked && this.opts.onTap) {
        const w = this.cam.getWorldPoint(p.x, p.y);
        this.opts.onTap(p, w.x, w.y);
      }
      if (this.activePointers().length === 0) { this.downAt = null; this.lastPan = null; }
    });

    scene.input.on('wheel', (p     , _o     , _dx        , dy        ) => {
      this.zoomAt(this.cam.zoom * Math.pow(1.0015, -dy), p.x, p.y);
    });
  }

  /** Vừa thả tay sau khi kéo? Scene dùng để bỏ qua "chạm" giả. */
  get dragging() { return this.moved; }

          activePointers()        {
    return this.scene.input.manager.pointers.filter((p     ) => p.isDown);
  }
          dist(a     , b     ) { return Math.hypot(a.x - b.x, a.y - b.y) || 1; }

          onResize() { this.refit(false); }

  /** Tính mức zoom nhỏ nhất (thế giới phủ kín màn hình). */
  refit(reset         ) {
    const W = this.scene.scale.width, H = this.scene.scale.height;
    this.minZoom = Math.max(W / this.opts.width, H / this.opts.height);
    this.maxZoom = this.minZoom * (this.opts.maxZoom ?? 4);
    if (reset) {
      this.cam.setZoom(this.minZoom);
      this.cam.centerOn(this.opts.width / 2, this.opts.height / 2);
    } else {
      this.cam.setZoom(Phaser.Math.Clamp(this.cam.zoom, this.minZoom, this.maxZoom));
    }
  }

  zoomAt(z        , sx        , sy        ) {
    z = Phaser.Math.Clamp(z, this.minZoom, this.maxZoom);
    const before = this.cam.getWorldPoint(sx, sy);
    this.cam.setZoom(z);
    this.cam.preRender();
    const after = this.cam.getWorldPoint(sx, sy);
    this.cam.scrollX += before.x - after.x;
    this.cam.scrollY += before.y - after.y;
  }

  /** Bay mượt tới một điểm với mức zoom (tương đối so với minZoom). */
  flyTo(x        , y        , rel = 1.6, ms = 700) {
    const z = Phaser.Math.Clamp(this.minZoom * rel, this.minZoom, this.maxZoom);
    this.cam.pan(x, y, ms, 'Sine.easeInOut');
    this.cam.zoomTo(z, ms, 'Sine.easeInOut');
  }

  zoomBy(f        ) {
    this.zoomAt(this.cam.zoom * f, this.scene.scale.width / 2, this.scene.scale.height / 2);
  }
}
return { CameraControls };
})();

/* ══════════ services/LayeredAvatar.ts ══════════ */
M.LayeredAvatar = (function () {
// ── Nhân vật chính ghép lớp ──
// Mỗi lớp (tóc sau, da, mặt, quần, áo, giày, tóc trước, phụ kiện) là một spritesheet
// có CÙNG bố cục khung. Ta chạy một đồng hồ chung và đặt cùng chỉ số khung cho mọi lớp,
// nên các lớp luôn khớp nhau. Lớp tô được (tint) nhân màu theo bảng màu đã chọn.

const { AssetLoader } = M.AssetLoader;
const toInt = (hex        ) => parseInt(String(hex).replace('#', ''), 16);

function avatarConfig()      { return AssetLoader.data('avatar'); }

/** Diện mạo mặc định từ manifest. */
function defaultLook()             {
  const cfg = avatarConfig();
  const d = cfg.defaults || {};
  const variants                                = {};
  const isHex = (v     ) => typeof v === 'string' && v.startsWith('#');
  for (const L of cfg.layers) {
    const v = d[L.slot];
    // defaults.top/bottom/shoes có thể là mã màu (#hex) thay vì asset id → lấy kiểu đầu tiên
    variants[L.slot] = L.slot in d && !isHex(v) ? v : (L.variants.find((x     ) => x.id)?.id ?? null);
  }
  const pal = cfg.palettes || {};
  const pick = (v     , list          , fb        ) => (typeof v === 'number' ? list?.[v] : isHex(v) ? v : null) || list?.[0] || fb;
  return {
    variants,
    colors: {
      skin: pick(d.skin, pal.skin, '#f9cfae'),
      hair: pick(d.hair, pal.hair, '#7a4b2e'),
      top: pick(d.topColor ?? d.top, pal.cloth, '#ffac6b'),
      bottom: pick(d.bottomColor ?? d.bottom, pal.cloth, '#7cc3ee'),
      shoes: pick(d.shoesColor ?? d.shoes, pal.shoes, '#c7b5f0'),
    },
  };
}

/** Mọi asset id cần nạp cho một diện mạo. */
function lookAssetIds(look            )           {
  return Object.values(look.variants).filter(Boolean)            ;
}
function allAvatarAssetIds()           {
  const cfg = avatarConfig();
  return cfg.layers.flatMap((L     ) => L.variants.map((v     ) => v.id)).filter(Boolean);
}

class LayeredAvatar {
  scene     ;
  container     ;
  sprites                      = {};
  cfg     ;
  look            ;
  anim = 'idle-down';
  t = 0;
  flip = false;
  onComplete                      = null;

  constructor(scene     , x        , y        , look             = defaultLook()) {
    this.scene = scene;
    this.cfg = avatarConfig();
    this.container = scene.add.container(x, y);
    this.look = look;
    const [ox, oy] = this.cfg.origin || [0.5, 0.92];
    for (const L of this.cfg.layers) {
      const s = scene.add.sprite(0, 0, '__DEFAULT');
      s.setOrigin(ox, oy);
      s.setScale(this.cfg.scale ?? 0.5);
      this.sprites[L.slot] = s;
      this.container.add(s);
    }
    this.setLook(look);
    this.apply();
  }

  setLook(look            ) {
    this.look = look;
    for (const L of this.cfg.layers) {
      const s = this.sprites[L.slot];
      const id = look.variants[L.slot];
      if (id && this.scene.textures.exists(id)) {
        s.setTexture(id);
        s.setVisible(true);
      } else {
        s.setVisible(false);
      }
      const colorKey = this.cfg.tintSlots?.[L.slot];
      if (L.tint && colorKey) {
        const hex = colorKey === 'cloth' ? (L.slot === 'bottom' ? look.colors.bottom : look.colors.top) : look.colors[colorKey];
        if (hex) s.setTint(toInt(hex)); else s.clearTint();
      } else {
        s.clearTint();
      }
    }
    this.apply();
  }

  play(key        , restart = false, onComplete                      = null) {
    if (!this.cfg.anims[key]) return;
    if (this.anim !== key || restart) { this.anim = key; this.t = 0; }
    this.onComplete = onComplete;
  }

  setFlip(f         ) { this.flip = f; }

  frameIndex()         {
    const a = this.cfg.anims[this.anim];
    const step = Math.floor(this.t * (a.frameRate || 8) / 1000);
    if (a.repeat === -1 || a.repeat === undefined) return a.start + (step % a.count);
    if (step >= a.count) {
      if (this.onComplete) { const cb = this.onComplete; this.onComplete = null; cb(); }
      return a.start + a.count - 1;
    }
    return a.start + step;
  }

  /** Đặt một khung tĩnh theo tên góc nhìn (front/side/back/threequarter). */
  showView(view        ) {
    const idx = this.cfg.views?.[view];
    if (idx === undefined) return;
    this.anim = '__static'; this.t = 0;
    for (const s of Object.values(this.sprites)) if (s.visible) s.setFrame(idx);
  }

  apply() {
    if (this.anim === '__static') return;
    const f = this.frameIndex();
    for (const s of Object.values(this.sprites)) {
      if (!s.visible) continue;
      s.setFrame(f);
      s.setFlipX(this.flip);
    }
  }

  update(dt        ) {
    if (this.anim === '__static') return;
    this.t += dt;
    this.apply();
  }

  set depth(d        ) { this.container.setDepth(d); }
  get x() { return this.container.x; }
  get y() { return this.container.y; }
  setPosition(x        , y        ) { this.container.setPosition(x, y); }
  setScale(s        ) { this.container.setScale(s); }
  destroy() { this.container.destroy(); }
}
return { avatarConfig, defaultLook, lookAssetIds, allAvatarAssetIds, LayeredAvatar };
})();

/* ══════════ scenes/BootScene.ts ══════════ */
M.BootScene = (function () {
// ── Khởi động: đọc manifest rồi mở màn hình theo #hash ──
const { AssetLoader } = M.AssetLoader;
const { Ui } = M.Ui;
const SCENES                         = { map: 'WorldMap', island: 'Island', gallery: 'Gallery' };

function sceneFromHash()         {
  const h = location.hash.replace('#', '');
  return SCENES[h] || 'WorldMap';
}

/** Gói preload chung: xếp hàng tài sản + thanh tiến trình. */
function preloadWithProgress(scene     , queue              , label        ) {
  const n = queue();
  if (!n) return;
  Ui.loading(0, label);
  scene.load.on('progress', (p        ) => Ui.loading(p, label));
  scene.load.once('complete', () => Ui.loading(null));
  scene.load.on('loaderror', (f     ) => console.warn('Không tải được', f.key, f.src));
}

class BootScene extends Phaser.Scene {
  constructor() { super('Boot'); }
  preload() {
    Ui.loading(0.05);
    AssetLoader.queueManifest(this);
  }
  create() {
    AssetLoader.init(this);
    // ảnh UI dùng chung (nhỏ) nạp sẵn
    this.scene.start(sceneFromHash());
  }
}
return { SCENES, sceneFromHash, preloadWithProgress, BootScene };
})();

/* ══════════ scenes/WorldMapPreviewScene.ts ══════════ */
M.WorldMapPreviewScene = (function () {
// ── Màn 1: Xem trước bản đồ thế giới ──
// Phóng to / kéo, rê chuột hoặc chạm để làm nổi vùng, hiện tên vùng, khoá/mở khoá thử.
const { AssetLoader } = M.AssetLoader;
const { CameraControls } = M.CameraControls;
const { Ui } = M.Ui;
const { preloadWithProgress } = M.BootScene;
const hexInt = (h        ) => parseInt(String(h || '#ffffff').replace('#', ''), 16);

class WorldMapPreviewScene extends Phaser.Scene {
  world     ;
  controls     ;
  polys                      = {};
  overlays                        = {};
  labels                      = {};
  unlocked                          = {};
  hover                = null;
  selected                = null;
  hl     ; hlGlow     ;
  showLabels = true;
  t = 0;

  constructor() { super('WorldMap'); }

  preload() {
    preloadWithProgress(this, () => {
      const entries = ['world-map', 'regions', 'ui']
        .flatMap((p) => AssetLoader.byCategory(p))
        // ảnh nền từng vùng lớn — chỉ nạp khi mở xem vùng
        .filter((e) => !/background\.webp$/.test(e.file));
      return AssetLoader.queue(this, entries);
    }, 'Đang mở bản đồ thế giới…');
  }

  create() {
    Ui.setActiveTab('WorldMap');
    AssetLoader.createAnimations(this);
    const W = this.world = AssetLoader.data('world');
    this.cameras.main.setBackgroundColor('#5ab4e0');

    const base = this.add.image(0, 0, W.background).setOrigin(0, 0).setDisplaySize(W.width, W.height);
    base.setDepth(0);

    // lớp tô nổi vùng (dưới các công trình) + viền sáng (trên)
    this.hl = this.add.graphics().setDepth(1);
    this.hlGlow = this.add.graphics().setDepth(4800);

    // công trình từng vùng
    for (const r of W.regions) {
      this.polys[r.id] = new Phaser.Geom.Polygon(r.polygon.flat());
      this.unlocked[r.id] = !!r.unlocked;
      for (const lm of r.landmarks || []) {
        if (!this.textures.exists(lm.asset)) continue;
        const s = AssetLoader.sprite(this, lm.asset, lm.x, lm.y);
        s.setDepth(10 + lm.y / 10);
        if (lm.scale) s.setScale(s.scaleX * lm.scale);
      }
    }

    // đảo của bé
    if (W.homeIsland && this.textures.exists(W.homeIsland.asset)) {
      const h = AssetLoader.sprite(this, W.homeIsland.asset, W.homeIsland.x, W.homeIsland.y);
      h.setDepth(10 + W.homeIsland.y / 10);
      this.tweens.add({ targets: h, y: h.y - 10, duration: 2200, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
      const pin = this.textures.exists('ui-map-pin') ? AssetLoader.image(this, 'ui-map-pin', W.homeIsland.x, W.homeIsland.y - h.displayHeight * 0.9) : null;
      if (pin) {
        pin.setDepth(5600);
        this.tweens.add({ targets: pin, y: pin.y - 18, duration: 700, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
      }
    }

    // trang trí: mây trôi, chim bay, thuyền dập dềnh
    for (const d of W.decorations || []) {
      if (!this.textures.exists(d.asset)) continue;
      const s = AssetLoader.sprite(this, d.asset, d.x, d.y);
      const isCloud = /cloud/.test(d.asset);
      s.setDepth(isCloud ? 5200 + d.y / 100 : 10 + d.y / 10);
      if (d.anim && this.anims.exists(d.anim)) s.play(d.anim);
      if (d.flipX) s.setFlipX(true);
      if (d.drift || isCloud) {
        const dist = 600 + (d.x % 400);
        this.tweens.add({ targets: s, x: s.x + dist, duration: 40000 + (d.y % 7) * 4000, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
      } else {
        this.tweens.add({ targets: s, y: s.y - 6, duration: 1600 + (d.x % 900), yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
      }
    }

    // mây khoá + ổ khoá
    for (const r of W.regions) this.buildOverlay(r);

    // nhãn tên vùng
    for (const r of W.regions) this.labels[r.id] = this.buildLabel(r);

    this.controls = new CameraControls(this, {
      width: W.width, height: W.height, maxZoom: 3.2,
      onHover: (x, y) => this.setHover(this.regionAt(x, y)),
      onTap: (_p, x, y) => this.tap(x, y),
    });

    this.buildPanel();
    Ui.card(null);
    this.events.once('shutdown', () => { Ui.card(null); Ui.clearPanel(); });
  }

  // ───────────── dựng ─────────────
  buildOverlay(r     ) {
    const o = r.lockedOverlay;
    const parts        = [];
    if (o && this.textures.exists(o.asset)) {
      const s = AssetLoader.image(this, o.asset, o.x, o.y).setDepth(5000);
      this.tweens.add({ targets: s, alpha: { from: 0.96, to: 0.86 }, duration: 2400, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
      parts.push(s);
    }
    if (this.textures.exists('ui-lock-badge')) {
      const c = r.label || r.center;
      const b = AssetLoader.image(this, 'ui-lock-badge', c[0], c[1] - 110).setDepth(5100);
      this.tweens.add({ targets: b, angle: { from: -6, to: 6 }, duration: 1300, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
      parts.push(b);
    }
    this.overlays[r.id] = parts;
    for (const p of parts) p.setVisible(!this.unlocked[r.id]);
  }

  buildLabel(r     ) {
    const [x, y] = r.label || r.center;
    const c = this.add.container(x, y).setDepth(6000);
    const txt = this.add.text(0, 0, r.name, {
      fontFamily: '"Baloo 2", Nunito, sans-serif', fontSize: '54px', fontStyle: '800',
      color: '#ffffff', stroke: '#' + hexInt(r.color).toString(16).padStart(6, '0'), strokeThickness: 0,
    }).setOrigin(0.5, 0.5);
    const sub = this.add.text(0, 40, r.nameEn || '', {
      fontFamily: 'Nunito, sans-serif', fontSize: '26px', fontStyle: '800', color: '#4b3a5e',
    }).setOrigin(0.5, 0.5);
    const w = Math.max(txt.width, sub.width) + 70, h = 118;
    const bg = this.add.graphics();
    bg.fillStyle(0x4b3a5e, 0.18).fillRoundedRect(-w / 2 + 4, -h / 2 + 10, w, h, 40);
    bg.fillStyle(0xfffaf2, 0.96).fillRoundedRect(-w / 2, -h / 2, w, h, 40);
    bg.fillStyle(hexInt(r.color), 1).fillRoundedRect(-w / 2 + 10, -h / 2 + 8, w - 20, 62, 30);
    txt.setY(-h / 2 + 39);
    sub.setY(h / 2 - 25);
    c.add([bg, txt, sub]);
    c.setSize(w, h);
    (c       ).baseScale = 1;
    return c;
  }

  buildPanel() {
    const el = Ui.panel(`
      <div class="row">
        <button class="btn icon" data-a="zin" aria-label="Phóng to">＋</button>
        <button class="btn icon" data-a="zout" aria-label="Thu nhỏ">－</button>
        <button class="btn" data-a="fit">Toàn cảnh</button>
        <button class="btn" data-a="labels">Ẩn tên vùng</button>
        <button class="btn accent" data-a="home">Đảo của bé</button>
      </div>
      <div class="chips">${this.world.regions.map((r     ) =>
        `<button class="chip" data-r="${r.id}" style="--c:${r.color}"><img src="${AssetLoader.url(r.icon)}" alt="">${Ui.esc(r.name)}</button>`).join('')}</div>
    `, 'map-panel');
    el.onclick = (e     ) => {
      const b = e.target.closest('button'); if (!b) return;
      const a = b.dataset.a;
      if (a === 'zin') this.controls.zoomBy(1.35);
      else if (a === 'zout') this.controls.zoomBy(1 / 1.35);
      else if (a === 'fit') { this.select(null); this.controls.flyTo(this.world.width / 2, this.world.height / 2, 1, 600); }
      else if (a === 'labels') {
        this.showLabels = !this.showLabels;
        b.textContent = this.showLabels ? 'Ẩn tên vùng' : 'Hiện tên vùng';
        for (const l of Object.values(this.labels)) (l       ).setVisible(this.showLabels);
      } else if (a === 'home') this.goHome();
      else if (b.dataset.r) this.select(b.dataset.r, true);
    };
  }

  // ───────────── tương tác ─────────────
  regionAt(x        , y        )                {
    for (const r of this.world.regions) if (Phaser.Geom.Polygon.Contains(this.polys[r.id], x, y)) return r.id;
    return null;
  }

  tap(x        , y        ) {
    const h = this.world.homeIsland;
    if (h && Math.hypot(x - h.x, y - (h.y - 80)) < 170) { this.showHomeCard(); return; }
    const id = this.regionAt(x, y);
    this.select(id, !!id);
  }

  setHover(id               ) {
    if (id === this.hover) return;
    this.hover = id;
    this.input.setDefaultCursor(id ? 'pointer' : 'grab');
    this.drawHighlight();
  }

  select(id               , fly = false) {
    this.selected = id;
    this.drawHighlight();
    for (const [rid, l] of Object.entries(this.labels)) {
      this.tweens.add({ targets: l, scale: (l       ).baseScale * (rid === id ? 1.25 : 1), duration: 220, ease: 'Back.easeOut' });
    }
    if (!id) { Ui.card(null); return; }
    const r = this.world.regions.find((x     ) => x.id === id);
    if (fly) this.controls.flyTo(r.center[0], r.center[1], 1.7, 650);
    this.showRegionCard(r);
  }

  drawHighlight() {
    this.hl.clear(); this.hlGlow.clear();
    const draw = (id        , strong         ) => {
      const r = this.world.regions.find((x     ) => x.id === id);
      const pts = r.polygon.map(([x, y]          ) => new Phaser.Geom.Point(x, y));
      this.hl.fillStyle(hexInt(r.color), strong ? 0.3 : 0.18).fillPoints(pts, true);
      this.hlGlow.lineStyle(strong ? 26 : 18, 0xffffff, strong ? 0.35 : 0.22).strokePoints(pts, true);
      this.hlGlow.lineStyle(strong ? 9 : 6, 0xfffaf2, 0.95).strokePoints(pts, true);
    };
    if (this.hover && this.hover !== this.selected) draw(this.hover, false);
    if (this.selected) draw(this.selected, true);
  }

  showRegionCard(r     ) {
    const open = this.unlocked[r.id];
    const el = Ui.card(`
      <div class="card-head" style="--c:${r.color}">
        <img class="card-icon" src="${AssetLoader.url(r.icon)}" alt="">
        <div><h3>${Ui.esc(r.name)}</h3><p>${Ui.esc(r.nameEn || '')}</p></div>
        <span class="badge ${open ? 'open' : 'locked'}">${open ? 'Đã mở' : 'Đang khoá'}</span>
      </div>
      <div class="card-art"><img src="${AssetLoader.url(r.entrance)}" alt="Cổng vào ${Ui.esc(r.name)}"></div>
      <div class="row">
        <button class="btn accent" data-a="view">Xem vùng</button>
        <button class="btn" data-a="lock">${open ? 'Khoá lại (thử)' : 'Mở khoá (thử)'}</button>
        <button class="btn ghost" data-a="close">Đóng</button>
      </div>`);
    el.onclick = (e     ) => {
      const a = e.target.closest('button')?.dataset.a;
      if (a === 'close') this.select(null);
      else if (a === 'lock') this.toggleLock(r);
      else if (a === 'view') this.showRegionView(r);
    };
  }

  showHomeCard() {
    this.select(null);
    const el = Ui.card(`
      <div class="card-head" style="--c:#ffd96b">
        <div><h3>Đảo của bé</h3><p>Personal Island</p></div>
      </div>
      <p class="card-text">Hòn đảo nhỏ của riêng bé — nơi có ngôi nhà, khu vườn và thú cưng.</p>
      <div class="row"><button class="btn accent" data-a="go">Đến đảo</button><button class="btn ghost" data-a="close">Đóng</button></div>`);
    el.onclick = (e     ) => {
      const a = e.target.closest('button')?.dataset.a;
      if (a === 'go') this.goHome(); else if (a === 'close') Ui.card(null);
    };
  }

  goHome() { location.hash = 'island'; }

  toggleLock(r     ) {
    const open = !this.unlocked[r.id];
    this.unlocked[r.id] = open;
    for (const p of this.overlays[r.id] || []) {
      if (open) this.tweens.add({ targets: p, alpha: 0, scale: p.scale * 1.15, duration: 600, onComplete: () => { p.setVisible(false); p.setAlpha(1); p.setScale(p.scale / 1.15); } });
      else { p.setVisible(true); p.setAlpha(0); this.tweens.add({ targets: p, alpha: 1, duration: 500 }); }
    }
    if (open && this.textures.exists('ui-unlocked-sparkle')) {
      const c = r.label || r.center;
      const s = AssetLoader.image(this, 'ui-unlocked-sparkle', c[0], c[1] - 60).setDepth(5900).setAlpha(0);
      const sc = s.scale;
      s.setScale(sc * 0.4);
      this.tweens.add({ targets: s, alpha: 1, scale: sc * 1.4, duration: 450, ease: 'Back.easeOut', yoyo: true, hold: 500, onComplete: () => s.destroy() });
    }
    Ui.toast(open ? `Đã mở khoá ${r.name}!` : `${r.name} đã khoá lại`);
    this.showRegionCard(r);
  }

  showRegionView(r     ) {
    const bg = this.world.regions && AssetLoader.url(r.background);
    const lms = (r.landmarks || []).map((l     ) => `<img src="${AssetLoader.url(l.asset)}" alt="">`).join('');
    Ui.modal(`
      <div class="region-view" style="--c:${r.color}">
        <div class="rv-stage">
          <img class="rv-bg" src="${bg}" alt="Khung cảnh ${Ui.esc(r.name)}">
          <img class="rv-gate" src="${AssetLoader.url(r.entrance)}" alt="">
          <div class="rv-title"><img src="${AssetLoader.url(r.icon)}" alt=""><span>${Ui.esc(r.name)}</span></div>
        </div>
        <div class="rv-strip">${lms}</div>
      </div>`);
  }

  update(_t        , dt        ) {
    if (!this.controls) return;
    // nhãn giữ cỡ dễ đọc khi phóng to
    const rel = this.cameras.main.zoom / this.controls.minZoom;
    const s = Math.pow(rel, -0.75);
    for (const l of Object.values(this.labels)         ) {
      if (l.baseScale !== s) {
        const sel = this.selected && this.labels[this.selected] === l;
        l.baseScale = s;
        if (!this.tweens.isTweening(l)) l.setScale(s * (sel ? 1.25 : 1));
      }
    }
    this.t += dt;
  }
}
return { WorldMapPreviewScene };
})();

/* ══════════ scenes/IslandPreviewScene.ts ══════════ */
M.IslandPreviewScene = (function () {
// ── Màn 2: Xem trước đảo của bé ──
// Dạo chơi: chạm mặt đất để bé đi tới, thú cưng đi theo.
// Sắp xếp: kéo thả đồ vật, chọn đồ trong túi đồ rồi chạm để đặt, lật / cất đồ.
const { AssetLoader } = M.AssetLoader;
const { CameraControls } = M.CameraControls;
const { LayeredAvatar, defaultLook, lookAssetIds } = M.LayeredAvatar;
const { Ui } = M.Ui;
const { preloadWithProgress } = M.BootScene;
const PET_IDS = ['fox', 'bunny', 'bear'];
const SNAP = 16;

class IslandPreviewScene extends Phaser.Scene {
  L     ;
  controls     ;
  walk     ;
  grid     ;
  avatar     ;
  pet     ;
  petId = 'fox';
  objs        = [];
  mode                  = 'play';
  selected      = null;
  selRing     ;
  placing                = null;
  ghost      = null;
  target                                  = null;
  facing = 'down';
  running = false;
  petBusy = false;
  dragFrom                                  = null;
  tapMarker     ;

  constructor() { super('Island'); }

  preload() {
    preloadWithProgress(this, () => {
      const pets = AssetLoader.data('pets') || {};
      const ids = [
        ...lookAssetIds(defaultLook()),
        ...PET_IDS.map((p) => pets[p]?.sheet),
      ];
      return AssetLoader.queueCategories(this, ['island', 'environment']) + AssetLoader.queueIds(this, ids);
    }, 'Đang ghé thăm đảo của bé…');
  }

  create() {
    Ui.setActiveTab('Island');
    AssetLoader.createAnimations(this);
    const L = this.L = AssetLoader.data('island');
    this.cameras.main.setBackgroundColor('#5ab4e0');

    this.add.image(0, 0, L.terrain).setOrigin(0, 0).setDisplaySize(L.width, L.height).setDepth(-10);
    if (L.gridOverlay && this.textures.exists(L.gridOverlay)) {
      this.grid = this.add.image(0, 0, L.gridOverlay).setOrigin(0, 0).setDisplaySize(L.width, L.height).setDepth(-5).setVisible(false);
    }
    this.walk = new Phaser.Geom.Polygon(L.walkArea.flat());

    for (const o of L.objects) this.addObject(o.asset, o.x, o.y, !!o.flipX);

    this.selRing = this.add.graphics().setDepth(-1);
    this.tapMarker = this.add.graphics().setDepth(-2);

    // bé + thú cưng
    const [ax, ay] = L.spawn.avatar;
    this.avatar = new LayeredAvatar(this, ax, ay);
    this.avatar.container.setSize(60, 90);
    this.avatar.container.setInteractive(new Phaser.Geom.Rectangle(-30, -84, 60, 88), Phaser.Geom.Rectangle.Contains);
    this.avatar.container.on('pointerup', () => {
      if (this.mode !== 'play' || this.controls.dragging) return;
      this.target = null;
      this.avatar.play('wave', true, () => this.avatar.play('idle-down'));
    });
    this.spawnPet(this.petId);

    this.controls = new CameraControls(this, {
      width: L.width, height: L.height, maxZoom: 3.5,
      onTap: (_p, x, y) => this.tap(x, y),
      onHover: (x, y) => this.moveGhost(x, y),
    });
    this.cameras.main.setZoom(this.controls.minZoom * (this.scale.width > this.scale.height ? 1.35 : 1));
    this.cameras.main.centerOn(ax, ay - 120);

    // kéo thả đồ (chế độ sắp xếp)
    this.input.on('gameobjectdown', (_p     , obj     ) => {
      if (this.mode !== 'edit' || !obj.getData('placed') || this.placing) return;
      this.controls.locked = true;
      this.select(obj);
      this.dragFrom = { x: obj.x, y: obj.y };
    });
    this.input.on('drag', (_p     , obj     , dx        , dy        ) => {
      if (this.mode !== 'edit' || !obj.getData('placed')) return;
      obj.setPosition(Math.round(dx / SNAP) * SNAP, Math.round(dy / SNAP) * SNAP);
      obj.setDepth(obj.y);
      obj.setTint(this.inside(obj.x, obj.y) ? 0xffffff : 0xff9b9b);
      this.drawSelection();
    });
    this.input.on('dragend', (_p     , obj     ) => {
      obj.clearTint();
      if (!this.inside(obj.x, obj.y) && this.dragFrom) {
        this.tweens.add({ targets: obj, x: this.dragFrom.x, y: this.dragFrom.y, duration: 220, ease: 'Back.easeOut', onUpdate: () => this.drawSelection(), onComplete: () => obj.setDepth(obj.y) });
        Ui.toast('Chỉ đặt được trên đất của đảo');
      } else {
        this.bounce(obj);
      }
    });
    this.input.on('pointerup', () => { setTimeout(() => { this.controls.locked = false; }, 0); });

    this.buildPanel();
    this.events.once('shutdown', () => { Ui.clearPanel(); Ui.card(null); });
  }

  // ───────────── đồ vật ─────────────
  addObject(asset        , x        , y        , flipX = false) {
    if (!this.textures.exists(asset)) return null;
    const s = AssetLoader.sprite(this, asset, x, y);
    s.setDepth(y).setFlipX(flipX);
    s.setData('placed', true).setData('asset', asset);
    s.setInteractive({ pixelPerfect: true, alphaTolerance: 40, draggable: false, useHandCursor: false });
    this.objs.push(s);
    return s;
  }

  inside(x        , y        ) { return Phaser.Geom.Polygon.Contains(this.walk, x, y); }

  bounce(obj     ) {
    const sy = obj.scaleY;
    this.tweens.add({ targets: obj, scaleY: sy * 0.9, duration: 90, yoyo: true, ease: 'Quad.easeOut', onComplete: () => obj.setScale(obj.scaleX, sy) });
  }

  select(obj     ) {
    this.selected = obj;
    this.drawSelection();
    if (!obj) { Ui.card(null); return; }
    const e = AssetLoader.entry(obj.getData('asset'));
    const el = Ui.card(`
      <div class="card-head" style="--c:#a6e3c4"><img class="card-icon sq" src="${AssetLoader.url(obj.getData('asset'))}" alt="">
      <div><h3>${Ui.esc(e?.usage || obj.getData('asset'))}</h3><p>${Ui.esc(e?.category || '')}</p></div></div>
      <div class="row">
        <button class="btn" data-a="flip">Lật</button>
        <button class="btn" data-a="dup">Nhân bản</button>
        <button class="btn danger" data-a="del">Cất đi</button>
        <button class="btn ghost" data-a="close">Xong</button>
      </div>`, );
    el.onclick = (ev     ) => {
      const a = ev.target.closest('button')?.dataset.a;
      if (!a || !this.selected) return;
      const o = this.selected;
      if (a === 'flip') { o.setFlipX(!o.flipX); this.bounce(o); }
      else if (a === 'dup') {
        const n = this.addObject(o.getData('asset'), o.x + 64, o.y + 32, o.flipX);
        if (n) { if (this.mode === 'edit') this.input.setDraggable(n, true); this.select(n); this.bounce(n); }
      } else if (a === 'del') {
        this.objs = this.objs.filter((x) => x !== o);
        this.tweens.add({ targets: o, alpha: 0, scale: o.scale * 0.6, duration: 200, onComplete: () => o.destroy() });
        this.select(null);
      } else if (a === 'close') this.select(null);
    };
  }

  drawSelection() {
    const g = this.selRing; g.clear();
    const o = this.selected;
    if (!o || !o.active) return;
    const w = Math.max(40, o.displayWidth * 0.55);
    g.lineStyle(6, 0xffffff, 0.95).strokeEllipse(o.x, o.y, w, w * 0.36);
    g.lineStyle(3, 0xffac6b, 1).strokeEllipse(o.x, o.y, w + 10, w * 0.36 + 6);
  }

  // ───────────── chế độ ─────────────
  setMode(m                 ) {
    this.mode = m;
    this.setPlacing(null);
    this.select(null);
    for (const o of this.objs) this.input.setDraggable(o, m === 'edit');
    if (this.grid) this.grid.setVisible(m === 'edit' || this.grid.getData('forced'));
    this.buildPanel();
  }

  setPlacing(id               ) {
    this.placing = id;
    if (this.ghost) { this.ghost.destroy(); this.ghost = null; }
    if (id) {
      this.select(null);
      this.ghost = AssetLoader.image(this, id, -999, -999).setAlpha(0.65).setDepth(99999);
      const p = this.input.activePointer;
      const w = this.cameras.main.getWorldPoint(p.x, p.y);
      this.moveGhost(w.x, w.y);
    }
    document.querySelectorAll             ('.palette button').forEach((b) => b.classList.toggle('on', b.dataset.id === id));
  }

  moveGhost(x        , y        ) {
    if (!this.ghost) return;
    const sx = Math.round(x / SNAP) * SNAP, sy = Math.round(y / SNAP) * SNAP;
    this.ghost.setPosition(sx, sy);
    this.ghost.setTint(this.inside(sx, sy) ? 0xffffff : 0xff8f8f);
  }

  tap(x        , y        ) {
    if (this.mode === 'edit') {
      if (this.placing) {
        const sx = Math.round(x / SNAP) * SNAP, sy = Math.round(y / SNAP) * SNAP;
        if (!this.inside(sx, sy)) { Ui.toast('Chỉ đặt được trên đất của đảo'); return; }
        const o = this.addObject(this.placing, sx, sy);
        if (o) { this.input.setDraggable(o, true); this.bounce(o); }
        return;
      }
      // chạm vào chỗ trống → bỏ chọn
      const hit = this.input.hitTestPointer(this.input.activePointer).filter((o     ) => o.getData && o.getData('placed'));
      if (!hit.length) this.select(null);
      return;
    }
    // dạo chơi: đi tới điểm chạm
    if (!this.inside(x, y)) { Ui.toast('Bé không bơi được đâu!'); return; }
    this.target = { x, y };
    const d = Math.hypot(x - this.avatar.x, y - this.avatar.y);
    this.running = d > 340;
    this.tapMarker.clear();
    this.tapMarker.lineStyle(5, 0xffffff, 0.9).strokeEllipse(x, y, 46, 18);
    this.tapMarker.setAlpha(1);
    this.tweens.killTweensOf(this.tapMarker);
    this.tweens.add({ targets: this.tapMarker, alpha: 0, duration: 700, delay: 150 });
  }

  // ───────────── thú cưng ─────────────
  spawnPet(id        ) {
    const pets = AssetLoader.data('pets') || {};
    const P = pets[id];
    if (!P || !this.textures.exists(P.sheet)) return;
    const pos = this.pet ? { x: this.pet.x, y: this.pet.y } : { x: this.L.spawn.pet[0], y: this.L.spawn.pet[1] };
    if (this.pet) this.pet.destroy();
    this.petId = id;
    const s = this.pet = this.add.sprite(pos.x, pos.y, P.sheet);
    s.setOrigin(...(P.origin || [0.5, 0.92])).setScale(P.scale ?? 0.5);
    s.setData('cfg', P);
    this.petPlay('greet', () => this.petPlay('idle-front'));
    s.setInteractive({ pixelPerfect: true, alphaTolerance: 40 });
    s.on('pointerup', () => {
      if (this.mode !== 'play' || this.controls.dragging) return;
      this.petPlay(Math.random() < 0.5 ? 'interact' : 'happy', () => this.petPlay('idle-front'));
    });
  }

  petPlay(anim        , done             ) {
    const key = `${this.petId}-${anim}`;
    if (!this.pet || !this.anims.exists(key)) return;
    if (done) {
      this.petBusy = true;
      this.pet.play(key);
      this.pet.once('animationcomplete', () => { this.petBusy = false; done(); });
    } else if (this.pet.anims.currentAnim?.key !== key) this.pet.play(key);
  }

  // ───────────── bảng điều khiển ─────────────
  buildPanel() {
    const L = this.L;
    const pets = AssetLoader.data('pets') || {};
    const petBtns = PET_IDS.filter((p) => pets[p]).map((p) => {
      const portrait = AssetLoader.entry(`${p}-portrait`) ? AssetLoader.url(`${p}-portrait`) : '';
      return `<button class="pet ${p === this.petId ? 'on' : ''}" data-pet="${p}" title="${Ui.esc(pets[p].name || p)}">${portrait ? `<img src="${portrait}" alt="">` : ''}<span>${Ui.esc(pets[p].name || p)}</span></button>`;
    }).join('');
    const palette = this.mode === 'edit'
      ? `<div class="palette">${(L.placeable || []).filter((id        ) => AssetLoader.entry(id)).map((id        ) =>
        `<button data-id="${id}" class="${id === this.placing ? 'on' : ''}" title="${Ui.esc(AssetLoader.entry(id)?.usage || id)}"><img src="${AssetLoader.url(id)}" alt=""></button>`).join('')}</div>
        <p class="hint">Kéo đồ để di chuyển · chọn đồ bên trên rồi chạm lên đảo để đặt</p>`
      : `<p class="hint">Chạm mặt đất để bé đi · chạm bé hoặc thú cưng để chào</p>`;
    const el = Ui.panel(`
      <div class="row">
        <div class="seg"><button data-m="play" class="${this.mode === 'play' ? 'on' : ''}">Dạo chơi</button><button data-m="edit" class="${this.mode === 'edit' ? 'on' : ''}">Sắp xếp</button></div>
        <button class="btn" data-a="grid">Lưới</button>
        <button class="btn icon" data-a="zin" aria-label="Phóng to">＋</button>
        <button class="btn icon" data-a="zout" aria-label="Thu nhỏ">－</button>
        <button class="btn" data-a="map">Bản đồ</button>
      </div>
      <div class="pets">${petBtns}</div>
      ${palette}`, 'island-panel');
    el.onclick = (e     ) => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.m) this.setMode(b.dataset.m);
      else if (b.dataset.pet) { this.spawnPet(b.dataset.pet); this.buildPanel(); }
      else if (b.dataset.id) this.setPlacing(this.placing === b.dataset.id ? null : b.dataset.id);
      else if (b.dataset.a === 'grid' && this.grid) { const v = !this.grid.visible; this.grid.setVisible(v).setData('forced', v); }
      else if (b.dataset.a === 'zin') this.controls.zoomBy(1.35);
      else if (b.dataset.a === 'zout') this.controls.zoomBy(1 / 1.35);
      else if (b.dataset.a === 'map') location.hash = 'map';
    };
  }

  // ───────────── vòng lặp ─────────────
  update(_t        , dt        ) {
    if (!this.avatar) return;
    const A = this.avatar;
    if (this.target) {
      const dx = this.target.x - A.x, dy = this.target.y - A.y;
      const d = Math.hypot(dx, dy);
      const speed = (this.running ? 250 : 140) * dt / 1000;
      if (d <= speed) {
        A.setPosition(this.target.x, this.target.y);
        this.target = null;
        A.play(`idle-${this.facing}`);
        if (!this.petBusy && Math.random() < 0.35) this.petPlay('happy', () => this.petPlay('idle-front'));
      } else {
        A.setPosition(A.x + dx / d * speed, A.y + dy / d * speed);
        if (Math.abs(dx) > Math.abs(dy) * 1.1) { this.facing = 'side'; A.setFlip(dx < 0); }
        else this.facing = dy > 0 ? 'down' : 'up';
        A.play(`${this.running ? 'run' : 'walk'}-${this.facing}`);
      }
    }
    A.container.setDepth(A.y);
    A.update(dt);

    // thú cưng đi theo, đứng chếch phía sau bé
    const P = this.pet;
    if (P) {
      const side = A.flip ? 1 : -1;
      const off = this.facing === 'side' ? { x: side * 70, y: 6 } : this.facing === 'up' ? { x: 46, y: 46 } : { x: 56, y: -18 };
      const tx = A.x + off.x, ty = A.y + off.y;
      const dx = tx - P.x, dy = ty - P.y, d = Math.hypot(dx, dy);
      if (d > 24) {
        const sp = Math.min(d, (d > 120 ? 280 : 150) * dt / 1000);
        P.x += dx / d * sp; P.y += dy / d * sp;
        this.petBusy = false;
        if (Math.abs(dx) > Math.abs(dy)) { this.petPlay('walk-side'); P.setFlipX(dx < 0); }
        else { this.petPlay(dy > 0 ? 'walk-front' : 'walk-back'); P.setFlipX(false); }
      } else if (!this.petBusy) {
        const cur = P.anims.currentAnim?.key || '';
        if (/walk-side/.test(cur)) this.petPlay('idle-side');
        else if (/walk/.test(cur)) this.petPlay('idle-front');
      }
      P.setDepth(P.y);
    }
  }
}
return { IslandPreviewScene };
})();

/* ══════════ scenes/CharacterGalleryScene.ts ══════════ */
M.CharacterGalleryScene = (function () {
// ── Màn 3: Phòng trưng bày nhân vật ──
// Bé (4 góc nhìn + animation + tuỳ biến từng lớp) và ba thú cưng (animation).
const { AssetLoader } = M.AssetLoader;
const { LayeredAvatar, avatarConfig, defaultLook, allAvatarAssetIds, AvatarLook } = M.LayeredAvatar;
const { Ui } = M.Ui;
const { preloadWithProgress } = M.BootScene;
const PET_IDS = ['fox', 'bunny', 'bear'];
const VIEWS                     = [['front', 'Trước'], ['threequarter', '3/4'], ['side', 'Bên'], ['back', 'Sau']];
const ANIM_NAMES                         = {
  'idle-down': 'Đứng (trước)', 'idle-up': 'Đứng (sau)', 'idle-side': 'Đứng (bên)', 'idle-threequarter': 'Đứng (3/4)',
  'walk-down': 'Đi (trước)', 'walk-up': 'Đi (sau)', 'walk-side': 'Đi (bên)',
  'run-down': 'Chạy (trước)', 'run-up': 'Chạy (sau)', 'run-side': 'Chạy (bên)',
  happy: 'Vui vẻ', celebrate: 'Ăn mừng', think: 'Suy nghĩ', wave: 'Vẫy tay', interact: 'Tương tác',
  'idle-front': 'Đứng (trước)', 'walk-front': 'Đi (trước)', 'walk-back': 'Đi (sau)', greet: 'Chào',
};
const COLOR_SLOTS                             = [['skin', 'Màu da', 'skin'], ['hair', 'Màu tóc', 'hair'], ['top', 'Màu áo', 'cloth'], ['bottom', 'Màu quần/váy', 'cloth'], ['shoes', 'Màu giày', 'shoes']];

class CharacterGalleryScene extends Phaser.Scene {
  look             = null       ;
  hero     ;
  views        = [];
  pets                      = {};
  bg     ;
  tab                    = 'avatar';
  heroAnim = 'idle-down';
  petAnim                         = { fox: 'idle-front', bunny: 'idle-front', bear: 'idle-front' };
  labels        = [];

  constructor() { super('Gallery'); }

  preload() {
    preloadWithProgress(this, () => {
      const pets = AssetLoader.data('pets') || {};
      return AssetLoader.queueIds(this, [...allAvatarAssetIds(), ...PET_IDS.map((p) => pets[p]?.sheet)]);
    }, 'Đang mời các bạn nhỏ ra chào…');
  }

  create() {
    Ui.setActiveTab('Gallery');
    AssetLoader.createAnimations(this);
    this.cameras.main.setBackgroundColor('#fff3dc');
    this.bg = this.add.graphics().setDepth(-10);
    this.look = this.loadLook();

    this.hero = new LayeredAvatar(this, 0, 0, this.look);
    this.hero.play(this.heroAnim);
    for (const [v] of VIEWS) {
      const a = new LayeredAvatar(this, 0, 0, this.look);
      a.showView(v);
      this.views.push(a);
    }
    const pets = AssetLoader.data('pets') || {};
    for (const p of PET_IDS) {
      const P = pets[p];
      if (!P || !this.textures.exists(P.sheet)) continue;
      const s = this.add.sprite(0, 0, P.sheet).setOrigin(...(P.origin || [0.5, 0.92]));
      s.setInteractive({ pixelPerfect: true, alphaTolerance: 40, useHandCursor: true });
      s.on('pointerup', () => this.playPet(p, 'greet'));
      this.pets[p] = s;
      this.playPet(p, 'idle-front');
    }
    this.hero.container.setSize(120, 180);

    this.layout();
    this.scale.on('resize', this.layout, this);
    this.events.once('shutdown', () => { this.scale.off('resize', this.layout, this); Ui.clearPanel(); });
    this.buildPanel();
  }

  // ───────────── diện mạo ─────────────
  loadLook()             {
    try {
      const s = JSON.parse(localStorage.getItem('lw-look') || 'null');
      if (s && s.variants && s.colors) {
        const cfg = avatarConfig();
        const ok = cfg.layers.every((L     ) => !(L.slot in s.variants) || s.variants[L.slot] === null || L.variants.some((v     ) => v.id === s.variants[L.slot]));
        if (ok) return { variants: { ...defaultLook().variants, ...s.variants }, colors: { ...defaultLook().colors, ...s.colors } };
      }
    } catch (e) { /* bỏ qua */ }
    return defaultLook();
  }
  saveLook() { try { localStorage.setItem('lw-look', JSON.stringify(this.look)); } catch (e) { /* bỏ qua */ } }

  applyLook() {
    this.hero.setLook(this.look);
    for (let i = 0; i < this.views.length; i++) { this.views[i].setLook(this.look); this.views[i].showView(VIEWS[i][0]); }
    this.saveLook();
  }

  randomize() {
    const cfg = avatarConfig();
    const pick = (a       ) => a[Math.floor(Math.random() * a.length)];
    for (const L of cfg.layers) if (L.variants.length > 1) this.look.variants[L.slot] = pick(L.variants).id;
    if (hasHairPair(cfg)) this.look.variants.hairBack = matchingHairBack(cfg, this.look.variants.hairFront);
    for (const [k, , pal] of COLOR_SLOTS) this.look.colors[k] = pick(cfg.palettes[pal] || [this.look.colors[k]]);
    this.applyLook();
    this.hero.play('celebrate', true, () => this.hero.play(this.heroAnim));
    this.buildPanel();
  }

  playPet(p        , anim        ) {
    const s = this.pets[p]; if (!s) return;
    const key = `${p}-${anim}`;
    if (!this.anims.exists(key)) return;
    s.play(key);
    const def = this.anims.get(key);
    if (def && def.repeat !== -1) s.once('animationcomplete', () => s.play(`${p}-${this.petAnim[p]}`));
    else this.petAnim[p] = anim;
  }

  // ───────────── bố cục ─────────────
  layout() {
    const W = this.scale.width, H = this.scale.height;
    const panel = document.getElementById('panel');
    const pr = panel && !panel.hidden ? panel.getBoundingClientRect() : null;
    const dpr = W / window.innerWidth;
    const portrait = window.innerWidth < 760;
    // vùng trống cho sân khấu (đơn vị pixel game)
    const top = 64 * dpr;
    let areaW = W, areaH = H - top;
    if (pr) {
      if (portrait) areaH = (pr.top * dpr) - top;
      else areaW = pr.left * dpr;
    }
    const cx = areaW / 2;
    const unit = Math.min(areaW / 7.2, areaH / 4.4); // ~ chiều cao một "ô" nhân vật

    this.bg.clear();
    this.bg.fillGradientStyle(0xdff3fd, 0xdff3fd, 0xfff3dc, 0xfff3dc, 1).fillRect(0, 0, W, H);
    const ped = (x        , y        , rx        , c        ) => {
      this.bg.fillStyle(0x4c3876, 0.12).fillEllipse(x + rx * 0.06, y + rx * 0.08, rx * 2.05, rx * 0.62);
      this.bg.fillStyle(c, 1).fillEllipse(x, y, rx * 2, rx * 0.56);
      this.bg.fillStyle(0xffffff, 0.45).fillEllipse(x - rx * 0.2, y - rx * 0.08, rx * 1.1, rx * 0.2);
    };

    // hàng trên: bé lớn + 4 góc nhìn nhỏ
    const heroY = top + unit * 2.1;
    const heroScale = (unit * 1.75) / 96;
    const heroX = portrait ? cx : cx - unit * 1.6;
    ped(heroX, heroY, unit * 0.75, 0xffd96b);
    this.hero.setPosition(heroX, heroY);
    this.hero.setScale(heroScale);

    const vScale = (unit * 0.78) / 96;
    const vx0 = portrait ? cx - unit * 1.65 : cx + unit * 0.4;
    const vy = portrait ? heroY + unit * 1.05 : top + unit * 1.35;
    const vgap = portrait ? unit * 1.1 : unit * 0.95;
    for (let i = 0; i < this.views.length; i++) {
      const x = vx0 + i * vgap;
      ped(x, vy, unit * 0.32, 0xc7b5f0);
      this.views[i].setPosition(x, vy);
      this.views[i].setScale(vScale);
    }
    for (const l of this.labels) l.destroy();
    this.labels = [];
    const fs = Math.max(12, unit * 0.16);
    VIEWS.forEach(([, name], i) => {
      this.labels.push(this.add.text(vx0 + i * vgap, vy + unit * 0.2, name, { fontFamily: 'Nunito, sans-serif', fontSize: fs + 'px', fontStyle: '800', color: '#6f5a8a' }).setOrigin(0.5, 0));
    });

    // hàng dưới: ba thú cưng
    const petY = portrait ? vy + unit * 1.45 : top + unit * 3.6;
    const petScale = (unit * 1.5) / 80;
    const pets = AssetLoader.data('pets') || {};
    PET_IDS.forEach((p, i) => {
      const s = this.pets[p]; if (!s) return;
      const x = (portrait ? cx : cx + unit * 0.8) + (i - 1) * unit * 1.25;
      ped(x, petY, unit * 0.46, [0xffc9a3, 0xffdbe5, 0xe6b386][i]);
      s.setPosition(x, petY).setScale(petScale * (pets[p].scale ?? 0.5));
      this.labels.push(this.add.text(x, petY + unit * 0.22, pets[p].name || p, { fontFamily: 'Nunito, sans-serif', fontSize: fs * 1.1 + 'px', fontStyle: '800', color: '#4b3a5e' }).setOrigin(0.5, 0));
    });
  }

  // ───────────── bảng điều khiển ─────────────
  buildPanel() {
    const cfg = avatarConfig();
    const pets = AssetLoader.data('pets') || {};
    let body = '';
    if (this.tab === 'avatar') {
      const anims = Object.keys(cfg.anims).map((k) => `<button class="chip ${k === this.heroAnim ? 'on' : ''}" data-anim="${k}">${Ui.esc(ANIM_NAMES[k] || k)}</button>`).join('');
      const slots = cfg.layers.filter((L     ) => L.variants.length > 1 && !(L.slot === 'hairBack' && hasHairPair(cfg))).map((L     ) => {
        const i = Math.max(0, L.variants.findIndex((v     ) => v.id === this.look.variants[L.slot]));
        return `<div class="opt"><span>${Ui.esc(SLOT_NAMES[L.slot] || L.slot)}</span>
          <button class="btn icon" data-slot="${L.slot}" data-d="-1" aria-label="Trước">‹</button>
          <b>${Ui.esc(L.variants[i]?.name || '')}</b>
          <button class="btn icon" data-slot="${L.slot}" data-d="1" aria-label="Sau">›</button></div>`;
      }).join('');
      const colors = COLOR_SLOTS.map(([k, name, pal]) => `<div class="opt col"><span>${name}</span><div class="sw">${(cfg.palettes[pal] || []).map((hex        ) =>
        `<button class="swatch ${hex === this.look.colors[k] ? 'on' : ''}" style="background:${hex}" data-color="${k}" data-hex="${hex}" aria-label="${hex}"></button>`).join('')}</div></div>`).join('');
      body = `<h4>Animation</h4><div class="chips">${anims}</div>
        <h4>Tuỳ biến <button class="btn small accent" data-a="rand">Ngẫu nhiên</button> <button class="btn small ghost" data-a="reset">Mặc định</button></h4>
        <div class="opts">${slots}</div><div class="opts">${colors}</div>`;
    } else {
      body = PET_IDS.filter((p) => pets[p]).map((p) => {
        const P = pets[p];
        const portrait = AssetLoader.entry(`${p}-portrait`) ? `<img src="${AssetLoader.url(`${p}-portrait`)}" alt="">` : '';
        const anims = Object.keys(P.anims).map((k) => `<button class="chip ${k === this.petAnim[p] ? 'on' : ''}" data-pet="${p}" data-anim="${k}">${Ui.esc(ANIM_NAMES[k] || k)}</button>`).join('');
        return `<div class="petcard">${portrait}<div><h4>${Ui.esc(P.name || p)}</h4><p>${Ui.esc(P.personality || '')}</p></div></div><div class="chips">${anims}</div>`;
      }).join('') + `<div class="row"><button class="btn accent" data-a="allcele">Cả ba cùng ăn mừng</button><button class="btn" data-a="allgreet">Cả ba cùng chào</button></div>`;
    }
    const el = Ui.panel(`
      <div class="seg wide"><button data-tab="avatar" class="${this.tab === 'avatar' ? 'on' : ''}">Bé</button><button data-tab="pets" class="${this.tab === 'pets' ? 'on' : ''}">Thú cưng</button></div>
      ${body}`, 'gallery-panel');
    el.onclick = (e     ) => {
      const b = e.target.closest('button'); if (!b) return;
      const d = b.dataset;
      if (d.tab) { this.tab = d.tab; this.buildPanel(); return; }
      if (d.pet && d.anim) { this.playPet(d.pet, d.anim); this.buildPanel(); return; }
      if (d.anim) {
        const a = cfg.anims[d.anim];
        if (a.repeat === -1 || a.repeat === undefined) { this.heroAnim = d.anim; this.hero.play(d.anim, true); this.hero.setFlip(false); }
        else this.hero.play(d.anim, true, () => this.hero.play(this.heroAnim));
        this.buildPanel(); return;
      }
      if (d.slot) {
        const L = cfg.layers.find((x     ) => x.slot === d.slot);
        const i = Math.max(0, L.variants.findIndex((v     ) => v.id === this.look.variants[L.slot]));
        const n = (i + Number(d.d) + L.variants.length) % L.variants.length;
        this.look.variants[L.slot] = L.variants[n].id;
        if (L.slot === 'hairFront' && hasHairPair(cfg)) this.look.variants.hairBack = matchingHairBack(cfg, L.variants[n].id);
        this.applyLook(); this.buildPanel(); return;
      }
      if (d.color) { this.look.colors[d.color] = d.hex; this.applyLook(); this.buildPanel(); return; }
      if (d.a === 'rand') this.randomize();
      else if (d.a === 'reset') { this.look = defaultLook(); this.applyLook(); this.buildPanel(); }
      else if (d.a === 'allcele') PET_IDS.forEach((p) => this.playPet(p, 'celebrate'));
      else if (d.a === 'allgreet') PET_IDS.forEach((p) => this.playPet(p, 'greet'));
    };
    this.time.delayedCall(30, () => this.layout());
  }

  update(_t        , dt        ) {
    if (this.hero) this.hero.update(dt);
  }
}

const SLOT_NAMES                         = {
  hairBack: 'Tóc (sau)', body: 'Dáng', face: 'Gương mặt', bottom: 'Quần / váy', top: 'Áo', shoes: 'Giày', hairFront: 'Kiểu tóc', accessory: 'Phụ kiện',
};

// Tóc trước + tóc sau là một kiểu tóc: 'avatar-hairfront-bob' đi với 'avatar-hairback-bob' (nếu có)
function hasHairPair(cfg     ) { return cfg.layers.some((L     ) => L.slot === 'hairBack') && cfg.layers.some((L     ) => L.slot === 'hairFront'); }
function matchingHairBack(cfg     , frontId               )                {
  if (!frontId) return null;
  const want = frontId.replace('hairfront', 'hairback');
  const back = cfg.layers.find((L     ) => L.slot === 'hairBack');
  return back.variants.some((v     ) => v.id === want) ? want : null;
}
return { CharacterGalleryScene };
})();

/* ══════════ main.ts ══════════ */
M.main = (function () {
// ── Little World — Phase 1: bản demo hình ảnh ──
// Ba màn: Bản đồ thế giới (#map), Đảo của bé (#island), Phòng nhân vật (#gallery).
const { BootScene, sceneFromHash } = M.BootScene;
const { WorldMapPreviewScene } = M.WorldMapPreviewScene;
const { IslandPreviewScene } = M.IslandPreviewScene;
const { CharacterGalleryScene } = M.CharacterGalleryScene;
const { Ui } = M.Ui;
// Vẽ canvas theo điểm ảnh thật của màn hình (nét trên retina), hiển thị thu lại bằng zoom.
const DPR = Math.min(2, window.devicePixelRatio || 1);
const size = () => ({ w: Math.round(window.innerWidth * DPR), h: Math.round(window.innerHeight * DPR) });
const s0 = size();

const game = new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  width: s0.w,
  height: s0.h,
  backgroundColor: '#a8dcf7',
  scale: { mode: Phaser.Scale.NONE, zoom: 1 / DPR },
  render: { antialias: true, roundPixels: false, powerPreference: 'high-performance' },
  input: { activePointers: 3 },
  scene: [BootScene, WorldMapPreviewScene, IslandPreviewScene, CharacterGalleryScene],
});

window.addEventListener('resize', () => {
  const s = size();
  game.scale.resize(s.w, s.h);
  game.scale.setZoom(1 / DPR);
});

function goTo(key        ) {
  const running = game.scene.getScenes(true).map((s     ) => s.scene.key).filter((k        ) => k !== 'Boot');
  if (running.includes(key)) return;
  Ui.card(null); Ui.modal(null);
  for (const k of running) game.scene.stop(k);
  if (game.scene.getScene('Boot')?.sys.settings.status >= Phaser.Scenes.RUNNING || game.scene.isActive('Boot')) game.scene.stop('Boot');
  game.scene.start(key);
}

window.addEventListener('hashchange', () => {
  // chỉ chuyển khi manifest đã sẵn sàng (Boot xong)
  if (game.cache.json.exists('lw-manifest')) goTo(sceneFromHash());
});

document.querySelectorAll             ('.tabs button').forEach((b) => {
  b.addEventListener('click', () => {
    const h = ({ WorldMap: 'map', Island: 'island', Gallery: 'gallery' }       )[b.dataset.scene          ];
    if (location.hash.replace('#', '') === h) goTo(b.dataset.scene          );
    else location.hash = h;
  });
});

(window       ).__lw = game; // tiện cho kiểm thử
return {  };
})();
})();</script>
