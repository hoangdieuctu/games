<title>Bé Yêu Hổ · Tiger!</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff8a00'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='20'%3E🐯%3C/text%3E%3C/svg%3E">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --orange: #ff8a00;
  --orange-d: #e06c00;
  --ink: #2b1a0e;
  --cream: #fff6e5;
  --green: #2fbf71;
}
html, body {
  width: 100%; height: 100%;
  font-family: 'Nunito', system-ui, sans-serif;
  color: var(--ink);
  background: var(--cream);
  overflow: hidden;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  position: fixed;
}
img { -webkit-user-drag: none; user-select: none; pointer-events: none; }
button { font-family: inherit; border: none; cursor: pointer; color: inherit; }
.hidden { display: none !important; }

/* Nền vằn hổ nhạt */
body::before {
  content: ''; position: fixed; inset: 0; z-index: -1;
  background:
    repeating-linear-gradient(115deg, transparent 0 46px, rgba(255,138,0,.07) 46px 60px, transparent 60px 104px),
    radial-gradient(ellipse at 50% 0%, #fff 0%, var(--cream) 70%);
}

.screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ── Thanh trên ── */
.bar {
  flex-shrink: 0; display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
}
.round-btn {
  width: 64px; height: 64px; border-radius: 50%;
  background: #fff; font-size: 32px;
  box-shadow: 0 4px 0 rgba(0,0,0,.12), 0 6px 16px rgba(0,0,0,.08);
  display: grid; place-items: center; flex-shrink: 0;
  transition: transform .12s;
}
.round-btn:active { transform: scale(.88); }
.lang-btn {
  height: 48px; padding: 0 16px; border-radius: 24px; flex-shrink: 0;
  background: #fff; font-size: clamp(15px, 3.6vw, 20px); font-weight: 900; color: var(--orange-d);
  box-shadow: 0 3px 0 rgba(0,0,0,.1); white-space: nowrap;
}
.lang-btn:active { transform: scale(.92); }
.lang-btn .short { display: none; }
@media (max-width: 480px) { .lang-btn .long { display: none; } .lang-btn .short { display: inline; } }
.bar-title {
  flex: 1; text-align: center; font-size: clamp(22px, 5vw, 34px); font-weight: 900;
  color: var(--orange-d);
}
.stars {
  min-width: 64px; height: 48px; padding: 0 14px; border-radius: 24px;
  background: #fff; display: flex; align-items: center; justify-content: center; gap: 4px;
  font-size: 24px; font-weight: 900; color: #c98a00;
  box-shadow: 0 3px 0 rgba(0,0,0,.1);
}
.stars.bump { animation: bump .5s; }
@keyframes bump { 40% { transform: scale(1.4); } }

/* ══════════ Hổ đâu? ══════════ */
.find-q {
  text-align: center; font-size: clamp(26px, 6vw, 46px); font-weight: 900; padding: 0 12px;
}
.find-q b { color: var(--orange-d); }
.find-grid {
  flex: 1; display: grid; gap: 14px; padding: 12px 14px 18px;
  align-content: center; justify-content: center;
}
.find-card {
  position: relative; border-radius: 26px; overflow: hidden; background: #ddd;
  box-shadow: 0 6px 0 rgba(0,0,0,.15), 0 10px 22px rgba(0,0,0,.12);
  transition: transform .25s, opacity .4s, filter .4s;
}
.find-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.find-card:active { transform: scale(.95); }
.find-card.shake { animation: shake .5s; }
@keyframes shake { 20%,60% { transform: translateX(-12px) rotate(-2deg); } 40%,80% { transform: translateX(12px) rotate(2deg); } }
.find-card.win { transform: scale(1.06); box-shadow: 0 0 0 8px #ffd23f, 0 10px 30px rgba(0,0,0,.25); z-index: 2; }
.find-card.dim { opacity: .25; filter: grayscale(1); }
.find-card .name {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
  background: #fff; padding: 4px 16px; border-radius: 16px; font-size: clamp(18px, 4vw, 28px); font-weight: 900;
  animation: booIn .4s cubic-bezier(.3,1.6,.5,1);
}
@keyframes booIn { from { transform: translateX(-50%) scale(0); } }

/* ── Pháo giấy ── */
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 100; overflow: hidden; }
.confetti { position: absolute; font-size: 34px; will-change: transform, opacity; }

<body>

<!-- ══════════ Hổ đâu? ══════════ -->
<section class="screen hidden" id="s-find">
  <div class="bar">
    <div class="stars"><span>⭐</span><span class="star-n">0</span></div>
    <div class="bar-title">Hổ đâu?</div>
    <button class="lang-btn" id="find-lang"></button>
    <button class="round-btn" id="find-say">🔊</button>
  </div>
  <div class="find-q" id="find-q"></div>
  <div class="find-grid" id="find-grid"></div>
</section>

<div id="fx"></div>

<script>
'use strict';

/* ══════════ Dữ liệu ảnh ══════════ */
const IMG = (n) => `img/${n}.jpg`;

const FIND_TIGERS = ['face_big', 'face_young', 'face_close', 'white_lying', 'cub_snow', 'walk_grass',
  'white_standing', 'snow_come', 'swim', 'cub_roar', 'walk_path', 'mom_cubs'];
// [ảnh, tên tiếng Anh, tiếng kêu tiếng Anh, tên tiếng Việt, tiếng kêu tiếng Việt]
// Sửa danh sách này thì chạy lại art/gen-voice.mjs để sinh clip giọng đọc.
const FIND_OTHERS = [
  ['cat', 'a cat', 'Meow!', 'mèo', 'Meo meo!'], ['dog', 'a dog', 'Woof woof!', 'chó', 'Gâu gâu!'],
  ['elephant', 'an elephant', '', 'voi', ''], ['giraffe', 'a giraffe', '', 'hươu cao cổ', ''],
  ['zebra', 'a zebra', '', 'ngựa vằn', ''], ['monkey', 'a monkey', 'Ooh ooh!', 'khỉ', 'Khẹc khẹc!'],
  ['cow', 'a cow', 'Moo!', 'bò', 'Ò ò!'], ['duck', 'a duck', 'Quack!', 'vịt', 'Cạp cạp!'],
  ['rabbit', 'a bunny', '', 'thỏ', ''], ['giant_panda', 'a panda', '', 'gấu trúc', ''],
  ['horse', 'a horse', 'Neigh!', 'ngựa', 'Hí hí!'], ['sheep', 'a sheep', 'Baa!', 'cừu', 'Be be!'],
  ['chicken', 'a chicken', 'Cluck cluck!', 'gà', 'Cục ta cục tác!'], ['frog', 'a frog', 'Ribbit!', 'ếch', 'Ộp ộp!'],
  ['penguin', 'a penguin', '', 'chim cánh cụt', ''], ['bear', 'a bear', '', 'gấu', ''],
];

// Câu đọc theo ngôn ngữ — khoá trùng tên tệp voice/<lang>/<khoá>.mp3 (art/gen-voice.mjs đọc chính bảng này).
const LINES = {
  en: {
    ask: 'Where is the tiger?', yes: 'Yes! Tiger!',
    no: (o) => `That's ${o[1]}! ${o[2]} Where is the tiger?`.replace('  ', ' '),
    q: 'Where is the <b>tiger</b>? 🐯', win: 'Tiger! 🐯', name: (o) => o[1].replace(/^an? /, ''),
  },
  vi: {
    ask: 'Con hổ đâu rồi?', yes: 'Đúng rồi! Con hổ!',
    no: (o) => `Đó là con ${o[3]}! ${o[4]} Con hổ đâu rồi?`.replace('  ', ' '),
    q: 'Con <b>hổ</b> đâu rồi? 🐯', win: 'Con hổ! 🐯', name: (o) => o[3],
  },
};
let lang = 'en';
try { if (localStorage.getItem('tiger_lang') === 'vi') lang = 'vi'; } catch (e) {}

/* ══════════ Tiện ích ══════════ */
const $ = (s) => document.querySelector(s);
const rand = (a) => a[Math.floor(Math.random() * a.length)];
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function retrigger(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
// Lấy phần tử tiếp theo trong danh sách xáo trộn, hết thì xáo lại (tránh lặp ảnh liền nhau).
function deck(list) {
  let pool = [];
  return () => { if (!pool.length) pool = shuffle(list); return pool.pop(); };
}

/* ══════════ Âm thanh (Web Audio) ══════════ */
const Sfx = {
  ctx: null,
  roarSrc: 'sounds/roar.mp3',
  roarOk: true,

  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },

  env(node, t0, a, d, peak) {
    node.gain.setValueAtTime(0.0001, t0);
    node.gain.exponentialRampToValueAtTime(peak, t0 + a);
    node.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
  },

  tone(freq, dur, type = 'sine', peak = .3, delay = 0, slideTo) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    this.env(g, t, .01, dur, peak);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur + .05);
  },

  noise(dur, filterType, freq, peak = .3, delay = 0, q = 1) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime + delay;
    const buf = c.createBuffer(1, Math.ceil(c.sampleRate * dur), c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type = filterType; f.frequency.value = freq; f.Q.value = q;
    const g = c.createGain(); this.env(g, t, .005, dur, peak);
    s.connect(f).connect(g).connect(c.destination);
    s.start(t);
  },

  boing()  { this.tone(300, .35, 'sine', .3, 0, 120); this.tone(180, .3, 'triangle', .15, .05, 360); },
  chime()  { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .35, 'triangle', .22, i * .09)); },

  // Tiếng gầm: ưu tiên tệp ghi âm thật; nếu không có thì tự tổng hợp.
  roar(vol = .8) {
    if (this.roarOk) {
      const a = new Audio(this.roarSrc);
      a.volume = Math.min(1, vol * .8);
      a.play().catch(() => { this.roarOk = false; this.synthRoar(vol); });
      a.onerror = () => { this.roarOk = false; };
      return;
    }
    this.synthRoar(vol);
  },

  synthRoar(vol) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime, dur = 1.1;
    const o = c.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(70, t); o.frequency.linearRampToValueAtTime(130, t + .25); o.frequency.linearRampToValueAtTime(60, t + dur);
    const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 28; lg.gain.value = 25;
    lfo.connect(lg).connect(o.frequency);
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(500, t); f.frequency.linearRampToValueAtTime(1300, t + .25); f.frequency.linearRampToValueAtTime(350, t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(.5 * vol, t + .12); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f).connect(g).connect(c.destination);
    o.start(t); lfo.start(t); o.stop(t + dur); lfo.stop(t + dur);
    this.noise(dur * .9, 'bandpass', 600, .25 * vol, 0, .6);
  },
};

/* ══════════ Giọng đọc ══════════
   Clip mp3 giọng nơ-ron sinh sẵn (art/gen-voice.mjs → voice/en, voice/vi).
   Clip thiếu / lỗi thì rơi về giọng máy (Speech Synthesis). */
const Speech = {
  // một thẻ <audio> dùng lại cho mọi câu: iOS chỉ cho phát không cần chạm trên thẻ đã từng phát trong một cú chạm
  el: new Audio(), unlocked: false, token: 0,
  synth: 'speechSynthesis' in window, voices: {},

  unlock() {
    if (this.unlocked) return;
    this.unlocked = true;
    if (this.el.src && !this.el.paused) return;
    this.el.src = SILENT_MP3;
    const p = this.el.play(); if (p && p.catch) p.catch(() => { this.unlocked = false; });
  },

  loadVoices() {
    if (!this.synth) return;
    const vs = speechSynthesis.getVoices();
    if (!vs.length) return;
    this.voices.en =
      vs.find((v) => /^google us english/i.test(v.name)) ||
      vs.find((v) => /^en[-_]US/i.test(v.lang)) || vs.find((v) => /^en/i.test(v.lang)) || null;
    this.voices.vi = vs.find((v) => /^vi/i.test(v.lang)) || null;
  },

  // key: tên clip; text: câu dự phòng cho giọng máy
  say(key, text, { onEnd } = {}) {
    this.cancel();
    const my = this.token, l = lang;
    let done = false;
    const finish = () => { if (done || my !== this.token) return; done = true; if (onEnd) onEnd(); };
    let fell = false;
    const fallback = () => {
      if (fell || done || my !== this.token) return; fell = true;
      this.fallback(text, l, finish);
    };
    const el = this.el;
    el.onended = finish; el.onerror = fallback;
    el.src = `voice/${l}/${key}.mp3`;
    const p = el.play(); if (p && p.catch) p.catch(fallback);
  },

  fallback(text, l, finish) {
    if (!this.synth) { setTimeout(finish, 300); return; }
    if (!this.voices[l]) this.loadVoices();
    const u = new SpeechSynthesisUtterance(text), v = this.voices[l];
    u.lang = v ? v.lang : (l === 'vi' ? 'vi-VN' : 'en-US');
    if (v) u.voice = v;
    u.rate = 0.92; u.pitch = 1.05;
    u.onend = u.onerror = finish;
    try { speechSynthesis.resume(); } catch (e) {}
    speechSynthesis.speak(u);
    setTimeout(finish, 1500 + text.length * 110);
  },

  cancel() {
    this.token++;
    const el = this.el; el.onended = el.onerror = null;
    try { el.pause(); } catch (e) {}
    if (this.synth) try { speechSynthesis.cancel(); } catch (e) {}
  },
};
if (Speech.synth) {
  Speech.loadVoices();
  speechSynthesis.onvoiceschanged = () => Speech.loadVoices();
}
const SILENT_MP3 = 'data:audio/mpeg;base64,SUQzBAAAAAAAIlRTU0UAAAAOAAADTGF2ZjYyLjMuMTAwAAAAAAAAAAAAAAD/84TAAAAAAAAAAAAASW5mbwAAAA8AAAAFAAACoABtbW1tbW1tbW1tbW1tbW1tbW1tkpKSkpKSkpKSkpKSkpKSkpKSkpK2tra2tra2tra2tra2tra2tra2ttvb29vb29vb29vb29vb29vb29vb//////////////////////////8AAAAATGF2YzYyLjExAAAAAAAAAAAAAAAAJARQAAAAAAAAAqC9P8gWAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD/80TEAAAAA0gAAAAATEFNRTMuMTAwVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVMQU1FMy7/80TEUwAAA0gAAAAAMTAwVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVMQU1FMy7/80TEpgAAA0gAAAAAMTAwVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVX/80TErAAAA0gAAAAAVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVX/80TErAAAA0gAAAAAVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVU=';

/* ══════════ Sao thưởng ══════════ */
let stars = 0;
try { stars = parseInt(localStorage.getItem('tiger_stars') || '0', 10) || 0; } catch (e) {}
function renderStars(bump) {
  document.querySelectorAll('.star-n').forEach((el) => { el.textContent = stars; });
  if (bump) document.querySelectorAll('.stars').forEach((el) => retrigger(el, 'bump'));
}
function addStar() {
  stars++;
  try { localStorage.setItem('tiger_stars', String(stars)); } catch (e) {}
  renderStars(true);
}
renderStars();

/* ══════════ Pháo giấy ══════════ */
const fx = $('#fx');
function burst(x, y, n = 18, chars = ['🐯', '⭐', '🧡', '✨', '🎉']) {
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.textContent = rand(chars);
    el.style.left = x + 'px'; el.style.top = y + 'px';
    fx.appendChild(el);
    const ang = Math.random() * Math.PI * 2, dist = 120 + Math.random() * 220;
    const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist - 120;
    el.animate([
      { transform: 'translate(-50%,-50%) scale(.4) rotate(0deg)', opacity: 1 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.2) rotate(${Math.random() * 540 - 270}deg)`, opacity: 1, offset: .6 },
      { transform: `translate(calc(-50% + ${dx * 1.1}px), calc(-50% + ${dy + 260}px)) scale(1) rotate(${Math.random() * 720 - 360}deg)`, opacity: 0 },
    ], { duration: 1300 + Math.random() * 500, easing: 'cubic-bezier(.2,.7,.4,1)' }).onfinish = () => el.remove();
  }
}
function burstAt(el, n, chars) {
  const r = el.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2, n, chars);
}

/* ══════════ Điều hướng màn hình ══════════ */
const screens = {};
let current = null;
function go(name) {
  if (current && screens[current].leave) screens[current].leave();
  Speech.cancel();
  document.querySelectorAll('.screen').forEach((s) => s.classList.add('hidden'));
  $('#s-' + name).classList.remove('hidden');
  current = name;
  if (screens[name].enter) screens[name].enter();
}

// Mở khoá âm thanh ở cú chạm đầu tiên (iOS yêu cầu).
document.addEventListener('pointerdown', () => { Sfx.unlock(); Speech.unlock(); }, { capture: true });
// Không cho menu chuột phải / nhấn giữ hiện lên khi bé bấm lâu.
document.addEventListener('contextmenu', (e) => e.preventDefault());

/* ══════════ Hổ đâu? ══════════ */
const find = {
  n: 0,
  nextTiger: deck(FIND_TIGERS),
  nextOther: deck(FIND_OTHERS),
  enter() { this.n = 0; this.round(); },
  leave() { clearTimeout(this.timer); },
  round() {
    clearTimeout(this.timer);
    this.locked = false;
    this.n++;
    const count = this.n <= 3 ? 2 : this.n <= 7 ? 3 : 4;
    const others = [];
    while (others.length < count - 1) {
      const o = this.nextOther();
      if (!others.includes(o)) others.push(o);
    }
    const cards = shuffle([{ tiger: true, img: IMG(this.nextTiger()) }, ...others.map((o) => ({ img: `img/others/${o[0]}.jpg`, o }))]);
    const g = $('#find-grid');
    const land = innerWidth > innerHeight;
    const cols = count === 2 ? (land ? 2 : 1) : count === 3 ? (land ? 3 : 2) : 2;
    const rows = Math.ceil(count / cols);
    const availW = innerWidth - 28 - (cols - 1) * 14, availH = innerHeight - 190 - (rows - 1) * 14;
    const size = Math.max(120, Math.min(availW / cols, availH / rows, 420));
    g.style.gridTemplateColumns = `repeat(${cols}, ${size}px)`;
    g.style.gridAutoRows = `${size}px`;
    g.innerHTML = '';
    cards.forEach((c) => {
      const b = document.createElement('button');
      b.className = 'find-card';
      b.innerHTML = `<img src="${c.img}" alt="">`;
      b.addEventListener('click', () => this.pick(b, c));
      g.appendChild(b);
    });
    this.ask();
  },
  ask() { Speech.say('ask', LINES[lang].ask); },
  pick(b, c) {
    if (this.locked) return;
    if (c.tiger) {
      this.locked = true;
      b.classList.add('win');
      document.querySelectorAll('.find-card').forEach((x) => { if (x !== b) x.classList.add('dim'); });
      b.insertAdjacentHTML('beforeend', `<span class="name">${LINES[lang].win}</span>`);
      Sfx.chime();
      Speech.say('yes', LINES[lang].yes, { onEnd: () => Sfx.roar(.55) });
      burstAt(b, 20);
      addStar();
      this.timer = setTimeout(() => this.round(), 3200);
    } else {
      retrigger(b, 'shake');
      Sfx.boing();
      if (!b.querySelector('.name')) b.insertAdjacentHTML('beforeend', `<span class="name">${LINES[lang].name(c.o)}</span>`);
      Speech.say('no-' + c.o[0], LINES[lang].no(c.o));
    }
  },
};
screens.find = find;
$('#find-say').addEventListener('click', () => find.ask());
// chọn ngôn ngữ đọc (và chữ trên màn hình): English ↔ Tiếng Việt, nhớ cho lần sau
function renderLang() {
  $('#find-lang').innerHTML = lang === 'vi' ? '🇻🇳 <span class="long">Tiếng Việt</span><span class="short">VI</span>'
                                            : '🇬🇧 <span class="long">English</span><span class="short">EN</span>';
  $('#find-q').innerHTML = LINES[lang].q;
  document.documentElement.lang = lang;
}
$('#find-lang').addEventListener('click', () => {
  lang = lang === 'vi' ? 'en' : 'vi';
  try { localStorage.setItem('tiger_lang', lang); } catch (e) {}
  renderLang();
  find.ask();
});
renderLang();
addEventListener('resize', () => { if (current === 'find' && !find.locked) { find.n--; find.round(); } });

go('find');
</script>
</body>
