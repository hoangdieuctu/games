<style id="kho-back-css">

a.kho-back.kho-back{display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:4px!important;
  width:auto!important;height:auto!important;min-width:0!important;min-height:0!important;padding:8px 15px 8px 12px!important;
  border-radius:999px!important;border:2px solid rgba(255,255,255,.4)!important;background:rgba(35,18,77,.62)!important;
  color:#efe6ff!important;font:700 15px/1.1 'Baloo 2','Nunito',system-ui,-apple-system,sans-serif!important;letter-spacing:normal!important;
  text-transform:none!important;text-decoration:none!important;white-space:nowrap!important;opacity:1!important;

a.kho-back .kb-ar{font-size:22px;line-height:.8;margin-top:-2px}

<canvas id="cv"></canvas>

<div id="hud">
  <a class="btn kho-back kb-compact" href="../index.html" aria-label="Về kho trò chơi"><span class="kb-ar">‹</span><span class="kb-tx">Về kho trò chơi</span></a>
  <div id="tankTabs"></div>
  <div class="spacer"></div>
  <div class="pill" id="coinPill" title="Xu">💰 <b id="coinsV">0</b></div>
  <button class="btn" id="btnLog" title="Nhật ký">📜</button>
  <button class="btn" id="btnSound" title="Âm thanh">🔇</button>
  <button class="btn" id="btnHelp" title="Hướng dẫn">❔</button>
</div>

<button id="warnBadge" hidden>⚠ <span>0</span></button>
<div id="breedBadge" hidden>🥚 <span></span></div>

<div id="bar">

  <div id="actions">
    <button data-act="feed">🥣<span>Cho ăn</span><small id="foodV"></small></button>
    <button data-act="clean">🧽<span>Dọn hồ</span></button>
    <button data-act="water">💧<span>Thay nước</span></button>
    <button data-act="design">🎨<span>Thiết kế</span></button>
    <button data-act="shop">🛒<span>Cửa hàng</span></button>
    <button data-act="fishlist">🐟<span>Đàn cá</span></button>
    <button data-act="breed">🥚<span>Ép đẻ</span></button>
    <button data-act="book">📖<span>Sổ tay</span></button>
  </div>
</div>

<div id="cleanHint" hidden>🧽 Kéo tay qua kính để lau rêu và hút cặn <button id="cleanDone">Xong</button></div>
<div id="placeHint" hidden>👆 Chạm vào hồ để đặt <b></b> <button id="placeCancel">Huỷ</button></div>

<aside id="panel" hidden>
  <header><h2 id="panelTitle"></h2><button id="panelClose" title="Đóng">✕</button></header>
  <div id="panelBody"></div>
