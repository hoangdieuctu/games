<canvas id="cv"></canvas>

<div id="hud">
  <a class="btn" href="../index.html" title="Về trang chủ">🏠</a>
  <div id="tankTabs"></div>
  <div class="spacer"></div>
  <div class="pill" id="coinPill" title="Xu">💰 <b id="coinsV">0</b></div>
  <button class="btn" id="btnLog" title="Nhật ký">📜</button>
  <button class="btn" id="btnSound" title="Âm thanh">🔇</button>
  <button class="btn" id="btnHelp" title="Hướng dẫn">❔</button>
</div>

<button id="warnBadge" hidden>⚠ <span>0</span></button>
<div id="breedBadge" hidden>🥚 <span></span></div>

<div id="bar">
  <div id="gauges"></div>

    <button data-act="fishlist">🐟<span>Đàn cá</span></button>
    <button data-act="breed">🥚<span>Ép đẻ</span></button>
    <button data-act="book">📖<span>Sổ tay</span></button>
  </div>
</div>

<div id="cleanHint" hidden>🧽 Kéo tay qua kính để lau rêu và hút cặn <button id="cleanDone">Xong</button></div>
