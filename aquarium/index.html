function findRecipe(a, b) {
  return HYBRIDS.find((h) => (h.parents[0] === a && h.parents[1] === b) || (h.parents[0] === b && h.parents[1] === a)) || null;
}

const fmtDur = (s) => {
  s = Math.max(0, Math.round(s));
  if (s < 60) return s + ' giây';
  if (s < 3600) return Math.floor(s / 60) + ' phút' + (s % 60 ? ' ' + (s % 60) + 's' : '');
  const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
  return h + ' giờ' + (m ? ' ' + m + ' phút' : '');
};

let S = null; // trạng thái toàn cục

function tankSpec(kind, size) {
  return kind === 'main' ? TANK_KINDS.main[size] : TANK_KINDS[kind];
}

function newTank(kind, size, name) {
  const spec = tankSpec(kind, size);
  const t = {
    id: uid(), kind, size: kind === 'main' ? size : null,
    name: name || spec.name,
    substrate: kind === 'hospital' ? 'bare' : 'sand',
    bg: 'blue',
    deco: [],
    eq: { filter: kind === 'hospital' ? 1 : 0, heater: false, heatTemp: 27, air: kind !== 'main', light: 1 },
    water: { temp: 27, dirt: 8, ammonia: 4, algae: 3, o2: 90 },
    med: null,          // { type, until }
    breeding: null,     // { a, b, start, end, chance, result }
    pellets: [],        // { x, y, vy, age }
    lastFed: 0,
    lastChange: now(),
    created: now(),
  };
  if (kind === 'breed') t.deco.push({ id: uid(), type: 'moss', x: spec.W * 0.5, flip: false });
  return t;
}
const tankDims = (t) => tankSpec(t.kind, t.size);

function newFish(spId, tankId, opts = {}) {
  const sp = SPECIES[spId];
  const t = S.tanks.find((x) => x.id === tankId);
  const d = tankDims(t);
  const f = {
    id: uid(), sp: spId, name: opts.name || pick(FISH_NAMES), tankId,
    born: now(), growth: opts.growth ?? 1, sex: Math.random() < 0.5 ? 'M' : 'F',
    health: 100, hunger: rand(20, 40), stress: 8,
    disease: null,            // { id, sev, since }
    variant: sp.variants ? randInt(0, sp.variants.length - 1) : 0,
    hue: rand(-8, 8),
    x: rand(d.W * 0.2, d.W * 0.8), y: rand(d.H * 0.3, d.H * 0.7), vx: rand(-2, 2), vy: 0,
    gen: opts.gen || 0, parents: opts.parents || null,
    lastBreed: 0, movedAt: now(), overfed: 0, earned: 0,
  };
  if (sp.zone === 'bottom') f.y = d.H * 0.9;
  if (sp.zone === 'top') f.y = d.H * 0.2;
  return f;
}

function freshState() {
  const main = newTank('main', 'S', 'Hồ đầu tiên');
  main.eq.filter = 1;
  main.deco.push({ id: uid(), type: 'rock_s', x: 8, flip: false });
  main.deco.push({ id: uid(), type: 'anubias', x: 30, flip: true });
  const st = {
    v: 1, coins: 260, food: 40, meds: {}, tanks: [main], fish: [],
    current: main.id, discovered: {}, log: [], lastSave: now(), muted: true,
    stats: { born: 0, died: 0, sold: 0, earned: 0 }, seenIntro: false,
  };
  S = st;
  for (let i = 0; i < 3; i++) S.fish.push(newFish('guppy', main.id));
  for (const s of BUYABLE) S.discovered[s.id] = true;
  return st;
}

function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const st = JSON.parse(raw);
    if (!st || !st.tanks || !st.fish) return null;
    // vá thiếu trường của phiên bản cũ
    st.meds ||= {}; st.log ||= []; st.stats ||= { born: 0, died: 0, sold: 0, earned: 0 }; st.discovered ||= {};
    for (const t of st.tanks) { t.pellets ||= []; t.water.o2 ??= 90; t.eq.heatTemp ??= 27; t.deco ||= []; }
    for (const f of st.fish) { f.earned ??= 0; f.overfed ??= 0; if (!SPECIES[f.sp]) f.sp = 'guppy'; }
    st.fish = st.fish.filter((f) => st.tanks.some((t) => t.id === f.tankId));
    if (!st.tanks.some((t) => t.id === st.current)) st.current = st.tanks[0].id;
    return st;
  } catch (e) { console.warn('Không đọc được bản lưu', e); return null; }
}

function saveState() {
  if (!S) return;
  S.lastSave = now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* đầy bộ nhớ: bỏ qua */ }
}

function resetState() { localStorage.removeItem(SAVE_KEY); }

const curTank = () => S.tanks.find((t) => t.id === S.current) || S.tanks[0];
const tankById = (id) => S.tanks.find((t) => t.id === id);
const fishIn = (tankId) => S.fish.filter((f) => f.tankId === tankId);
const fishById = (id) => S.fish.find((f) => f.id === id);

function addLog(text, icon = '•') {
  S.log.unshift({ t: now(), text, icon });
  if (S.log.length > 60) S.log.length = 60;
}

function spend(n) {
  if (S.coins < n) return false;
  S.coins -= n; return true;
}

function fishValue(f) {
  const sp = SPECIES[f.sp];
  const base = sp.parents ? sp.price : sp.price * 0.6;
  return Math.max(1, Math.round(base * (0.4 + 0.6 * f.growth) * (0.5 + 0.5 * f.health / 100)));
}
const isAdult = (f) => f.growth >= 0.6;
const ageSec = (f) => (now() - f.born) / 1000;


/* ══════════ sim.js ══════════ */
/* ═══════════════════════ sim.js — mô phỏng nước, sức khỏe, bệnh, ép đẻ ═══════════════════════ */

const EVENTS = []; // sự kiện cho UI hiển thị (toast)
function emit(type, text, icon) { EVENTS.push({ type, text, icon }); addLog(text, icon); }

function ambientTemp(ts = now()) {
  const d = new Date(ts);
  const hour = d.getHours() + d.getMinutes() / 60;
  return 26.5 + 1.5 * Math.sin(((hour - 9) / 24) * Math.PI * 2);
}
function isNight(ts = now()) { const h = new Date(ts).getHours(); return h >= 19 || h < 6; }

/* Tổng hợp bối cảnh của một hồ: tải sinh học, cây, chỗ trốn, loài… */
function tankContext(t) {
  const fs = fishIn(t.id);
  const d = tankDims(t);
  let bioload = 0, plants = 0, hide = 0, bubbler = 0, dirtCleaners = 0, algaeEaters = 0;
  const count = {};
  for (const f of fs) {
    const sp = SPECIES[f.sp];
    count[f.sp] = (count[f.sp] || 0) + 1;
    if (!sp.invert) bioload += sp.size * sp.bioload * (0.3 + 0.7 * f.growth);
    if (sp.cleaner === 'dirt' || sp.cleaner === 'both') dirtCleaners++;
    if (sp.cleaner === 'algae' || sp.cleaner === 'both') algaeEaters++;
  }
  for (const dc of t.deco) {
    const D = DECO[dc.type]; if (!D) continue;
    if (D.plant) plants++;
    hide += D.hide || 0;
    if (D.kind === 'bubbler') bubbler++;
  }
  const aggr = fs.filter((f) => SPECIES[f.sp].temper === 'aggr');
  const nippers = fs.filter((f) => SPECIES[f.sp].nipper);
  const predators = fs.filter((f) => SPECIES[f.sp].temper === 'semi' && SPECIES[f.sp].size >= 12 && f.growth > 0.7);
  const medHarm = !!(t.med && MEDS[t.med.type].harmInverts);
  return { fs, d, litres: d.litres, bioload, ratio: bioload / d.litres, plants, hide, bubbler, dirtCleaners, algaeEaters, count, aggr, nippers, predators, medHarm };
}

/* Nguyên nhân căng thẳng của một con cá → [{text, val}] */
function stressReasons(f, t, c) {
  const sp = SPECIES[f.sp], w = t.water, k = sp.hardy, r = [];
  const add = (text, val) => { if (val > 0.5) r.push({ text, val }); };
  if (f.hunger > 50) add('Đói', (f.hunger - 50) * 0.4);
  if (w.ammonia > 10) add('Nước độc (ammonia ' + Math.round(w.ammonia) + ')', (w.ammonia - 10) * 0.55 * k);
  if (w.dirt > 45) add('Hồ bẩn', (w.dirt - 45) * 0.3 * k);
  const dev = w.temp < sp.temp[0] ? sp.temp[0] - w.temp : w.temp > sp.temp[1] ? w.temp - sp.temp[1] : 0;
  if (dev > 0.3) add(`Nhiệt độ ${w.temp.toFixed(1)}°C không phù hợp (cần ${sp.temp[0]}–${sp.temp[1]}°C)`, Math.min(40, dev * 9));
  if (w.o2 < 55) add('Thiếu oxy', (55 - w.o2) * 0.7);
  if (!sp.invert && c.ratio > 1) add('Hồ quá tải cá', Math.min(45, (c.ratio - 1) * 45));
  if (sp.school > 0 && (c.count[f.sp] || 0) < sp.school) add(`Thiếu đàn (${c.count[f.sp]}/${sp.school} con)`, c.count[f.sp] === 1 ? 22 : 14);
  if (sp.shy && c.hide < 1) add('Thiếu cây, chỗ trốn', 12);
  if (sp.minLitres && c.litres < sp.minLitres && t.kind === 'main') add(`Hồ quá nhỏ (cần ≥${sp.minLitres}L)`, 25);
  if (sp.temper === 'aggr' && c.count[f.sp] > 1) add('Đánh nhau với cá cùng loài', 30);
  const bully = c.aggr.find((o) => o.sp !== f.sp && !sp.invert && (sp.longFin || sp.size <= 5));
  if (bully) add(`Bị ${SPECIES[bully.sp].name} đuổi đánh`, 18);
  if (sp.longFin && c.nippers.some((o) => o.id !== f.id && o.sp !== f.sp)) add('Bị rỉa vây', 15);
  if (!sp.invert && sp.size <= 3 && c.predators.length) add('Bị cá lớn săn', 15);
  if (sp.invert && c.medHarm) add('Thuốc trong hồ gây hại', 60);
  if (sp.shy && t.eq.light === 2 && c.hide < 2) add('Đèn quá sáng', 5);
  const dm = (now() - f.movedAt) / 1000;
  if (dm < 600) add('Mới chuyển hồ', 12 * (1 - dm / 600));
  if (f.disease) add(DISEASES[f.disease.id].name, 10 + f.disease.sev * 15);
  if (!sp.invert && f.growth < 0.6 && t.kind === 'main' && c.predators.length) add('Cá con dễ bị ăn', 10);
  r.sort((a, b) => b.val - a.val);
  return r;
}

/* Cảnh báo thiết kế hồ */
function tankIssues(t) {
  const c = tankContext(t), out = [];
  const fishOnly = c.fs.filter((f) => !SPECIES[f.sp].invert);
  if (fishOnly.length && t.eq.filter === 0) out.push({ lvl: 'bad', text: 'Không có máy lọc: chất độc tích tụ nhanh.' });
  if (c.ratio > 1) out.push({ lvl: c.ratio > 1.5 ? 'bad' : 'warn', text: `Quá tải: ${Math.round(c.bioload)} cm cá cho ${c.litres}L (nên ≤ 1 cm/L).` });
  const seen = new Set();
  for (const f of c.fs) {
    const sp = SPECIES[f.sp]; if (seen.has(f.sp)) continue; seen.add(f.sp);
    if (sp.school > 0 && c.count[f.sp] < sp.school) out.push({ lvl: 'warn', text: `${sp.name} cần đàn ≥ ${sp.school} con (đang có ${c.count[f.sp]}).` });
    if (sp.shy && c.hide < 1) out.push({ lvl: 'warn', text: `${sp.name} nhút nhát, cần cây hoặc hang để trốn.` });
    if (sp.minLitres && c.litres < sp.minLitres && t.kind === 'main') out.push({ lvl: 'bad', text: `${sp.name} cần hồ ≥ ${sp.minLitres}L.` });
    if (sp.temper === 'aggr' && c.count[f.sp] > 1) out.push({ lvl: 'bad', text: `Hai ${sp.name} cùng hồ sẽ đánh nhau.` });
    if (sp.temp[0] > 27.5 && !t.eq.heater) out.push({ lvl: 'warn', text: `${sp.name} cần nước ${sp.temp[0]}°C+: nên bật máy sưởi.` });
    if (sp.temp[1] < 26 && ambientTemp() > sp.temp[1]) out.push({ lvl: 'warn', text: `${sp.name} thích nước mát (≤${sp.temp[1]}°C), trời đang nóng.` });
  }
  const ids = [...seen].map((id) => SPECIES[id]);
  for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
    const a = ids[i], b = ids[j];
    if (a.invert || b.invert) continue;
    if (a.temp[0] > b.temp[1] || b.temp[0] > a.temp[1]) out.push({ lvl: 'bad', text: `${a.name} và ${b.name} cần nhiệt độ khác nhau, không thể cùng khoẻ.` });
  }
  for (const a of c.aggr) for (const o of c.fs) {
    if (o.sp === a.sp) continue; const so = SPECIES[o.sp];
    if (!so.invert && (so.longFin || so.size <= 5)) { out.push({ lvl: 'warn', text: `${SPECIES[a.sp].name} sẽ đuổi đánh ${so.name}.` }); break; }
  }
  if (c.nippers.length) { const v = c.fs.find((o) => SPECIES[o.sp].longFin && !SPECIES[o.sp].nipper); if (v) out.push({ lvl: 'warn', text: `${SPECIES[c.nippers[0].sp].name} sẽ rỉa vây ${SPECIES[v.sp].name}.` }); }
  if (c.predators.length) { const v = c.fs.find((o) => SPECIES[o.sp].size <= 3); if (v) out.push({ lvl: 'warn', text: `${SPECIES[c.predators[0].sp].name} lớn có thể ăn ${SPECIES[v.sp].name}.` }); }
  if (c.medHarm && c.fs.some((f) => SPECIES[f.sp].invert)) out.push({ lvl: 'bad', text: 'Thuốc đang dùng gây hại cho tép, ốc: chuyển chúng đi!' });
  if (c.plants && t.eq.light === 0) out.push({ lvl: 'warn', text: 'Cây thủy sinh cần đèn để sống tốt.' });
  if (t.eq.light === 2 && !c.algaeEaters) out.push({ lvl: 'warn', text: 'Đèn sáng mà không có ốc, cá lau kiếng: rêu sẽ mọc nhanh.' });
  if (!fishOnly.length && t.kind === 'main') out.push({ lvl: 'info', text: 'Hồ chưa có cá. Ghé Cửa hàng để mua.' });
  return out;
}

/* ── Nước ── */
function simWater(t, c, dt) {
  const w = t.water, h = dt / H;
  const filt = [0, 3, 8][t.eq.filter];
  w.dirt = clamp(w.dirt + (c.bioload * 0.06 - filt - c.dirtCleaners * 0.5 - (c.bioload ? 0 : 1)) * h, 0, 100);
  w.ammonia = clamp(w.ammonia + ((w.dirt / 100) * 4 + c.bioload * 0.03 - [0, 3, 8][t.eq.filter] - c.plants * 0.3) * h, 0, 100);
  const lightAlgae = t.eq.light * 1.4 * (1 + w.ammonia / 100);
  w.algae = clamp(w.algae + (lightAlgae - c.algaeEaters * 1.2 - (t.eq.light === 0 ? 1 : 0.2)) * h, 0, 100);
  const amb = ambientTemp();
  const target = t.eq.heater ? Math.max(amb, t.eq.heatTemp) : amb;
  w.temp += (target - w.temp) * Math.min(1, h * (t.eq.heater ? 2.5 : 1));
  const o2t = clamp(100 - c.ratio * 35 + (t.eq.air ? 15 : 0) + c.plants * 2.5 + c.bubbler * 6 - Math.max(0, w.temp - 28) * 4 - (isNight() ? w.algae * 0.1 : 0), 15, 100);
  w.o2 += (o2t - w.o2) * Math.min(1, dt / 600);
  if (t.med && t.med.until < now()) { t.med = null; }
}

function rotPellet(t) { t.water.dirt = clamp(t.water.dirt + 1.5, 0, 100); t.water.ammonia = clamp(t.water.ammonia + 0.8, 0, 100); }

/* Khi bù thời gian dài: mồi được ăn/rữa ngay */
function resolvePelletsCoarse(t, c) {
  if (!t.pellets.length) return;
  const eaters = c.fs.filter((f) => !SPECIES[f.sp].invert);
  for (const p of t.pellets) {
    eaters.sort((a, b) => b.hunger - a.hunger);
    const f = eaters[0];
    if (f && f.hunger > 8) eatPellet(f); else rotPellet(t);
  }
  t.pellets.length = 0;
}
function eatPellet(f) {
  if (f.hunger < 15) f.overfed = Math.min(6, f.overfed + 1);
  f.hunger = Math.max(0, f.hunger - 22);
}

/* ── Cá ── */
function simFish(f, t, c, dt, cheap) {
  const sp = SPECIES[f.sp], h = dt / H, w = t.water;
  // đói & tự kiếm ăn
  let hungerRate = 100 / (8 * H) * (f.growth < 0.6 ? 1.4 : 1);
  if ((sp.cleaner === 'dirt' || sp.cleaner === 'both') && w.dirt > 12) { hungerRate -= 100 / (12 * H); w.dirt = Math.max(0, w.dirt - 0.2 * h); }
  if ((sp.cleaner === 'algae' || sp.cleaner === 'both') && w.algae > 8) { hungerRate -= 100 / (12 * H); }
  if (sp.invert && w.dirt < 12 && w.algae < 8) hungerRate *= 0.5;
  f.hunger = clamp(f.hunger + hungerRate * dt, 0, 100);
  f.overfed = Math.max(0, f.overfed - h * 0.5);
  // lớn
  if (f.growth < 1) f.growth = Math.min(1, f.growth + dt / (45 * MIN) * (f.hunger < 70 ? 1 : 0.3));
  // căng thẳng (làm mượt, hằng số 2 phút)
  const reasons = cheap ? null : stressReasons(f, t, c);
  const target = reasons ? clamp(reasons.reduce((s, r) => s + r.val, 0), 0, 100) : f.stress;
  f.stress += (target - f.stress) * Math.min(1, dt / 120);
  // sức khỏe
  let dh = 0;
  if (f.stress < 30 && f.hunger < 70) dh += 6 * (1 - (f.stress / 30) * 0.5);
  if (f.stress > 55) dh -= ((f.stress - 55) / 45) * 9;
  if (f.hunger >= 95) dh -= 8;
  if (f.disease) dh -= f.disease.sev * (sp.invert ? 10 : 7);
  if (sp.invert && c.medHarm) dh -= 25;
  f.health = clamp(f.health + dh * h, 0, 100);
  // thu nhập (khách ngắm cá khoẻ)
  if (f.health >= 60 && f.stress < 50 && !sp.invert) {
    const inc = INCOME_MIN[sp.rarity] / 60 * (0.3 + 0.7 * f.growth) * dt;
    S.coins += inc; f.earned += inc; S.stats.earned += inc;
  }
  // bệnh
  if (!sp.invert) simDisease(f, t, c, dt, reasons);
  if (f.health <= 0) return 'dead';
  return null;
}

function simDisease(f, t, c, dt, reasons) {
  const sp = SPECIES[f.sp], w = t.water, h = dt / H;
  if (!f.disease) {
    const p = Math.pow(f.stress / 100, 2) * 0.8 * sp.hardy * h;
    if (Math.random() < p) {
      const dev = w.temp < sp.temp[0] ? sp.temp[0] - w.temp : w.temp > sp.temp[1] ? w.temp - sp.temp[1] : 0;
      const moved = (now() - f.movedAt) / 1000 < 900;
      const nipped = reasons ? reasons.some((r) => r.text.startsWith('Bị rỉa') || r.text.startsWith('Đánh nhau')) : false;
      const wts = {
        ich: 1 + dev * 3 + (moved ? 3 : 0),
        finrot: 0.5 + (w.dirt > 45 ? 3 : 0) + (nipped ? 4 : 0),
        fungus: 0.3 + (w.dirt > 60 ? 2 : 0),
        bloat: f.overfed >= 3 ? 4 : 0.1,
        velvet: 0.3 + (w.ammonia > 40 ? 3 : 0),
        swim: (sp.shape === 'fancy' || sp.shape === 'disc' ? 1 : 0.1) + (w.temp < sp.temp[0] ? 2 : 0) + (f.overfed >= 3 ? 1 : 0),
      };
      let sum = 0; for (const k in wts) sum += wts[k];
      let r = Math.random() * sum, id = 'ich';
      for (const k in wts) { r -= wts[k]; if (r <= 0) { id = k; break; } }
      f.disease = { id, sev: 0.1, since: now() };
      emit('disease', `${f.name} (${sp.name}) có dấu hiệu ${DISEASES[id].name}.`, '🤒');
    }
    return;
  }
  const D = DISEASES[f.disease.id];
  let rate = 1 / (4 * H); // nặng dần
  const medOK = t.med && t.med.type === D.med;
  if (medOK && w.dirt < 60) rate -= 1 / ((t.kind === 'hospital' ? 1.5 : 2.5) * H);
  else if (medOK) rate -= 1 / (5 * H);
  if (f.disease.id === 'ich' && w.temp >= 29) rate -= 1 / (6 * H);
  if ((f.disease.id === 'bloat' || f.disease.id === 'swim') && f.hunger > 60) rate -= 1 / (5 * H);
  if (f.disease.id === 'finrot' && w.dirt < 25 && w.ammonia < 15) rate -= 1 / (8 * H);
  if (f.stress < 25) rate -= 1 / (12 * H); // sức đề kháng
  f.disease.sev = clamp(f.disease.sev + rate * dt, 0, 1);
  if (f.disease.sev <= 0) {
    emit('cured', `${f.name} đã khỏi ${D.name}!`, '💚');
    f.disease = null; f.health = Math.min(100, f.health + 10);
    return;
  }
  if (D.contagious > 0) {
    const p = D.contagious * f.disease.sev * h;
    for (const o of c.fs) {
      if (o === f || o.disease || SPECIES[o.sp].invert) continue;
      if (Math.random() < p) { o.disease = { id: f.disease.id, sev: 0.08, since: now() }; emit('disease', `${o.name} bị lây ${D.name} từ ${f.name}.`, '🦠'); }
    }
  }
}

/* ── Ép đẻ ── */
function breedingInfo(a, b, t) {
  const sa = SPECIES[a.sp], sb = SPECIES[b.sp];
  if (sa.invert || sb.invert) return { ok: false, reason: 'Tép, ốc không ép đẻ được ở đây.' };
  const res = a.sp === b.sp ? sa : findRecipe(a.sp, b.sp);
  if (!res) return { ok: false, reason: `${sa.name} và ${sb.name} không lai được với nhau.` };
  if (!isAdult(a) || !isAdult(b)) return { ok: false, res, reason: 'Cả hai phải trưởng thành.' };
  if (a.disease || b.disease || a.health < 50 || b.health < 50) return { ok: false, res, reason: 'Cả hai phải khoẻ mạnh, không bệnh.' };
  if (a.sp === b.sp && a.sex === b.sex) return { ok: false, res, reason: 'Cùng loài cần một đực (♂) một cái (♀).' };
  const cd = 5 * MIN * 1000;
  if (now() - a.lastBreed < cd || now() - b.lastBreed < cd) return { ok: false, res, reason: 'Cá cần nghỉ ' + fmtDur((cd - Math.min(now() - a.lastBreed, now() - b.lastBreed)) / 1000) + ' nữa.' };
  const c = tankContext(t), w = t.water;
  const lines = [];
  const base = BREED_BASE[res.rarity]; lines.push({ text: `Cơ bản (${RARITY[res.rarity].name})`, v: pct(base) });
  let ch = base;
  const hm = 0.6 + 0.4 * ((a.health + b.health) / 200); ch *= hm; lines.push({ text: 'Sức khoẻ cha mẹ', v: '×' + hm.toFixed(2) });
  const q = 1 - clamp(w.ammonia / 100, 0, 0.5) - clamp(w.dirt / 200, 0, 0.25); ch *= q; lines.push({ text: 'Chất lượng nước', v: '×' + q.toFixed(2) });
  if (c.plants) { ch += 0.1; lines.push({ text: 'Có cây để đẻ trứng', v: '+10%' }); } else lines.push({ text: 'Không có cây đẻ trứng', v: '+0%' });
  const others = c.fs.length - 2;
  if (others > 0) { const pen = Math.min(0.3, others * 0.1); ch -= pen; lines.push({ text: `${others} cá khác quấy rầy`, v: '−' + pct(pen) }); }
  if (t.kind !== 'breed') { ch *= 0.5; lines.push({ text: 'Không phải hồ ép đẻ', v: '×0.5' }); }
  if (a.stress > 40 || b.stress > 40) { ch *= 0.8; lines.push({ text: 'Cha mẹ căng thẳng', v: '×0.8' }); }
  ch = clamp(ch, 0.02, 0.95);
  return { ok: true, res, chance: ch, duration: BREED_MIN[res.rarity] * 60, lines, discovered: !!S.discovered[res.id], same: a.sp === b.sp };
}

function startBreeding(t, a, b) {
  const info = breedingInfo(a, b, t);
  if (!info.ok) return info;
  t.breeding = { a: a.id, b: b.id, start: now(), end: now() + info.duration * 1000, chance: info.chance, result: info.res.id, same: info.same };
  a.lastBreed = b.lastBreed = now();
  addLog(`Bắt đầu ép ${a.name} × ${b.name} → ${info.discovered ? info.res.name : '???'} (${pct(info.chance)}, ${fmtDur(info.duration)})`, '🥚');
  return info;
}

function resolveBreeding(t) {
  const br = t.breeding; t.breeding = null;
  const a = fishById(br.a), b = fishById(br.b);
  const res = SPECIES[br.result];
  if (!a || !b || a.tankId !== t.id || b.tankId !== t.id) { emit('breedfail', 'Ép đẻ thất bại: cha mẹ không còn trong hồ.', '💔'); return; }
  if (Math.random() > br.chance) { emit('breedfail', `Trứng của ${a.name} × ${b.name} không nở. Thử lại sau nhé.`, '💔'); return; }
  const n = br.same ? randInt(2, 4) : res.rarity >= 4 ? 1 : randInt(1, 2);
  const first = !S.discovered[res.id];
  S.discovered[res.id] = true;
  for (let i = 0; i < n; i++) {
    const fry = newFish(res.id, t.id, { growth: 0.25, gen: Math.max(a.gen, b.gen) + 1, parents: [a.sp, b.sp] });
    fry.x = a.x + rand(-3, 3); fry.y = a.y + rand(-2, 2);
    S.fish.push(fry); S.stats.born++;
  }
  emit(first ? 'discover' : 'breed', first ? `🎉 Khám phá loài mới: ${res.name} (${RARITY[res.rarity].name})!` : `${n} cá con ${res.name} đã nở!`, first ? '✨' : '🐣');
}

/* ── Vòng mô phỏng ── */
function simulate(dt, cheap = false) {
  const dead = [];
  for (const t of S.tanks) {
    const c = tankContext(t);
    simWater(t, c, dt);
    if (cheap || dt > 5) resolvePelletsCoarse(t, c);
    for (const f of c.fs) if (simFish(f, t, c, dt, cheap) === 'dead') dead.push(f);
    if (t.breeding && now() >= t.breeding.end) resolveBreeding(t);
  }
  for (const f of dead) {
    S.fish.splice(S.fish.indexOf(f), 1); S.stats.died++;
    emit('death', `${f.name} (${SPECIES[f.sp].name}) đã chết${f.disease ? ' vì ' + DISEASES[f.disease.id].name : ''}.`, '🕊️');
  }
}

/* Bù thời gian khi mở lại: chạy mô phỏng thô theo bước 60s */
function catchUp() {
  const gap = Math.min(OFFLINE_CAP, (now() - S.lastSave) / 1000);
  if (gap < 30) return 0;
  const step = 60; let left = gap;
  const before = S.coins;
  // ép đẻ kết thúc trong lúc offline: resolveBreeding dùng now() nên vẫn đúng
  while (left > 0) { const dt = Math.min(step, left); simulate(dt, left > 3600); left -= dt; }
  return { gap, earned: S.coins - before };
}

/* ── Hành động ── */
function feedTank(t) {
  if (S.food <= 0) return false;
  const c = tankContext(t);
  const eaters = c.fs.filter((f) => !SPECIES[f.sp].invert).length;
  S.food--;
  const n = clamp(Math.round(eaters * 1.3) + 2, 3, 16);
  const d = tankDims(t);
  for (let i = 0; i < n; i++) t.pellets.push({ x: rand(d.W * 0.15, d.W * 0.85), y: rand(0.5, 2), vy: rand(0.8, 1.6), vx: rand(-0.3, 0.3), age: 0 });
  t.lastFed = now();
  return true;
}
function cleanTank(t, amt) {
  t.water.dirt = Math.max(0, t.water.dirt - amt);
  t.water.algae = Math.max(0, t.water.algae - amt * 0.9);
}
function waterChange(t) {
  const w = t.water;
  w.ammonia *= 0.7; w.dirt *= 0.85;
  w.temp = w.temp * 0.7 + 26 * 0.3;
  t.lastChange = now();
  for (const p of t.pellets) rotPellet(t); t.pellets.length = 0;
  addLog(`Thay 30% nước ${t.name}.`, '💧');
}
function applyMed(t, type) {
  if (!spend(MEDS[type].price)) return false;
  t.med = { type, until: now() + MED_HOURS * H * 1000 };
  addLog(`Dùng ${MEDS[type].name} cho ${t.name}.`, '💊');
  return true;
}
function moveFish(f, tankId) {
  const t = tankById(tankId); if (!t) return;
  const d = tankDims(t);
  f.tankId = tankId; f.movedAt = now();
  f.x = rand(d.W * 0.3, d.W * 0.7); f.y = SPECIES[f.sp].zone === 'bottom' ? d.H * 0.9 : d.H * 0.4; f.vx = 0; f.vy = 0;
  addLog(`Chuyển ${f.name} sang ${t.name}.`, '🫧');
}
function sellFish(f) {
  const v = fishValue(f);
  S.coins += v; S.stats.sold++;
  S.fish.splice(S.fish.indexOf(f), 1);
  addLog(`Bán ${f.name} (${SPECIES[f.sp].name}) được ${v} xu.`, '💰');
  return v;
}
function buyFish(spId, t) {
  const sp = SPECIES[spId];
  if (!spend(sp.price)) return null;
  const f = newFish(spId, t.id);
  S.fish.push(f);
  addLog(`Mua ${sp.name} "${f.name}" về ${t.name}.`, '🛒');
  return f;
}

/* ── Chẩn đoán ── */
function diagnose(f) {
  const t = tankById(f.tankId), c = tankContext(t), sp = SPECIES[f.sp];
  const reasons = stressReasons(f, t, c);
  const symptoms = [];
  let status, color;
  if (f.health < 25) { status = 'Nguy kịch'; color = '#ff4d4d'; }
  else if (f.disease) { status = 'Đang bệnh'; color = '#ff8a3d'; }
  else if (f.stress > 60) { status = 'Rất căng thẳng'; color = '#ffb347'; }
  else if (f.stress > 30) { status = 'Hơi căng thẳng'; color = '#ffd76a'; }
  else if (f.hunger > 70) { status = 'Đói'; color = '#ffd76a'; }
  else { status = 'Khoẻ mạnh'; color = '#5ad17a'; }
  if (f.disease) symptoms.push(...DISEASES[f.disease.id].symptoms);
  if (f.hunger > 70) symptoms.push('Đói, sục sạo tìm thức ăn');
  if (f.stress > 60 && !f.disease) symptoms.push('Kẹp vây, màu nhạt đi');
  if (f.health < 40) symptoms.push('Bơi lờ đờ, hay nằm gần đáy');
  if (t.water.o2 < 55) symptoms.push('Ngáp ở mặt nước');
  if (!symptoms.length) symptoms.push(sp.invert ? 'Đang chăm chỉ dọn hồ' : 'Bơi lội bình thường, ăn tốt');
  const steps = [];
  if (f.disease) {
    const D = DISEASES[f.disease.id];
    steps.push(...D.treat);
    if (t.kind !== 'hospital' && S.tanks.some((x) => x.kind === 'hospital')) steps.push('Chuyển sang hồ dưỡng bệnh để thuốc hiệu quả hơn và không lây lan');
  }
  for (const r of reasons.slice(0, 4)) {
    if (r.text === 'Đói') steps.push('Cho ăn (bấm Cho ăn ở thanh dưới)');
    else if (r.text.startsWith('Nước độc')) steps.push('Thay nước 30%, lắp/lên cấp máy lọc, thêm cây');
    else if (r.text === 'Hồ bẩn') steps.push('Dọn hồ (kéo tay lau qua hồ) và thêm cá chuột, tép dọn đáy');
    else if (r.text.startsWith('Nhiệt độ')) steps.push(t.water.temp < sp.temp[0] ? `Bật máy sưởi và đặt ${sp.temp[0]}–${sp.temp[1]}°C` : 'Tắt/hạ máy sưởi, hoặc chuyển sang hồ mát hơn');
    else if (r.text === 'Thiếu oxy') steps.push('Lắp máy sủi, thêm cây, giảm số cá');
    else if (r.text === 'Hồ quá tải cá') steps.push('Chuyển bớt cá sang hồ khác hoặc nâng cấp hồ lớn hơn');
    else if (r.text.startsWith('Thiếu đàn')) steps.push(`Mua thêm ${sp.name} cho đủ ${sp.school} con`);
    else if (r.text.startsWith('Thiếu cây')) steps.push('Vào Thiết kế, thêm cây thủy sinh hoặc hang đá');
    else if (r.text.startsWith('Hồ quá nhỏ')) steps.push('Nâng cấp hồ lớn hơn trong Thiết kế');
    else if (r.text.startsWith('Đánh nhau')) steps.push('Tách hai con hung dữ ra hai hồ');
    else if (r.text.startsWith('Bị ')) steps.push('Chuyển con này hoặc kẻ bắt nạt sang hồ khác');
    else if (r.text.startsWith('Thuốc')) steps.push('Chuyển tép, ốc sang hồ không có thuốc ngay');
  }
  return { status, color, symptoms, reasons, steps: [...new Set(steps)], disease: f.disease ? DISEASES[f.disease.id] : null };
}


/* ══════════ boids.js ══════════ */
/* ═══════════════════════ boids.js — chuyển động cá (đơn vị cm, cm/s) ═══════════════════════ */

const AI = new Map(); // id -> trạng thái tạm (không lưu)
function ai(f) {
  let a = AI.get(f.id);
  if (!a) { a = { tx: f.x, ty: f.y, timer: 0, phase: rand(Math.PI * 2), state: 'wander', bank: 0, face: 1, chaseT: 0, restT: 0 }; AI.set(f.id, a); }
  return a;
}

function zoneBand(sp, d) {
  if (sp.zone === 'top') return [d.H * 0.08, d.H * 0.45];
  if (sp.zone === 'bottom') return [d.H * 0.8, d.H * 0.94];
  return [d.H * 0.2, d.H * 0.8];
}

function decoAt(t, d, minHide = 0.5) {
  const list = t.deco.filter((x) => (DECO[x.type]?.hide || 0) >= minHide);
  return list.length ? pick(list) : null;
}

function newTarget(f, sp, t, d, a) {
  const [y0, y1] = zoneBand(sp, d);
  const hideNeed = sp.shy && (f.stress > 35 || Math.random() < 0.35);
  if (hideNeed) {
    const dc = decoAt(t, d, 0.5);
    if (dc) { const D = DECO[dc.type]; a.tx = dc.x + rand(-D.w * 0.3, D.w * 0.3); a.ty = d.H - D.h * rand(0.3, 0.8); a.state = 'hide'; a.timer = rand(4, 10); return; }
  }
  a.tx = rand(d.W * 0.06, d.W * 0.94); a.ty = rand(y0, y1); a.state = 'wander';
  a.timer = rand(2.5, 7) * (sp.speed < 5 ? 1.5 : 1);
}

function updateMovement(t, dt, time) {
  const d = tankDims(t);
  const fs = fishIn(t.id);
  const pellets = t.pellets;
  // mồi rơi
  for (let i = pellets.length - 1; i >= 0; i--) {
    const p = pellets[i];
    p.age += dt;
    const floor = d.H - 1.2;
    if (p.y < floor) { p.y += p.vy * dt; p.x += p.vx * dt; p.vx *= 0.98; }
    else p.y = floor;
    if (p.age > 150) { rotPellet(t); pellets.splice(i, 1); }
  }
  for (const f of fs) {
    const sp = SPECIES[f.sp], a = ai(f);
    if (sp.shape === 'snail') { moveSnail(f, a, d, dt); continue; }
    if (sp.shape === 'shrimp') { moveShrimp(f, a, d, dt, t); continue; }
    const sick = f.health < 35 || (f.disease && f.disease.sev > 0.6);
    const lenCm = visSize(sp.size) * (0.35 + 0.65 * f.growth);
    let maxSp = sp.speed * (0.5 + 0.5 * f.health / 100) * (f.growth < 0.6 ? 0.8 : 1);
    if (sick) maxSp *= 0.45;
    a.timer -= dt;

    // 1. mục tiêu
    let sx = 0, sy = 0;
    let feeding = false;
    if (f.hunger > 25 && pellets.length && !sp.invert) {
      let best = null, bd = 1e9;
      for (const p of pellets) { const dd = (p.x - f.x) ** 2 + (p.y - f.y) ** 2; if (dd < bd) { bd = dd; best = p; } }
      if (best && (sp.zone !== 'bottom' || best.y > d.H * 0.7 || bd < 36)) {
        feeding = true;
        a.tx = best.x; a.ty = best.y; a.state = 'feed';
        if (bd < (lenCm * 0.45 + 0.8) ** 2) { pellets.splice(pellets.indexOf(best), 1); eatPellet(f); a.timer = 0.3; }
      }
    }
    if (!feeding) {
      if (a.state === 'feed') { a.state = 'wander'; a.timer = 0; }
      if (a.timer <= 0 || ((a.tx - f.x) ** 2 + (a.ty - f.y) ** 2) < 4) newTarget(f, sp, t, d, a);
      // xiêm/tứ vân đuổi cá vây dài
      if ((sp.temper === 'aggr' || sp.nipper) && a.chaseT <= 0 && Math.random() < dt * 0.05) {
        const vic = fs.filter((o) => o !== f && !SPECIES[o.sp].invert && (SPECIES[o.sp].longFin || (sp.temper === 'aggr' && o.sp === f.sp)));
        if (vic.length) { a.victim = pick(vic).id; a.chaseT = rand(2, 4); }
      }
      if (a.chaseT > 0) {
        a.chaseT -= dt;
        const v = fishById(a.victim);
        if (v && v.tankId === t.id) { a.tx = v.x; a.ty = v.y; maxSp *= 1.4; const va = ai(v); va.fleeX = f.x; va.fleeY = f.y; va.fleeT = 1.2; }
        else a.chaseT = 0;
      }
    }
    let dx = a.tx - f.x, dy = a.ty - f.y;
    let dist = Math.hypot(dx, dy) || 1;
    const arrive = Math.min(1, dist / 6);
    sx += (dx / dist) * maxSp * arrive * 1.2; sy += (dy / dist) * maxSp * arrive * 1.2;

    // chạy trốn
    if (a.fleeT > 0) { a.fleeT -= dt; const fx = f.x - a.fleeX, fy = f.y - a.fleeY, fd = Math.hypot(fx, fy) || 1; sx += (fx / fd) * maxSp * 2.5; sy += (fy / fd) * maxSp * 1.5; }

    // 2. đàn & tách
    let cx = 0, cy = 0, ax = 0, ay = 0, n = 0, rx = 0, ry = 0;
    for (const o of fs) {
      if (o === f) continue;
      const ox = o.x - f.x, oy = o.y - f.y, dd = ox * ox + oy * oy;
      const so = SPECIES[o.sp];
      const sep = (lenCm + visSize(so.size) * (0.35 + 0.65 * o.growth)) * 0.45;
      if (dd < sep * sep && dd > 0.0001) { const q = Math.sqrt(dd); rx -= (ox / q) * (sep - q) / sep; ry -= (oy / q) * (sep - q) / sep; }
      if (sp.school > 0 && o.sp === f.sp && dd < (lenCm * 8) ** 2) { cx += o.x; cy += o.y; ax += o.vx; ay += o.vy; n++; }
    }
    if (n) {
      cx = cx / n - f.x; cy = cy / n - f.y;
      sx += cx * 0.35 + (ax / n - f.vx) * 0.6; sy += cy * 0.35 + (ay / n - f.vy) * 0.6;
    }
    sx += rx * maxSp * 1.6; sy += ry * maxSp * 1.6;

    // 3. tường
    const m = lenCm * 0.6 + 1;
    if (f.x < m) sx += (m - f.x) * 4; if (f.x > d.W - m) sx -= (f.x - d.W + m) * 4;
    if (f.y < m * 0.6) sy += (m * 0.6 - f.y) * 4; if (f.y > d.H - m * 0.5) sy -= (f.y - d.H + m * 0.5) * 4;
    // né trang trí (chỉ vật rắn)
    for (const dc of t.deco) {
      const D = DECO[dc.type]; if (!D || D.plant || D.kind === 'bubbler' || D.kind === 'shell') continue;
      if (a.state === 'hide') continue;
      const cxD = dc.x, cyD = d.H - D.h / 2, rr = Math.max(D.w, D.h) * 0.55 + lenCm * 0.3;
      const ox = f.x - cxD, oy = f.y - cyD, q = Math.hypot(ox, oy);
      if (q < rr && q > 0.01) { sx += (ox / q) * (rr - q) * 3; sy += (oy / q) * (rr - q) * 3; }
    }

    // 4. bệnh: bơi nghiêng, chìm/nổi
    if (sick) { sy += (f.disease && f.disease.id === 'swim' ? (Math.sin(time * 0.7 + a.phase) > 0 ? -1 : 1) * 2 : 1.2); }
    if (f.hunger < 20 && a.restT <= 0 && Math.random() < dt * 0.02) a.restT = rand(2, 5);
    if (a.restT > 0) { a.restT -= dt; sx *= 0.15; sy *= 0.15; }

    // 5. tích phân
    const accel = maxSp * (feeding ? 3 : 1.6);
    let ddx = sx - f.vx, ddy = sy - f.vy;
    const dl = Math.hypot(ddx, ddy) || 1;
    const lim = Math.min(dl, accel * dt);
    f.vx += (ddx / dl) * lim; f.vy += (ddy / dl) * lim;
    const spd = Math.hypot(f.vx, f.vy);
    if (spd > maxSp) { f.vx *= maxSp / spd; f.vy *= maxSp / spd; }
    // cá bơi ngang là chính
    f.vy *= 0.97;
    f.x = clamp(f.x + f.vx * dt, 0.5, d.W - 0.5);
    f.y = clamp(f.y + f.vy * dt, 0.5, d.H - 0.6);
    // hướng mặt (đổi chậm để không giật)
    if (Math.abs(f.vx) > maxSp * 0.08) a.face = f.vx > 0 ? 1 : -1;
    a.phase += dt * (2.5 + spd * 1.6 / Math.max(1, lenCm * 0.4));
    a.speedN = spd / Math.max(0.1, maxSp);
  }
}

function moveSnail(f, a, d, dt) {
  // bò dọc đáy hoặc theo kính bên
  if (a.timer <= 0) { a.timer = rand(6, 15); a.dir = pick([-1, 1]); a.onGlass = Math.random() < 0.35; }
  a.timer -= dt;
  const v = 0.8;
  if (a.onGlass) {
    const side = f.x < d.W / 2 ? 0.8 : d.W - 0.8; f.x += (side - f.x) * Math.min(1, dt * 2);
    f.y = clamp(f.y + a.dir * v * dt, d.H * 0.2, d.H - 1);
    if (f.y <= d.H * 0.2 || f.y >= d.H - 1) a.dir *= -1;
  } else {
    f.y += (d.H - 1 - f.y) * Math.min(1, dt * 2);
    f.x = clamp(f.x + a.dir * v * dt, 1, d.W - 1);
    if (f.x <= 1 || f.x >= d.W - 1) a.dir *= -1;
  }
  a.face = a.dir; a.phase += dt;
}

function moveShrimp(f, a, d, dt, t) {
  a.timer -= dt;
  if (a.timer <= 0) {
    a.timer = rand(1.5, 4);
    if (Math.random() < 0.3) { a.hopX = rand(-6, 6); a.hopY = -rand(2, 5); }
    else { a.hopX = rand(-1.5, 1.5); a.hopY = 0; }
    a.dir = a.hopX < 0 ? -1 : 1;
  }
  // nhặt mồi gần đáy
  let best = null, bd = 1e9;
  for (const p of t.pellets) if (p.y > d.H * 0.75) { const dd = (p.x - f.x) ** 2; if (dd < bd) { bd = dd; best = p; } }
  if (best && f.hunger > 20) { f.vx += Math.sign(best.x - f.x) * 2 * dt; if (bd < 1.5) { t.pellets.splice(t.pellets.indexOf(best), 1); eatPellet(f); } }
  f.vx += a.hopX * dt * 2; f.vy += a.hopY * dt * 2 + 3 * dt; // trọng lực
  f.vx *= 0.9; f.vy *= 0.92;
  f.x = clamp(f.x + f.vx * dt, 1, d.W - 1);
  f.y = clamp(f.y + f.vy * dt, d.H * 0.5, d.H - 1);
  if (f.y >= d.H - 1) f.vy = 0;
  if (Math.abs(f.vx) > 0.2) a.face = f.vx > 0 ? 1 : -1;
  a.phase += dt * 3;
}


/* ══════════ render.js ══════════ */
/* ═══════════════════════ render.js — vẽ hồ, trang trí, cá ═══════════════════════ */

const R = { bubbles: [], debris: [], sparks: [], time: 0, layout: null, selected: null, hover: null, clean: null, dragDeco: null, ghost: null };

function hash01(str, n = 0) {
  let h = 2166136261 ^ n;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 10000) / 10000;
}
function shade(hex, k) { // k>0 sáng, <0 tối
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = (c) => clamp(Math.round(k > 0 ? c + (255 - c) * k : c * (1 + k)), 0, 255);
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function withAlpha(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

function computeLayout(t, rect) {
  const d = tankDims(t), spec = tankSpec(t.kind, t.size);
  const pad = 18;
  const s = Math.min(((rect.w - pad * 2) * spec.fit) / d.W, ((rect.h - pad * 2) * spec.fit) / d.H);
  const w = d.W * s, h = d.H * s;
  const x = rect.x + (rect.w - w) / 2, y = rect.y + (rect.h - h) / 2 + rect.h * 0.03;
  return { x, y, w, h, s, W: d.W, H: d.H };
}
const toPx = (L, cx, cy) => [L.x + cx * L.s, L.y + cy * L.s];
const toCm = (L, px, py) => [(px - L.x) / L.s, (py - L.y) / L.s];

/* ── Phòng & hồ ── */
function drawRoom(ctx, W, Hh, night) {
  const g = ctx.createLinearGradient(0, 0, 0, Hh);
  if (night) { g.addColorStop(0, '#0b1020'); g.addColorStop(1, '#05070d'); }
  else { g.addColorStop(0, '#1b2838'); g.addColorStop(1, '#0d141d'); }
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, Hh);
}

function drawTankBack(ctx, t, L, night) {
  const bg = BACKGROUNDS[t.bg] || BACKGROUNDS.blue;
  const lightOn = t.eq.light > 0;
  // bóng & tủ
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.filter = 'blur(14px)';
  ctx.fillRect(L.x - 6, L.y + L.h * 0.15, L.w + 12, L.h + 14);
  ctx.restore();
  ctx.fillStyle = night ? '#0a0d14' : '#131a24';
  ctx.fillRect(L.x - 10, L.y + L.h, L.w + 20, 16);
  // nước
  const g = ctx.createLinearGradient(0, L.y, 0, L.y + L.h);
  g.addColorStop(0, bg.top); g.addColorStop(1, bg.bot);
  ctx.fillStyle = g; ctx.fillRect(L.x, L.y, L.w, L.h);
  // đèn tắt → tối
  if (!lightOn) { ctx.fillStyle = `rgba(2,6,14,${night ? 0.72 : 0.45})`; ctx.fillRect(L.x, L.y, L.w, L.h); }
  else if (t.eq.light === 2) { const gg = ctx.createRadialGradient(L.x + L.w / 2, L.y, 0, L.x + L.w / 2, L.y, L.w * 0.8); gg.addColorStop(0, 'rgba(255,255,230,.28)'); gg.addColorStop(1, 'rgba(255,255,230,0)'); ctx.fillStyle = gg; ctx.fillRect(L.x, L.y, L.w, L.h); }

      const gr = ctx.createLinearGradient(0, L.y, 0, L.y + L.h);
      gr.addColorStop(0, `rgba(255,255,255,${0.09 * t.eq.light})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gr; ctx.beginPath();
      ctx.moveTo(x0 - L.w * 0.02, L.y); ctx.lineTo(x0 + L.w * 0.02, L.y); ctx.lineTo(x0 + L.w * 0.12, L.y + L.h); ctx.lineTo(x0 - L.w * 0.06, L.y + L.h); ctx.closePath(); ctx.fill();

  if (w.dirt > 20) { const gd = ctx.createLinearGradient(0, L.y, 0, L.y + L.h); gd.addColorStop(0, 'rgba(110,80,40,0)'); gd.addColorStop(1, `rgba(110,80,40,${(w.dirt - 20) / 80 * 0.5})`); ctx.fillStyle = gd; ctx.fillRect(L.x, L.y, L.w, L.h); }
  if (t.med) { const mc = { antifungal: 'rgba(40,90,255,.18)', ich: 'rgba(60,200,120,.12)', copper: 'rgba(80,200,220,.12)', antibiotic: 'rgba(255,220,120,.1)', epsom: 'rgba(255,255,255,.06)' }[t.med.type]; ctx.fillStyle = mc; ctx.fillRect(L.x, L.y, L.w, L.h); }
}

function drawSubstrate(ctx, t, L) {
  const sub = SUBSTRATES[t.substrate]; if (!sub || !sub.c1) return;

  const y = L.y + L.h - hpx;

  ctx.lineTo(L.x + L.w, L.y + L.h); ctx.closePath(); ctx.fill();

    for (let i = 0; i < 70; i++) {
      const px = L.x + hash01(t.id, i) * L.w, py = y + 2 + hash01(t.id, i + 500) * (hpx - 3);
      ctx.fillStyle = i % 3 ? 'rgba(255,255,255,.18)' : 'rgba(0,0,0,.25)';

}
const groundY = (L) => L.y + L.h - Math.max(6, L.s * 1.6);

/* ── Trang trí ── */
function drawDeco(ctx, dc, L, time, alpha = 1) {
  const D = DECO[dc.type]; if (!D) return;
  const [x] = toPx(L, dc.x, 0); const gy = groundY(L);
  const w = D.w * L.s, h = D.h * L.s;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, gy); if (dc.flip) ctx.scale(-1, 1);
  const seed = dc.id || dc.type;
  switch (D.kind) {
    case 'rock': {
      const g = ctx.createRadialGradient(-w * 0.2, -h * 0.7, 2, 0, -h * 0.3, w * 0.8); g.addColorStop(0, '#9aa3ad'); g.addColorStop(1, '#3b424b');
      ctx.fillStyle = g; ctx.beginPath();
      const n = 9;
      for (let i = 0; i <= n; i++) { const a = Math.PI + (i / n) * Math.PI; const r = (0.8 + hash01(seed, i) * 0.35); ctx.lineTo(Math.cos(a) * w * 0.5 * r, Math.sin(a) * h * r * 1.05); }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1; ctx.stroke(); break;
    }
    case 'wood': {
      ctx.strokeStyle = '#4a2f1b'; ctx.lineCap = 'round'; ctx.lineWidth = w * 0.11;
      ctx.beginPath(); ctx.moveTo(-w * 0.45, 0); ctx.quadraticCurveTo(-w * 0.1, -h * 0.3, w * 0.35, -h * 0.9); ctx.stroke();
      ctx.lineWidth = w * 0.07; ctx.beginPath(); ctx.moveTo(-w * 0.15, -h * 0.28); ctx.quadraticCurveTo(-w * 0.3, -h * 0.6, -w * 0.45, -h * 0.75); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(w * 0.1, -h * 0.55); ctx.quadraticCurveTo(w * 0.35, -h * 0.5, w * 0.5, -h * 0.45); ctx.stroke();
      ctx.strokeStyle = '#7a5433'; ctx.lineWidth = w * 0.03; ctx.beginPath(); ctx.moveTo(-w * 0.42, -2); ctx.quadraticCurveTo(-w * 0.1, -h * 0.32, w * 0.32, -h * 0.86); ctx.stroke(); break;
    }
    case 'cave': {
      const g = ctx.createLinearGradient(0, -h, 0, 0); g.addColorStop(0, '#7d858f'); g.addColorStop(1, '#3a4047');
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-w / 2, 0); ctx.quadraticCurveTo(-w * 0.55, -h * 1.05, 0, -h); ctx.quadraticCurveTo(w * 0.55, -h * 1.05, w / 2, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#0b0d10'; ctx.beginPath(); ctx.ellipse(w * 0.05, -h * 0.02, w * 0.28, h * 0.55, 0, Math.PI, 0); ctx.fill(); break;
    }
    case 'castle': {
      ctx.fillStyle = '#c9b8a3';
      ctx.fillRect(-w * 0.5, -h * 0.55, w, h * 0.55);
      ctx.fillRect(-w * 0.5, -h * 0.85, w * 0.28, h * 0.85); ctx.fillRect(w * 0.22, -h * 0.85, w * 0.28, h * 0.85);
      ctx.fillRect(-w * 0.12, -h, w * 0.24, h);
      ctx.fillStyle = '#a8957f';
      for (let i = -2; i <= 2; i++) ctx.fillRect(i * w * 0.2 - w * 0.05, -h * 0.62, w * 0.1, h * 0.08);
      ctx.fillRect(-w * 0.5, -h * 0.92, w * 0.1, h * 0.08); ctx.fillRect(-w * 0.32, -h * 0.92, w * 0.1, h * 0.08);
      ctx.fillRect(w * 0.22, -h * 0.92, w * 0.1, h * 0.08); ctx.fillRect(w * 0.4, -h * 0.92, w * 0.1, h * 0.08);
      ctx.fillStyle = '#e04848'; ctx.beginPath(); ctx.moveTo(-w * 0.12, -h); ctx.lineTo(w * 0.12, -h); ctx.lineTo(0, -h * 1.18); ctx.fill();
      ctx.fillStyle = '#2a2018'; ctx.beginPath(); ctx.ellipse(0, -h * 0.02, w * 0.12, h * 0.25, 0, Math.PI, 0); ctx.fill(); break;
    }
    case 'shell': {
      ctx.fillStyle = '#f2d9c4'; ctx.beginPath(); ctx.moveTo(0, 0);
      for (let i = 0; i <= 8; i++) { const a = Math.PI + (i / 8) * Math.PI; ctx.lineTo(Math.cos(a) * w * 0.5 * (i % 2 ? 1 : 0.92), Math.sin(a) * h * 1.1); }
      ctx.fill(); ctx.strokeStyle = '#c49b7c'; ctx.lineWidth = 1;
      for (let i = 1; i < 8; i++) { const a = Math.PI + (i / 8) * Math.PI; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * w * 0.5, Math.sin(a) * h * 1.1); ctx.stroke(); } break;
    }
    case 'bubbler': { ctx.fillStyle = '#556'; ctx.beginPath(); ctx.ellipse(0, -h * 0.4, w * 0.5, h * 0.5, 0, 0, 7); ctx.fill(); break; }
    case 'plant': drawPlant(ctx, D, w, h, seed, time); break;
  }
  ctx.restore();
}

function drawPlant(ctx, D, w, h, seed, time) {
  const sway = (k, f = 1) => Math.sin(time * 1.1 * f + hash01(seed, k) * 6) * 0.12;
  switch (D.style) {
    case 'moss': {
      for (let i = 0; i < 14; i++) { const px = (hash01(seed, i) - 0.5) * w, py = -hash01(seed, i + 40) * h; ctx.fillStyle = i % 2 ? '#2f7a3a' : '#4aa050'; ctx.beginPath(); ctx.arc(px, py, w * 0.14, 0, 7); ctx.fill(); }
      break;
    }
    case 'round': {
      for (let i = 0; i < 6; i++) {
        const a = -Math.PI / 2 + (i - 2.5) * 0.4 + sway(i) * 1.5, len = h * (0.55 + hash01(seed, i) * 0.45);
        const ex = Math.cos(a) * len, ey = Math.sin(a) * len;
        ctx.strokeStyle = '#1f5a2a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(ex, ey); ctx.stroke();
        const g = ctx.createRadialGradient(ex, ey, 1, ex, ey, w * 0.3); g.addColorStop(0, '#4caf50'); g.addColorStop(1, '#1b5e20');
        ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(ex, ey - w * 0.1, w * 0.26, w * 0.2, a + Math.PI / 2, 0, 7); ctx.fill();
      } break;
    }
    case 'fern': case 'red': case 'broad': {
      const col = D.style === 'red' ? ['#8e2a3a', '#d8506a'] : D.style === 'broad' ? ['#1e6b2e', '#5cc46a'] : ['#1f5e2c', '#3f9a4a'];
      const n = D.style === 'broad' ? 5 : 7;
      for (let i = 0; i < n; i++) {
        const a = -Math.PI / 2 + (i - (n - 1) / 2) * (D.style === 'broad' ? 0.35 : 0.22) + sway(i);
        const len = h * (0.7 + hash01(seed, i) * 0.3), wd = D.style === 'broad' ? w * 0.28 : w * 0.13;
        const g = ctx.createLinearGradient(0, 0, 0, -len); g.addColorStop(0, col[0]); g.addColorStop(1, col[1]);
        ctx.save(); ctx.rotate(a + Math.PI / 2); ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-wd, -len * 0.5, 0, -len); ctx.quadraticCurveTo(wd, -len * 0.5, 0, 0); ctx.fill();
        if (D.style === 'fern') { ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -len); ctx.stroke(); }
        ctx.restore();
      } break;
    }
    case 'grass': {
      for (let i = 0; i < 9; i++) {
        const bx = (hash01(seed, i) - 0.5) * w, len = h * (0.6 + hash01(seed, i + 20) * 0.4), sw = sway(i, 0.8) * len * 1.3;
        ctx.strokeStyle = i % 2 ? '#3f9a4a' : '#2e7d3a'; ctx.lineWidth = Math.max(1.5, w * 0.08); ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(bx, 0); ctx.quadraticCurveTo(bx + sw * 0.3, -len * 0.5, bx + sw, -len); ctx.stroke();
      } break;
    }
  }
}

/* ── Cá ── */
function bodyPath(shape, L, wag) {
  const p = new Path2D();
  const hl = L / 2;
  let hb; // nửa chiều cao
  switch (shape) {
    case 'torpedo': case 'phoenix': hb = L * 0.14; break;
    case 'oval': case 'sword': hb = L * 0.22; break;
    case 'fan': case 'veil': hb = L * 0.2; break;
    case 'tall': hb = L * 0.42; break;
    case 'disc': hb = L * 0.44; break;
    case 'fancy': hb = L * 0.3; break;
    case 'koi': hb = L * 0.17; break;
    case 'bottom': case 'pleco': hb = L * 0.17; break;
    default: hb = L * 0.2;
  }
  const tail = -hl * (shape === 'fan' || shape === 'veil' ? 0.55 : shape === 'phoenix' ? 0.8 : 0.85);
  const nose = hl * (shape === 'tall' || shape === 'disc' ? 0.8 : 1);
  if (shape === 'tall') {
    p.moveTo(nose, 0); p.quadraticCurveTo(nose * 0.4, -hb * 1.1, -hl * 0.2, -hb * 0.6); p.quadraticCurveTo(tail, -hb * 0.35, tail, 0);
    p.quadraticCurveTo(tail, hb * 0.35, -hl * 0.2, hb * 0.6); p.quadraticCurveTo(nose * 0.4, hb * 1.1, nose, 0);
  } else if (shape === 'disc') {
    p.ellipse(0, 0, hl * 0.82, hb, 0, 0, Math.PI * 2);
  } else if (shape === 'bottom' || shape === 'pleco') {
    p.moveTo(nose, hb * 0.5); p.quadraticCurveTo(nose * 0.5, -hb * 1.4, -hl * 0.1, -hb * 0.9); p.quadraticCurveTo(tail, -hb * 0.2, tail, wag);
    p.quadraticCurveTo(tail, hb * 0.5, -hl * 0.2, hb * 0.55); p.lineTo(nose * 0.7, hb * 0.55); p.quadraticCurveTo(nose, hb * 0.55, nose, hb * 0.5);
  } else {
    p.moveTo(nose, 0);
    p.quadraticCurveTo(hl * 0.45, -hb * 1.25, -hl * 0.1, -hb * 0.95);
    p.quadraticCurveTo(tail * 0.75, -hb * 0.5, tail, wag * 0.6);
    p.quadraticCurveTo(tail * 0.75, hb * 0.5, -hl * 0.1, hb * 0.95);
    p.quadraticCurveTo(hl * 0.45, hb * 1.25, nose, 0);
  }
  p.closePath();
  return { p, hb, tail, nose };
}

function drawFish(ctx, f, L, time, a) {
  const sp = SPECIES[f.sp];
  if (sp.shape === 'snail') return drawSnail(ctx, f, L, a);
  if (sp.shape === 'shrimp') return drawShrimp(ctx, f, L, a);
  if (sp.shape === 'dragon') return drawDragon(ctx, f, L, time, a);
  const col = sp.variants ? sp.variants[f.variant] || sp.col : sp.col;
  const lenCm = visSize(sp.size) * (0.35 + 0.65 * f.growth);
  const Lpx = Math.max(10, lenCm * L.s);
  const [px, py] = toPx(L, f.x, f.y);
  const face = a.face || 1;
  let ang = Math.atan2(f.vy, Math.abs(f.vx) + 0.01); ang = clamp(ang, -0.45, 0.45);
  const sick = f.health < 35 || (f.disease && f.disease.sev > 0.6);
  if (f.disease && f.disease.id === 'swim') ang += Math.sin(time * 0.8 + a.phase) * 0.8;
  else if (sick) ang += 0.25;
  const wag = Math.sin(a.phase) * Lpx * 0.07 * (0.4 + (a.speedN || 0.5));
  const fin = col.fin, body = col.body, acc = col.accent;
  const finS = sp.finScale || 1;
  const dull = 1 - f.health / 100;

  ctx.save();
  ctx.translate(px, py); ctx.scale(face, 1); ctx.rotate(ang);
  if (f.disease && f.disease.id === 'bloat') ctx.scale(1, 1 + 0.3 * f.disease.sev);
  if (sp.glow) { ctx.shadowColor = withAlpha(acc.length === 7 ? acc : '#ffffff', 0.6 + 0.3 * Math.sin(time * 2)); ctx.shadowBlur = 6 + sp.glow * 5 * (L.s / 6); }

  const { p, hb, tail, nose } = bodyPath(sp.shape, Lpx, wag);
  const ragged = f.disease && f.disease.id === 'finrot' ? f.disease.sev : 0;

  // ── vây đuôi ──
  ctx.fillStyle = withAlpha(fin, 0.85);
  const tx = tail; // gốc đuôi
  ctx.beginPath();
  if (sp.shape === 'fan') {
    const r = Lpx * 0.5 * finS;
    const g = ctx.createRadialGradient(tx, 0, r * 0.15, tx, 0, r); g.addColorStop(0, fin); g.addColorStop(1, withAlpha(acc, 0.85)); ctx.fillStyle = g;
    ctx.moveTo(tx + 2, 0); ctx.arc(tx + wag * 0.3, 0, r, Math.PI * 0.68, Math.PI * 1.32); ctx.closePath();
  } else if (sp.shape === 'veil') {
    const r = Lpx * 0.62 * finS, ww = wag * 1.4, tip = tx - r * (1 - ragged * 0.4);
    const g = ctx.createLinearGradient(tx, 0, tip, 0); g.addColorStop(0, withAlpha(fin, 0.9)); g.addColorStop(1, withAlpha(acc, 0.35)); ctx.fillStyle = g;
    for (let k = 0; k < 2; k++) {
      const o = k ? ww * 0.8 : 0, sc = k ? 0.8 : 1;
      ctx.beginPath(); ctx.moveTo(tx + 2, 0);
      ctx.bezierCurveTo(tx - r * 0.35, -r * 0.45 * sc + o, tx - r * 1.05, -r * 0.5 * sc + o, tip, ww * 1.6 + o);
      ctx.bezierCurveTo(tx - r * 1.05, r * 0.5 * sc + o, tx - r * 0.35, r * 0.45 * sc + o, tx + 2, 0);
      ctx.fill();
    }
    ctx.beginPath();
  } else if (sp.shape === 'phoenix') {
    for (let i = -1; i <= 1; i++) {
      const r = Lpx * (i === 0 ? 1.3 : 0.95), sw = Math.sin(a.phase * 0.7 + i) * Lpx * 0.15;
      const g = ctx.createLinearGradient(tx, 0, tx - r, 0); g.addColorStop(0, fin); g.addColorStop(0.6, body); g.addColorStop(1, withAlpha(acc, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(tx + 2, 0);
      ctx.bezierCurveTo(tx - r * 0.3, i * Lpx * 0.25 + sw, tx - r * 0.7, i * Lpx * 0.45 + sw * 1.5, tx - r, i * Lpx * 0.4 + sw * 2);
      ctx.bezierCurveTo(tx - r * 0.6, i * Lpx * 0.15 + sw, tx - r * 0.3, i * Lpx * 0.05, tx + 2, 0); ctx.fill();
    }
    ctx.beginPath();
  } else if (sp.shape === 'fancy') {
    const r = Lpx * 0.6;
    ctx.moveTo(tx, 0); ctx.bezierCurveTo(tx - r * 0.5, -r * 0.6 + wag, tx - r, -r * 0.8 + wag, tx - r * 0.7, wag * 0.5);
    ctx.bezierCurveTo(tx - r, r * 0.8 + wag, tx - r * 0.5, r * 0.6 + wag, tx, 0);
  } else if (sp.shape === 'sword') {
    ctx.moveTo(tx, 0); ctx.lineTo(tx - Lpx * 0.22, -hb * 0.9 + wag); ctx.lineTo(tx - Lpx * 0.15, wag * 0.6); ctx.lineTo(tx - Lpx * 0.6, hb * 1.6 + wag); ctx.lineTo(tx - Lpx * 0.1, hb * 0.5 + wag * 0.5); ctx.closePath();
  } else if (sp.shape === 'tall' || sp.shape === 'disc') {
    ctx.moveTo(tx, -hb * 0.35); ctx.quadraticCurveTo(tx - Lpx * 0.25, wag, tx - Lpx * 0.22, -hb * 0.6 + wag); ctx.lineTo(tx - Lpx * 0.2, hb * 0.6 + wag); ctx.quadraticCurveTo(tx - Lpx * 0.25, wag, tx, hb * 0.35); ctx.closePath();
  } else {
    const r = Lpx * 0.28 * (1 - ragged * 0.4);
    ctx.moveTo(tx, 0); ctx.lineTo(tx - r, -hb * 1.1 + wag); ctx.lineTo(tx - r * 0.6, wag * 0.8); ctx.lineTo(tx - r, hb * 1.1 + wag); ctx.closePath();
  }
  ctx.fill();
  if (ragged > 0.15) { ctx.fillStyle = 'rgba(30,20,20,.5)'; for (let i = 0; i < 4; i++) { const yy = (i - 1.5) * hb * 0.5; ctx.beginPath(); ctx.arc(tx - Lpx * 0.26 * (sp.shape === 'veil' ? 2.4 : 1), yy + wag, Lpx * 0.03 + ragged * Lpx * 0.03, 0, 7); ctx.fill(); } }

  // ── vây lưng / bụng ──
  ctx.fillStyle = withAlpha(fin, 0.75);
  if (sp.shape === 'veil') {
    const r = Lpx * 0.32 * finS;
    ctx.beginPath(); ctx.moveTo(-Lpx * 0.15, -hb * 0.9); ctx.quadraticCurveTo(-Lpx * 0.2 - wag, -hb - r, tail - r * 0.6, -hb * 0.5 + wag * 0.5); ctx.lineTo(tail, -hb * 0.3); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-Lpx * 0.05, hb * 0.9); ctx.quadraticCurveTo(-Lpx * 0.2 - wag, hb + r, tail - r * 0.6, hb * 0.5 + wag * 0.5); ctx.lineTo(tail, hb * 0.3); ctx.fill();
  } else if (sp.shape === 'tall') {
    const r = Lpx * 0.7 * finS;
    ctx.beginPath(); ctx.moveTo(Lpx * 0.1, -hb * 0.9); ctx.quadraticCurveTo(-Lpx * 0.1, -hb - r * 0.9, -Lpx * 0.45, -hb - r * 0.4 + wag * 0.3); ctx.lineTo(tail, -hb * 0.4); ctx.fill();
    ctx.beginPath(); ctx.moveTo(Lpx * 0.1, hb * 0.9); ctx.quadraticCurveTo(-Lpx * 0.1, hb + r * 0.9, -Lpx * 0.45, hb + r * 0.4 + wag * 0.3); ctx.lineTo(tail, hb * 0.4); ctx.fill();
  } else if (sp.shape === 'disc') {
    const r = hb * 0.35 * finS;
    ctx.beginPath(); ctx.ellipse(-Lpx * 0.05, -hb * 0.95, Lpx * 0.4, r, 0, Math.PI, 0); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-Lpx * 0.05, hb * 0.95, Lpx * 0.4, r, 0, 0, Math.PI); ctx.fill();
  } else if (sp.shape !== 'bottom' && sp.shape !== 'pleco') {
    ctx.beginPath(); ctx.moveTo(Lpx * 0.15, -hb * 0.9); ctx.quadraticCurveTo(-Lpx * 0.05, -hb * (sp.shape === 'fancy' ? 2 : 1.7), -Lpx * 0.3, -hb * 0.7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-Lpx * 0.05, hb * 0.9); ctx.quadraticCurveTo(-Lpx * 0.15, hb * 1.5, -Lpx * 0.3, hb * 0.7); ctx.fill();
  } else {
    ctx.beginPath(); ctx.moveTo(Lpx * 0.05, -hb * 0.9); ctx.lineTo(-Lpx * 0.05, -hb * 1.9); ctx.lineTo(-Lpx * 0.2, -hb * 0.8); ctx.fill();
  }

  // ── thân ──
  ctx.shadowBlur = 0;
  const g = ctx.createLinearGradient(0, -hb, 0, hb);
  g.addColorStop(0, shade(body, -0.25)); g.addColorStop(0.45, body); g.addColorStop(1, col.belly || shade(body, 0.45));
  ctx.fillStyle = g; ctx.fill(p);
  ctx.save(); ctx.clip(p);
  drawPattern(ctx, sp, col, f, Lpx, hb, time, a);
  // bóng nắng
  ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.ellipse(Lpx * 0.05, -hb * 0.5, Lpx * 0.3, hb * 0.28, 0, 0, 7); ctx.fill();
  if (dull > 0.3) { ctx.fillStyle = `rgba(120,120,120,${(dull - 0.3) * 0.7})`; ctx.fillRect(-Lpx, -Lpx, Lpx * 2, Lpx * 2); }
  drawDiseaseMarks(ctx, f, Lpx, hb);
  ctx.restore();
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1; ctx.stroke(p);

  // vây ngực
  ctx.fillStyle = withAlpha(fin, 0.6);
  ctx.save(); ctx.translate(Lpx * 0.15, hb * 0.3); ctx.rotate(Math.sin(a.phase * 1.3) * 0.4 + 0.5);
  ctx.beginPath(); ctx.ellipse(0, 0, Lpx * 0.14, hb * 0.35, 0, 0, 7); ctx.fill(); ctx.restore();

  // râu
  if (sp.shape === 'koi' || sp.shape === 'bottom') {
    ctx.strokeStyle = 'rgba(40,30,20,.7)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(nose - 2, hb * 0.3); ctx.quadraticCurveTo(nose + Lpx * 0.1, hb * 0.6, nose + Lpx * 0.12, hb * 0.9 + Math.sin(a.phase) * 2); ctx.stroke();
  }
  if (sp.shape === 'pleco') { ctx.fillStyle = '#2a2018'; ctx.beginPath(); ctx.ellipse(nose - Lpx * 0.05, hb * 0.45, Lpx * 0.09, hb * 0.2, 0, 0, 7); ctx.fill(); }

  // mắt
  const ex = nose - Lpx * (sp.shape === 'tall' || sp.shape === 'disc' ? 0.22 : 0.16), ey = -hb * (sp.shape === 'bottom' ? 0.4 : 0.2);
  const er = Math.max(1.3, Lpx * 0.045);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, ey, er, 0, 7); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(ex + er * 0.3, ey, er * 0.55, 0, 7); ctx.fill();
  ctx.restore();

  // tàn lửa phượng hoàng
  if (sp.shape === 'phoenix' && Math.random() < 0.35) R.sparks.push({ x: f.x - face * lenCm * 0.5, y: f.y, vx: rand(-1, 1), vy: rand(-2, -0.5), life: rand(0.6, 1.4), c: pick([fin, acc, body]) });
  if (sp.glow >= 2 && Math.random() < 0.08) R.sparks.push({ x: f.x + rand(-lenCm / 2, lenCm / 2), y: f.y + rand(-1, 1), vx: 0, vy: -0.6, life: 1, c: acc, tiny: true });
}

function drawPattern(ctx, sp, col, f, Lpx, hb, time, a) {
  const acc = col.accent;
  switch (sp.pattern) {
    case 'neon': {
      ctx.fillStyle = acc; ctx.shadowColor = acc; ctx.shadowBlur = 6;
      ctx.fillRect(-Lpx * 0.45, -hb * 0.35, Lpx * 0.9, hb * 0.35); ctx.shadowBlur = 0;
      ctx.fillStyle = col.fin; ctx.fillRect(-Lpx * 0.45, hb * 0.05, Lpx * 0.5, hb); break;
    }
    case 'hstripes': { ctx.fillStyle = withAlpha(acc, 0.85); for (let i = -1; i <= 1; i++) ctx.fillRect(-Lpx * 0.45, i * hb * 0.55 - hb * 0.12, Lpx * 0.9, hb * 0.22); break; }
    case 'bars': { ctx.fillStyle = withAlpha(acc, 0.85); for (let i = 0; i < 3; i++) { const x = Lpx * 0.22 - i * Lpx * 0.26; ctx.beginPath(); ctx.moveTo(x - Lpx * 0.05, -hb * 1.2); ctx.lineTo(x + Lpx * 0.05, -hb * 1.2); ctx.lineTo(x, hb * 1.2); ctx.lineTo(x - Lpx * 0.1, hb * 1.2); ctx.fill(); } break; }
    case 'spots': { ctx.fillStyle = withAlpha(acc, 0.7); for (let i = 0; i < 12; i++) { ctx.beginPath(); ctx.arc((hash01(f.id, i) - 0.5) * Lpx * 0.85, (hash01(f.id, i + 30) - 0.5) * hb * 1.6, Lpx * 0.03 + hash01(f.id, i + 60) * Lpx * 0.03, 0, 7); ctx.fill(); } break; }
    case 'speckle': { ctx.fillStyle = withAlpha(acc, 0.8); for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.arc((hash01(f.id, i) - 0.7) * Lpx * 0.6, (hash01(f.id, i + 30) - 0.5) * hb * 1.4, Lpx * 0.025, 0, 7); ctx.fill(); } break; }
    case 'patch': { ctx.fillStyle = acc; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse((hash01(f.id, i) - 0.5) * Lpx * 0.7, (hash01(f.id, i + 9) - 0.5) * hb, Lpx * (0.1 + hash01(f.id, i + 3) * 0.12), hb * 0.6, hash01(f.id, i + 5) * 3, 0, 7); ctx.fill(); } break; }
    case 'wave': { ctx.strokeStyle = withAlpha(acc, 0.7); ctx.lineWidth = Math.max(1, Lpx * 0.03); for (let i = 0; i < 5; i++) { const x = Lpx * 0.3 - i * Lpx * 0.15; ctx.beginPath(); for (let y = -hb; y <= hb; y += hb * 0.25) ctx.lineTo(x + Math.sin(y / hb * 4 + i) * Lpx * 0.03, y); ctx.stroke(); } break; }
    case 'iridescent': {
      const hue = (time * 40 + hash01(f.id) * 360) % 360;
      const g = ctx.createLinearGradient(-Lpx / 2, 0, Lpx / 2, 0);
      g.addColorStop(0, `hsla(${hue},90%,65%,.45)`); g.addColorStop(0.5, `hsla(${(hue + 90) % 360},90%,65%,.35)`); g.addColorStop(1, `hsla(${(hue + 180) % 360},90%,65%,.45)`);
      ctx.fillStyle = g; ctx.fillRect(-Lpx, -Lpx, Lpx * 2, Lpx * 2); break;
    }
    case 'plates': { ctx.strokeStyle = withAlpha(acc, 0.6); ctx.lineWidth = 1; for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(-Lpx * 0.45, i * hb * 0.5); ctx.lineTo(Lpx * 0.3, i * hb * 0.5); ctx.stroke(); } for (let i = 0; i < 5; i++) { const x = Lpx * 0.25 - i * Lpx * 0.15; ctx.beginPath(); ctx.moveTo(x, -hb); ctx.lineTo(x, hb); ctx.stroke(); } break; }
    case 'scales': { ctx.strokeStyle = withAlpha(acc, 0.55); ctx.lineWidth = 1; for (let r = 0; r < 6; r++) for (let c = 0; c < 3; c++) { ctx.beginPath(); ctx.arc(Lpx * 0.35 - r * Lpx * 0.14, (c - 1) * hb * 0.6 + (r % 2) * hb * 0.3, hb * 0.32, Math.PI * 0.7, Math.PI * 1.3); ctx.stroke(); } break; }
    case 'flame': { const g = ctx.createLinearGradient(Lpx / 2, 0, -Lpx / 2, 0); g.addColorStop(0, withAlpha(acc, 0.6)); g.addColorStop(1, withAlpha(col.fin, 0)); ctx.fillStyle = g; ctx.fillRect(-Lpx, -Lpx, Lpx * 2, Lpx * 2); break; }
    case 'stars': { for (let i = 0; i < 14; i++) { const tw = 0.5 + 0.5 * Math.sin(time * 3 + i * 1.7); ctx.fillStyle = `rgba(255,255,255,${0.4 + 0.6 * tw})`; ctx.beginPath(); ctx.arc((hash01(f.id, i) - 0.5) * Lpx * 0.9, (hash01(f.id, i + 30) - 0.5) * hb * 1.7, 0.6 + tw * Lpx * 0.02, 0, 7); ctx.fill(); } break; }
    case 'plain': default:
      if (col.spots) { ctx.fillStyle = 'rgba(20,20,20,.8)'; for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.arc((hash01(f.id, i) - 0.5) * Lpx * 0.85, (hash01(f.id, i + 30) - 0.5) * hb * 1.6, Lpx * 0.04, 0, 7); ctx.fill(); } }
  }
}

function drawDiseaseMarks(ctx, f, Lpx, hb) {
  if (!f.disease) return;
  const sev = f.disease.sev, id = f.disease.id, n = Math.round(3 + sev * 14);
  if (id === 'ich') { ctx.fillStyle = 'rgba(255,255,255,.95)'; for (let i = 0; i < n; i++) { ctx.beginPath(); ctx.arc((hash01(f.id, i + 100) - 0.5) * Lpx * 0.9, (hash01(f.id, i + 200) - 0.5) * hb * 1.7, Math.max(0.8, Lpx * 0.018), 0, 7); ctx.fill(); } }
  else if (id === 'velvet') { ctx.fillStyle = 'rgba(230,180,60,.8)'; for (let i = 0; i < n * 2; i++) { ctx.beginPath(); ctx.arc((hash01(f.id, i + 100) - 0.5) * Lpx * 0.9, (hash01(f.id, i + 200) - 0.5) * hb * 1.7, 0.7, 0, 7); ctx.fill(); } }
  else if (id === 'fungus') { ctx.fillStyle = 'rgba(245,245,245,.85)'; for (let i = 0; i < Math.round(1 + sev * 3); i++) { const x = (hash01(f.id, i + 100) - 0.5) * Lpx * 0.8, y = (hash01(f.id, i + 200) - 0.5) * hb; for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.arc(x + (hash01(f.id, k + i * 7) - 0.5) * Lpx * 0.08, y + (hash01(f.id, k + 50 + i * 7) - 0.5) * hb * 0.3, Lpx * 0.035, 0, 7); ctx.fill(); } } }
}

function drawSnail(ctx, f, L, a) {
  const [px, py] = toPx(L, f.x, f.y); const r = Math.max(4, SPECIES.snail.size * L.s * 0.5 * (0.5 + 0.5 * f.growth));
  ctx.save(); ctx.translate(px, py); ctx.scale(a.face || 1, 1);
  ctx.fillStyle = '#6b4a2b'; ctx.beginPath(); ctx.ellipse(r * 0.3, 0, r * 1.2, r * 0.45, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(r * 1.2, -r * 0.2); ctx.lineTo(r * 1.7, -r * 0.9); ctx.moveTo(r * 1.3, -r * 0.1); ctx.lineTo(r * 1.9, -r * 0.4); ctx.stroke();
  const g = ctx.createRadialGradient(-r * 0.3, -r * 0.7, 1, -r * 0.2, -r * 0.5, r); g.addColorStop(0, '#f0c060'); g.addColorStop(1, '#3a2510');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(-r * 0.2, -r * 0.45, r * 0.75, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(-r * 0.2, -r * 0.45, r * 0.4, 0, 5); ctx.stroke();
  ctx.restore();
}
function drawShrimp(ctx, f, L, a) {
  const [px, py] = toPx(L, f.x, f.y); const l = Math.max(6, SPECIES.shrimp.size * L.s * (0.5 + 0.5 * f.growth));
  ctx.save(); ctx.translate(px, py); ctx.scale(a.face || 1, 1);
  const col = SPECIES.shrimp.col;
  ctx.strokeStyle = withAlpha(col.body, 0.9); ctx.lineWidth = Math.max(2, l * 0.28); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(l * 0.5, 0); ctx.quadraticCurveTo(0, -l * 0.35, -l * 0.4, 0); ctx.quadraticCurveTo(-l * 0.5, l * 0.2, -l * 0.6, l * 0.1); ctx.stroke();
  ctx.lineWidth = 1; ctx.strokeStyle = withAlpha(col.fin, 0.8);
  for (let i = 0; i < 4; i++) { const x = l * 0.3 - i * l * 0.18; ctx.beginPath(); ctx.moveTo(x, l * 0.1); ctx.lineTo(x - l * 0.05 + Math.sin(a.phase + i) * 2, l * 0.35); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(l * 0.5, -l * 0.05); ctx.lineTo(l * 1.1, -l * 0.35); ctx.moveTo(l * 0.5, 0); ctx.lineTo(l * 1.15, -l * 0.05); ctx.stroke();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(l * 0.45, -l * 0.12, Math.max(0.8, l * 0.06), 0, 7); ctx.fill();
  ctx.restore();
}
function drawDragon(ctx, f, L, time, a) {
  const sp = SPECIES.dragon, col = sp.col;
  const lenCm = visSize(sp.size) * (0.35 + 0.65 * f.growth), Lpx = lenCm * L.s;
  const [px, py] = toPx(L, f.x, f.y); const face = a.face || 1;
  const ang = clamp(Math.atan2(f.vy, Math.abs(f.vx) + 0.01), -0.4, 0.4);
  ctx.save(); ctx.translate(px, py); ctx.scale(face, 1); ctx.rotate(ang);
  ctx.shadowColor = withAlpha(col.fin, 0.8); ctx.shadowBlur = 14;
  const N = 14, seg = Lpx / N;
  const pts = [];
  for (let i = 0; i <= N; i++) { const x = Lpx * 0.45 - i * seg; const y = Math.sin(a.phase - i * 0.55) * Lpx * 0.06 * (i / N); pts.push([x, y]); }
  // vây lưng
  ctx.fillStyle = withAlpha(col.fin, 0.7); ctx.beginPath(); ctx.moveTo(pts[1][0], pts[1][1]);
  for (let i = 1; i < N; i++) { const r = Lpx * (0.045 + 0.025 * Math.sin(i * 1.3)); ctx.lineTo(pts[i][0] - seg * 0.3, pts[i][1] - Lpx * 0.07 - r); ctx.lineTo(pts[i + 1][0], pts[i + 1][1] - Lpx * 0.06); }
  ctx.closePath(); ctx.fill();
  // đuôi
  ctx.beginPath(); const tp = pts[N]; ctx.moveTo(tp[0], tp[1]); ctx.lineTo(tp[0] - Lpx * 0.22, tp[1] - Lpx * 0.16); ctx.lineTo(tp[0] - Lpx * 0.12, tp[1]); ctx.lineTo(tp[0] - Lpx * 0.22, tp[1] + Lpx * 0.16); ctx.closePath(); ctx.fill();
  // thân theo đoạn
  ctx.shadowBlur = 0;
  for (let i = N - 1; i >= 0; i--) {
    const [x, y] = pts[i]; const r = Lpx * 0.085 * (i < 3 ? 1 + (3 - i) * 0.1 : 1 - (i / N) * 0.5);
    const g = ctx.createRadialGradient(x, y - r * 0.4, 1, x, y, r); g.addColorStop(0, shade(col.body, 0.3)); g.addColorStop(1, shade(col.body, -0.3));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    ctx.strokeStyle = withAlpha(col.accent, 0.5); ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, r * 0.7, Math.PI * 0.7, Math.PI * 1.3); ctx.stroke();
  }
  // đầu, râu, mắt
  const hx = pts[0][0], hy = pts[0][1], hr = Lpx * 0.11;
  ctx.fillStyle = shade(col.body, 0.1); ctx.beginPath(); ctx.ellipse(hx + hr * 0.3, hy, hr * 1.4, hr, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = col.fin; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(hx + hr * 1.3, hy + hr * 0.3); ctx.quadraticCurveTo(hx + hr * 2.6, hy + hr * 0.2 + Math.sin(time * 3) * 3, hx + hr * 3.2, hy + hr * 1.2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(hx + hr * 0.2, hy - hr * 0.8); ctx.quadraticCurveTo(hx - hr * 0.3, hy - hr * 2, hx - hr * 1.2, hy - hr * 2.2); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(hx + hr * 0.7, hy - hr * 0.3, hr * 0.3, 0, 7); ctx.fill();
  ctx.fillStyle = col.accent; ctx.beginPath(); ctx.arc(hx + hr * 0.78, hy - hr * 0.3, hr * 0.16, 0, 7); ctx.fill();
  ctx.restore();
  if (Math.random() < 0.2) R.sparks.push({ x: f.x - face * lenCm * 0.5 + rand(-2, 2), y: f.y + rand(-1, 1), vx: 0, vy: -0.8, life: 1.2, c: col.fin, tiny: true });
}

/* ── Hiệu ứng ── */
function updateParticles(t, L, dt) {
  const d = tankDims(t);
  // bọt khí từ sủi & đá sủi
  const srcs = [];
  if (t.eq.air) srcs.push(d.W - 2);
  for (const dc of t.deco) if (DECO[dc.type]?.kind === 'bubbler') srcs.push(dc.x);
  for (const sx of srcs) if (Math.random() < dt * 6) R.bubbles.push({ x: sx + rand(-0.6, 0.6), y: d.H - 1.5, r: rand(0.25, 0.7), vy: rand(6, 10), w: rand(6) });
  for (let i = R.bubbles.length - 1; i >= 0; i--) { const b = R.bubbles[i]; b.y -= b.vy * dt; b.x += Math.sin(R.time * 4 + b.w) * dt * 1.2; if (b.y < 0.3) R.bubbles.splice(i, 1); }
  // rác lơ lửng theo độ bẩn
  const want = Math.round(t.water.dirt / 100 * 45);
  while (R.debris.length < want) R.debris.push({ x: rand(d.W), y: rand(d.H * 0.3, d.H), vx: rand(-0.2, 0.2), s: rand(0.6, 1.4) });
  if (R.debris.length > want) R.debris.length = want;
  for (const p of R.debris) { p.x += p.vx * dt; p.y += Math.sin(R.time + p.s) * dt * 0.15 + dt * 0.05; if (p.y > d.H - 1) p.y = d.H * 0.4; if (p.x < 0) p.x = d.W; if (p.x > d.W) p.x = 0; }
  for (let i = R.sparks.length - 1; i >= 0; i--) { const s = R.sparks[i]; s.life -= dt; s.x += s.vx * dt; s.y += s.vy * dt; if (s.life <= 0) R.sparks.splice(i, 1); }
}

function drawEffects(ctx, t, L) {
  for (const b of R.bubbles) { const [x, y] = toPx(L, b.x, b.y); const r = b.r * L.s; ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.stroke(); ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.35, 0, 7); ctx.fill(); }
  ctx.fillStyle = 'rgba(90,70,40,.55)';
  for (const p of R.debris) { const [x, y] = toPx(L, p.x, p.y); ctx.fillRect(x, y, p.s * 1.5, p.s * 1.5); }
  for (const s of R.sparks) { const [x, y] = toPx(L, s.x, s.y); ctx.fillStyle = withAlpha(s.c, Math.max(0, s.life) * 0.9); ctx.beginPath(); ctx.arc(x, y, s.tiny ? 1.2 : 1.5 + s.life * 1.5, 0, 7); ctx.fill(); }
  // mồi
  for (const p of t.pellets) { const [x, y] = toPx(L, p.x, p.y); ctx.fillStyle = '#8b5a2b'; ctx.beginPath(); ctx.arc(x, y, Math.max(1.5, L.s * 0.22), 0, 7); ctx.fill(); ctx.fillStyle = 'rgba(255,220,160,.5)'; ctx.beginPath(); ctx.arc(x - 0.5, y - 0.5, Math.max(0.6, L.s * 0.08), 0, 7); ctx.fill(); }
  // trứng đang ấp
  if (t.breeding) {
    const moss = t.deco.find((d) => DECO[d.type]?.plant) || { x: tankDims(t).W / 2 };
    const [mx] = toPx(L, moss.x, 0); const gy = groundY(L);
    const prog = clamp((now() - t.breeding.start) / (t.breeding.end - t.breeding.start), 0, 1);
    for (let i = 0; i < 9; i++) { const x = mx + (hash01(t.id, i) - 0.5) * L.s * 6, y = gy - L.s * 1.5 - hash01(t.id, i + 9) * L.s * 2; ctx.fillStyle = `rgba(255,240,200,${0.5 + prog * 0.4})`; ctx.beginPath(); ctx.arc(x, y, Math.max(1.5, L.s * 0.28), 0, 7); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.arc(x - 1, y - 1, 1, 0, 7); ctx.fill(); }
  }
}

function drawGlassFront(ctx, t, L) {
  const al = t.water.algae / 100;
  if (al > 0.05) {
    ctx.save(); ctx.beginPath(); ctx.rect(L.x, L.y, L.w, L.h); ctx.clip();
    const gL = ctx.createLinearGradient(L.x, 0, L.x + L.w * 0.25, 0); gL.addColorStop(0, `rgba(60,140,60,${al * 0.75})`); gL.addColorStop(1, 'rgba(60,140,60,0)');
    ctx.fillStyle = gL; ctx.fillRect(L.x, L.y, L.w * 0.25, L.h);
    const gR = ctx.createLinearGradient(L.x + L.w, 0, L.x + L.w * 0.75, 0); gR.addColorStop(0, `rgba(60,140,60,${al * 0.75})`); gR.addColorStop(1, 'rgba(60,140,60,0)');
    ctx.fillStyle = gR; ctx.fillRect(L.x + L.w * 0.75, L.y, L.w * 0.25, L.h);
    ctx.fillStyle = `rgba(70,150,60,${al * 0.5})`;
    for (let i = 0; i < 40 * al; i++) { ctx.beginPath(); ctx.arc(L.x + hash01(t.id, i + 300) * L.w, L.y + hash01(t.id, i + 400) * L.h, 2 + hash01(t.id, i + 500) * 8, 0, 7); ctx.fill(); }
    ctx.restore();
  }
  // mặt nước
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2; ctx.beginPath();
  for (let x = 0; x <= L.w; x += 8) ctx.lineTo(L.x + x, L.y + 2 + Math.sin(x * 0.04 + R.time * 1.5) * 1.5);
  ctx.stroke();
  // phản chiếu kính
  const g = ctx.createLinearGradient(L.x, L.y, L.x + L.w * 0.3, L.y + L.h);
  g.addColorStop(0, 'rgba(255,255,255,.12)'); g.addColorStop(0.3, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(L.x, L.y, L.w, L.h);
  // khung
  ctx.strokeStyle = '#2b3542'; ctx.lineWidth = 6; ctx.strokeRect(L.x - 3, L.y - 3, L.w + 6, L.h + 6);
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1; ctx.strokeRect(L.x - 6, L.y - 6, L.w + 12, L.h + 12);
  // thiết bị: lọc (góc phải), sưởi (trái)
  if (t.eq.filter) { ctx.fillStyle = '#1d232c'; const fw = 8 + t.eq.filter * 5, fh = L.h * 0.35; ctx.fillRect(L.x + L.w - fw - 4, L.y - 4, fw, fh); ctx.fillStyle = '#35404f'; ctx.fillRect(L.x + L.w - fw - 2, L.y + 4, fw - 4, 6); }
  if (t.eq.heater) { ctx.fillStyle = '#1d232c'; ctx.fillRect(L.x + 6, L.y + L.h * 0.3, 5, L.h * 0.55); ctx.fillStyle = t.water.temp < t.eq.heatTemp - 0.2 ? '#ff5533' : '#334'; ctx.fillRect(L.x + 7, L.y + L.h * 0.32, 3, 4); }
}

function drawSelection(ctx, f, L, time) {
  const sp = SPECIES[f.sp]; const [x, y] = toPx(L, f.x, f.y); const r = Math.max(14, visSize(sp.size) * (0.35 + 0.65 * f.growth) * L.s * 0.6);
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.setLineDash([4, 4]); ctx.lineDashOffset = -time * 20; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.stroke(); ctx.setLineDash([]);
}
function drawFishBadges(ctx, f, L) {
  const sp = SPECIES[f.sp]; const [x, y] = toPx(L, f.x, f.y); const r = Math.max(8, visSize(sp.size) * (0.35 + 0.65 * f.growth) * L.s * 0.35);
  let icon = null;
  if (f.disease) icon = '🤒'; else if (f.hunger > 75) icon = '🍽️'; else if (f.stress > 65) icon = '💢';
  if (!icon) return;
  ctx.font = '13px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(icon, x, y - r - 4);
}

/* ── Khung hình ── */
function renderFrame(ctx, W, Hh, t, dt) {
  R.time += dt;
  const night = isNight();
  drawRoom(ctx, W, Hh, night);
  const L = R.layout; if (!L) return;
  drawTankBack(ctx, t, L, night);
  ctx.save(); ctx.beginPath(); ctx.rect(L.x, L.y, L.w, L.h); ctx.clip();
  drawSubstrate(ctx, t, L);
  const decos = [...t.deco].sort((a, b) => (DECO[b.type]?.h || 0) - (DECO[a.type]?.h || 0));
  for (const dc of decos) drawDeco(ctx, dc, L, R.time, R.dragDeco === dc ? 0.6 : 1);
  if (R.ghost) drawDeco(ctx, R.ghost, L, R.time, 0.55);
  updateParticles(t, L, dt);
  drawEffects(ctx, t, L);
  const fs = fishIn(t.id).sort((a, b) => SPECIES[a.sp].size - SPECIES[b.sp].size);
  for (const f of fs) drawFish(ctx, f, L, R.time, ai(f));
  for (const f of fs) drawFishBadges(ctx, f, L);
  if (R.selected) { const f = fishById(R.selected); if (f && f.tankId === t.id) drawSelection(ctx, f, L, R.time); }
  ctx.restore();
  drawGlassFront(ctx, t, L);
  if (R.clean) { ctx.font = '34px system-ui'; ctx.textAlign = 'center'; ctx.fillText('🧽', R.clean.x, R.clean.y + 12); }
}

const ICON_CACHE = new Map();
function speciesIcon(spId, size = 46, silhouette = false) {
  const key = spId + '|' + size + '|' + silhouette;
  if (ICON_CACHE.has(key)) { const src = ICON_CACHE.get(key), c2 = document.createElement('canvas'); c2.width = src.width; c2.height = src.height; c2.getContext('2d').drawImage(src, 0, 0); return c2; }
  const sp = SPECIES[spId], c = document.createElement('canvas'); const dpr = Math.min(2, devicePixelRatio || 1);
  c.width = c.height = size * dpr; const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
  const extra = sp.shape === 'veil' || sp.shape === 'fan' || sp.shape === 'phoenix' ? 1.9 : sp.shape === 'dragon' ? 1.2 : 1.35;
  const s = (size * 0.86) / (sp.size * extra);
  const L = { x: 0, y: 0, s, W: 100, H: 100 };
  const f = { id: spId, sp: spId, x: (size / 2 + (sp.shape === 'veil' || sp.shape === 'fan' ? size * 0.12 : 0)) / s, y: size / 2 / s, vx: 1, vy: 0, growth: 1, health: 100, disease: null, variant: 0 };

}
function decoIcon(type, w = 90, h = 56) {

  c.width = w * dpr; c.height = h * dpr; const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
  const D = DECO[type]; const s = Math.min((w * 0.8) / D.w, (h * 0.85) / D.h);
  const L = { x: 0, y: 0, s, w, h }; // groundY dùng L.y+L.h
  drawDeco(ctx, { id: type, type, x: (w / 2) / s, flip: false }, { ...L, y: 0, h: h - 4 }, 1);
  return c;
}

function switchTank(id) {

function renderGauges(t) {

  let lo = -Infinity, hi = Infinity; for (const f of fs) { lo = Math.max(lo, SPECIES[f.sp].temp[0]); hi = Math.min(hi, SPECIES[f.sp].temp[1]); }
  const tempCls = !fs.length ? '' : w.temp < lo - 0.5 || w.temp > hi + 0.5 ? 'bad' : w.temp < lo || w.temp > hi ? 'warn' : '';
  const g = (label, val, text, cls) => `<div class="gauge ${cls}"><span>${label}</span><b>${text}</b><div class="bar"><i style="width:${clamp(val, 0, 100)}%"></i></div></div>`;

    g('☠ Độc', w.ammonia, Math.round(w.ammonia), cl(w.ammonia, 25, 50)) +

    const bf = b.querySelector('#buyFood'); if (bf) bf.onclick = () => { if (spend(20)) { S.food += 20; toast('+20 lần cho ăn', 'good'); refreshHUD(); renderPanel(); } else toast('Không đủ xu', 'bad'); };
    b.querySelectorAll('[data-med]').forEach((bt) => bt.onclick = () => useMed(t, bt.dataset.med));
  } };
}

    b.querySelectorAll('[data-sub]').forEach((bt) => bt.onclick = () => { const k = bt.dataset.sub; if (t.substrate === k) return; if (!spend(SUBSTRATES[k].price)) return toast('Không đủ xu', 'bad'); t.substrate = k; renderPanel(); });

/* Ép đẻ */
function breedPanel() {
  const t = curTank();
  if (t.breeding) {
    const br = t.breeding, a = fishById(br.a), b = fishById(br.b), res = SPECIES[br.result];
    const prog = clamp((now() - br.start) / (br.end - br.start), 0, 1);
    const known = S.discovered[res.id];
    const html = `<div class="card"><div class="ic" data-ic="${res.id}" ${known ? '' : 'data-sil="1"'}></div><div class="info"><b>${known ? esc(res.name) : '???'} ${rarBadge(res.rarity)}</b><small>${a ? esc(a.name) : '?'} × ${b ? esc(b.name) : '?'}</small></div></div>
    <div class="chance">${pct(br.chance)}<small>tỉ lệ thành công</small></div>
    <div class="prog"><i style="width:${prog * 100}%"></i></div><p class="note" style="text-align:center">Còn ${fmtDur((br.end - now()) / 1000)} · Giữ nước sạch, đừng chuyển cha mẹ đi.</p>
    <button class="pbtn red big" id="cancelB">Huỷ ép đẻ</button>`;
    return { title: '🥚 Đang ấp trứng', html, bind(bb) { bb.querySelectorAll('[data-ic]').forEach((d) => d.appendChild(speciesIcon(d.dataset.ic, 46, !!d.dataset.sil))); bb.querySelector('#cancelB').onclick = () => { t.breeding = null; renderPanel(); refreshHUD(); }; } };
  }
  const fs = fishIn(t.id).filter((f) => !SPECIES[f.sp].invert);
  const pk = UI.breedPick.filter((id) => fs.some((f) => f.id === id)); UI.breedPick = pk;
  let info = null;
  if (pk.length === 2) info = breedingInfo(fishById(pk[0]), fishById(pk[1]), t);
  let html = '';
  if (t.kind !== 'breed') html += `<p class="note">⚠ Đây không phải hồ ép đẻ: tỉ lệ giảm một nửa và cá khác quấy rầy. ${S.tanks.some((x) => x.kind === 'breed') ? 'Hãy chuyển hai cá sang hồ ép đẻ.' : '<a href="#" id="addBreed" style="color:var(--accent)">Thêm hồ ép đẻ (90 xu)</a>'}</p>`;
  html += `<p class="note">Chọn <b>hai</b> cá trưởng thành, khoẻ mạnh. Cùng loài (đực + cái) cho ra cá con cùng loài; hai loài khác nhau có thể tạo <b>loài lai mới</b>. Xem gợi ý trong Sổ tay.</p>`;
  if (pk.length === 2) {
    const res = info.res;
    html += `<div class="card" style="border-color:var(--gold)"><div class="ic">${res ? `<span data-ic="${res.id}" ${S.discovered[res.id] ? '' : 'data-sil=1'}></span>` : '❓'}</div><div class="info"><b>${res ? (S.discovered[res.id] ? esc(res.name) : '??? (chưa khám phá)') : 'Không lai được'} ${res ? rarBadge(res.rarity) : ''}</b><small>${info.ok ? `Thời gian: ${fmtDur(info.duration)}` : esc(info.reason)}</small></div></div>`;
    if (info.ok) html += `<div class="chance">${pct(info.chance)}<small>tỉ lệ thành công</small></div>${info.lines.map((l) => `<div class="kv"><span>${esc(l.text)}</span><b>${esc(l.v)}</b></div>`).join('')}<button class="pbtn gold big" id="startB">🥚 Bắt đầu ép đẻ</button>`;
  }
  html += `<div class="sec"><h3>Cá trong hồ (${fs.length})</h3>${fs.map((f) => fishCard(f, `<div class="act"><button class="pbtn ${pk.includes(f.id) ? '' : 'ghost'}" data-pick="${f.id}">${pk.includes(f.id) ? '✓ Chọn' : 'Chọn'}</button></div>`)).join('') || '<p class="note">Chưa có cá. Chuyển cá vào hồ này từ Thông tin cá.</p>'}</div>`;
  return { title: '🥚 Ép đẻ · ' + t.name, html, bind(bb) {
    bb.querySelectorAll('[data-ic]').forEach((d) => d.appendChild(speciesIcon(d.dataset.ic, 46, !!d.dataset.sil)));
    bb.querySelectorAll('[data-pick]').forEach((bt) => bt.onclick = (e) => { e.stopPropagation(); const id = bt.dataset.pick; if (UI.breedPick.includes(id)) UI.breedPick = UI.breedPick.filter((x) => x !== id); else { UI.breedPick.push(id); if (UI.breedPick.length > 2) UI.breedPick.shift(); } renderPanel(); });
    const sb = bb.querySelector('#startB'); if (sb) sb.onclick = () => { const r = startBreeding(t, fishById(pk[0]), fishById(pk[1])); if (r.ok) { toast('Bắt đầu ấp trứng 🥚', 'gold'); UI.breedPick = []; renderPanel(); refreshHUD(); } else toast(r.reason, 'bad'); };
    const ab = bb.querySelector('#addBreed'); if (ab) ab.onclick = (e) => { e.preventDefault(); openPanel('tanks'); };
  } };
}

/* Sổ tay */
function bookPanel() {

  let html = `<p class="note">Đã khám phá ${Object.keys(S.discovered).length}/${Object.keys(SPECIES).length} loài · Sinh ${S.stats.born} · Bán ${S.stats.sold} · Kiếm ${fmtCoins(S.stats.earned)} xu</p>`;
  for (const r of groups) {
    const list = Object.values(SPECIES).filter((s) => s.rarity === r);
    html += `<div class="sec"><h3 style="color:${RARITY[r].color}">${RARITY[r].name}</h3>${list.map((s) => {
      const known = S.discovered[s.id];
      const par = s.parents ? s.parents.map((p) => (S.discovered[p] ? SPECIES[p].name : '???')).join(' × ') : 'Mua ở cửa hàng';
      return `<div class="card ${known ? '' : 'dis'}"><div class="ic" data-ic="${s.id}" ${known ? '' : 'data-sil=1'}></div><div class="info"><b>${known ? esc(s.name) : '???'} ${rarBadge(s.rarity)}</b><small>${s.parents ? '🥚 ' : ''}${esc(par)}</small>${known ? `<small>${esc(s.desc)}</small>` : `<small>Ép đẻ hai loài trên để khám phá. Tỉ lệ cơ bản ${pct(BREED_BASE[s.rarity])}, ${BREED_MIN[s.rarity]} phút.</small>`}</div></div>`;

/* Thêm hồ */
function tanksPanel() {
  const opts = [['main', 'S'], ['main', 'M'], ['main', 'L'], ['breed', null], ['hospital', null]];
  const html = `<p class="note">Bạn có ${S.tanks.length}/${MAX_TANKS} hồ. Hồ phụ giúp nhân giống và cách ly cá bệnh, đúng như chơi hồ cá thật.</p>
  ${opts.map(([k, sz]) => { const s = tankSpec(k, sz); const price = k === 'main' && sz === 'S' ? 60 : s.price; return `<div class="card ${S.coins < price ? 'dis' : ''}"><div class="ic" style="font-size:30px">${KIND_ICON[k]}</div><div class="info"><b>${esc(s.name)}</b><small>${k === 'breed' ? 'Có rêu sẵn, tỉ lệ ép đẻ đầy đủ. Đặt 2 cá vào rồi bấm Ép đẻ.' : k === 'hospital' ? 'Không nền, có lọc. Thuốc hiệu quả hơn, không lây cho đàn.' : `${s.W}×${s.H} cm · ${s.litres} lít`}</small></div><div class="act"><button class="pbtn gold" data-k="${k}" data-sz="${sz || ''}" data-p="${price}">${price} xu</button></div></div>`; }).join('')}`;
  return { title: 'Thêm hồ mới', html, bind(b) {
    b.querySelectorAll('[data-k]').forEach((bt) => bt.onclick = () => {
      if (S.tanks.length >= MAX_TANKS) return toast('Đã đủ 6 hồ', 'bad');

      const t = newTank(k, sz, k === 'main' ? `Hồ ${S.tanks.length + 1}` : tankSpec(k, sz).name.split(' ').slice(0, 3).join(' ') + (n ? ' ' + (n + 1) : ''));
      S.tanks.push(t); toast('Đã thêm hồ mới!', 'good'); switchTank(t.id); openPanel('design');
    });
  } };
}
