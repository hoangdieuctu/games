<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="theme-color" content="#a8dcf7">
<title>Thế Giới Nhỏ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #4b3a5e; --ink2: #6f5a8a; --cream: #fffaf2; --paper: #fff3dc;
  --sky: #a8dcf7; --mint: #a6e3c4; --yellow: #ffd96b; --orange: #ffac6b; --pink: #ffb8cb; --lav: #c7b5f0; --rose: #f58aa8;
  --shadow: 0 6px 0 rgba(76,56,118,.14), 0 12px 28px rgba(76,56,118,.18);
  --r: 20px;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #a8dcf7; color: var(--ink);
  font-family: 'Nunito', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#game { position: fixed; inset: 0; }
#game canvas { display: block; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }

/* ── thanh trên ── */
.topbar { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; right: 12px; z-index: 20;
  display: flex; align-items: center; gap: 10px; pointer-events: none; }
.topbar > * { pointer-events: auto; }
.back { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; text-decoration: none;
  background: var(--cream); color: var(--ink); font-size: 30px; font-weight: 900; line-height: 1; box-shadow: var(--shadow); padding-bottom: 3px; }
.brand { background: var(--cream); border-radius: 999px; padding: 6px 16px 6px 16px; box-shadow: var(--shadow); line-height: 1.05; }
.brand b { font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 20px; font-weight: 800; color: #f28a4e; display: block; }
.brand span { font-size: 11px; font-weight: 800; color: var(--ink2); display: block; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand { text-align: center; }
/* màn rộng: tên game nằm giữa thanh trên */
@media (min-width: 1100px) { .brand { position: absolute; left: 50%; top: 0; transform: translateX(-50%); padding: 6px 22px; } .brand span { font-size: 12px; } }
.tabs { margin-left: auto; display: flex; gap: 4px; background: var(--cream); padding: 5px; border-radius: 999px; box-shadow: var(--shadow); }
.tabs button { border: 0; background: transparent; padding: 8px 14px; border-radius: 999px; font-weight: 900; font-size: 14px; color: var(--ink2); }
.tabs button.on { background: var(--yellow); color: var(--ink); box-shadow: inset 0 -3px 0 rgba(0,0,0,.08); }

/* ── bảng điều khiển ── */
.panel { position: fixed; z-index: 15; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); width: min(400px, calc(100vw - 24px));
  max-height: calc(100vh - 90px); overflow: auto; background: rgba(255,250,242,.96); border-radius: var(--r); box-shadow: var(--shadow);
  padding: 12px; display: flex; flex-direction: column; gap: 10px; border: 3px solid #fff; }
.panel.map-panel, .panel.island-panel { left: 12px; right: auto; width: min(560px, calc(100vw - 24px)); }
.panel.map-panel, .panel.island-panel { width: auto; max-width: min(560px, calc(100vw - 24px)); }
.panel h4 { margin: 4px 2px 0; font-size: 14px; font-weight: 900; display: flex; align-items: center; gap: 6px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn { border: 0; border-radius: 14px; padding: 9px 13px; background: #fff; font-weight: 900; font-size: 14px; color: var(--ink);
  box-shadow: inset 0 -3px 0 rgba(76,56,118,.12), 0 0 0 2px #efe6f7; transition: transform .1s; }
.btn:active { transform: translateY(2px); }
.btn.icon { width: 40px; padding: 8px 0; font-size: 18px; }
.btn.small { padding: 4px 10px; font-size: 12px; border-radius: 10px; }
.btn.accent { background: var(--orange); color: #fff; box-shadow: inset 0 -3px 0 rgba(140,60,20,.22); }
.btn.danger { background: var(--rose); color: #fff; box-shadow: inset 0 -3px 0 rgba(120,30,60,.22); }
.btn.ghost { background: transparent; box-shadow: none; color: var(--ink2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 0; border-radius: 999px; padding: 6px 12px 6px 6px; background: #fff; font-weight: 800; font-size: 13px;
  display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 0 0 2px color-mix(in srgb, var(--c, #c7b5f0) 60%, #fff); }
.chip:not(:has(img)) { padding: 6px 12px; }
.chip img { width: 28px; height: 28px; object-fit: contain; }
.chip.on { background: var(--yellow); }
.seg { display: inline-flex; background: #f2ebfa; border-radius: 14px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 11px; font-weight: 900; font-size: 14px; color: var(--ink2); }
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 2px 0 rgba(76,56,118,.15); }
.seg.wide { display: flex; } .seg.wide button { flex: 1; }
.hint { margin: 0 2px; font-size: 12px; font-weight: 700; color: var(--ink2); }

.pets { display: flex; gap: 6px; }
.pet { flex: 1; border: 0; background: #fff; border-radius: 14px; padding: 4px 6px; display: flex; align-items: center; gap: 6px;
  font-weight: 900; font-size: 13px; box-shadow: 0 0 0 2px #efe6f7; }
.pet img { width: 36px; height: 36px; object-fit: contain; }
.pet.on { background: var(--yellow); box-shadow: 0 0 0 2px #f2c94c; }
.pet-dock { position: fixed; z-index: 15; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); display: flex; gap: 6px; padding: 6px;
  background: rgba(255,250,242,.96); border-radius: 20px; box-shadow: var(--shadow); border: 3px solid #fff; }
.pet-dock .pet { flex: none; }
body:not([data-scene="Island"]) .pet-dock { display: none; }
@media (max-width: 760px) {
  /* điện thoại: cột ảnh nhỏ ở mép phải, giữa màn hình (tránh bong bóng lời thoại và bảng điều khiển) */
  .pet-dock { flex-direction: column; bottom: auto; top: 50%; transform: translateY(-50%); right: 8px; padding: 4px; border-radius: 18px; }
  .pet-dock .pet span { display: none; }
  .pet-dock .pet { padding: 3px; }
}
.palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 6px; max-height: 190px; overflow: auto; padding: 2px; }
.palette button { aspect-ratio: 1; border: 0; border-radius: 14px; background: #f3fbef; display: grid; place-items: center; padding: 4px; box-shadow: 0 0 0 2px #e2f1da; }
.palette button.on { background: var(--yellow); box-shadow: 0 0 0 3px #f2a94c; }
.palette img { max-width: 100%; max-height: 100%; object-fit: contain; }

.opts { display: grid; gap: 6px; }
.opt { display: grid; grid-template-columns: 96px 40px 1fr 40px; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; }
.opt b { text-align: center; font-size: 13px; }
.opt.col { grid-template-columns: 96px 1fr; }
.sw { display: flex; flex-wrap: wrap; gap: 5px; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px #e4dbef; padding: 0; }
.swatch.on { box-shadow: 0 0 0 3px var(--ink); }
.petcard { display: flex; gap: 10px; align-items: center; }
.petcard img { width: 56px; height: 56px; object-fit: contain; }
.petcard h4 { margin: 0; } .petcard p { margin: 2px 0 0; font-size: 12px; font-weight: 700; color: var(--ink2); }

/* ── thẻ thông tin ── */
.card { position: fixed; z-index: 16; right: 12px; top: 74px; width: min(360px, calc(100vw - 24px)); background: rgba(255,250,242,.97);
  border-radius: var(--r); box-shadow: var(--shadow); padding: 12px; border: 3px solid #fff; display: flex; flex-direction: column; gap: 10px; }
.card.pop { animation: pop .28s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { from { transform: scale(.85); opacity: 0; } }
.card-head { display: flex; align-items: center; gap: 10px; background: color-mix(in srgb, var(--c) 35%, #fff); border-radius: 14px; padding: 8px; }
.card-head h3 { margin: 0; font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 22px; line-height: 1; }
.card-head p { margin: 2px 0 0; font-size: 12px; font-weight: 800; color: var(--ink2); }
.card-icon { width: 56px; height: 56px; object-fit: contain; }
.card-icon.sq { background: #fff; border-radius: 12px; padding: 4px; }
.badge { margin-left: auto; font-size: 12px; font-weight: 900; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.badge.open { background: var(--mint); } .badge.locked { background: var(--lav); color: #fff; }
.card-art { background: linear-gradient(#dff3fd, #fff3dc); border-radius: 14px; display: grid; place-items: center; padding: 6px; }
.card-art img { max-width: 100%; max-height: 180px; }
.card-text { margin: 0; font-size: 14px; font-weight: 700; }

/* ── hộp thoại xem vùng ── */
#modal { position: fixed; inset: 0; z-index: 30; background: rgba(60,40,90,.45); display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 16px; }
.modal-box { min-width: 0; position: relative; background: var(--cream); border-radius: 24px; padding: 10px; max-width: min(1100px, 100%); width: 100%; box-shadow: var(--shadow); border: 4px solid #fff; }
.modal-close { position: absolute; top: -14px; right: -10px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--rose); color: #fff; font-weight: 900; font-size: 18px; box-shadow: var(--shadow); }
.region-view { min-width: 0; }
/* ảnh cảnh 16:9 vừa cả bề ngang lẫn bề cao màn hình */
.rv-stage { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 16/9; background: #dff3fd;
  width: min(100%, calc((100vh - 32px - 28px) * 16 / 9)); width: min(100%, calc((100dvh - 32px - 28px) * 16 / 9)); margin: 0 auto; }
.rv-bg { width: 100%; height: 100%; object-fit: cover; display: block; }
.rv-gate { position: absolute; left: 50%; bottom: 4%; height: 52%; transform: translateX(-50%); filter: drop-shadow(0 8px 10px rgba(76,56,118,.25)); }
.rv-title { position: absolute; left: 12px; top: 12px; display: flex; align-items: center; gap: 8px; background: rgba(255,250,242,.92); padding: 4px 14px 4px 4px; border-radius: 999px; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; }
.rv-title img { width: 44px; height: 44px; }
@media (max-width: 760px), (max-height: 500px) { .rv-title { font-size: 16px; top: 8px; left: 8px; } .rv-title img { width: 30px; height: 30px; } }

/* ── thông báo & tải ── */
#toast { position: fixed; left: 50%; top: 78px; transform: translate(-50%, -20px); z-index: 40; background: var(--ink); color: #fff; font-weight: 800;
  padding: 10px 18px; border-radius: 999px; opacity: 0; pointer-events: none; transition: .25s; font-size: 14px; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#loading { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: linear-gradient(#dff3fd, #fff3dc); transition: opacity .4s; }
#loading.done { opacity: 0; pointer-events: none; }
.ld-box { text-align: center; display: grid; gap: 12px; justify-items: center; font-weight: 900; }
.ld-orb { width: 72px; height: 72px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #ffd96b 40%, #ffac6b); box-shadow: 0 10px 0 rgba(76,56,118,.12); animation: bob 1s ease-in-out infinite alternate; }
@keyframes bob { to { transform: translateY(-14px); } }
.bar { width: 220px; height: 12px; border-radius: 99px; background: #fff; overflow: hidden; box-shadow: inset 0 0 0 2px #efe6f7; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffd96b, #ffac6b); border-radius: 99px; transition: width .2s; }

/* ── điện thoại dọc ── */
@media (max-width: 760px) {
  .brand span { display: none; }
  .brand { padding: 6px 12px; } .brand b { font-size: 16px; }
  .tabs button { padding: 7px 9px; font-size: 13px; }
  .panel, .panel.map-panel, .panel.island-panel { left: 8px; right: 8px; width: auto; bottom: max(8px, env(safe-area-inset-bottom)); max-height: 46vh; padding: 10px; }
  .card { top: auto; bottom: calc(max(8px, env(safe-area-inset-bottom)) + 8px); left: 8px; right: 8px; width: auto; z-index: 17; }
  .card-art img { max-height: 120px; }
  .opt { grid-template-columns: 80px 36px 1fr 36px; }
  .opt.col { grid-template-columns: 80px 1fr; }
}
@media (max-width: 420px) { .brand { display: none; } .tabs { margin-left: 0; flex: 1; } .tabs button { flex: 1; } }

/* ═════════════ Phase 2: gameplay ═════════════ */
.round-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--cream); color: var(--ink2); font-size: 22px; box-shadow: var(--shadow); flex: none; }
.round-btn svg { display: block; margin: auto; }
#btn-fs .fs-out, #btn-fs.on .fs-in { display: none; }
#btn-fs.on .fs-out { display: inline; }
.hud { display: flex; gap: 4px; background: var(--cream); border-radius: 999px; padding: 4px 8px; box-shadow: var(--shadow); }
.res { border: 0; background: transparent; display: inline-flex; align-items: center; gap: 2px; padding: 2px 4px; border-radius: 999px; font-weight: 900; font-size: 15px; }
.res img { width: 28px; height: 28px; object-fit: contain; }
.res.bump { animation: bump .5s cubic-bezier(.3,1.8,.5,1); }
@keyframes bump { 40% { transform: scale(1.4); background: var(--yellow); } }
.tabs { margin-left: auto; }
body[data-scene="Home"] .topbar .tabs, body[data-scene="Home"] .hud { display: none; }
body[data-scene="Play"] .tabs, body[data-scene="Play"] .back { display: none; }

/* lời thú cưng */
.guide { position: fixed; z-index: 25; left: 12px; bottom: max(12px, env(safe-area-inset-bottom)); display: flex; align-items: flex-end; gap: 6px; max-width: min(440px, calc(100vw - 24px)); pointer-events: auto; cursor: pointer; }
.guide img { width: 72px; height: 72px; flex: none; filter: drop-shadow(0 4px 6px rgba(76,56,118,.25)); }
.guide p { margin: 0 0 30px; background: #fff; border-radius: 20px 20px 20px 4px; padding: 10px 14px; font-weight: 800; font-size: 17px; box-shadow: var(--shadow); line-height: 1.3; }
.guide.pop { animation: pop .3s cubic-bezier(.3,1.6,.5,1); }
body[data-scene="Island"] .guide, body[data-scene="WorldMap"] .guide { bottom: auto; top: 70px; }
body[data-scene="Play"] .guide { left: auto; right: 12px; bottom: auto; top: 70px; flex-direction: row-reverse; }
body[data-scene="Play"] .guide p { border-radius: 20px 20px 4px 20px; margin: 0 0 30px; }
body[data-scene="Play"] .guide img { display: none; }
body[data-scene="Play"] .guide p { margin: 0; }

.btn.big { padding: 14px 22px; font-size: 18px; border-radius: 18px; }
.row.center { justify-content: center; }
.cost { display: inline-flex; gap: 6px; flex-wrap: wrap; font-weight: 900; font-size: 13px; }
.cost span { display: inline-flex; align-items: center; gap: 1px; }
.cost img { width: 22px; height: 22px; object-fit: contain; }
.cost.gain span::before { content: '+'; }

/* màn chào */
.panel.home-panel { left: 50%; right: auto; bottom: auto; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 24px); padding: 18px; border-radius: 28px; }
.home-box { display: grid; gap: 12px; text-align: center; }
.logo { margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 46px; line-height: 1; color: #f28a4e; text-shadow: 0 3px 0 #fff, 0 6px 0 rgba(76,56,118,.12); }
.tag { margin: -4px 0 4px; font-weight: 800; color: var(--ink2); }
.home-box h3 { margin: 4px 0 0; }
.profiles { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.prof { border: 0; background: #fff; border-radius: 20px; padding: 10px; width: 120px; display: grid; justify-items: center; gap: 2px; box-shadow: 0 0 0 3px #efe6f7, 0 6px 0 rgba(76,56,118,.1); }
.prof > img { width: 76px; height: 76px; }
.prof b { font-size: 17px; }
.prof span { display: inline-flex; align-items: center; gap: 2px; font-weight: 800; font-size: 13px; color: var(--ink2); }
.prof span img { width: 18px; }
.prof.add .plus { font-size: 52px; line-height: 76px; height: 76px; color: var(--orange); font-weight: 900; }
.field { display: grid; gap: 6px; text-align: left; font-weight: 900; }
.field input { font: inherit; font-size: 20px; padding: 12px 14px; border-radius: 14px; border: 3px solid #efe6f7; background: #fff; color: var(--ink); }
.seg.big button { display: grid; padding: 8px 6px; } .seg.big small { font-weight: 700; font-size: 12px; }
.pet-pick { display: flex; gap: 8px; }
.pet-pick button { flex: 1; border: 0; background: #fff; border-radius: 18px; padding: 8px; display: grid; justify-items: center; font-weight: 900; box-shadow: 0 0 0 3px #efe6f7; }
.pet-pick img { width: 72px; height: 72px; }
.pet-pick button.on { background: var(--yellow); box-shadow: 0 0 0 3px #f2a94c; }

/* bản đồ */
.chip.locked { opacity: .7; } .chip img.mini { width: 18px; height: 18px; }
.acts { display: grid; gap: 6px; }
.act { border: 0; background: #fff; border-radius: 14px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; text-align: left; box-shadow: 0 0 0 2px #efe6f7, inset 0 -3px 0 rgba(76,56,118,.08); }
.act b { font-size: 17px; } .act span { font-size: 12px; font-weight: 700; color: var(--ink2); }
.act em { font-style: normal; font-size: 12px; font-weight: 900; color: #f28a4e; align-self: center; }
.act .cost { grid-column: 1 / -1; }
.act:not(.off):hover { background: #fff8e6; }
.act.off { opacity: .55; }
.need { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; } .need img { width: 22px; }

/* đảo */
.palette button { position: relative; }
.palette button i { position: absolute; right: 3px; bottom: 2px; font-style: normal; font-weight: 900; font-size: 12px; background: var(--orange); color: #fff; border-radius: 99px; padding: 0 6px; }
.modal-wide .modal-box { max-width: min(860px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 16px; }
.shop h2, .achv h2, .parent h2 { margin: 0 0 8px; font-family: 'Baloo 2', sans-serif; }
.shop-res { display: flex; flex-wrap: wrap; gap: 10px; font-weight: 900; margin-bottom: 8px; }
.shop-res span { display: inline-flex; align-items: center; gap: 3px; } .shop-res img { width: 26px; }
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-top: 10px; }
.shop-item { border: 0; background: #fff; border-radius: 16px; padding: 8px; display: grid; justify-items: center; gap: 4px; box-shadow: 0 0 0 2px #efe6f7; }
.shop-item img { height: 76px; max-width: 100%; object-fit: contain; }
.shop-item b { font-size: 13px; } .shop-item i { font-size: 11px; font-weight: 800; color: var(--ink2); font-style: normal; }
.shop-item.cant { opacity: .5; }
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.ach-card { background: #fff; border-radius: 16px; padding: 10px; display: grid; justify-items: center; text-align: center; gap: 2px; box-shadow: 0 0 0 2px #efe6f7; filter: grayscale(1); opacity: .55; }
.ach-card.on { filter: none; opacity: 1; box-shadow: 0 0 0 3px var(--yellow); }
.ach-card img { width: 56px; height: 56px; object-fit: contain; } .ach-card b { font-size: 14px; } .ach-card span { font-size: 12px; font-weight: 700; color: var(--ink2); }

/* thanh trò chơi */
.panel.game-panel { top: max(10px, env(safe-area-inset-top)); bottom: auto; left: 12px; right: auto; width: auto; max-width: calc(100vw - 24px); padding: 6px; border-radius: 999px; flex-direction: row; flex-wrap: wrap; align-items: center; }
.game-bar { display: flex; align-items: center; gap: 8px; }
.gb-title { display: grid; line-height: 1.05; padding-right: 6px; } .gb-title b { font-family: 'Baloo 2', sans-serif; font-size: 20px; } .gb-title span { font-size: 12px; font-weight: 800; color: var(--ink2); }
.gb-dots { display: flex; gap: 5px; } .gb-dots i { width: 14px; height: 14px; border-radius: 50%; background: #e9def3; } .gb-dots i.on { background: var(--mint); box-shadow: inset 0 0 0 3px #7cc96a; } .gb-dots i.cur { background: var(--yellow); }
.builder-ex { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 0 4px; }
.builder-ex .seg button { padding: 7px 10px; font-size: 13px; }

/* phần thưởng */
.modal-reward .modal-box { max-width: 520px; text-align: center; padding: 18px 16px; }
.reward-box h2 { margin: 0 0 6px; font-family: 'Baloo 2', sans-serif; font-size: 36px; color: #f28a4e; }
.rw-pet { width: 96px; height: 96px; margin-top: -60px; animation: bob 0.8s ease-in-out infinite alternate; }
.rw-row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 8px 0; }
.rw { background: #fff; border-radius: 18px; padding: 8px 12px; display: grid; justify-items: center; box-shadow: 0 0 0 3px #ffe7a3; animation: pop .45s cubic-bezier(.3,1.8,.5,1) both; }
.rw img { width: 64px; height: 64px; } .rw b { font-size: 26px; color: #f28a4e; line-height: 1; } .rw span { font-size: 12px; font-weight: 800; color: var(--ink2); }
.lvl { font-weight: 800; color: var(--ink2); margin: 4px 0; } .lvl.up { color: #3e9a52; }
.ach-new { display: flex; gap: 10px; align-items: center; background: #fff8e6; border-radius: 14px; padding: 8px 10px; margin: 6px 0; text-align: left; animation: pop .5s .6s cubic-bezier(.3,1.8,.5,1) both; }
.ach-new img { width: 48px; height: 48px; object-fit: contain; } .ach-new b { display: block; } .ach-new span { font-size: 13px; font-weight: 700; color: var(--ink2); }
.reward-box .row { margin-top: 12px; }

/* phụ huynh */
.parent-gate { text-align: center; padding: 10px; display: grid; gap: 10px; }
.gate-q { font-size: 44px; font-weight: 900; font-family: 'Baloo 2', sans-serif; }
.parent { display: grid; gap: 10px; }
.parent h4 { margin: 10px 0 4px; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.stat-grid div { background: #fff; border-radius: 14px; padding: 10px; display: grid; box-shadow: 0 0 0 2px #efe6f7; }
.stat-grid b { font-size: 24px; } .stat-grid span { font-size: 12px; font-weight: 700; color: var(--ink2); }
.bars { display: grid; gap: 4px; }
.bar-row { display: grid; grid-template-columns: 170px 1fr 30px; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; }
.bar-row i { display: block; height: 12px; border-radius: 99px; background: linear-gradient(90deg, #ffd96b, #ffac6b); width: var(--w); min-width: 4px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; border-radius: 12px; overflow: hidden; }
.tbl th, .tbl td { padding: 6px 8px; text-align: left; border-bottom: 1px solid #f0e8f6; }
.achs { display: flex; flex-wrap: wrap; gap: 6px; }
.ach { display: inline-flex; align-items: center; gap: 4px; background: #fff; border-radius: 999px; padding: 3px 10px 3px 3px; font-size: 12px; font-weight: 800; opacity: .45; filter: grayscale(1); }
.ach.on { opacity: 1; filter: none; box-shadow: 0 0 0 2px var(--yellow); } .ach img { width: 26px; height: 26px; object-fit: contain; }
.prof-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: #fff; border-radius: 14px; padding: 8px; margin-bottom: 6px; box-shadow: 0 0 0 2px #efe6f7; }
.prof-row.on { box-shadow: 0 0 0 3px var(--yellow); }
.prof-row > img { width: 44px; height: 44px; } .prof-row > div { display: grid; flex: 1; min-width: 120px; } .prof-row span { font-size: 12px; color: var(--ink2); font-weight: 700; }
.prof-row select, .tog select { font: inherit; padding: 4px 8px; border-radius: 10px; border: 2px solid #efe6f7; }
.prof-row em { font-size: 12px; font-weight: 900; color: #3e9a52; font-style: normal; }
.tog { display: flex; align-items: center; gap: 10px; font-weight: 800; background: #fff; border-radius: 12px; padding: 10px 12px; }
.tog input[type=checkbox] { width: 22px; height: 22px; accent-color: #f28a4e; }

const rad = (d        ) => (d * Math.PI) / 180;
function ell(cx        , cy        , rx        , ry        , rot = 0, n = 40)       {
  const a = rad(rot), ca = Math.cos(a), sa = Math.sin(a);

}

M.AssetLoader = (function () {
// ── Nạp tài sản Little World theo manifest ──
// public/assets/asset-manifest.json do art/build-manifest.mjs sinh ra.
// Mỗi scene chỉ nạp nhóm nó cần (lọc theo tiền tố category) để mở nhanh trên điện thoại.

                          

const ASSET_BASE = 'public/assets/';
const MANIFEST_KEY = 'lw-manifest';

                                                                                              
                             
                                                                                     
                                                                                         
                                                                
                                                                                     
 
                                                                                                

let manifest                  = null;
const byId = new Map                    ();

const AssetLoader = {
  /** Gọi trong preload() của scene khởi động. */
  queueManifest(scene     ) {
    scene.load.json(MANIFEST_KEY, ASSET_BASE + 'asset-manifest.json');
  },

  /** Gọi sau khi manifest đã nạp (create() của scene khởi động). */
  init(scene     )           {
    manifest = scene.cache.json.get(MANIFEST_KEY)            ;
    if (!manifest) throw new Error('Không đọc được asset-manifest.json');
    byId.clear();
    for (const e of manifest.entries) byId.set(e.id, e);
    return manifest;
  },

  get manifest()           { return manifest            ; },
  data(key        )      { return manifest ? manifest.data[key] : undefined; },
  entry(id        )                         { return byId.get(id); },
  url(id        )         { const e = byId.get(id); return e ? ASSET_BASE + e.file : ''; },
  byCategory(prefix        )               {
    return manifest ? manifest.entries.filter((e) => e.category === prefix || e.category.startsWith(prefix + '/')) : [];
  },

  /** Xếp hàng nạp các entry (bỏ qua cái đã có texture). Trả về số file đã xếp. */
  queue(scene     , entries              )         {
    let n = 0;
    for (const e of entries) {
      if (!e || scene.textures.exists(e.id)) continue;
      const url = ASSET_BASE + e.file;
      if (e.type === 'spritesheet') {
        scene.load.spritesheet(e.id, url, { frameWidth: e.frameWidth, frameHeight: e.frameHeight });
      } else if (e.type === 'image') {
        if (e.format === 'svg') scene.load.svg(e.id, url, { width: e.width, height: e.height });
        else scene.load.image(e.id, url);
      } else continue;
      n++;
    }
    return n;
  },
  queueIds(scene     , ids                               )         {
    return this.queue(scene, ids.filter(Boolean).map((id) => byId.get(id          )).filter(Boolean)                );
  },
  queueCategories(scene     , prefixes          )         {
    return this.queue(scene, prefixes.flatMap((p) => this.byCategory(p)));
  },

  /** Nạp ngay (ngoài preload), gọi cb khi xong. */
  loadNow(scene     , ids          , cb            ) {
    const n = this.queueIds(scene, ids);
    if (!n) { cb(); return; }
    scene.load.once('complete', () => { this.createAnimations(scene); cb(); });
    scene.load.start();
  },

  /** Tạo mọi animation khai báo trong manifest cho texture đã nạp. */
  createAnimations(scene     ) {
    if (!manifest) return;
    for (const e of manifest.entries) {
      if (!e.animations || !scene.textures.exists(e.id)) continue;
      for (const a of e.animations) {
        if (scene.anims.exists(a.key)) continue;
        scene.anims.create({
          key: a.key,
          frames: scene.anims.generateFrameNumbers(e.id, { frames: a.frames }),
          frameRate: a.frameRate || 8,
          repeat: a.repeat === undefined ? -1 : a.repeat,
        });
      }
    }
  },

  /** Đặt một ảnh theo đúng scale/origin của manifest. */
  image(scene     , id        , x        , y        )      {
    const e = byId.get(id);
    const img = scene.add.image(x, y, id);
    if (e) {
      img.setScale(e.scale ?? 1);
      img.setOrigin(e.origin?.[0] ?? 0.5, e.origin?.[1] ?? 0.5);
    }
    return img;
  },
  sprite(scene     , id        , x        , y        )      {
    const e = byId.get(id);
    const s = scene.add.sprite(x, y, id);
    if (e) {
      s.setScale(e.scale ?? 1);
      s.setOrigin(e.origin?.[0] ?? 0.5, e.origin?.[1] ?? 0.5);
      if (e.animations && e.animations.length && scene.anims.exists(e.animations[0].key)) s.play(e.animations[0].key);
    }
    return s;
  },
};
return { ASSET_BASE, MANIFEST_KEY, AssetLoader };
})();

M.Ui = (function () {
// ── Lớp giao diện HTML phủ trên canvas (nút, bảng, hộp thoại) ──
// Dùng DOM cho UI để chữ luôn sắc nét và thao tác chạm thoải mái trên điện thoại.

const $ = (sel        ) => document.querySelector(sel)               ;

const Ui = {
  /** Scene mà đường dẫn hiện tại muốn mở; scene khác tạo xong muộn (đang tải dở) sẽ tự dừng. */
  route: '',
  stale(scene     )          {
    if (Ui.route && Ui.route !== scene.scene.key) { scene.scene.stop(); return true; }
    return false;
  },
  setActiveTab(key        ) {
    document.body.dataset.scene = key;
    document.querySelectorAll             ('.tabs button').forEach((b) => {
      b.classList.toggle('on', b.dataset.scene === key);
    });
  },

  /** Đặt nội dung bảng điều khiển của scene. Trả về phần tử để gắn sự kiện. */
  panel(html        , cls = '')              {
    const el = $('#panel');
    el.className = 'panel ' + cls;
    el.innerHTML = html;
    el.hidden = !html;
    return el;
  },
  clearPanel() { const el = $('#panel'); el.innerHTML = ''; el.hidden = true; },

  /** Thẻ thông tin nổi (ví dụ: vùng đang chọn). */
  card(html               )              {
    const el = $('#card');
    if (!html) { el.hidden = true; el.innerHTML = ''; return el; }
    el.innerHTML = html;
    el.hidden = false;
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    return el;
  },

  modal(html               , opts                                                            = {})              {
    const el = $('#modal');
    if (!html) { el.hidden = true; el.innerHTML = ''; el.className = ''; el.onclick = null; return el; }
    el.className = opts.cls || '';
    el.innerHTML = `<div class="modal-box">${html}${opts.noClose ? '' : '<button class="modal-close" aria-label="Đóng">✕</button>'}</div>`;
    el.hidden = false;
    const close = () => { Ui.modal(null); opts.onClose?.(); };
    el.querySelector('.modal-close')?.addEventListener('click', close);
    el.onclick = (e) => { if (e.target === el && !opts.noClose) close(); };
    return el;
  },
  get modalOpen() { return !$('#modal').hidden; },

  toast(msg        , ms = 1800) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout((el       )._t);
    (el       )._t = setTimeout(() => el.classList.remove('show'), ms);
  },

  loading(pct               , label = 'Đang tải thế giới nhỏ…') {
    const el = $('#loading');
    if (pct === null) { el.classList.add('done'); setTimeout(() => (el.hidden = true), 400); return; }
    el.hidden = false; el.classList.remove('done');
    (el.querySelector('.bar i')               ).style.width = Math.round(pct * 100) + '%';
    (el.querySelector('.label')               ).textContent = label;
  },

  esc(s        ) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }       )[c]);
  },
};
return { Ui };
})();

function freshProfile(name        , age         , pet        )          {
  const res = emptyRes();
  for (const [k, v] of Object.entries(STARTER_RES)) res[k       ] = v          ;
  return {
    id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),

  };
}

/** Sửa một hồ sơ đọc từ bộ nhớ: bổ sung trường thiếu, bỏ giá trị sai kiểu. */
function repairProfile(p     )                 {
  if (!p || typeof p !== 'object' || typeof p.id !== 'string') return null;
  const base = freshProfile(String(p.name || 'Bé'), ['toddler', 'preschool', 'explorer'].includes(p.age) ? p.age : 'preschool', ['fox', 'bunny', 'bear'].includes(p.pet) ? p.pet : 'fox');
  const num = (o     ) => Object.fromEntries(Object.entries(o && typeof o === 'object' ? o : {}).filter(([, v]) => typeof v === 'number' && isFinite(v          ) && (v          ) >= 0));
  const out          = {
    ...base, id: p.id, created: +p.created || Date.now(),
    look: p.look && typeof p.look === 'object' ? p.look : null,
    res: { ...emptyRes(), ...num(p.res) }, earned: { ...emptyRes(), ...num(p.earned) },
    items: num(p.items), level: num(p.level), plays: num(p.plays), ach: num(p.ach), counters: num(p.counters),
    island: Array.isArray(p.island) ? p.island.filter((o     ) => o && typeof o.a === 'string' && isFinite(o.x) && isFinite(o.y)) : null,
    history: Array.isArray(p.history) ? p.history.filter((h     ) => h && typeof h.act === 'string').slice(-200) : [],
    sessions: +p.sessions || 0, playMs: +p.playMs || 0, lastSeen: +p.lastSeen || 0, seenIntro: !!p.seenIntro,
  };
  return out;
}

function load()           {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && typeof s === 'object' && Array.isArray(s.profiles)) {
        const profiles = s.profiles.map(repairProfile).filter(Boolean)             ;
        return {
          v: VERSION, profiles,
          current: profiles.some((p) => p.id === s.current) ? s.current : (profiles[0]?.id ?? null),
          settings: { ...defaultSettings(), ...(s.settings && typeof s.settings === 'object' ? s.settings : {}) },
        };
      }
    }
  } catch (e) { console.warn('Little World: bản lưu bị hỏng, bắt đầu mới', e); }
  // Mang diện mạo đã chỉnh ở bản Phase 1 (nếu có) sang hồ sơ đầu tiên
  return { v: VERSION, current: null, profiles: [], settings: defaultSettings() };
}

let save           = load();
let saveTimer      = null;
const listeners = new Set            ();

function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) { /* bộ nhớ đầy / chế độ riêng tư: vẫn chơi được */ }
}

                                                                                                                              

const Store = {
  get settings()           { return save.settings; },
  get profiles()            { return save.profiles; },
  get p()                 { return save.profiles.find((x) => x.id === save.current) || null; },

  /** Lưu ngay (gọi sau thay đổi quan trọng) hoặc gom lại (soon). */
  commit(soon = false) {
    if (soon) { clearTimeout(saveTimer); saveTimer = setTimeout(persist, 400); } else persist();
    for (const f of listeners) f();
  },
  onChange(f            ) { listeners.add(f); return () => listeners.delete(f); },

  createProfile(name        , age         , pet        )          {
    const p = freshProfile(name, age, pet);
    if (!save.profiles.length) {
      try { const old = JSON.parse(localStorage.getItem('lw-look') || 'null'); if (old && old.variants) p.look = old; } catch (e) { /* bỏ qua */ }
    }
    save.profiles.push(p);
    save.current = p.id;
    this.commit();
    return p;
  },
  selectProfile(id        ) { if (save.profiles.some((p) => p.id === id)) { save.current = id; this.commit(); } },
  deleteProfile(id        ) {
    save.profiles = save.profiles.filter((p) => p.id !== id);
    if (save.current === id) save.current = save.profiles[0]?.id ?? null;
    this.commit();
  },
  resetProfile(id        ) {
    const i = save.profiles.findIndex((p) => p.id === id); if (i < 0) return;
    const o = save.profiles[i];
    const n = freshProfile(o.name, o.age, o.pet); n.id = o.id; n.look = o.look; n.seenIntro = true;
    save.profiles[i] = n; this.commit();
  },
  resetAll() { save = { v: VERSION, current: null, profiles: [], settings: defaultSettings() }; this.commit(); },

  startSession() { const p = this.p; if (!p) return; p.sessions++; p.lastSeen = Date.now(); this.commit(); },
  tickPlaytime(ms        ) { const p = this.p; if (!p) return; p.playMs += ms; p.lastSeen = Date.now(); this.commit(true); },

  // ───── tài nguyên ─────
  has(cost      )          { const p = this.p; if (!p) return false; return Object.entries(cost).every(([k, v]) => p.res[k       ] >= (v          )); },
  pay(cost      )          {
    const p = this.p; if (!p || !this.has(cost)) return false;
    for (const [k, v] of Object.entries(cost)) p.res[k       ] -= v          ;
    this.commit(); return true;
  },
  give(r      ) {
    const p = this.p; if (!p) return;
    for (const [k, v] of Object.entries(r)) { p.res[k       ] += v          ; p.earned[k       ] += v          ; }
  },
  addItem(asset        , n = 1) { const p = this.p; if (!p) return; p.items[asset] = (p.items[asset] || 0) + n; if (p.items[asset] <= 0) delete p.items[asset]; this.commit(true); },
  count(k        , n = 1) { const p = this.p; if (!p) return; p.counters[k] = (p.counters[k] || 0) + n; },

  level(act        )         { const p = this.p; return Math.max(1, Math.min(5, p?.level[act] || (p ? startLevel(p.age) : 1))); },
  setLevel(act        , l        ) { const p = this.p; if (!p) return; p.level[act] = Math.max(1, Math.min(5, l)); this.commit(); },

  starsTotal()         { return this.p?.earned.star || 0; },
  regionOpen(id        )          { return this.starsTotal() >= (REGION_STARS[id] ?? 0); },

  /** Kết thúc một hoạt động: phần thưởng + điều chỉnh độ khó + huy hiệu. */
  finish(actId        , info                                                                     )               {
    const p = this.p ; const act = actById(actId) ;
    const before = this.level(actId);
    const openBefore = Object.keys(REGION_STARS).filter((r) => this.regionOpen(r));
    let after = before;
    if (!info.noAdapt) {
      // Ít nhầm → lên cấp; nhầm nhiều → nhẹ hơn một chút. Không bao giờ "thua".
      if (info.mistakes <= Math.max(1, Math.floor(info.rounds / 3))) after = Math.min(5, before + 1);
      else if (info.mistakes >= info.rounds * 2 + 2) after = Math.max(1, before - 1);
    }
    p.level[actId] = after;
    const reward       = { ...act.reward };
    if (!p.plays[actId]) reward.star = (reward.star || 0) + 2;   // lần đầu chơi: thêm 2 sao
    this.give(reward);
    p.plays[actId] = (p.plays[actId] || 0) + 1;
    p.history.push({ act: actId, t: Date.now(), ms: Math.round(info.ms), level: before, mistakes: info.mistakes });
    if (p.history.length > 200) p.history.splice(0, p.history.length - 200);
    if (actId === 'builder') this.count('builds');
    const newAch = this.checkAchievements();
    const unlocked = Object.keys(REGION_STARS).filter((r) => this.regionOpen(r) && !openBefore.includes(r));
    this.commit();
    return { reward, levelBefore: before, levelAfter: after, newAch, unlocked };
  },

  /** Kiểm tra & ghi huy hiệu mới. Trả về id các huy hiệu vừa đạt. */
  checkAchievements()           {
    const p = this.p; if (!p) return [];
    const plays = Object.values(p.plays).reduce((a, b) => a + b, 0);
    const regionsPlayed = new Set(Object.keys(p.plays).filter((k) => p.plays[k] > 0).map((k) => actById(k)?.region));
    const animalPlays = (p.plays['animal-match'] || 0) + (p.plays['animal-habitat'] || 0);
    const c = p.counters;
    const rules                          = {
      'first-play': plays >= 1, 'plays-10': plays >= 10, 'plays-30': plays >= 30,
      'all-regions': ACTIVITIES.map((a) => a.region).every((r) => regionsPlayed.has(r)),
      'stars-50': p.earned.star >= 50,
      'first-place': (c.placed || 0) >= 1, 'place-15': (c.placed || 0) >= 15,
      'harvest-1': (c.harvest || 0) >= 1, 'harvest-5': (c.harvest || 0) >= 5,
      'animal-friend': animalPlays >= 5,
      'memory-5': (p.level['memory'] || 0) >= 5 && (p.plays['memory'] || 0) > 0,
      'math-4': (p.level['count'] || 0) >= 4 && (p.plays['count'] || 0) > 0,
      'builder-3': (c.builds || 0) >= 3,
      'eco-hero': (p.plays['sort-trash'] || 0) > 0 && (p.plays['ocean-clean'] || 0) > 0,
      'new-pet-friend': (c.petSwitch || 0) >= 1,
      'pattern-4': (p.level['pattern'] || 0) >= 4 && (p.plays['pattern'] || 0) > 0,
      'artist-3': (p.plays['coloring'] || 0) >= 3,
      'pet-care-3': (p.plays['pet-care'] || 0) >= 3,
    };
    const got           = [];
    for (const a of ACHIEVEMENTS) if (rules[a.id] && !p.ach[a.id]) { p.ach[a.id] = Date.now(); got.push(a.id); }
    return got;
  },

  setIsland(objs             ) { const p = this.p; if (!p) return; p.island = objs; this.commit(true); },
  setLook(look     ) { const p = this.p; if (!p) return; p.look = look; this.commit(true); },
  setPet(pet        ) { const p = this.p; if (!p || p.pet === pet) return; p.pet = pet; this.count('petSwitch'); this.checkAchievements(); this.commit(); },
  setSettings(s                   ) { Object.assign(save.settings, s); this.commit(); },
};
return { Store };
})();

/* ══════════ services/Audio.ts ══════════ */
M.Audio = (function () {
// ── Âm thanh tự tổng hợp (Web Audio) + lời đọc ──
// Lời đọc: clip giọng nơ-ron sinh sẵn (art/gen-voice.mjs → public/assets/voice/); câu nào chưa có clip
// thì rơi về Speech Synthesis của máy.
// Không dùng file nhạc có bản quyền: mọi tiếng đều sinh bằng sóng âm, nhẹ nhàng, không gắt.
// Chỉ bật sau lần chạm đầu tiên của người chơi (trình duyệt chặn tự phát).
const { Store } = M.Store;
const { ASSET_BASE } = M.AssetLoader;
let ctx                      = null;
let master                  = null;
let musicGain                  = null;
let musicTimer      = null;
let musicStep = 0;
let viVoice                              = null;
let voiceGain                  = null;

// ── giọng đọc sinh sẵn ── (splitSpeech / speechKey phải giống hệt art/gen-voice.mjs)
const VOICE_DIR = ASSET_BASE + 'voice/';
const splitSpeech = (t        ) => t.split(/(?<=[.!?…])\s+/).map((s) => s.trim()).filter(Boolean);
const speechKey = (s        ) => s.normalize('NFC').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
let clips                                = null;
const buffers = new Map                                     ();
let speakToken = 0;
let speaking                          = [];
fetch(VOICE_DIR + 'index.json').then((r) => r.ok ? r.json() : null).then((j) => { clips = j?.clips || null; }).catch(() => {});

function clipBuffer(file        )                              {
  let p = buffers.get(file);
  if (!p) {
    p = fetch(VOICE_DIR + file).then((r) => r.arrayBuffer())
      .then((b) => new Promise             ((ok, bad) => ctx .decodeAudioData(b, ok, bad)))
      .catch(() => { buffers.delete(file); return null; });
    buffers.set(file, p);
  }
  return p;
}
function stopSpeaking() {
  speakToken++;
  for (const s of speaking) { try { s.stop(); } catch (e) { /* đã dừng */ } }
  speaking = [];
  try { if (typeof speechSynthesis !== 'undefined') speechSynthesis.cancel(); } catch (e) { /* */ }
}

function ensure()                      {
  if (!ctx) {
    const AC = (window       ).AudioContext || (window       ).webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx .createGain(); master.connect(ctx .destination);
    musicGain = ctx .createGain(); musicGain.gain.value = 0.0; musicGain.connect(master);
    voiceGain = ctx .createGain(); voiceGain.gain.value = 1.15; voiceGain.connect(master);
    Audio.applySettings();
  }
  if (ctx .state === 'suspended') ctx .resume();
  return ctx;
}

function tone(freq        , t0        , dur        , { type = 'sine', vol = 0.25, attack = 0.01, slide = 0, dest = null        } = {}) {
  const c = ctx ; const o = c.createOscillator(); const g = c.createGain();
  o.type = type                  ;
  o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * slide), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(dest || master );
  o.start(t0); o.stop(t0 + dur + 0.05);
}

const NOTE = (n        ) => 440 * Math.pow(2, (n - 69) / 12);
// giai điệu nền: ngũ cung Đô trưởng, chậm, như hộp nhạc
const MELODY = [72, 76, 79, 76, 74, 72, 69, 72, 74, 76, 74, 72, 67, 69, 72, -1];
const BASS = [48, 48, 45, 45, 43, 43, 45, 45];

function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices();
    viVoice = vs.find((v) => /^vi/i.test(v.lang)) || null;
  } catch (e) { viVoice = null; }
}
if (typeof speechSynthesis !== 'undefined') { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

const Audio = {
  unlock() { ensure(); if (Store.settings.music) this.startMusic(); },

  applySettings() {
    const s = Store.settings;
    if (master) master.gain.value = s.sound ? s.volume : 0;
    if (musicGain && ctx) musicGain.gain.setTargetAtTime(s.music && s.sound ? 0.32 : 0, ctx.currentTime, 0.3);
    if (s.music && s.sound) this.startMusic(); else this.stopMusic();
  },

  sfx(name                                                                                                                                                           ) {
    if (!Store.settings.sound) return;
    const c = ensure(); if (!c) return;
    const t = c.currentTime + 0.01;
    switch (name) {
      case 'tap': tone(660, t, 0.08, { type: 'triangle', vol: 0.15 }); break;
      case 'pop': tone(520, t, 0.12, { type: 'sine', vol: 0.25, slide: 1.8 }); break;
      case 'flip': tone(380, t, 0.09, { type: 'triangle', vol: 0.14, slide: 1.5 }); break;
      case 'snap': tone(880, t, 0.07, { type: 'square', vol: 0.06 }); tone(1320, t + 0.05, 0.12, { type: 'sine', vol: 0.18 }); break;
      case 'place': tone(300, t, 0.12, { type: 'sine', vol: 0.3, slide: 0.6 }); tone(600, t + 0.02, 0.08, { type: 'triangle', vol: 0.08 }); break;
      case 'good': [72, 76, 79].forEach((n, i) => tone(NOTE(n), t + i * 0.08, 0.25, { type: 'triangle', vol: 0.18 })); break;
      case 'soft': tone(330, t, 0.22, { type: 'sine', vol: 0.14, slide: 0.85 }); break;
      case 'bloop': tone(240, t, 0.25, { type: 'sine', vol: 0.22, slide: 2.2 }); break;
      case 'plant': tone(200, t, 0.15, { type: 'triangle', vol: 0.2, slide: 0.7 }); tone(NOTE(79), t + 0.15, 0.3, { type: 'sine', vol: 0.12 }); break;
      case 'munch': [0, 0.16, 0.32].forEach((d) => { tone(170, t + d, 0.09, { type: 'square', vol: 0.05, slide: 0.7 }); tone(260, t + d + 0.03, 0.06, { type: 'triangle', vol: 0.1 }); }); break;
      case 'bubble': for (let i = 0; i < 4; i++) tone(600 + Math.random() * 500, t + i * 0.06, 0.08, { type: 'sine', vol: 0.1, slide: 1.6 }); break;
      case 'splash': tone(900, t, 0.25, { type: 'sine', vol: 0.12, slide: 0.3 }); tone(300, t + 0.05, 0.3, { type: 'sine', vol: 0.15, slide: 2 }); break;
      case 'yawn': tone(420, t, 0.7, { type: 'sine', vol: 0.12, slide: 0.55, attack: 0.15 }); break;
      case 'whoosh': {
        const n = c.sampleRate * 0.35; const b = c.createBuffer(1, n, c.sampleRate); const d = b.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / n) * 0.5;
        const src = c.createBufferSource(); src.buffer = b;
        const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(400, t); f.frequency.exponentialRampToValueAtTime(2400, t + 0.3);
        const g = c.createGain(); g.gain.value = 0.25;
        src.connect(f); f.connect(g); g.connect(master ); src.start(t);
        break;
      }
      case 'reward': [72, 76, 79, 84, 88].forEach((n, i) => tone(NOTE(n), t + i * 0.09, 0.5, { type: 'triangle', vol: 0.16 })); tone(NOTE(96), t + 0.5, 0.6, { type: 'sine', vol: 0.06 }); break;
      case 'unlock': [67, 72, 76, 79, 84].forEach((n, i) => tone(NOTE(n), t + i * 0.12, 0.7, { type: 'sine', vol: 0.15 })); break;
    }
  },

  /** Một nốt đơn (Hz) — dùng cho trò có nhạc. */
  tone(freq        , dur = 0.25, vol = 0.12) {
    if (!Store.settings.sound) return;
    const c = ensure(); if (!c) return;
    tone(freq, c.currentTime + 0.01, dur, { type: 'triangle', vol });
  },

  startMusic() {
    if (musicTimer || !ctx || !Store.settings.music || !Store.settings.sound) return;
    const beat = 0.42;
    let next = ctx.currentTime + 0.1;
    musicTimer = setInterval(() => {
      if (!ctx) return;
      while (next < ctx.currentTime + 0.6) {
        const m = MELODY[musicStep % MELODY.length];
        if (m > 0) tone(NOTE(m), next, beat * 1.6, { type: 'sine', vol: 0.1, attack: 0.02, dest: musicGain });
        if (musicStep % 2 === 0) tone(NOTE(BASS[(musicStep / 2) % BASS.length]), next, beat * 2.2, { type: 'triangle', vol: 0.07, attack: 0.04, dest: musicGain });
        musicStep++; next += beat;
      }
    }, 150);
    if (musicGain) musicGain.gain.setTargetAtTime(0.32, ctx.currentTime, 0.5);
  },
  stopMusic() { clearInterval(musicTimer); musicTimer = null; },

  /** Đọc câu hướng dẫn bằng clip giọng nơ-ron; thiếu clip thì dùng Speech Synthesis của máy. */
  say(text        ) {
    if (!Store.settings.voice || !Store.settings.sound) return;
    stopSpeaking();
    // tên bé do người dùng nhập → clip đọc "bé"
    const name = Store.p?.name?.trim();
    const spoken = name ? text.split(name).join('bé') : text;
    const files = splitSpeech(spoken).map((s) => clips?.[speechKey(s)]);
    const c = ensure();
    if (c && files.length && files.every(Boolean)) { this.playClips(files            , text); return; }
    if (clips) console.warn('[voice] chưa có clip:', splitSpeech(spoken).filter((s) => !clips [speechKey(s)]));
    this.synth(text);
  },

  async playClips(files          , text        ) {
    const token = speakToken;
    const bufs = await Promise.all(files.map(clipBuffer));
    if (token !== speakToken || !ctx || !voiceGain) return;
    if (bufs.some((b) => !b)) { this.synth(text); return; }
    let t = ctx.currentTime + 0.03;
    // nhạc nền nhỏ lại trong lúc đọc
    const total = bufs.reduce((s, b) => s + b .duration + 0.12, 0);
    if (musicGain && Store.settings.music) {
      musicGain.gain.setTargetAtTime(0.12, t, 0.08);
      musicGain.gain.setTargetAtTime(0.32, t + total, 0.4);
    }
    for (const b of bufs) {
      const src = ctx.createBufferSource(); src.buffer = b ;
      src.connect(voiceGain); src.start(t);
      speaking.push(src);
      t += b .duration + 0.12;
    }
  },

  synth(text        ) {
    if (typeof speechSynthesis === 'undefined') return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/[!?.]+/g, (m) => m[0]));
      u.lang = 'vi-VN'; if (viVoice) u.voice = viVoice;
      u.rate = 0.92; u.pitch = 1.15; u.volume = Math.min(1, Store.settings.volume + 0.2);
      speechSynthesis.speak(u);
    } catch (e) { /* không có giọng đọc: vẫn hiện chữ */ }
  },
  get hasVoice() { return !!viVoice || !!clips; },
  get hasVoice() { return !!viVoice; },
};
return { Audio };
})();

/* ══════════ services/Hud.ts ══════════ */
M.Hud = (function () {
// ── Thanh tài nguyên, lời thú cưng, bảng phần thưởng ──
const { AssetLoader } = M.AssetLoader;
const { Store } = M.Store;
const { Audio } = M.Audio;
const { Ui } = M.Ui;
const { RES_LIST, RES_NAMES, RES_USE, ACHIEVEMENTS, REGION_STARS, pick, PET_LINES } = M.Content;

const Hud = {
  show(on         ) {

  /** Nảy số khi tài nguyên tăng. */

  /** Thú cưng nói một câu (bong bóng + giọng đọc). */
  say(text        , opts                                   = {}) {

    const el = $('#guide');

    const pet = p?.pet || 'fox';

      const r = ($('#panel')               ).getBoundingClientRect();
      el.style.top = Math.round(r.bottom + 8) + 'px';
    } else el.style.top = '';
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    el.onclick = () => { Audio.say(text); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); };
    clearTimeout(guideTimer);
    if (opts.ms !== 0) guideTimer = setTimeout(() => { el.hidden = true; }, opts.ms || Math.max(3500, text.length * 90));
    if (opts.speak !== false) Audio.say(text);
  },
  hideGuide() { clearTimeout(guideTimer); $('#guide').hidden = true; },

  /** Bảng phần thưởng sau khi chơi xong. */
  rewardModal(res                                                                                                                   ,
    title        , actions                                                            ) {
    const items = Object.entries(res.reward).filter(([, v]) => v).map(([k, v], i) =>
      `<div class="rw" style="animation-delay:${0.15 + i * 0.18}s"><img src="${resIcon(k)}" alt=""><b>+${v}</b><span>${RES_NAMES[k                          ]}</span></div>`).join('');
    const lvl = res.levelAfter > res.levelBefore ? `<p class="lvl up">Lần sau sẽ khó hơn một chút — cấp ${res.levelAfter}!</p>`
      : res.levelAfter < res.levelBefore ? `<p class="lvl">Lần sau mình chơi nhẹ nhàng hơn nhé — cấp ${res.levelAfter}.</p>` : '';
    const ach = res.newAch.map((id) => ACHIEVEMENTS.find((a) => a.id === id)).filter(Boolean).map((a     ) =>
      `<div class="ach-new"><img src="${AssetLoader.url(a.icon)}" alt=""><div><b>Huy hiệu mới: ${Ui.esc(a.name)}</b><span>${Ui.esc(a.desc)}</span></div></div>`).join('');
    const regions = (AssetLoader.data('world')?.regions || [])         ;
    const unl = res.unlocked.map((id) => regions.find((r) => r.id === id)).filter(Boolean).map((r     ) =>
      `<div class="ach-new"><img src="${AssetLoader.url(r.icon)}" alt=""><div><b>Đã mở vùng đất mới: ${Ui.esc(r.name)}!</b><span>Mở bản đồ để ghé thăm nhé.</span></div></div>`).join('');
    const p = Store.p ;
    const el = Ui.modal(`
      <div class="reward-box">
        <img class="rw-pet" src="${AssetLoader.url(p.pet + '-portrait')}" alt="">
        <h2>${Ui.esc(title)}</h2>
        <div class="rw-row">${items}</div>
        ${lvl}${unl}${ach}
        <div class="row center">
          <button class="btn big" data-a="again">Chơi nữa</button>
          <button class="btn big accent" data-a="island">Về đảo trang trí</button>
          <button class="btn big" data-a="map">Bản đồ</button>
        </div>
      </div>`, { noClose: true, cls: 'modal-reward' });
    Audio.sfx('reward');
    if (res.unlocked.length) setTimeout(() => Audio.sfx('unlock'), 900);
    setTimeout(() => { for (const k of Object.keys(res.reward)) this.bump(k); }, 400);
    this.render();
    el.querySelector('.reward-box') .addEventListener('click', (e     ) => {
      const a = e.target.closest('button')?.dataset.a; if (!a) return;
      Audio.sfx('tap'); Ui.modal(null);
      (actions       )[a]();
    });
  },

  regionNeed(id        ) { return Math.max(0, (REGION_STARS[id] ?? 0) - Store.starsTotal()); },
  hello() { this.say(pick(PET_LINES.hello)); },
};
return { resIcon, costHtml, Hud };
})();

M.Parent = (function () {
// ── Góc phụ huynh: cổng xác nhận người lớn, thống kê, cài đặt, quản lý hồ sơ ──
// Mọi dữ liệu chỉ nằm trên máy này; không gửi đi đâu cả.
const { Store, Profile } = M.Store;
const { Audio } = M.Audio;
const { Ui } = M.Ui;
const { AssetLoader } = M.AssetLoader;
const { ACTIVITIES, ACHIEVEMENTS, SKILL_NAMES, actById, REGION_STARS } = M.Content;
const fmtMin = (ms        ) => { const m = Math.round(ms / 60000); return m < 60 ? `${m} phút` : `${Math.floor(m / 60)} giờ ${m % 60} phút`; };
const fmtDate = (t        ) => new Date(t).toLocaleString('vi-VN', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const AGE_NAMES                         = { toddler: '2–3 tuổi', preschool: '4–5 tuổi', explorer: '6–8 tuổi' };

const Parent = {
  /** Cổng người lớn: phép nhân nhỏ, trẻ nhỏ khó tự bấm đúng. */
  open(onDone             ) {
    const a = 3 + Math.floor(Math.random() * 6), b = 3 + Math.floor(Math.random() * 6), ans = a * b;
    const opts = new Set        ([ans]);
    while (opts.size < 4) opts.add(ans + (Math.floor(Math.random() * 13) - 6) || ans + 7);
    const list = [...opts].sort(() => Math.random() - 0.5);
    const el = Ui.modal(`
      <div class="parent-gate">
        <h2>Dành cho phụ huynh</h2>
