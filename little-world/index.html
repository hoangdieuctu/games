      </div>`, { onClose: onDone });
    el.querySelector('.parent-gate') .addEventListener('click', (e     ) => {
      const n = e.target.closest('[data-n]')?.dataset.n; if (n === undefined) return;
      if (+n === ans) this.dashboard(onDone);
      else { Audio.sfx('soft'); Ui.toast('Chưa đúng — nhờ bố mẹ giúp nhé'); Ui.modal(null); onDone?.(); }
    });
  },

  dashboard(onDone             , tab = 'stats') {
    const p = Store.p;
    const tabs = [['stats', 'Hoạt động'], ['profiles', 'Hồ sơ'], ['settings', 'Cài đặt']];
    let body = '';
    if (tab === 'stats') body = p ? this.statsHtml(p) : '<p>Chưa có hồ sơ nào.</p>';
    else if (tab === 'profiles') body = this.profilesHtml();
    else body = this.settingsHtml();
    const el = Ui.modal(`
      <div class="parent">
        <h2>Góc phụ huynh</h2>
        <div class="seg wide">${tabs.map(([k, n]) => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${n}</button>`).join('')}</div>
        <div class="parent-body">${body}</div>
        <p class="hint">Dữ liệu chỉ lưu trên thiết bị này (localStorage), không gửi đi đâu. Số liệu chỉ mô tả hoạt động trong game — không phải đánh giá trí tuệ hay sự phát triển của trẻ.</p>
      </div>`, { onClose: onDone, cls: 'modal-wide' });
    el.querySelector('.parent') .addEventListener('click', (e     ) => this.onClick(e, onDone));
    el.querySelector('.parent') .addEventListener('input', (e     ) => {
      if (e.target.dataset.set === 'volume') { Store.setSettings({ volume: +e.target.value }); Audio.applySettings(); }
    });
  },

  statsHtml(p         )         {
    const plays = Object.values(p.plays).reduce((a, b) => a + b, 0);
    const fav = Object.entries(p.plays).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, v]) => `${Ui.esc(actById(k)?.name || k)} (${v})`).join(', ') || '—';
    const regions = (AssetLoader.data('world')?.regions || [])         ;
    const explored = regions.filter((r) => ACTIVITIES.some((a) => a.region === r.id && p.plays[a.id]));
    const bySkill                         = {};
    for (const a of ACTIVITIES) bySkill[a.skill] = (bySkill[a.skill] || 0) + (p.plays[a.id] || 0);
    const max = Math.max(1, ...Object.values(bySkill));
    const bars = Object.entries(SKILL_NAMES).map(([k, n]) => `<div class="bar-row"><span>${n}</span><i style="--w:${(bySkill[k] || 0) / max * 100}%"></i><b>${bySkill[k] || 0}</b></div>`).join('');
    const acts = ACTIVITIES.map((a) => `<tr><td>${Ui.esc(a.name)}</td><td>${p.plays[a.id] || 0}</td><td>${p.plays[a.id] ? 'cấp ' + Store.level(a.id) : '—'}</td></tr>`).join('');
    const hist = p.history.slice(-12).reverse().map((h) => `<tr><td>${fmtDate(h.t)}</td><td>${Ui.esc(actById(h.act)?.name || h.act)}</td><td>${Math.max(1, Math.round(h.ms / 1000))} giây</td><td>cấp ${h.level}</td></tr>`).join('');
    const ach = ACHIEVEMENTS.map((a) => `<span class="ach ${p.ach[a.id] ? 'on' : ''}" title="${Ui.esc(a.desc)}"><img src="${AssetLoader.url(a.icon)}" alt="">${Ui.esc(a.name)}</span>`).join('');
    return `
      <div class="stat-grid">
        <div><b>${p.sessions}</b><span>lần mở game</span></div>
        <div><b>${fmtMin(p.playMs)}</b><span>thời gian chơi (ước tính)</span></div>
        <div><b>${plays}</b><span>lượt chơi hoàn thành</span></div>
        <div><b>${explored.length}/${regions.length}</b><span>vùng đất đã khám phá</span></div>
      </div>
      <p><b>${Ui.esc(p.name)}</b> · ${AGE_NAMES[p.age]} · Hoạt động bé thích: ${fav}</p>
      <h4>Hoạt động theo nhóm kỹ năng</h4><div class="bars">${bars}</div>
      <h4>Các trò chơi</h4><table class="tbl"><tr><th>Trò chơi</th><th>Lượt</th><th>Độ khó hiện tại</th></tr>${acts}</table>
      <h4>Gần đây</h4>${hist ? `<table class="tbl"><tr><th>Lúc</th><th>Trò chơi</th><th>Thời gian</th><th>Độ khó</th></tr>${hist}</table>` : '<p>Chưa có.</p>'}
      <h4>Huy hiệu</h4><div class="achs">${ach}</div>`;
  },

  profilesHtml()         {
    const cur = Store.p?.id;
    const rows = Store.profiles.map((p) => `
      <div class="prof-row ${p.id === cur ? 'on' : ''}">
        <img src="${AssetLoader.url(p.pet + '-portrait')}" alt="">
        <div><b>${Ui.esc(p.name)}</b><span>${AGE_NAMES[p.age]} · ${p.earned.star} sao</span></div>
        <select data-age="${p.id}">${Object.entries(AGE_NAMES).map(([k, n]) => `<option value="${k}" ${k === p.age ? 'selected' : ''}>${n}</option>`).join('')}</select>
        ${p.id === cur ? '<em>đang chơi</em>' : `<button class="btn small" data-use="${p.id}">Chọn</button>`}
        <button class="btn small" data-reset="${p.id}">Chơi lại từ đầu</button>
        <button class="btn small danger" data-del="${p.id}">Xoá</button>
      </div>`).join('');
    return `${rows || '<p>Chưa có hồ sơ.</p>'}
      <div class="row"><button class="btn accent" data-a="new">Thêm bé mới</button></div>
      <p class="hint">Độ tuổi chỉ dùng để chọn độ khó ban đầu; game tự điều chỉnh theo cách bé chơi.</p>`;
  },

  settingsHtml()         {
    const s = Store.settings;
    const t = (k        , on         , name        ) => `<label class="tog"><input type="checkbox" data-set="${k}" ${on ? 'checked' : ''}><span>${name}</span></label>`;
    return `
      <div class="opts">
        ${t('sound', s.sound, 'Âm thanh')}
        ${t('music', s.music, 'Nhạc nền')}
        ${t('voice', s.voice, 'Đọc hướng dẫn bằng giọng nói' + (Audio.hasVoice ? '' : ' (máy này chưa có giọng tiếng Việt)'))}
        <label class="tog"><span>Âm lượng</span><input type="range" min="0" max="1" step="0.05" value="${s.volume}" data-set="volume"></label>
        <label class="tog"><span>Ngôn ngữ</span><select data-set="lang"><option value="vi" selected>Tiếng Việt</option></select></label>
      </div>
      <div class="row"><button class="btn danger" data-a="wipe">Xoá toàn bộ dữ liệu trên máy</button></div>`;
  },

  onClick(e     , onDone             ) {
    const t = e.target;
    const d = t.closest('[data-tab],[data-use],[data-del],[data-reset],[data-a]')?.dataset;
    if (t.matches('input[type=checkbox]')) { Store.setSettings({ [t.dataset.set]: t.checked }       ); Audio.applySettings(); return; }
    if (t.matches('select[data-age]')) {
      t.onchange = () => { const p = Store.profiles.find((x) => x.id === t.dataset.age); if (p) { p.age = t.value; Store.commit(); } };
      return;
    }
    if (!d) return;
    if (d.tab) { this.dashboard(onDone, d.tab); return; }
    if (d.use) { Store.selectProfile(d.use); Ui.modal(null); location.hash = 'island'; window.dispatchEvent(new Event('lw-profile')); return; }
    if (d.reset) { if (confirm('Chơi lại từ đầu cho hồ sơ này? Đảo, đồ và sao sẽ được làm mới.')) { Store.resetProfile(d.reset); window.dispatchEvent(new Event('lw-profile')); this.dashboard(onDone, 'profiles'); } return; }
    if (d.del) { if (confirm('Xoá hồ sơ này khỏi máy?')) { Store.deleteProfile(d.del); window.dispatchEvent(new Event('lw-profile')); this.dashboard(onDone, 'profiles'); } return; }
    if (d.a === 'new') { Ui.modal(null); location.hash = 'home'; window.dispatchEvent(new CustomEvent('lw-new-profile')); return; }
    if (d.a === 'wipe') { if (confirm('Xoá toàn bộ hồ sơ và tiến trình trên máy này?')) { Store.resetAll(); Ui.modal(null); location.hash = 'home'; window.dispatchEvent(new Event('lw-profile')); } }
  },
  _unused: REGION_STARS,
};
return { Parent };
})();

/* ══════════ services/CameraControls.ts ══════════ */
M.CameraControls = (function () {
// ── Kéo để di chuyển, chụm hai ngón / con lăn để phóng to ──
// Dùng chung cho bản đồ thế giới và đảo. Chạm nhẹ (không kéo) → onTap.

                          

                             
                                                                 
                                                                            
                                                   
                                             
 

class CameraControls {
  scene     ; cam     ; opts            ;
  minZoom = 0.1; maxZoom = 2;
  locked = false;                           // scene đang kéo một vật → không kéo camera
          downAt                                  = null;
          moved = false;
          pinch                                  = null;
          lastPan                                  = null;

  constructor(scene     , opts            ) {
    this.scene = scene; this.opts = opts; this.cam = scene.cameras.main;
    scene.input.addPointer(1);
    this.cam.setBounds(0, 0, opts.width, opts.height);
    this.refit(true);

    scene.scale.on('resize', this.onResize, this);
    scene.events.once('shutdown', () => scene.scale.off('resize', this.onResize, this));

    scene.input.on('pointerdown', (p     ) => {
      const pts = this.activePointers();
      if (pts.length >= 2) {
        this.pinch = { d: this.dist(pts[0], pts[1]), z: this.cam.zoom };
        this.moved = true;
        return;
      }
      this.downAt = { x: p.x, y: p.y };
      this.lastPan = { x: p.x, y: p.y };
      this.moved = false;
    });

    scene.input.on('pointermove', (p     ) => {
      if (this.opts.onHover && !p.isDown) {
        const w = this.cam.getWorldPoint(p.x, p.y);
        this.opts.onHover(w.x, w.y);
      }
      const pts = this.activePointers();
      if (pts.length >= 2 && this.pinch) {
        const d = this.dist(pts[0], pts[1]);
        const mx = (pts[0].x + pts[1].x) / 2, my = (pts[0].y + pts[1].y) / 2;
        this.zoomAt(this.pinch.z * d / this.pinch.d, mx, my);
        return;
      }
      if (!p.isDown || !this.downAt || this.locked) return;
      const thresh = 8 * (window.devicePixelRatio || 1);
      if (!this.moved && Math.hypot(p.x - this.downAt.x, p.y - this.downAt.y) > thresh) this.moved = true;
      if (this.moved && this.lastPan) {
        this.cam.scrollX -= (p.x - this.lastPan.x) / this.cam.zoom;
        this.cam.scrollY -= (p.y - this.lastPan.y) / this.cam.zoom;
      }
      this.lastPan = { x: p.x, y: p.y };
    });

    scene.input.on('pointerup', (p     ) => {
      if (this.activePointers().length < 2) this.pinch = null;
      if (this.downAt && !this.moved && !this.locked && this.opts.onTap) {
        const w = this.cam.getWorldPoint(p.x, p.y);
        this.opts.onTap(p, w.x, w.y);
      }
      if (this.activePointers().length === 0) { this.downAt = null; this.lastPan = null; }
    });

    scene.input.on('wheel', (p     , _o     , _dx        , dy        ) => {
      this.zoomAt(this.cam.zoom * Math.pow(1.0015, -dy), p.x, p.y);
    });
  }

  /** Vừa thả tay sau khi kéo? Scene dùng để bỏ qua "chạm" giả. */
  get dragging() { return this.moved; }

          activePointers()        {
    return this.scene.input.manager.pointers.filter((p     ) => p.isDown);
  }
          dist(a     , b     ) { return Math.hypot(a.x - b.x, a.y - b.y) || 1; }

          onResize() { this.refit(false); }

  /** Tính mức zoom nhỏ nhất (thế giới phủ kín màn hình). */
  refit(reset         ) {
    const W = this.scene.scale.width, H = this.scene.scale.height;
    this.minZoom = Math.max(W / this.opts.width, H / this.opts.height);
    this.maxZoom = this.minZoom * (this.opts.maxZoom ?? 4);
    if (reset) {
      this.cam.setZoom(this.minZoom);
      this.cam.centerOn(this.opts.width / 2, this.opts.height / 2);
    } else {
      this.cam.setZoom(Phaser.Math.Clamp(this.cam.zoom, this.minZoom, this.maxZoom));
    }
  }

  zoomAt(z        , sx        , sy        ) {
    z = Phaser.Math.Clamp(z, this.minZoom, this.maxZoom);
    const before = this.cam.getWorldPoint(sx, sy);
    this.cam.setZoom(z);
    this.cam.preRender();
    const after = this.cam.getWorldPoint(sx, sy);
    this.cam.scrollX += before.x - after.x;
    this.cam.scrollY += before.y - after.y;
  }

  /** Bay mượt tới một điểm với mức zoom (tương đối so với minZoom). */
  flyTo(x        , y        , rel = 1.6, ms = 700) {
    const z = Phaser.Math.Clamp(this.minZoom * rel, this.minZoom, this.maxZoom);
    this.cam.pan(x, y, ms, 'Sine.easeInOut');
    this.cam.zoomTo(z, ms, 'Sine.easeInOut');
  }

  zoomBy(f        ) {
    this.zoomAt(this.cam.zoom * f, this.scene.scale.width / 2, this.scene.scale.height / 2);
  }
}
return { CameraControls };
})();

/* ══════════ services/LayeredAvatar.ts ══════════ */
M.LayeredAvatar = (function () {
// ── Nhân vật chính ghép lớp ──
// Mỗi lớp (tóc sau, da, mặt, quần, áo, giày, tóc trước, phụ kiện) là một spritesheet
// có CÙNG bố cục khung. Ta chạy một đồng hồ chung và đặt cùng chỉ số khung cho mọi lớp,
// nên các lớp luôn khớp nhau. Lớp tô được (tint) nhân màu theo bảng màu đã chọn.

const { AssetLoader } = M.AssetLoader;
const toInt = (hex        ) => parseInt(String(hex).replace('#', ''), 16);

function avatarConfig()      { return AssetLoader.data('avatar'); }

/** Diện mạo mặc định từ manifest. */
function defaultLook()             {
  const cfg = avatarConfig();
  const d = cfg.defaults || {};
  const variants                                = {};
  const isHex = (v     ) => typeof v === 'string' && v.startsWith('#');
  for (const L of cfg.layers) {
    const v = d[L.slot];
    // defaults.top/bottom/shoes có thể là mã màu (#hex) thay vì asset id → lấy kiểu đầu tiên
    variants[L.slot] = L.slot in d && !isHex(v) ? v : (L.variants.find((x     ) => x.id)?.id ?? null);
  }
  const pal = cfg.palettes || {};
  const pick = (v     , list          , fb        ) => (typeof v === 'number' ? list?.[v] : isHex(v) ? v : null) || list?.[0] || fb;
  return {
    variants,
    colors: {
      skin: pick(d.skin, pal.skin, '#f9cfae'),
      hair: pick(d.hair, pal.hair, '#7a4b2e'),
      top: pick(d.topColor ?? d.top, pal.cloth, '#ffac6b'),
      bottom: pick(d.bottomColor ?? d.bottom, pal.cloth, '#7cc3ee'),
      shoes: pick(d.shoesColor ?? d.shoes, pal.shoes, '#c7b5f0'),
    },
  };
}

/** Mọi asset id cần nạp cho một diện mạo. */
function lookAssetIds(look            )           {
  return Object.values(look.variants).filter(Boolean)            ;
}
function allAvatarAssetIds()           {
  const cfg = avatarConfig();
  return cfg.layers.flatMap((L     ) => L.variants.map((v     ) => v.id)).filter(Boolean);
}

class LayeredAvatar {
  scene     ;
  container     ;
  sprites                      = {};
  cfg     ;
  look            ;
  anim = 'idle-down';
  t = 0;
  flip = false;
  onComplete                      = null;

  constructor(scene     , x        , y        , look             = defaultLook()) {
    this.scene = scene;
    this.cfg = avatarConfig();
    this.container = scene.add.container(x, y);
    this.look = look;
    const [ox, oy] = this.cfg.origin || [0.5, 0.92];
    for (const L of this.cfg.layers) {
      const s = scene.add.sprite(0, 0, '__DEFAULT');
      s.setOrigin(ox, oy);
      s.setScale(this.cfg.scale ?? 0.5);
      this.sprites[L.slot] = s;
      this.container.add(s);
    }
    this.setLook(look);
    this.apply();
  }

  setLook(look            ) {
    this.look = look;
    for (const L of this.cfg.layers) {
      const s = this.sprites[L.slot];
      const id = look.variants[L.slot];
      if (id && this.scene.textures.exists(id)) {
        s.setTexture(id);
        s.setVisible(true);
      } else {
        s.setVisible(false);
      }
      const colorKey = this.cfg.tintSlots?.[L.slot];
      if (L.tint && colorKey) {
        const hex = colorKey === 'cloth' ? (L.slot === 'bottom' ? look.colors.bottom : look.colors.top) : look.colors[colorKey];
        if (hex) s.setTint(toInt(hex)); else s.clearTint();
      } else {
        s.clearTint();
      }
    }
    this.apply();
  }

  play(key        , restart = false, onComplete                      = null) {
    if (!this.cfg.anims[key]) return;
    if (this.anim !== key || restart) { this.anim = key; this.t = 0; }
    this.onComplete = onComplete;
  }

  setFlip(f         ) { this.flip = f; }

  frameIndex()         {
    const a = this.cfg.anims[this.anim];
    const step = Math.floor(this.t * (a.frameRate || 8) / 1000);
    if (a.repeat === -1 || a.repeat === undefined) return a.start + (step % a.count);
    if (step >= a.count) {
      if (this.onComplete) { const cb = this.onComplete; this.onComplete = null; cb(); }
      return a.start + a.count - 1;
    }
    return a.start + step;
  }

  /** Đặt một khung tĩnh theo tên góc nhìn (front/side/back/threequarter). */
  showView(view        ) {
    const idx = this.cfg.views?.[view];
    if (idx === undefined) return;
    this.anim = '__static'; this.t = 0;
    for (const s of Object.values(this.sprites)) if (s.visible) s.setFrame(idx);
  }

  apply() {
    if (this.anim === '__static') return;
    const f = this.frameIndex();
    for (const s of Object.values(this.sprites)) {
      if (!s.visible) continue;
      s.setFrame(f);
      s.setFlipX(this.flip);
    }
  }

  update(dt        ) {
    if (this.anim === '__static') return;
    this.t += dt;
    this.apply();
  }

  set depth(d        ) { this.container.setDepth(d); }
  get x() { return this.container.x; }
  get y() { return this.container.y; }
  setPosition(x        , y        ) { this.container.setPosition(x, y); }
  setScale(s        ) { this.container.setScale(s); }
  destroy() { this.container.destroy(); }
}

/** Diện mạo đã lưu (có thể cũ/hỏng) → diện mạo hợp lệ với manifest hiện tại. */
function validLook(s     )             {
  const d = defaultLook();
  try {
    if (s && s.variants && s.colors) {
      const cfg = avatarConfig();
      const ok = cfg.layers.every((L     ) => !(L.slot in s.variants) || s.variants[L.slot] === null || L.variants.some((v     ) => v.id === s.variants[L.slot]));
      if (ok) return { variants: { ...d.variants, ...s.variants }, colors: { ...d.colors, ...s.colors } };
    }
  } catch (e) { /* bỏ qua */ }
  return d;
}
return { avatarConfig, defaultLook, lookAssetIds, allAvatarAssetIds, LayeredAvatar, validLook };
})();

/* ══════════ scenes/BootScene.ts ══════════ */
M.BootScene = (function () {
// ── Khởi động: đọc manifest rồi mở màn hình theo #hash ──
// #home · #island · #map · #map/<vùng> · #wardrobe · #play/<hoạt động>
const { AssetLoader } = M.AssetLoader;
const { Store } = M.Store;
const { Ui } = M.Ui;
const { actById } = M.Content;
function routeFromHash()        {
  const [h, arg] = location.hash.replace('#', '').split('/');
  if (!Store.p) return { key: 'Home' };
  if (h === 'map') return { key: 'WorldMap', data: { region: arg || null } };
  if (h === 'wardrobe') return { key: 'Wardrobe' };
  if (h === 'home') return { key: 'Home' };
  if (h === 'play' && arg) {
    const a = actById(arg);
    if (a && Store.regionOpen(a.region)) return { key: a.scene, data: { act: a.id } };
    if (a) return { key: 'WorldMap', data: { region: a.region } };
  }
  return { key: 'Island' };
}

/** Gói preload chung: xếp hàng tài sản + thanh tiến trình. */
function preloadWithProgress(scene     , queue              , label        ) {
  const n = queue();
  if (!n) return;
  Ui.loading(0, label);
  // chỉ cho lần nạp này: lần nạp lẻ về sau (ví dụ icon phần thưởng) không được bật lại màn tải
  const onProgress = (p        ) => Ui.loading(p, label);
  scene.load.on('progress', onProgress);
  scene.load.once('complete', () => { scene.load.off('progress', onProgress); Ui.loading(null); });
  scene.load.on('loaderror', (f     ) => console.warn('Không tải được', f.key, f.src));
}

class BootScene extends Phaser.Scene {
  constructor() { super('Boot'); }
  preload() {
    Ui.loading(0.05);
    AssetLoader.queueManifest(this);
  }
  create() {
    AssetLoader.init(this);
    if (Store.p) Store.startSession();
    const r = routeFromHash();
    Ui.route = r.key;
    this.scene.start(r.key, r.data);
  }
}
return { routeFromHash, preloadWithProgress, BootScene };
})();

/* ══════════ scenes/MiniGame.ts ══════════ */
M.MiniGame = (function () {
// ── Khung chung cho mọi mini-game ──
// Không gian thiết kế cố định (1600×900 ngang / 900×1600 dọc), camera tự co giãn cho vừa màn hình.
// Mỗi game chỉ cần: buildRound(), và gọi good()/miss()/nextRound()/complete().
const { AssetLoader } = M.AssetLoader;
const { Store } = M.Store;
const { Audio } = M.Audio;
const { Hud } = M.Hud;
const { Ui } = M.Ui;
const { actById, Activity, pick, PET_LINES } = M.Content;
const { preloadWithProgress } = M.BootScene;
const FONT = '"Baloo 2", Nunito, sans-serif';
const shuffle =    (a     )      => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const randInt = (a        , b        ) => a + Math.floor(Math.random() * (b - a + 1));

class MiniGame extends Phaser.Scene {
  act           = null       ;
  mode = '';
  level = 1;
  round = 0;
  rounds = 5;
  mistakes = 0;
  roundMistakes = 0;
  startedAt = 0;
  W = 1600; H = 900; portrait = false;
  bg     ; bgKey = '';
  layer     ;            // container cho nội dung của vòng hiện tại
  dots     ;
  busy = false;
  done = false;
  petSprite     ;

  init(data     ) {
    this.act = actById(data?.act) || actById('animal-match') ;
    this.mode = this.act.mode || '';
    this.level = Store.level(this.act.id);
    this.rounds = this.act.rounds;
    this.round = 0; this.mistakes = 0; this.roundMistakes = 0; this.done = false; this.busy = false;
    this.W = 0; this.H = 0; this.portrait = false;
  }

  /** Tài sản riêng của game (id). */
  assets()           { return []; }

  preload() {
    const region = (AssetLoader.data('world')?.regions || []).find((r     ) => r.id === this.act.region);
    this.bgKey = region?.background || '';
    const pets = AssetLoader.data('pets') || {};
    const pet = Store.p?.pet || 'fox';
    preloadWithProgress(this, () => AssetLoader.queueIds(this, [this.bgKey, pets[pet]?.sheet, ...this.assets()]), 'Đang chuẩn bị trò chơi…');
  }

  create() {
    if (Ui.stale(this)) return;
    Ui.setActiveTab('Play');
    AssetLoader.createAnimations(this);
    this.cameras.main.setBackgroundColor('#dff3fd');
    if (this.bgKey && this.textures.exists(this.bgKey)) this.bg = this.add.image(0, 0, this.bgKey).setDepth(-100);
    this.layer = this.add.container(0, 0);
    this.dots = this.add.container(0, 0).setDepth(900);
    this.spawnPet();
    this.fit();
    this.scale.on('resize', this.onResize, this);
    this.events.once('shutdown', () => { this.scale.off('resize', this.onResize, this); Ui.clearPanel(); Hud.hideGuide(); });
    this.buildBar();
    this.startedAt = Date.now();
    this.setup();
    this.startRound();
  }

  /** Gọi một lần trước vòng đầu (tuỳ game). */
  setup() { /* */ }
  buildRound() { /* game ghi đè */ }

  // ───────── bố cục ─────────
  fit() {
    const sw = this.scale.width, sh = this.scale.height;
    const portrait = sh > sw * 1.1;
    const changed = portrait !== this.portrait;
    this.portrait = portrait;
    // không gian thiết kế co theo tỉ lệ màn hình (ngang: cao 900; dọc: rộng 900)
    const ar = sw / sh, clamp = (v        , lo        , hi        ) => Math.max(lo, Math.min(hi, v));
    const W = portrait ? 900 : Math.round(clamp(900 * ar, 1300, 2000)), H = portrait ? Math.round(clamp(900 / ar, 1350, 2000)) : 900;
    // chỉ dựng lại khi đổi đáng kể (thanh địa chỉ điện thoại ẩn/hiện thì không)
    const changed2 = Math.abs(W - this.W) > this.W * 0.1 || Math.abs(H - this.H) > this.H * 0.1;
    if (!changed && !changed2 && this.layer) { this.applyCam(sw, sh); return false; }
    this.W = W; this.H = H;
    this.applyCam(sw, sh);
    return changed || changed2;
  }
  applyCam(sw        , sh        ) {
    const cam = this.cameras.main;
    const z = Math.min(sw / this.W, sh / this.H);
    cam.setZoom(z);
    cam.centerOn(this.W / 2, this.H / 2);
    if (this.bg) {
      // ảnh nền phủ kín cả phần thừa ngoài không gian thiết kế
      const vw = sw / z, vh = sh / z;
      const s = Math.max(vw / this.bg.width, vh / this.bg.height);
      this.bg.setScale(s).setPosition(this.W / 2, this.H / 2);
    }
    this.placePet();
  }
  onResize() { if (this.fit() && !this.done) this.relayout(); }
  /** Đổi chiều màn hình: dựng lại vòng hiện tại. */
  relayout() { this.startRound(true); }

  /** Toạ độ trên cùng của vùng chơi (dưới thanh trên của trang). */
  get top() { return this.portrait ? 290 : 120; }

  // ───────── thanh điều khiển (DOM) ─────────
  buildBar() {
    const el = Ui.panel(`
      <div class="game-bar">
        <button class="btn icon" data-a="exit" aria-label="Thoát">✕</button>
        <div class="gb-title"><b>${Ui.esc(this.act.name)}</b><span>Cấp ${this.level}</span></div>
        <div class="gb-dots"></div>
        <button class="btn icon" data-a="hint" aria-label="Gợi ý">?</button>
      </div>`, 'game-panel');
    el.onclick = (e     ) => {
      const a = e.target.closest('button')?.dataset.a;
      if (a === 'exit') { Audio.sfx('tap'); this.exit(); }
      else if (a === 'hint') { Audio.sfx('tap'); this.hint(); }
    };
    this.updateDots();
  }
  updateDots() {
    const d = document.querySelector('.gb-dots'); if (!d) return;
    if (this.rounds <= 1) { d.innerHTML = ''; return; }
    d.innerHTML = Array.from({ length: this.rounds }, (_, i) => `<i class="${i < this.round ? 'on' : i === this.round ? 'cur' : ''}"></i>`).join('');
  }

  exit() { location.hash = 'map/' + this.act.region; }
  hint() { this.say(this.instruction()); }
  instruction()         { return this.act.desc; }

  // ───────── vòng chơi ─────────
  startRound(same = false) {
    if (!same) this.roundMistakes = 0;
    this.busy = false;
    this.tweens.killTweensOf(this.layer.list);
    this.layer.removeAll(true);
    this.input.setDraggable && this.layer.list.forEach(() => 0);
    this.buildRound();
    this.updateDots();
  }

  nextRound(delay = 900) {
    this.busy = true;
    this.time.delayedCall(delay, () => {
      this.round++;
      if (this.round >= this.rounds) this.complete();
      else this.startRound();
    });
  }

  /** Bé làm đúng: lấp lánh + tiếng vui + thú cưng khen. */
  good(x        , y        , praise = true) {
    Audio.sfx('good');
    this.sparkle(x, y);
    if (praise) { this.petReact('happy'); if (Math.random() < 0.6) this.say(pick(PET_LINES.great), false); }
  }
  /** Bé chọn chưa đúng: không phạt, chỉ lắc nhẹ + gợi ý. */
  miss(obj      , hint         ) {
    this.mistakes++; this.roundMistakes++;
    Audio.sfx('soft');
    if (obj) {
      const x0 = obj.x;
      this.tweens.add({ targets: obj, x: x0 + 12, duration: 60, yoyo: true, repeat: 2, onComplete: () => (obj.x = x0) });
    }
    if (hint) this.say(hint);
    else if (this.roundMistakes === 2) this.say(pick(PET_LINES.tryAgain));
  }

  complete(extra                        = {}) {
    if (this.done) return;
    this.done = true;
    this.petReact('celebrate');
    this.confetti();
    const res = Store.finish(this.act.id, { mistakes: this.mistakes, ms: Date.now() - this.startedAt, rounds: this.rounds, ...extra });
    this.time.delayedCall(900, () => {
      Hud.rewardModal(res, pick(['Bé giỏi quá!', 'Hoàn thành rồi!', 'Tuyệt vời!']), {
        again: () => this.scene.restart({ act: this.act.id }),
        island: () => { location.hash = 'island'; },
        map: () => { location.hash = 'map/' + this.act.region; },
      });
    });
  }

  say(text        , speak = true) { Hud.say(text, { speak }); }

  // ───────── thú cưng ở góc ─────────
  spawnPet() {
    const pets = AssetLoader.data('pets') || {};
    const id = Store.p?.pet || 'fox';
    const P = pets[id];
    if (!P || !this.textures.exists(P.sheet)) return;
    this.petSprite = this.add.sprite(0, 0, P.sheet).setOrigin(0.5, 0.92).setDepth(800);
    this.petSprite.setData('id', id);
    this.petPlay('greet', true);
    this.petSprite.setInteractive({ pixelPerfect: true, alphaTolerance: 40, useHandCursor: true });
    this.petSprite.on('pointerup', () => { this.petPlay('interact', true); this.hint(); });
  }
  placePet() {
    if (!this.petSprite) return;
    const s = this.portrait ? 1.0 : 1.1;
    this.petSprite.setScale(s).setPosition(this.portrait ? 110 : 120, this.H - 20);
  }
  petPlay(anim        , once = false) {
    const s = this.petSprite; if (!s) return;
    const key = `${s.getData('id')}-${anim}`;
    if (!this.anims.exists(key)) return;
    s.play(key);
    if (once) s.once('animationcomplete', () => this.petPlay('idle-front'));
  }
  petReact(anim                       ) { this.petPlay(anim === 'happy' ? 'happy' : 'celebrate', true); if (anim === 'happy') this.time.delayedCall(900, () => this.petPlay('idle-front')); }

  // ───────── hiệu ứng ─────────
  sparkle(x        , y        , n = 10) {
    for (let i = 0; i < n; i++) {
      const a = (Math.PI * 2 * i) / n + Math.random() * 0.4;
      const g = this.add.star(x, y, 5, 6, 14, [0xffd96b, 0xffffff, 0xffb8cb, 0xa6e3c4][i % 4]).setDepth(950);
      this.tweens.add({ targets: g, x: x + Math.cos(a) * (70 + Math.random() * 50), y: y + Math.sin(a) * (70 + Math.random() * 50), angle: 180, alpha: 0, scale: 0.4, duration: 650, ease: 'Cubic.easeOut', onComplete: () => g.destroy() });
    }
  }
  confetti() {
    for (let i = 0; i < 60; i++) {
      const x = Math.random() * this.W, c = [0xffd96b, 0xffac6b, 0xffb8cb, 0xa6e3c4, 0xc7b5f0, 0x8fd6f0][i % 6];
      const r = this.add.rectangle(x, -20 - Math.random() * 200, 14, 22, c).setDepth(960).setAngle(Math.random() * 180);
      this.tweens.add({ targets: r, y: this.H + 40, angle: r.angle + 360 + Math.random() * 360, x: x + (Math.random() - 0.5) * 200, duration: 1600 + Math.random() * 1200, ease: 'Sine.easeIn', onComplete: () => r.destroy() });
    }
  }

  /** Khung bo tròn nền trắng mờ (dùng cho thẻ, khay). */
  plate(x        , y        , w        , h        , color = 0xfffaf2, alpha = 0.92, r = 28) {
    const g = this.add.graphics();
    g.fillStyle(0x4c3876, 0.14).fillRoundedRect(x - w / 2 + 4, y - h / 2 + 8, w, h, r);
    g.fillStyle(color, alpha).fillRoundedRect(x - w / 2, y - h / 2, w, h, r);
    g.lineStyle(5, 0xffffff, 1).strokeRoundedRect(x - w / 2, y - h / 2, w, h, r);
    return g;
  }
  label(x        , y        , text        , size = 44, color = '#4b3a5e') {
    return this.add.text(x, y, text, { fontFamily: FONT, fontSize: size + 'px', fontStyle: '800', color, stroke: '#ffffff', strokeThickness: Math.round(size / 6), align: 'center', wordWrap: { width: this.W - 120 } }).setOrigin(0.5);
  }
  /** Ảnh vừa khít một ô w×h (giữ tỉ lệ). */
  fitImage(key        , x        , y        , w        , h        ) {
    const img = this.add.image(x, y, key);
    const s = Math.min(w / img.width, h / img.height);
    img.setScale(s);
    img.setData('baseScale', s);
    return img;
  }
  pulse(obj     , k = 1.08) {
    const s = obj.getData('baseScale') || obj.scale;
    this.tweens.add({ targets: obj, scale: s * k, duration: 160, yoyo: true, ease: 'Quad.easeOut' });
  }

  /** Nút to bo tròn màu cam (trong vùng chơi). */
  bigButton(x        , y        , text        , cb            ) {
    const c = this.add.container(x, y);
    const w = Math.max(300, text.length * 26 + 80), h = 96;
    const g = this.add.graphics();
    g.fillStyle(0xd96f36, 1).fillRoundedRect(-w / 2, -h / 2 + 8, w, h, 48);
    g.fillStyle(0xffac6b, 1).fillRoundedRect(-w / 2, -h / 2, w, h, 48);
    g.lineStyle(6, 0xffffff, 1).strokeRoundedRect(-w / 2, -h / 2, w, h, 48);
    const t = this.add.text(0, -2, text, { fontFamily: FONT, fontSize: '48px', fontStyle: '800', color: '#ffffff' }).setOrigin(0.5);
    c.add([g, t]); c.setSize(w, h).setInteractive({ useHandCursor: true });
    c.on('pointerdown', () => c.setScale(0.95));
    c.on('pointerout', () => c.setScale(1));
    c.on('pointerup', () => { c.setScale(1); Audio.sfx('tap'); cb(); });
    return c;
  }

  update(_t        , _dt        ) { /* */ }
}
return { FONT, shuffle, randInt, MiniGame };
})();

M.HomeScene = (function () {

          <div class="field"><span>Chọn bạn đồng hành</span><div class="pet-pick">${['fox', 'bunny', 'bear'].map((id) => `
            <button data-pet="${id}" class="${f.pet === id ? 'on' : ''}"><img src="${portrait(id)}" alt=""><b>${Ui.esc(pets[id]?.name || id)}</b></button>`).join('')}</div>
            <p class="hint">${Ui.esc(pets[f.pet]?.personality || '')}</p></div>
          <div class="row center">
            ${Store.profiles.length ? '<button class="btn big ghost" data-a="cancel">Quay lại</button>' : ''}
            <button class="btn big accent" data-a="go">Bắt đầu phiêu lưu!</button>
          </div>
        </div>`;
    }
    const el = Ui.panel(html, 'home-panel');
    const name = el.querySelector('#pname')                           ;
    if (name) name.oninput = () => { this.form.name = name.value; };
    el.onclick = (e     ) => {
      const b = e.target.closest('button'); if (!b) return;
      Audio.unlock(); Audio.sfx('tap');
      const d = b.dataset;
      if (d.id) { Store.selectProfile(d.id); this.enter(); }
      else if (d.a === 'new') { this.creating = true; this.form = { name: '', age: 'preschool', pet: 'fox' }; this.render(); }
      else if (d.a === 'cancel') { this.creating = false; this.render(); }
      else if (d.age) { this.form.age = d.age; this.render(); }
      else if (d.pet) { this.form.pet = d.pet; Audio.sfx('pop'); this.render(); }
      else if (d.a === 'go') {
        Store.createProfile(this.form.name || 'Bé', this.form.age, this.form.pet);
        this.enter();
      }
    };
  }

  enter() {
    Store.startSession();
    Ui.clearPanel();
    window.dispatchEvent(new Event('lw-profile'));
    location.hash = 'island';
  }
}
return { HomeScene };
})();

/* ══════════ scenes/WorldMapScene.ts ══════════ */
M.WorldMapScene = (function () {
// ── Bản đồ thế giới: 6 vùng đất, mỗi vùng có các trò chơi ──
// Vùng mở dần theo số sao bé nhận được. Vùng khoá vẫn nhìn thấy và xem trước được.
const { AssetLoader } = M.AssetLoader;
const { Store } = M.Store;
const { Audio } = M.Audio;
const { Hud, resIcon, costHtml } = M.Hud;
const { ACTIVITIES, REGION_STARS, PET_LINES, pick } = M.Content;
const { CameraControls } = M.CameraControls;
const { Ui } = M.Ui;
const { preloadWithProgress } = M.BootScene;
const hexInt = (h        ) => parseInt(String(h || '#ffffff').replace('#', ''), 16);

class WorldMapScene extends Phaser.Scene {
  world     ;
  controls     ;
  polys                      = {};
  overlays                        = {};
  labels                      = {};
  unlocked                          = {};
  hover                = null;
  selected                = null;
  hl     ; hlGlow     ;
  showLabels = true;
  t = 0;

  constructor() { super('WorldMap'); }

  preload() {
    preloadWithProgress(this, () => {
      const entries = ['world-map', 'regions', 'ui']
        .flatMap((p) => AssetLoader.byCategory(p))
        // ảnh nền từng vùng lớn — chỉ nạp khi mở xem vùng
        .filter((e) => !/background\.webp$/.test(e.file));
      return AssetLoader.queue(this, entries);
    }, 'Đang mở bản đồ thế giới…');
  }

  focus                = null;
  init(data     ) { this.focus = data?.region || null; }

  create() {
    if (Ui.stale(this)) return;
    Ui.setActiveTab('WorldMap');
    Hud.show(true);
    AssetLoader.createAnimations(this);
    const W = this.world = AssetLoader.data('world');
    this.cameras.main.setBackgroundColor('#5ab4e0');

    const base = this.add.image(0, 0, W.background).setOrigin(0, 0).setDisplaySize(W.width, W.height);
    base.setDepth(0);

    // lớp tô nổi vùng (dưới các công trình) + viền sáng (trên)
    this.hl = this.add.graphics().setDepth(1);
    this.hlGlow = this.add.graphics().setDepth(4800);

    // công trình từng vùng
    for (const r of W.regions) {
      this.polys[r.id] = new Phaser.Geom.Polygon(r.polygon.flat());
      this.unlocked[r.id] = Store.regionOpen(r.id);
      for (const lm of r.landmarks || []) {
        if (!this.textures.exists(lm.asset)) continue;
        const s = AssetLoader.sprite(this, lm.asset, lm.x, lm.y);
        s.setDepth(10 + lm.y / 10);
        if (lm.scale) s.setScale(s.scaleX * lm.scale);
      }
    }

    // đảo của bé
    if (W.homeIsland && this.textures.exists(W.homeIsland.asset)) {
      const h = AssetLoader.sprite(this, W.homeIsland.asset, W.homeIsland.x, W.homeIsland.y);
      h.setDepth(10 + W.homeIsland.y / 10);
      this.tweens.add({ targets: h, y: h.y - 10, duration: 2200, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
      const pin = this.textures.exists('ui-map-pin') ? AssetLoader.image(this, 'ui-map-pin', W.homeIsland.x, W.homeIsland.y - h.displayHeight * 0.9) : null;
      if (pin) {
        pin.setDepth(5600);
        this.tweens.add({ targets: pin, y: pin.y - 18, duration: 700, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
      }
    }

    // trang trí: mây trôi, chim bay, thuyền dập dềnh
    for (const d of W.decorations || []) {
      if (!this.textures.exists(d.asset)) continue;
      const s = AssetLoader.sprite(this, d.asset, d.x, d.y);
      const isCloud = /cloud/.test(d.asset);
      s.setDepth(isCloud ? 5200 + d.y / 100 : 10 + d.y / 10);
      if (d.anim && this.anims.exists(d.anim)) s.play(d.anim);
      if (d.flipX) s.setFlipX(true);
      if (d.drift || isCloud) {
        const dist = 600 + (d.x % 400);
        this.tweens.add({ targets: s, x: s.x + dist, duration: 40000 + (d.y % 7) * 4000, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
      } else {
        this.tweens.add({ targets: s, y: s.y - 6, duration: 1600 + (d.x % 900), yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
      }
    }

    // mây khoá + ổ khoá
    for (const r of W.regions) this.buildOverlay(r);

    // nhãn tên vùng
    for (const r of W.regions) this.labels[r.id] = this.buildLabel(r);

    this.controls = new CameraControls(this, {
      width: W.width, height: W.height, maxZoom: 3.2,
      onHover: (x, y) => this.setHover(this.regionAt(x, y)),
      onTap: (_p, x, y) => this.tap(x, y),
    });

    this.buildPanel();
    Ui.card(null);
    this.events.once('shutdown', () => { Ui.card(null); Ui.clearPanel(); });

    // vùng vừa mở khoá (chưa xem): mây tan + lấp lánh
    const p = Store.p ;
    const fresh = W.regions.filter((r     ) => this.unlocked[r.id] && REGION_STARS[r.id] > 0 && !p.counters['seen-' + r.id]);
    if (this.focus) this.time.delayedCall(50, () => this.select(this.focus, true));
    else if (fresh.length) {
      const r = fresh[0];
      for (const x of fresh) p.counters['seen-' + x.id] = 1;
      Store.commit();
      for (const o of this.overlays[r.id] || []) o.setVisible(true);
      this.time.delayedCall(400, () => { this.select(r.id, true); this.time.delayedCall(700, () => this.revealRegion(r)); });
    } else this.time.delayedCall(300, () => Hud.say(pick(PET_LINES.map)));
  }

  revealRegion(r     ) {
    Audio.sfx('unlock');
    for (const p of this.overlays[r.id] || []) {
      this.tweens.add({ targets: p, alpha: 0, scale: p.scale * 1.2, duration: 900, onComplete: () => p.setVisible(false) });
    }
    if (this.textures.exists('world-ui-unlocked-sparkle')) {
      const c = r.label || r.center;
      const s = AssetLoader.image(this, 'world-ui-unlocked-sparkle', c[0], c[1] - 60).setDepth(5900).setAlpha(0);
      const sc = s.scale; s.setScale(sc * 0.4);
      this.tweens.add({ targets: s, alpha: 1, scale: sc * 1.6, duration: 500, ease: 'Back.easeOut', yoyo: true, hold: 700, onComplete: () => s.destroy() });
    }
    Hud.say(`Vùng ${r.name} đã mở! Mình vào chơi nhé!`);
  }

  // ───────────── dựng ─────────────
  buildOverlay(r     ) {
    const o = r.lockedOverlay;
    const parts        = [];
    if (o && this.textures.exists(o.asset)) {
      const s = AssetLoader.image(this, o.asset, o.x, o.y).setDepth(5000);
      this.tweens.add({ targets: s, alpha: { from: 0.96, to: 0.86 }, duration: 2400, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
      parts.push(s);
    }
    if (this.textures.exists('ui-lock-badge')) {
      const c = r.label || r.center;
      const b = AssetLoader.image(this, 'ui-lock-badge', c[0], c[1] - 110).setDepth(5100);
      this.tweens.add({ targets: b, angle: { from: -6, to: 6 }, duration: 1300, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
      parts.push(b);
    }
    this.overlays[r.id] = parts;
    for (const p of parts) p.setVisible(!this.unlocked[r.id]);
  }

  buildLabel(r     ) {
    const [x, y] = r.label || r.center;
    const c = this.add.container(x, y).setDepth(6000);
    const txt = this.add.text(0, 0, r.name, {
      fontFamily: '"Baloo 2", Nunito, sans-serif', fontSize: '54px', fontStyle: '800',
      color: '#ffffff', stroke: '#' + hexInt(r.color).toString(16).padStart(6, '0'), strokeThickness: 0,
    }).setOrigin(0.5, 0.5);
    const sub = this.add.text(0, 40, r.nameEn || '', {
      fontFamily: 'Nunito, sans-serif', fontSize: '26px', fontStyle: '800', color: '#4b3a5e',
    }).setOrigin(0.5, 0.5);
    const w = Math.max(txt.width, sub.width) + 70, h = 118;
    const bg = this.add.graphics();
    bg.fillStyle(0x4b3a5e, 0.18).fillRoundedRect(-w / 2 + 4, -h / 2 + 10, w, h, 40);
    bg.fillStyle(0xfffaf2, 0.96).fillRoundedRect(-w / 2, -h / 2, w, h, 40);
    bg.fillStyle(hexInt(r.color), 1).fillRoundedRect(-w / 2 + 10, -h / 2 + 8, w - 20, 62, 30);
    txt.setY(-h / 2 + 39);
    sub.setY(h / 2 - 25);
    c.add([bg, txt, sub]);
    c.setSize(w, h);
    (c       ).baseScale = 1;
    return c;
  }

  buildPanel() {
    const el = Ui.panel(`
      <div class="row">
        <button class="btn" data-a="fit">Toàn cảnh</button>
        <button class="btn accent" data-a="home">Về đảo</button>
      </div>
    `, 'map-panel');
    el.onclick = (e     ) => {
      const b = e.target.closest('button'); if (!b) return;
      Audio.sfx('tap');
      const a = b.dataset.a;
      if (a === 'fit') { this.select(null); this.controls.flyTo(this.world.width / 2, this.world.height / 2, 1, 600); }
      else if (a === 'home') this.goHome();
    };
  }

  // ───────────── tương tác ─────────────
  regionAt(x        , y        )                {
    for (const r of this.world.regions) if (Phaser.Geom.Polygon.Contains(this.polys[r.id], x, y)) return r.id;
    return null;
  }

  tap(x        , y        ) {
    const h = this.world.homeIsland;
    if (h && Math.hypot(x - h.x, y - (h.y - 80)) < 170) { this.showHomeCard(); return; }
    const id = this.regionAt(x, y);
    this.select(id, !!id);
  }

  setHover(id               ) {
    if (id === this.hover) return;
    this.hover = id;
    this.input.setDefaultCursor(id ? 'pointer' : 'grab');
    this.drawHighlight();
  }

  select(id               , fly = false) {
    this.selected = id;
    this.drawHighlight();
    for (const [rid, l] of Object.entries(this.labels)) {
      this.tweens.add({ targets: l, scale: (l       ).baseScale * (rid === id ? 1.25 : 1), duration: 220, ease: 'Back.easeOut' });
    }
    if (!id) { Ui.card(null); return; }
    const r = this.world.regions.find((x     ) => x.id === id);
    if (fly) this.controls.flyTo(r.center[0], r.center[1], 1.7, 650);
    this.showRegionCard(r);
  }

  drawHighlight() {
    this.hl.clear(); this.hlGlow.clear();
    const draw = (id        , strong         ) => {
      const r = this.world.regions.find((x     ) => x.id === id);
      const pts = r.polygon.map(([x, y]          ) => new Phaser.Geom.Point(x, y));
      this.hl.fillStyle(hexInt(r.color), strong ? 0.3 : 0.18).fillPoints(pts, true);
      this.hlGlow.lineStyle(strong ? 26 : 18, 0xffffff, strong ? 0.35 : 0.22).strokePoints(pts, true);
      this.hlGlow.lineStyle(strong ? 9 : 6, 0xfffaf2, 0.95).strokePoints(pts, true);
    };
    if (this.hover && this.hover !== this.selected) draw(this.hover, false);
    if (this.selected) draw(this.selected, true);
  }

  showRegionCard(r     ) {
    const open = this.unlocked[r.id];
    const p = Store.p ;
    const acts = ACTIVITIES.filter((x) => x.region === r.id);
    const need = Hud.regionNeed(r.id);
    const list = acts.map((x) => `
      <button class="act ${open ? '' : 'off'}" data-act="${x.id}">
        <div><b>${Ui.esc(x.name)}</b><span>${Ui.esc(x.desc)}</span></div>
        <em>${p.plays[x.id] ? `Cấp ${Store.level(x.id)} · ${p.plays[x.id]} lượt` : 'Mới!'}</em>
        ${costHtml(x.reward       , 'cost gain')}
      </button>`).join('');
    const el = Ui.card(`
      <div class="card-head" style="--c:${r.color}">
        <img class="card-icon" src="${AssetLoader.url(r.icon)}" alt="">
        <div><h3>${Ui.esc(r.name)}</h3><p>${Ui.esc(r.nameEn || '')}</p></div>
        <span class="badge ${open ? 'open' : 'locked'}">${open ? 'Đã mở' : 'Đang khoá'}</span>
      </div>
      ${open ? '' : `<p class="card-text need">Cần thêm <b>${need}</b> <img src="${resIcon('star')}" alt="sao"> để mở. Chơi ở các vùng khác để nhận sao nhé!</p>`}
      <div class="acts">${list}</div>
      <div class="row">
        <button class="btn" data-a="view">Xem cảnh vùng</button>
        <button class="btn ghost" data-a="close">Đóng</button>
      </div>`);
    el.onclick = (e     ) => {
      const b = e.target.closest('button'); if (!b) return;
      Audio.sfx('tap');
      if (b.dataset.act) {
        if (!open) { Hud.say(`${r.name} chưa mở. Cần thêm ${need} ngôi sao nữa nhé!`); return; }
        location.hash = 'play/' + b.dataset.act;
        return;
      }
      const a = b.dataset.a;
      if (a === 'close') this.select(null);
      else if (a === 'view') this.showRegionView(r);
    };
  }

  showHomeCard() {
    this.select(null);
    const el = Ui.card(`
      <div class="card-head" style="--c:#ffd96b">
        <div><h3>Đảo của bé</h3><p>Personal Island</p></div>
      </div>
      <p class="card-text">Hòn đảo nhỏ của riêng bé — nơi có ngôi nhà, khu vườn và thú cưng.</p>
      <div class="row"><button class="btn accent" data-a="go">Đến đảo</button><button class="btn ghost" data-a="close">Đóng</button></div>`);
    el.onclick = (e     ) => {
      const a = e.target.closest('button')?.dataset.a;
      if (a === 'go') this.goHome(); else if (a === 'close') Ui.card(null);
    };
  }

  goHome() { location.hash = 'island'; }

  showRegionView(r     ) {
    const bg = this.world.regions && AssetLoader.url(r.background);
    Ui.modal(`
      <div class="region-view" style="--c:${r.color}">
        <div class="rv-stage">
          <img class="rv-bg" src="${bg}" alt="Khung cảnh ${Ui.esc(r.name)}">
          <img class="rv-gate" src="${AssetLoader.url(r.entrance)}" alt="">
          <div class="rv-title"><img src="${AssetLoader.url(r.icon)}" alt=""><span>${Ui.esc(r.name)}</span></div>
        </div>
      </div>`);
  }

  update(_t        , dt        ) {
    if (!this.controls) return;
    // nhãn giữ cỡ dễ đọc khi phóng to
    const rel = this.cameras.main.zoom / this.controls.minZoom;
    const s = Math.pow(rel, -0.75);
    for (const l of Object.values(this.labels)         ) {
      if (l.baseScale !== s) {
        const sel = this.selected && this.labels[this.selected] === l;
        l.baseScale = s;
        if (!this.tweens.isTweening(l)) l.setScale(s * (sel ? 1.25 : 1));
      }
    }
    this.t += dt;
  }
}
return { WorldMapScene };
})();

/* ══════════ scenes/IslandScene.ts ══════════ */
M.IslandScene = (function () {
// ── Đảo của bé ──
// Dạo chơi: chạm mặt đất để bé đi, chạm luống đất để gieo hạt / thu hoạch hoa.
// Trang trí: lấy đồ trong túi đặt lên đảo, kéo để di chuyển, lật, cất lại vào túi.
// Cửa hàng: đổi tài nguyên (kiếm được khi chơi) lấy đồ mới. Mọi thay đổi tự lưu.
const { AssetLoader } = M.AssetLoader;
const { CameraControls } = M.CameraControls;
const { LayeredAvatar, validLook, lookAssetIds } = M.LayeredAvatar;
const { Store, IslandObj } = M.Store;
const { Audio } = M.Audio;
const { Hud, costHtml, resIcon } = M.Hud;
const { Ui } = M.Ui;
const { SHOP, SHOP_GROUPS, shopItem, PLOT_ASSETS, PLOT_GROW_MS, PLOT_HARVEST, ACHIEVEMENTS, PET_LINES, RES_NAMES, pick } = M.Content;
const { preloadWithProgress } = M.BootScene;
const PET_IDS = ['fox', 'bunny', 'bear'];
const SNAP = 16;
const FIXED = new Set(['island-building-house-main']);   // nhà chính không cất đi được

// ── lưới đi lại: bé tìm đường vòng qua nhà, cây, đá, hồ… (A* trên ô NAV px) ──
const NAV = 16;
const BODY = { rx: 12, ry: 7 };   // nửa bề ngang / bề sâu chân bé
// đồ thấp, bé bước qua được
const WALK_THROUGH = /grass|flower-(pink|yellow|lavender|white|tulip|blue)$|mushroom-(red|brown)|lilypad|fence-gate|bridge|picnic|pet-bed|starfish|shell/;
/** Vùng chân đồ vật trên mặt đất (elip), null = đi qua được. */
function footprint(o     )                                                            {
  const id = o.getData('asset'); const e      = AssetLoader.entry(id);
  if (!e || WALK_THROUGH.test(id)) return null;
  const tags           = e.tags || [];
  const [ww, wh] = e.worldSize || [o.displayWidth, o.displayHeight];
  const fpH = (e.footprint?.[1] || 1) * 64;
  if (e.layer === 'ground' || tags.includes('ground')) {
    if (!tags.includes('water')) return null;
    // hồ, sông: lấy giữa hình
    const cy = o.y - (o.originY - 0.5) * o.displayHeight;
    return { cx: o.x, cy, rx: ww * 0.42, ry: wh * 0.36 };
  }
  if (tags.includes('tree')) {
    const big = tags.includes('large');
    return { cx: o.x, cy: o.y - (big ? 22 : 8), rx: big ? 80 : 22, ry: big ? 34 : 11 };
  }
  if (id === 'island-deco-fence-v') return { cx: o.x, cy: o.y - wh * 0.38, rx: 12, ry: wh * 0.4 };
  if (tags.includes('building')) {
    const ry = Math.min(fpH * 0.34, wh * 0.3);
    return { cx: o.x, cy: o.y - ry * 0.85, rx: ww * 0.44, ry };
  }
  const ry = Math.max(9, Math.min(wh * 0.28, fpH * 0.3));
  return { cx: o.x, cy: o.y - ry * 0.6, rx: Math.max(14, ww * 0.42), ry };
}
const BLOOMS = ['island-plant-flower-pink', 'island-plant-flower-yellow', 'island-plant-flower-lavender', 'island-plant-flower-tulip'];

class IslandScene extends Phaser.Scene {
  L     ; controls     ; walk     ; grid     ; avatar     ; pet     ; petId = 'fox';
  objs        = [];
  mode                  = 'play';
  selected      = null; selRing     ; placing                = null; ghost      = null;
  target                                                     = null;
  facing = 'down'; running = false; petBusy = false; dragFrom                                  = null; tapMarker     ;
  plotTimer = 0; shopGroup = 'plant';
  path                             = [];
  navW = 0; navH = 0; land                    = null; blocked                    = null;

  constructor() { super('Island'); }

  preload() {
    preloadWithProgress(this, () => {
      const pets = AssetLoader.data('pets') || {};
      const ids = [...lookAssetIds(validLook(Store.p?.look)), ...PET_IDS.map((p) => pets[p]?.sheet),
        ...Object.keys(PLOT_HARVEST).map((r) => 'reward-' + r)];   // icon bay lên khi thu hoạch
      return AssetLoader.queueCategories(this, ['island', 'environment']) + AssetLoader.queueIds(this, ids);
    }, 'Đang về đảo của bé…');
  }

  create() {
    if (Ui.stale(this)) return;
    Ui.setActiveTab('Island');
    Hud.show(true);
    AssetLoader.createAnimations(this);
    const L = this.L = AssetLoader.data('island');
    const P = Store.p ;
    this.petId = P.pet;
    this.objs = []; this.mode = 'play'; this.placing = null; this.selected = null;
    this.cameras.main.setBackgroundColor('#5ab4e0');

    this.add.image(0, 0, L.terrain).setOrigin(0, 0).setDisplaySize(L.width, L.height).setDepth(-10);
    if (L.gridOverlay && this.textures.exists(L.gridOverlay)) {
      this.grid = this.add.image(0, 0, L.gridOverlay).setOrigin(0, 0).setDisplaySize(L.width, L.height).setDepth(-5).setVisible(false);
    }
    this.walk = new Phaser.Geom.Polygon(L.walkArea.flat());
    this.buildLand();

    // bố cục đã lưu, hoặc bố cục ban đầu (luống đất đang lớn sẵn cho bé thấy ngay)
    let objs              = P.island               ;
    if (!objs) {
      const now = Date.now();
      objs = L.objects.map((o     ) => {
        const r            = { a: o.asset, x: o.x, y: o.y, f: !!o.flipX };
        if (o.asset === 'island-terrain-plot-sprout') { r.a = 'island-terrain-plot-empty'; r.seed = now - 20_000; }
        if (o.asset === 'island-terrain-plot-growing') { r.a = 'island-terrain-plot-empty'; r.seed = now - PLOT_GROW_MS[2] + 15_000; }
        return r;
      });
    }
    for (const o of objs) this.addObject(o.a, o.x, o.y, !!o.f, o.seed);
    this.buildNav();

    this.selRing = this.add.graphics().setDepth(-1);
    this.tapMarker = this.add.graphics().setDepth(-2);

    const [ax, ay] = L.spawn.avatar;
    this.avatar = new LayeredAvatar(this, ax, ay, validLook(P.look));
    this.avatar.container.setSize(60, 90);
    this.avatar.container.setInteractive(new Phaser.Geom.Rectangle(-30, -84, 60, 88), Phaser.Geom.Rectangle.Contains);
    this.avatar.container.on('pointerup', () => {
      if (this.mode !== 'play' || this.controls.dragging) return;
      this.target = null; this.path = [];
      Audio.sfx('pop');
      this.avatar.play('wave', true, () => this.avatar.play('idle-down'));
    });
    this.spawnPet(this.petId);

    this.controls = new CameraControls(this, {
      width: L.width, height: L.height, maxZoom: 3.5,
      onTap: (_p, x, y) => this.tap(x, y),
      onHover: (x, y) => this.moveGhost(x, y),
    });
    this.cameras.main.setZoom(this.controls.minZoom * (this.scale.width > this.scale.height ? 1.35 : 1));
    this.cameras.main.centerOn(ax, ay - 120);

    this.input.on('gameobjectdown', (_p     , obj     ) => {
      if (this.mode !== 'edit' || !obj.getData('placed') || this.placing) return;
      this.controls.locked = true;
      this.select(obj);
      this.dragFrom = { x: obj.x, y: obj.y };
    });
    this.input.on('drag', (_p     , obj     , dx        , dy        ) => {
      if (this.mode !== 'edit' || !obj.getData('placed')) return;
      obj.setPosition(Math.round(dx / SNAP) * SNAP, Math.round(dy / SNAP) * SNAP);
      obj.setDepth(this.depthOf(obj));
      obj.setTint(this.inside(obj.x, obj.y) ? 0xffffff : 0xff9b9b);
      this.syncBloom(obj);
      this.drawSelection();
    });
    this.input.on('dragend', (_p     , obj     ) => {
      obj.clearTint();
      if (!this.inside(obj.x, obj.y) && this.dragFrom) {
        this.tweens.add({ targets: obj, x: this.dragFrom.x, y: this.dragFrom.y, duration: 220, ease: 'Back.easeOut', onUpdate: () => { this.drawSelection(); this.syncBloom(obj); }, onComplete: () => { obj.setDepth(this.depthOf(obj)); this.syncBloom(obj); } });
        Ui.toast('Chỉ đặt được trên đất của đảo');
      } else { this.bounce(obj); Audio.sfx('place'); this.save(); }
    });
    this.input.on('pointerup', () => { setTimeout(() => { if (this.controls) this.controls.locked = false; }, 0); });

    this.buildPanel();
    this.refreshPlots();
    this.events.once('shutdown', () => { Ui.clearPanel(); Ui.card(null); this.petDock(null); });   // không lưu ở đây: lúc tắt scene đồ vật đã bị huỷ

    if (!P.seenIntro) {
      P.seenIntro = true; Store.commit();
      const pets = AssetLoader.data('pets') || {};
      this.time.delayedCall(600, () => Hud.say(`Chào ${P.name}! Mình là ${pets[this.petId]?.name || 'bạn đồng hành'}. Đây là đảo của chúng mình!`));
      this.time.delayedCall(5200, () => Hud.say('Mở Bản đồ để chơi trò chơi, nhận sao và đồ xây đảo nhé!'));
    } else this.time.delayedCall(500, () => Hud.say(pick([...PET_LINES.hello, ...PET_LINES.island])));
  }

  // ───────────── đồ vật ─────────────
  depthOf(o     ) { const a = o.getData('asset'); const e = AssetLoader.entry(a); return (e?.tags || []).includes('ground') || PLOT_ASSETS.includes(a) ? -3 + o.y / 10000 : o.y; }

  addObject(asset        , x        , y        , flipX = false, seed         ) {
    if (!this.textures.exists(asset)) return null;
    const s = AssetLoader.sprite(this, asset, x, y);
    s.setFlipX(flipX);
    s.setData('placed', true).setData('asset', asset);
    if (seed) s.setData('seed', seed);
    s.setDepth(this.depthOf(s));
    s.setInteractive({ pixelPerfect: true, alphaTolerance: 40, draggable: false, useHandCursor: false });
    if (this.mode === 'edit') this.input.setDraggable(s, true);
    this.objs.push(s);
    return s;
  }

  save() {
    Store.setIsland(this.objs.filter((o) => o.active).map((o) => {
      const r            = { a: o.getData('asset'), x: Math.round(o.x), y: Math.round(o.y) };
      if (o.flipX) r.f = true;
      if (o.getData('seed')) r.seed = o.getData('seed');
      return r;
    }));
  }

  inside(x        , y        ) { return Phaser.Geom.Polygon.Contains(this.walk, x, y); }
  bounce(obj     ) {
    const sy = obj.scaleY;
    this.tweens.add({ targets: obj, scaleY: sy * 0.9, duration: 90, yoyo: true, ease: 'Quad.easeOut', onComplete: () => obj.setScale(obj.scaleX, sy) });
  }

  // ───────────── luống đất ─────────────
  isPlot(o     ) { return PLOT_ASSETS.includes(o.getData('asset')); }
  plotStage(o     )         {
    const seed = o.getData('seed'); if (!seed) return 0;
    const t = Date.now() - seed;
    return t >= PLOT_GROW_MS[2] ? 3 : t >= PLOT_GROW_MS[1] ? 2 : 1;
  }
  refreshPlots() {
    for (const o of this.objs) if (o.active && this.isPlot(o)) {
      const st = this.plotStage(o);
      const want = st === 0 ? 'island-terrain-plot-empty' : st === 1 ? 'island-terrain-plot-sprout' : 'island-terrain-plot-growing';
      if (o.texture.key !== want && this.textures.exists(want)) { o.setTexture(want); o.setData('asset', 'island-terrain-plot-empty'); }
      const ready = st === 3;
      if (ready && !o.getData('bloom')) {
        const bloom = BLOOMS.slice(0, 3).map((k, i) => this.add.image(0, 0, k).setScale(0.42).setOrigin(0.5, 0.9));
        const spark = this.textures.exists('world-ui-unlocked-sparkle') ? this.add.image(0, 0, 'world-ui-unlocked-sparkle').setScale(0.22) : null;
        if (spark) this.tweens.add({ targets: spark, scale: 0.28, angle: 20, duration: 700, yoyo: true, repeat: -1 });
        o.setData('bloom', { flowers: bloom, spark });
        this.syncBloom(o);
      } else if (!ready && o.getData('bloom')) {
        const b = o.getData('bloom'); b.flowers.forEach((f     ) => f.destroy()); b.spark?.destroy(); o.setData('bloom', null);
      }
    }
  }
  syncBloom(o     ) {
    const b = o.getData('bloom'); if (!b) return;
    b.flowers.forEach((f     , i        ) => f.setPosition(o.x + (i - 1) * 42, o.y - 6 + (i % 2) * 8).setDepth(o.y + 1 + i));
    b.spark?.setPosition(o.x, o.y - 80).setDepth(o.y + 10);
  }
  tapPlot(o     ) {
    const st = this.plotStage(o);
    if (st === 0) {
      if (!Store.pay({ seed: 1 })) { Hud.say('Mình hết hạt giống rồi. Chơi ở Đảo Động Vật để nhận thêm nhé!'); return; }
      o.setData('seed', Date.now());
      Audio.sfx('plant'); Hud.bump('seed'); Hud.render();
      Hud.say('Gieo hạt rồi! Chờ một chút, hoa sẽ nở nhé.');
    } else if (st === 3) {
      o.setData('seed', null);
      Store.give(PLOT_HARVEST); Store.count('harvest');
      const got = Store.checkAchievements(); Store.commit();
      Audio.sfx('reward');
      for (const k of Object.keys(PLOT_HARVEST)) Hud.bump(k);
      Hud.render();
      Hud.say(`Thu hoạch được ${PLOT_HARVEST.flower} bông hoa và ${PLOT_HARVEST.seed} hạt giống!`);
      this.achToast(got);
      this.flyIcons(o.x, o.y - 40, PLOT_HARVEST       );
    } else {
      Hud.say(st === 1 ? 'Mầm non đang lớn! Hoa sẽ nở sớm thôi.' : 'Sắp nở rồi! Chờ thêm chút xíu nhé.');
    }
    this.bounce(o);
    this.refreshPlots();
    this.save();
  }

  flyIcons(x        , y        , r                        ) {
    let i = 0;
    for (const [k, v] of Object.entries(r)) for (let n = 0; n < v; n++) {
      const key = 'reward-' + k;
      if (!this.textures.exists(key)) { AssetLoader.loadNow(this, [key], () => {}); continue; }
      const s = this.add.image(x, y, key).setScale(0.4).setDepth(99990);
      this.tweens.add({ targets: s, y: y - 120 - Math.random() * 40, x: x + (i++ - 2) * 30, alpha: 0, duration: 900, ease: 'Cubic.easeOut', onComplete: () => s.destroy() });
    }
  }

  achToast(ids          ) {
    ids.forEach((id, i) => {
      const a = ACHIEVEMENTS.find((x) => x.id === id); if (!a) return;
      this.time.delayedCall(900 + i * 2200, () => { Audio.sfx('unlock'); Ui.toast(`Huy hiệu mới: ${a.name}!`, 2600); });
    });
  }

  // ───────────── chọn & sửa ─────────────
  select(obj     ) {
    this.selected = obj;
    this.drawSelection();
    if (!obj) { Ui.card(null); return; }
    const asset = obj.getData('asset');
    const name = shopItem(asset)?.name || AssetLoader.entry(asset)?.usage || asset;
    const fixed = FIXED.has(asset);
    const el = Ui.card(`
      <div class="card-head" style="--c:#a6e3c4"><img class="card-icon sq" src="${AssetLoader.url(asset)}" alt="">
      <div><h3>${Ui.esc(name)}</h3><p>Kéo để di chuyển</p></div></div>
      <div class="row">
        <button class="btn" data-a="flip">Lật</button>
        ${fixed ? '' : '<button class="btn danger" data-a="store">Cất vào túi</button>'}
        <button class="btn ghost" data-a="close">Xong</button>
      </div>`);
    el.onclick = (ev     ) => {
      const a = ev.target.closest('button')?.dataset.a;
      if (!a || !this.selected) return;
      Audio.sfx('tap');
      const o = this.selected;
      if (a === 'flip') { o.setFlipX(!o.flipX); this.bounce(o); this.save(); }
      else if (a === 'store') {
        this.objs = this.objs.filter((x) => x !== o);
        const b = o.getData('bloom'); if (b) { b.flowers.forEach((f     ) => f.destroy()); b.spark?.destroy(); }
        Store.addItem(asset);
        this.tweens.add({ targets: o, alpha: 0, scale: o.scale * 0.6, duration: 200, onComplete: () => o.destroy() });
        this.select(null);
        this.save(); this.buildPanel();
      } else if (a === 'close') this.select(null);
    };
  }

  drawSelection() {
    const g = this.selRing; g.clear();
    const o = this.selected;
    if (!o || !o.active) return;
    const w = Math.max(40, o.displayWidth * 0.55);
    g.lineStyle(6, 0xffffff, 0.95).strokeEllipse(o.x, o.y, w, w * 0.36);
    g.lineStyle(3, 0xffac6b, 1).strokeEllipse(o.x, o.y, w + 10, w * 0.36 + 6);
  }

  setMode(m                 ) {
    this.mode = m;
    this.buildNav();
    this.setPlacing(null);
    this.select(null);
    for (const o of this.objs) this.input.setDraggable(o, m === 'edit');
    if (this.grid) this.grid.setVisible(m === 'edit');
    this.buildPanel();
    if (m === 'edit') Hud.say(Object.keys(Store.p .items).length ? 'Chọn đồ trong túi rồi chạm lên đảo để đặt nhé!' : 'Túi đang trống. Bấm "Cửa hàng" để đổi đồ mới nhé!');
  }

  setPlacing(id               ) {
    this.placing = id;
    if (this.ghost) { this.ghost.destroy(); this.ghost = null; }
    if (id) {
      this.select(null);
      this.ghost = AssetLoader.image(this, id, -999, -999).setAlpha(0.65).setDepth(99999);
      const p = this.input.activePointer;
      const w = this.cameras.main.getWorldPoint(p.x, p.y);
      this.moveGhost(w.x, w.y);
    }
    document.querySelectorAll             ('.palette button').forEach((b) => b.classList.toggle('on', b.dataset.id === id));
  }

  moveGhost(x        , y        ) {
    if (!this.ghost) return;
    const sx = Math.round(x / SNAP) * SNAP, sy = Math.round(y / SNAP) * SNAP;
    this.ghost.setPosition(sx, sy);
    this.ghost.setTint(this.inside(sx, sy) ? 0xffffff : 0xff8f8f);
  }

  tap(x        , y        ) {
    if (this.mode === 'edit') {
      if (this.placing) {
        const sx = Math.round(x / SNAP) * SNAP, sy = Math.round(y / SNAP) * SNAP;
        if (!this.inside(sx, sy)) { Ui.toast('Chỉ đặt được trên đất của đảo'); return; }
        const id = this.placing;
        const P = Store.p ;
        if (!P.items[id]) { this.setPlacing(null); return; }
        const o = this.addObject(id, sx, sy);
        if (o) {
          this.bounce(o); Audio.sfx('place');
          Store.addItem(id, -1); Store.count('placed');
          const got = Store.checkAchievements(); Store.commit();
          this.achToast(got);
          this.save();
          if (!P.items[id]) this.setPlacing(null);
          this.buildPanel();
        }
        return;
      }
      const hit = this.input.hitTestPointer(this.input.activePointer).filter((o     ) => o.getData && o.getData('placed'));
      if (!hit.length) this.select(null);
      return;
    }
    // dạo chơi: chạm luống đất → đi tới rồi gieo / thu hoạch
    const hits = this.input.hitTestPointer(this.input.activePointer).filter((o     ) => o.getData && o.getData('placed'));
    const plot = hits.find((o     ) => this.isPlot(o)) || this.objs.find((o) => o.active && this.isPlot(o) && Math.abs(o.x - x) < 75 && Math.abs(o.y - y) < 45);
    if (plot) {
      this.walkTo(plot.x - 90, plot.y + 10, () => { this.facing = 'side'; this.avatar.setFlip(false); this.avatar.play('interact', true, () => this.avatar.play('idle-side')); this.tapPlot(plot); });
      return;
    }
    if (!this.inside(x, y)) { Ui.toast('Bé không bơi được đâu!'); return; }
    this.walkTo(x, y);
  }

  walkTo(x        , y        , then             ) {
    this.buildNav();
    const route = this.findPath(this.avatar.x, this.avatar.y, x, y);
    if (!route) { then?.(); return; }
    const end = route[route.length - 1];
    // chạm vào chỗ không tới được (giữa nhà, giữa hồ) → đi tới chỗ gần nhất; việc "then" vẫn làm khi tới nơi
    this.path = route;
    this.target = { x: end.x, y: end.y, then };
    let d = 0, px = this.avatar.x, py = this.avatar.y;
    for (const p of route) { d += Math.hypot(p.x - px, p.y - py); px = p.x; py = p.y; }
    this.running = d > 340;
    this.tapMarker.clear();
    this.tapMarker.lineStyle(5, 0xffffff, 0.9).strokeEllipse(end.x, end.y, 46, 18);
    this.tapMarker.setAlpha(1);
    this.tweens.killTweensOf(this.tapMarker);
    this.tweens.add({ targets: this.tapMarker, alpha: 0, duration: 700, delay: 150 });
  }

  // ───────────── tìm đường ─────────────
  /** Ô thuộc đất liền (trong walkArea) — tính một lần. */
  buildLand() {
    const L = this.L;
    this.navW = Math.ceil(L.width / NAV); this.navH = Math.ceil(L.height / NAV);
    const land = this.land = new Uint8Array(this.navW * this.navH);
    for (let j = 0; j < this.navH; j++) for (let i = 0; i < this.navW; i++) {
      land[j * this.navW + i] = this.inside((i + 0.5) * NAV, (j + 0.5) * NAV) ? 1 : 0;
    }
  }
  /** Ô bị chặn = ngoài đất liền hoặc nằm dưới chân đồ vật. Dựng lại mỗi lần đi (đồ có thể vừa được dời). */
  buildNav() {
    const W = this.navW, H = this.navH;
    const b = this.blocked = new Uint8Array(W * H);
    for (let k = 0; k < b.length; k++) b[k] = this.land [k] ? 0 : 1;
    for (const o of this.objs) {
      if (!o.active) continue;
      const f = footprint(o); if (!f) continue;
      const rx = f.rx + BODY.rx, ry = f.ry + BODY.ry;
      const i0 = Math.max(0, Math.floor((f.cx - rx) / NAV)), i1 = Math.min(W - 1, Math.floor((f.cx + rx) / NAV));
      const j0 = Math.max(0, Math.floor((f.cy - ry) / NAV)), j1 = Math.min(H - 1, Math.floor((f.cy + ry) / NAV));
      for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
        const dx = ((i + 0.5) * NAV - f.cx) / rx, dy = ((j + 0.5) * NAV - f.cy) / ry;
        if (dx * dx + dy * dy <= 1) b[j * W + i] = 1;
      }
    }
  }
  isBlocked(x        , y        ) {
    if (!this.blocked) return false;
    const i = Math.floor(x / NAV), j = Math.floor(y / NAV);
    if (i < 0 || j < 0 || i >= this.navW || j >= this.navH) return true;
    return this.blocked[j * this.navW + i] === 1;
  }
  /** Ô trống gần nhất (tìm loang). */
  nearestFree(c        )         {
    const b = this.blocked , W = this.navW;
    if (!b[c]) return c;
    const seen = new Uint8Array(b.length); const q = [c]; seen[c] = 1;
    for (let h = 0; h < q.length && h < 20000; h++) {
      const k = q[h]; if (!b[k]) return k;
      const i = k % W, j = (k / W) | 0;
      for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const ni = i + di, nj = j + dj;
        if (ni < 0 || nj < 0 || ni >= W || nj >= this.navH) continue;
        const n = nj * W + ni; if (!seen[n]) { seen[n] = 1; q.push(n); }
      }
    }
    return -1;
  }
  /** Đường đi (đã làm mượt) từ (sx,sy) tới gần (tx,ty) nhất có thể. null nếu đứng yên. */
  findPath(sx        , sy        , tx        , ty        )                                    {
    const W = this.navW, H = this.navH, b = this.blocked ;
    const cell = (x        , y        ) => Math.min(H - 1, Math.max(0, Math.floor(y / NAV))) * W + Math.min(W - 1, Math.max(0, Math.floor(x / NAV)));
    const startRaw = cell(sx, sy);
    const start = this.nearestFree(startRaw);
    let goal = this.nearestFree(cell(tx, ty));
    if (start < 0 || goal < 0) return null;
    const exact = goal === cell(tx, ty);
    const gx = goal % W, gy = (goal / W) | 0;
    const hf = (k        ) => { const dx = Math.abs(k % W - gx), dy = Math.abs(((k / W) | 0) - gy); return Math.max(dx, dy) + 0.414 * Math.min(dx, dy); };
    // A* với hàng đợi ưu tiên (heap nhị phân)
    const g = new Float32Array(W * H).fill(Infinity), from = new Int32Array(W * H).fill(-1), closed = new Uint8Array(W * H);
    const heap                     = [];
    const push = (f        , k        ) => { heap.push([f, k]); let i = heap.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (heap[p][0] <= heap[i][0]) break; [heap[p], heap[i]] = [heap[i], heap[p]]; i = p; } };
    const pop = () => { const top = heap[0]; const last = heap.pop() ; if (heap.length) { heap[0] = last; let i = 0; for (;;) { const l = i * 2 + 1, r = l + 1; let m = i; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === i) break; [heap[m], heap[i]] = [heap[i], heap[m]]; i = m; } } return top; };
    g[start] = 0; push(hf(start), start);
    let best = start, bestH = hf(start);
    while (heap.length) {
      const [, k] = pop();
      if (closed[k]) continue; closed[k] = 1;
      const h = hf(k); if (h < bestH) { bestH = h; best = k; }
      if (k === goal) { best = k; break; }
      const i = k % W, j = (k / W) | 0;
      for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
        if (!di && !dj) continue;
        const ni = i + di, nj = j + dj;
        if (ni < 0 || nj < 0 || ni >= W || nj >= H) continue;
        const n = nj * W + ni; if (b[n] || closed[n]) continue;
        if (di && dj && (b[j * W + ni] || b[nj * W + i])) continue;   // không cắt góc
        const ng = g[k] + (di && dj ? 1.414 : 1);
        if (ng < g[n]) { g[n] = ng; from[n] = k; push(ng + hf(n), n); }
      }
    }
    const cells           = [];
    for (let k = best; k >= 0; k = from[k]) cells.push(k);
    cells.reverse();
    const pts = cells.map((k) => ({ x: (k % W + 0.5) * NAV, y: (((k / W) | 0) + 0.5) * NAV }));
    if (best === goal && exact) pts[pts.length - 1] = { x: tx, y: ty };
    if (startRaw === start) pts[0] = { x: sx, y: sy };
    // làm mượt: bỏ điểm giữa nếu nhìn thẳng thấy điểm sau
    const out                             = [];
    let a = 0;
    while (a < pts.length - 1) {
      let c = pts.length - 1;
      while (c > a + 1 && !this.clear(pts[a], pts[c])) c--;
      out.push(pts[c]); a = c;
    }
    return out.length ? out : null;
  }
  /** Đoạn thẳng a→b không đi qua ô bị chặn. */
  clear(a                          , b                          ) {
    const d = Math.hypot(b.x - a.x, b.y - a.y), n = Math.ceil(d / (NAV / 3));
    for (let s = 1; s < n; s++) {
      const t = s / n, x = a.x + (b.x - a.x) * t, y = a.y + (b.y - a.y) * t;
      if (this.isBlocked(x, y) || this.isBlocked(x + BODY.rx * 0.5, y) || this.isBlocked(x - BODY.rx * 0.5, y)) return false;
    }
    return true;
  }

  // ───────────── thú cưng ─────────────
  spawnPet(id        ) {
    const pets = AssetLoader.data('pets') || {};
    const P = pets[id];
    if (!P || !this.textures.exists(P.sheet)) return;
    const pos = this.pet ? { x: this.pet.x, y: this.pet.y } : { x: this.L.spawn.pet[0], y: this.L.spawn.pet[1] };
    if (this.pet) this.pet.destroy();
    this.petId = id;
    const s = this.pet = this.add.sprite(pos.x, pos.y, P.sheet);
    s.setOrigin(...(P.origin || [0.5, 0.92])).setScale(P.scale ?? 0.5);
    this.petPlay('greet', () => this.petPlay('idle-front'));
    s.setInteractive({ pixelPerfect: true, alphaTolerance: 40 });
    s.on('pointerup', () => {
      if (this.mode !== 'play' || this.controls.dragging) return;
      Audio.sfx('bloop');
      this.petPlay(Math.random() < 0.5 ? 'interact' : 'happy', () => this.petPlay('idle-front'));
      Hud.say(pick([...PET_LINES.island, ...PET_LINES.hello]));
    });
  }

  petPlay(anim        , done             ) {
    const key = `${this.petId}-${anim}`;
    if (!this.pet || !this.anims.exists(key)) return;
    if (done) {
      this.petBusy = true;
      this.pet.play(key);
      this.pet.once('animationcomplete', () => { this.petBusy = false; done(); });
    } else if (this.pet.anims.currentAnim?.key !== key) this.pet.play(key);
  }

  /** Chọn bạn đồng hành: góc dưới bên phải, tách khỏi bảng điều khiển để bớt che đảo. */
  petDock(html               ) {
    let el = document.getElementById('pet-dock');
    if (!html) { el?.remove(); return; }
    if (!el) { el = document.createElement('div'); el.id = 'pet-dock'; el.className = 'pet-dock'; document.body.appendChild(el); }
    el.innerHTML = html;
    el.onclick = (e     ) => {
      const b = e.target.closest('button[data-pet]'); if (!b) return;
      Audio.sfx('tap');
      if (b.dataset.pet === this.petId) return;
      const pets = AssetLoader.data('pets') || {};
      Store.setPet(b.dataset.pet); this.spawnPet(b.dataset.pet); this.buildPanel();
      Hud.say(`Chào bạn! Mình là ${pets[b.dataset.pet]?.name}. Cùng chơi nhé!`);
      this.achToast(Object.keys(Store.p .ach).filter((k) => k === 'new-pet-friend' && Date.now() - Store.p .ach[k] < 2000));
    };
  }

  // ───────────── bảng điều khiển ─────────────
  buildPanel() {
    const P = Store.p ;
    const pets = AssetLoader.data('pets') || {};
    const petBtns = PET_IDS.filter((p) => pets[p]).map((p) =>
      `<button class="pet ${p === this.petId ? 'on' : ''}" data-pet="${p}" title="${Ui.esc(pets[p].name || p)}"><img src="${AssetLoader.url(`${p}-portrait`)}" alt=""><span>${Ui.esc(pets[p].name || p)}</span></button>`).join('');
    const inv = Object.entries(P.items).filter(([id, n]) => n > 0 && AssetLoader.entry(id));
    const palette = this.mode === 'edit'
      ? `<h4>Túi đồ <button class="btn small accent" data-a="shop">Cửa hàng</button></h4>
        ${inv.length ? `<div class="palette">${inv.map(([id, n]) =>
          `<button data-id="${id}" class="${id === this.placing ? 'on' : ''}" title="${Ui.esc(shopItem(id)?.name || id)}"><img src="${AssetLoader.url(id)}" alt=""><i>${n}</i></button>`).join('')}</div>
        <p class="hint">Chọn đồ rồi chạm lên đảo để đặt · kéo đồ trên đảo để di chuyển</p>`
          : '<p class="hint">Túi đang trống — vào Cửa hàng đổi đồ bằng sao, hạt giống, gỗ, đá… kiếm được khi chơi.</p>'}`
      : '';
    const el = Ui.panel(`
      <div class="row">
        <div class="seg"><button data-m="play" class="${this.mode === 'play' ? 'on' : ''}">Dạo chơi</button><button data-m="edit" class="${this.mode === 'edit' ? 'on' : ''}">Trang trí</button></div>
        <button class="btn" data-a="ach">Huy hiệu</button>
        <button class="btn accent" data-a="map">Đi chơi</button>
      </div>
      ${palette}`, 'island-panel');
    this.petDock(this.mode === 'play' ? petBtns : null);
    el.onclick = (e     ) => {
      const b = e.target.closest('button'); if (!b) return;
      Audio.sfx('tap');
      if (b.dataset.m) this.setMode(b.dataset.m);
      else if (b.dataset.id) this.setPlacing(this.placing === b.dataset.id ? null : b.dataset.id);
      else if (b.dataset.a === 'map') location.hash = 'map';
      else if (b.dataset.a === 'shop') this.openShop();
      else if (b.dataset.a === 'ach') this.openAchievements();
    };
  }

  openShop() {
    const P = Store.p ;
    const items = SHOP.filter((s) => s.group === this.shopGroup && AssetLoader.entry(s.asset));
    const el = Ui.modal(`
      <div class="shop">
        <h2>Cửa hàng của đảo</h2>
        <div class="shop-res">${Object.entries(P.res).map(([k, v]) => `<span><img src="${resIcon(k)}" alt="">${v} ${RES_NAMES[k                          ]}</span>`).join('')}</div>
        <div class="seg wide">${SHOP_GROUPS.map(([g, n]) => `<button data-g="${g}" class="${g === this.shopGroup ? 'on' : ''}">${n}</button>`).join('')}</div>
        <div class="shop-grid">${items.map((s) => {
          const ok = Store.has(s.cost);
          return `<button class="shop-item ${ok ? '' : 'cant'}" data-buy="${s.asset}"><img src="${AssetLoader.url(s.asset)}" alt=""><b>${Ui.esc(s.name)}</b>${costHtml(s.cost       )}${P.items[s.asset] ? `<i>Trong túi: ${P.items[s.asset]}</i>` : ''}</button>`;
        }).join('')}</div>
        <p class="hint">Mọi thứ đều đổi bằng phần thưởng bé tự kiếm khi chơi. Không có mua bằng tiền thật.</p>
      </div>`, { cls: 'modal-wide', onClose: () => this.buildPanel() });
    el.querySelector('.shop') .addEventListener('click', (e     ) => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.g) { Audio.sfx('tap'); this.shopGroup = b.dataset.g; this.openShop(); return; }
      if (b.dataset.buy) {
        const s = shopItem(b.dataset.buy) ;
        if (!Store.pay(s.cost)) {
          Audio.sfx('soft');
          const miss = Object.entries(s.cost).filter(([k, v]) => P.res[k                      ] < (v          )).map(([k, v]) => `${(v          ) - P.res[k                      ]} ${RES_NAMES[k                          ].toLowerCase()}`).join(', ');
          Ui.toast(`Cần thêm ${miss}`, 2200);
          return;
        }
        Audio.sfx('reward');
        Store.addItem(s.asset);
        Hud.render();
        Ui.toast(`Đã cho ${s.name} vào túi!`);
        this.openShop();
      }
    });
  }

  openAchievements() {
    const P = Store.p ;
    const got = ACHIEVEMENTS.filter((a) => P.ach[a.id]).length;
    Ui.modal(`
      <div class="achv">
        <h2>Huy hiệu của ${Ui.esc(P.name)} <small>${got}/${ACHIEVEMENTS.length}</small></h2>
        <div class="ach-grid">${ACHIEVEMENTS.map((a) => `<div class="ach-card ${P.ach[a.id] ? 'on' : ''}"><img src="${AssetLoader.url(a.icon)}" alt=""><b>${Ui.esc(a.name)}</b><span>${Ui.esc(a.desc)}</span></div>`).join('')}</div>
      </div>`, { cls: 'modal-wide' });
  }

  // ───────────── vòng lặp ─────────────
  update(_t        , dt        ) {
    if (!this.avatar) return;
    this.plotTimer += dt;
    if (this.plotTimer > 1000) { this.plotTimer = 0; this.refreshPlots(); }
    const A = this.avatar;
    if (this.target) {
      const wp = this.path[0] || this.target;
      const dx = wp.x - A.x, dy = wp.y - A.y;
      const d = Math.hypot(dx, dy);
      const speed = (this.running ? 250 : 140) * dt / 1000;
      if (d <= speed && this.path.length > 1) {
        A.setPosition(wp.x, wp.y);
        this.path.shift();
      } else if (d <= speed) {
        this.path = [];
        A.setPosition(this.target.x, this.target.y);
        const then = this.target.then;
        this.target = null;
        A.play(`idle-${this.facing}`);
        if (then) then();
        else if (!this.petBusy && Math.random() < 0.35) this.petPlay('happy', () => this.petPlay('idle-front'));
      } else {
        A.setPosition(A.x + dx / d * speed, A.y + dy / d * speed);
        if (Math.abs(dx) > Math.abs(dy) * 1.1) { this.facing = 'side'; A.setFlip(dx < 0); }
        else this.facing = dy > 0 ? 'down' : 'up';
        A.play(`${this.running ? 'run' : 'walk'}-${this.facing}`);
      }
    }
    A.container.setDepth(A.y);
    A.update(dt);

    const P = this.pet;
    if (P) {
      const side = A.flip ? 1 : -1;
      const off = this.facing === 'side' ? { x: side * 70, y: 6 } : this.facing === 'up' ? { x: 46, y: 46 } : { x: 56, y: -18 };
      const tx = A.x + off.x, ty = A.y + off.y;
      const dx = tx - P.x, dy = ty - P.y, d = Math.hypot(dx, dy);
      if (d > 24) {
        const sp = Math.min(d, (d > 120 ? 280 : 150) * dt / 1000);
        const nx = P.x + dx / d * sp, ny = P.y + dy / d * sp;
        // trượt dọc theo vật cản; kẹt cả hai phía (đứng sau nhà) thì cứ đi để không bị bỏ lại
        if (!this.isBlocked(nx, ny) || this.isBlocked(P.x, P.y)) { P.x = nx; P.y = ny; }
