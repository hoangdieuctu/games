        else if (!this.isBlocked(nx, P.y)) P.x = nx;
        else if (!this.isBlocked(P.x, ny)) P.y = ny;
        else if (d > 160) { P.x = nx; P.y = ny; }
        this.petBusy = false;
        if (Math.abs(dx) > Math.abs(dy)) { this.petPlay('walk-side'); P.setFlipX(dx < 0); }
        else { this.petPlay(dy > 0 ? 'walk-front' : 'walk-back'); P.setFlipX(false); }
      } else if (!this.petBusy) {
        const cur = P.anims.currentAnim?.key || '';
        if (/walk-side/.test(cur)) this.petPlay('idle-side');
        else if (/walk/.test(cur)) this.petPlay('idle-front');
      }
      P.setDepth(P.y);
    }
  }
}
return { IslandScene };
})();

/* ══════════ scenes/WardrobeScene.ts ══════════ */
M.WardrobeScene = (function () {
// ── Tủ đồ: tuỳ biến bé (tóc, da, quần áo, phụ kiện) và chọn bạn đồng hành ──
// Diện mạo lưu vào hồ sơ bé, dùng trên đảo và bản đồ.
const { AssetLoader } = M.AssetLoader;
const { LayeredAvatar, avatarConfig, defaultLook, allAvatarAssetIds, AvatarLook, validLook } = M.LayeredAvatar;
const { Store } = M.Store;
const { Audio } = M.Audio;
const { Hud } = M.Hud;
const { Ui } = M.Ui;
const { preloadWithProgress } = M.BootScene;
const PET_IDS = ['fox', 'bunny', 'bear'];
const VIEWS                     = [['front', 'Trước'], ['threequarter', '3/4'], ['side', 'Bên'], ['back', 'Sau']];
const ANIM_NAMES                         = {
  'idle-down': 'Đứng (trước)', 'idle-up': 'Đứng (sau)', 'idle-side': 'Đứng (bên)', 'idle-threequarter': 'Đứng (3/4)',
  'walk-down': 'Đi (trước)', 'walk-up': 'Đi (sau)', 'walk-side': 'Đi (bên)',
  'run-down': 'Chạy (trước)', 'run-up': 'Chạy (sau)', 'run-side': 'Chạy (bên)',
  happy: 'Vui vẻ', celebrate: 'Ăn mừng', think: 'Suy nghĩ', wave: 'Vẫy tay', interact: 'Tương tác',
  'idle-front': 'Đứng (trước)', 'walk-front': 'Đi (trước)', 'walk-back': 'Đi (sau)', greet: 'Chào',
};
const COLOR_SLOTS                             = [['skin', 'Màu da', 'skin'], ['hair', 'Màu tóc', 'hair'], ['top', 'Màu áo', 'cloth'], ['bottom', 'Màu quần/váy', 'cloth'], ['shoes', 'Màu giày', 'shoes']];

class WardrobeScene extends Phaser.Scene {
  look             = null       ;
  hero     ;
  views        = [];
  pets                      = {};
  bg     ;
  tab                    = 'avatar';
  heroAnim = 'idle-down';
  petAnim                         = { fox: 'idle-front', bunny: 'idle-front', bear: 'idle-front' };
  labels        = [];

  constructor() { super('Wardrobe'); }

  preload() {
    preloadWithProgress(this, () => {
      const pets = AssetLoader.data('pets') || {};
      return AssetLoader.queueIds(this, [...allAvatarAssetIds(), ...PET_IDS.map((p) => pets[p]?.sheet)]);
    }, 'Đang mời các bạn nhỏ ra chào…');
  }

  create() {
    if (Ui.stale(this)) return;
    Ui.setActiveTab('Wardrobe');
    Hud.show(true);
    this.time.delayedCall(400, () => Hud.say('Bé muốn mặc gì hôm nay? Chạm các nút để đổi nhé!'));
    AssetLoader.createAnimations(this);
    this.cameras.main.setBackgroundColor('#fff3dc');
    this.bg = this.add.graphics().setDepth(-10);
    this.look = this.loadLook();

    this.hero = new LayeredAvatar(this, 0, 0, this.look);
    this.hero.play(this.heroAnim);
    for (const [v] of VIEWS) {
      const a = new LayeredAvatar(this, 0, 0, this.look);
      a.showView(v);
      this.views.push(a);
    }
    const pets = AssetLoader.data('pets') || {};
    for (const p of PET_IDS) {
      const P = pets[p];
      if (!P || !this.textures.exists(P.sheet)) continue;
      const s = this.add.sprite(0, 0, P.sheet).setOrigin(...(P.origin || [0.5, 0.92]));
      s.setInteractive({ pixelPerfect: true, alphaTolerance: 40, useHandCursor: true });
      s.on('pointerup', () => { Audio.sfx('bloop'); this.playPet(p, 'greet'); });
      this.pets[p] = s;
      this.playPet(p, 'idle-front');
    }
    this.hero.container.setSize(120, 180);

    this.layout();
    this.scale.on('resize', this.layout, this);
    this.events.once('shutdown', () => { this.scale.off('resize', this.layout, this); Ui.clearPanel(); });
    this.buildPanel();
  }

  // ───────────── diện mạo ─────────────
  loadLook()             { return validLook(Store.p?.look); }
  saveLook() { Store.setLook(this.look); }

  applyLook() {
    this.hero.setLook(this.look);
    for (let i = 0; i < this.views.length; i++) { this.views[i].setLook(this.look); this.views[i].showView(VIEWS[i][0]); }
    this.saveLook();
  }

  randomize() {
    const cfg = avatarConfig();
    const pick = (a       ) => a[Math.floor(Math.random() * a.length)];
    for (const L of cfg.layers) if (L.variants.length > 1) this.look.variants[L.slot] = pick(L.variants).id;
    if (hasHairPair(cfg)) this.look.variants.hairBack = matchingHairBack(cfg, this.look.variants.hairFront);
    for (const [k, , pal] of COLOR_SLOTS) this.look.colors[k] = pick(cfg.palettes[pal] || [this.look.colors[k]]);
    this.applyLook();
    this.hero.play('celebrate', true, () => this.hero.play(this.heroAnim));
    this.buildPanel();
  }

  playPet(p        , anim        ) {
    const s = this.pets[p]; if (!s) return;
    const key = `${p}-${anim}`;
    if (!this.anims.exists(key)) return;
    s.play(key);
    const def = this.anims.get(key);
    if (def && def.repeat !== -1) s.once('animationcomplete', () => s.play(`${p}-${this.petAnim[p]}`));
    else this.petAnim[p] = anim;
  }

  // ───────────── bố cục ─────────────
  layout() {
    const W = this.scale.width, H = this.scale.height;
    const panel = document.getElementById('panel');
    const pr = panel && !panel.hidden ? panel.getBoundingClientRect() : null;
    const dpr = W / window.innerWidth;
    const portrait = window.innerWidth < 760;
    // vùng trống cho sân khấu (đơn vị pixel game)
    const top = 64 * dpr;
    let areaW = W, areaH = H - top;
    if (pr) {
      if (portrait) areaH = (pr.top * dpr) - top;
      else areaW = pr.left * dpr;
    }
    const cx = areaW / 2;
    const unit = Math.min(areaW / 7.2, areaH / 4.4); // ~ chiều cao một "ô" nhân vật

    this.bg.clear();
    this.bg.fillGradientStyle(0xdff3fd, 0xdff3fd, 0xfff3dc, 0xfff3dc, 1).fillRect(0, 0, W, H);
    const ped = (x        , y        , rx        , c        ) => {
      this.bg.fillStyle(0x4c3876, 0.12).fillEllipse(x + rx * 0.06, y + rx * 0.08, rx * 2.05, rx * 0.62);
      this.bg.fillStyle(c, 1).fillEllipse(x, y, rx * 2, rx * 0.56);
      this.bg.fillStyle(0xffffff, 0.45).fillEllipse(x - rx * 0.2, y - rx * 0.08, rx * 1.1, rx * 0.2);
    };

    // hàng trên: bé lớn + 4 góc nhìn nhỏ
    const heroY = top + unit * 2.1;
    const heroScale = (unit * 1.75) / 96;
    const heroX = portrait ? cx : cx - unit * 1.6;
    ped(heroX, heroY, unit * 0.75, 0xffd96b);
    this.hero.setPosition(heroX, heroY);
    this.hero.setScale(heroScale);

    const vScale = (unit * 0.78) / 96;
    const vx0 = portrait ? cx - unit * 1.65 : cx + unit * 0.4;
    const vy = portrait ? heroY + unit * 1.05 : top + unit * 1.35;
    const vgap = portrait ? unit * 1.1 : unit * 0.95;
    for (let i = 0; i < this.views.length; i++) {
      const x = vx0 + i * vgap;
      ped(x, vy, unit * 0.32, 0xc7b5f0);
      this.views[i].setPosition(x, vy);
      this.views[i].setScale(vScale);
    }
    for (const l of this.labels) l.destroy();
    this.labels = [];
    const fs = Math.max(12, unit * 0.16);
    VIEWS.forEach(([, name], i) => {
      this.labels.push(this.add.text(vx0 + i * vgap, vy + unit * 0.2, name, { fontFamily: 'Nunito, sans-serif', fontSize: fs + 'px', fontStyle: '800', color: '#6f5a8a' }).setOrigin(0.5, 0));
    });

    // hàng dưới: ba thú cưng
    const petY = portrait ? vy + unit * 1.45 : top + unit * 3.6;
    const petScale = (unit * 1.5) / 80;
    const pets = AssetLoader.data('pets') || {};
    PET_IDS.forEach((p, i) => {
      const s = this.pets[p]; if (!s) return;
      const x = (portrait ? cx : cx + unit * 0.8) + (i - 1) * unit * 1.25;
      ped(x, petY, unit * 0.46, [0xffc9a3, 0xffdbe5, 0xe6b386][i]);
      s.setPosition(x, petY).setScale(petScale * (pets[p].scale ?? 0.5));
      this.labels.push(this.add.text(x, petY + unit * 0.22, pets[p].name || p, { fontFamily: 'Nunito, sans-serif', fontSize: fs * 1.1 + 'px', fontStyle: '800', color: '#4b3a5e' }).setOrigin(0.5, 0));
    });
  }

  // ───────────── bảng điều khiển ─────────────
  buildPanel() {
    const cfg = avatarConfig();
    const pets = AssetLoader.data('pets') || {};
    let body = '';
    if (this.tab === 'avatar') {
      const anims = Object.keys(cfg.anims).map((k) => `<button class="chip ${k === this.heroAnim ? 'on' : ''}" data-anim="${k}">${Ui.esc(ANIM_NAMES[k] || k)}</button>`).join('');
      const slots = cfg.layers.filter((L     ) => L.variants.length > 1 && !(L.slot === 'hairBack' && hasHairPair(cfg))).map((L     ) => {
        const i = Math.max(0, L.variants.findIndex((v     ) => v.id === this.look.variants[L.slot]));
        return `<div class="opt"><span>${Ui.esc(SLOT_NAMES[L.slot] || L.slot)}</span>
          <button class="btn icon" data-slot="${L.slot}" data-d="-1" aria-label="Trước">‹</button>
          <b>${Ui.esc(L.variants[i]?.name || '')}</b>
          <button class="btn icon" data-slot="${L.slot}" data-d="1" aria-label="Sau">›</button></div>`;
      }).join('');
      const colors = COLOR_SLOTS.map(([k, name, pal]) => `<div class="opt col"><span>${name}</span><div class="sw">${(cfg.palettes[pal] || []).map((hex        ) =>
        `<button class="swatch ${hex === this.look.colors[k] ? 'on' : ''}" style="background:${hex}" data-color="${k}" data-hex="${hex}" aria-label="${hex}"></button>`).join('')}</div></div>`).join('');
      body = `<h4>Animation</h4><div class="chips">${anims}</div>
        <h4>Tuỳ biến <button class="btn small accent" data-a="rand">Ngẫu nhiên</button> <button class="btn small ghost" data-a="reset">Mặc định</button></h4>
        <div class="opts">${slots}</div><div class="opts">${colors}</div>`;
    } else {
      body = PET_IDS.filter((p) => pets[p]).map((p) => {
        const P = pets[p];
        const portrait = AssetLoader.entry(`${p}-portrait`) ? `<img src="${AssetLoader.url(`${p}-portrait`)}" alt="">` : '';
        const anims = Object.keys(P.anims).map((k) => `<button class="chip ${k === this.petAnim[p] ? 'on' : ''}" data-pet="${p}" data-anim="${k}">${Ui.esc(ANIM_NAMES[k] || k)}</button>`).join('');
        const mine = Store.p?.pet === p;
        return `<div class="petcard">${portrait}<div><h4>${Ui.esc(P.name || p)} ${mine ? '<span class="badge open">Bạn đồng hành</span>' : `<button class="btn small accent" data-choose="${p}">Chọn bạn này</button>`}</h4><p>${Ui.esc(P.personality || '')}</p></div></div><div class="chips">${anims}</div>`;
      }).join('') + `<div class="row"><button class="btn accent" data-a="allcele">Cả ba cùng ăn mừng</button><button class="btn" data-a="allgreet">Cả ba cùng chào</button></div>`;
    }
    const el = Ui.panel(`
      <div class="seg wide"><button data-tab="avatar" class="${this.tab === 'avatar' ? 'on' : ''}">Bé</button><button data-tab="pets" class="${this.tab === 'pets' ? 'on' : ''}">Thú cưng</button></div>
      ${body}`, 'gallery-panel');
    el.onclick = (e     ) => {
      const b = e.target.closest('button'); if (!b) return;
      const d = b.dataset;
      Audio.sfx('tap');
      if (d.tab) { this.tab = d.tab; this.buildPanel(); return; }
      if (d.choose) { Store.setPet(d.choose); this.playPet(d.choose, 'celebrate'); Hud.say(`Chào bạn! Mình là ${pets[d.choose]?.name}. Từ giờ mình đi cùng bạn nhé!`); this.buildPanel(); return; }
      if (d.pet && d.anim) { this.playPet(d.pet, d.anim); this.buildPanel(); return; }
      if (d.anim) {
        const a = cfg.anims[d.anim];
        if (a.repeat === -1 || a.repeat === undefined) { this.heroAnim = d.anim; this.hero.play(d.anim, true); this.hero.setFlip(false); }
        else this.hero.play(d.anim, true, () => this.hero.play(this.heroAnim));
        this.buildPanel(); return;
      }
      if (d.slot) {
        const L = cfg.layers.find((x     ) => x.slot === d.slot);
        const i = Math.max(0, L.variants.findIndex((v     ) => v.id === this.look.variants[L.slot]));
        const n = (i + Number(d.d) + L.variants.length) % L.variants.length;
        this.look.variants[L.slot] = L.variants[n].id;
        if (L.slot === 'hairFront' && hasHairPair(cfg)) this.look.variants.hairBack = matchingHairBack(cfg, L.variants[n].id);
        this.applyLook(); this.buildPanel(); return;
      }
      if (d.color) { this.look.colors[d.color] = d.hex; this.applyLook(); this.buildPanel(); return; }
      if (d.a === 'rand') this.randomize();
      else if (d.a === 'reset') { this.look = defaultLook(); this.applyLook(); this.buildPanel(); }
      else if (d.a === 'allcele') PET_IDS.forEach((p) => this.playPet(p, 'celebrate'));
      else if (d.a === 'allgreet') PET_IDS.forEach((p) => this.playPet(p, 'greet'));
    };
    this.time.delayedCall(30, () => this.layout());
  }

  update(_t        , dt        ) {
    if (this.hero) this.hero.update(dt);
  }
}

const SLOT_NAMES                         = {
  hairBack: 'Tóc (sau)', body: 'Dáng', face: 'Gương mặt', bottom: 'Quần / váy', top: 'Áo', shoes: 'Giày', hairFront: 'Kiểu tóc', accessory: 'Phụ kiện',
};

// Tóc trước + tóc sau là một kiểu tóc: 'avatar-hairfront-bob' đi với 'avatar-hairback-bob' (nếu có)
function hasHairPair(cfg     ) { return cfg.layers.some((L     ) => L.slot === 'hairBack') && cfg.layers.some((L     ) => L.slot === 'hairFront'); }
function matchingHairBack(cfg     , frontId               )                {
  if (!frontId) return null;
  const want = frontId.replace('hairfront', 'hairback');
  const back = cfg.layers.find((L     ) => L.slot === 'hairBack');
  return back.variants.some((v     ) => v.id === want) ? want : null;
}
return { WardrobeScene };
})();

/* ══════════ games/AnimalMatch.ts ══════════ */
M.AnimalMatch = (function () {
// ── Game 1: Tìm bạn thú (chọn đúng con vật) / Nhà của thú (đưa thú về đúng nơi ở) ──
// Cấp 1–5: số lựa chọn 2 → 3 → 4 → 6; cấp 5 chỉ nghe tiếng kêu.
const { AssetLoader } = M.AssetLoader;
const { Audio } = M.Audio;
const { MiniGame, shuffle } = M.MiniGame;
class AnimalMatchScene extends MiniGame {
  target      = null;
  constructor() { super('AnimalMatch'); }

  get play() { return AssetLoader.data('play'); }
  assets() {
    const P = this.play;
    return [...P.animals.map((a     ) => a.asset), ...P.habitats.map((h     ) => h.asset), P.cards?.front || 'card-front'];
  }
  instruction() {
    if (!this.target) return this.act.desc;
    if (this.mode === 'habitat') return `${this.target.name} sống ở đâu nhỉ? Kéo bạn ấy về nhà nhé.`;
    return this.level >= 5 ? `Con nào kêu "${this.target.sound}"?` : `Con ${this.target.name.toLowerCase()} đâu rồi?`;
  }

  buildRound() {
    if (this.mode === 'habitat') this.buildHabitat(); else this.buildFind();
  }

  // ───── Tìm bạn thú ─────
  buildFind() {
    const P = this.play;
    const n = [2, 3, 4, 6, 6][this.level - 1];
    const pool = shuffle(P.animals         );
    const choices = pool.slice(0, n);
    this.target = choices[Math.floor(Math.random() * n)];
    const top = this.top;
    const q = this.label(this.W / 2, top + 30, this.level >= 5 ? `Con nào kêu "${this.target.sound}"?` : `Con ${this.target.name.toLowerCase()} đâu?`, this.portrait ? 54 : 58);
    this.layer.add(q);
    // loa: đọc lại
    const spk = this.add.circle(q.x + q.width / 2 + 50, q.y, 32, 0xffd96b).setStrokeStyle(5, 0xffffff).setInteractive({ useHandCursor: true });
    const spkT = this.label(spk.x, spk.y - 2, '♪', 40);
    spk.on('pointerup', () => { Audio.sfx('tap'); this.say(this.instruction()); });
    this.layer.add([spk, spkT]);

    const cols = this.portrait ? (n <= 2 ? 1 : 2) : Math.min(n, n === 6 ? 3 : n);
    const rows = Math.ceil(n / cols);
    const areaT = top + 110, areaB = this.H - (this.portrait ? 220 : 60);
    const cw = Math.min(this.portrait ? 380 : 330, (this.W - 140) / cols), ch = Math.min(cw * 1.15, (areaB - areaT) / rows - 20);
    choices.forEach((a     , i        ) => {
      const c = i % cols, r = Math.floor(i / cols);
      const rowCount = Math.min(cols, n - r * cols);
      const x = this.W / 2 + (c - (rowCount - 1) / 2) * (cw + 24);
      const y = areaT + (r + 0.5) * ((areaB - areaT) / rows);
      const card = this.add.container(x, y);
      const plate = this.plate(0, 0, cw, ch, 0xfffaf2, 0.95);
      const img = this.fitImage(a.asset, 0, -14, cw * 0.82, ch * 0.72);
      const name = this.label(0, ch / 2 - 34, this.level <= 2 ? a.name : '', 34);
      card.add([plate, img, name]);
      card.setSize(cw, ch).setInteractive({ useHandCursor: true });
      card.setScale(0);
      this.tweens.add({ targets: card, scale: 1, duration: 320, delay: i * 70, ease: 'Back.easeOut' });
      card.on('pointerup', () => this.pickFind(card, a, img));
      this.layer.add(card);
    });
    this.time.delayedCall(250, () => this.say(this.instruction()));
  }

  pickFind(card     , a     , img     ) {
    if (this.busy) return;
    if (a.id === this.target.id) {
      this.busy = true;
      this.good(card.x, card.y);
      Audio.say(`Đúng rồi! Con ${a.name.toLowerCase()} kêu ${a.sound}!`);
      this.tweens.add({ targets: card, scale: 1.15, duration: 220, yoyo: true, repeat: 1, ease: 'Quad.easeOut' });
      this.tweens.add({ targets: img, angle: { from: -8, to: 8 }, duration: 160, yoyo: true, repeat: 3 });
      for (const o of this.layer.list) if (o !== card && o.input) this.tweens.add({ targets: o, alpha: 0.35, duration: 250 });
      this.nextRound(1500);
    } else {
      this.miss(card, `Đây là con ${a.name.toLowerCase()}. Tìm con ${this.target.name.toLowerCase()} nhé!`);
    }
  }

  // ───── Nhà của thú ─────
  buildHabitat() {
    const P = this.play;
    const nh = [2, 2, 3, 4, 4][this.level - 1];
    const habitats = shuffle(P.habitats         ).slice(0, nh);
    const cand = shuffle((P.animals         ).filter((a) => habitats.some((h) => h.id === a.habitat)));
    this.target = cand[0];
    const top = this.top;
    this.layer.add(this.label(this.W / 2, top + 30, `${this.target.name} sống ở đâu?`, 56));

    const homes        = [];
    const hw = this.portrait ? 380 : Math.min(340, (this.W - 120) / nh - 20), hh = hw * 0.66;
    habitats.forEach((h     , i        ) => {
      let x, y;
      if (this.portrait) { x = this.W / 2 + ((i % 2) - (Math.min(2, nh) - 1) / 2) * (hw + 24); y = this.H - 260 - (Math.floor(i / 2)) * (hh + 70) - (nh > 2 ? 0 : 0); if (nh <= 2) y = this.H - 300; }
      else { x = this.W / 2 + (i - (nh - 1) / 2) * (hw + 30); y = this.H - hh / 2 - 70; }
      const c = this.add.container(x, y);
      const img = this.fitImage(h.asset, 0, 0, hw, hh);
      const t = this.label(0, hh / 2 + 26, h.name, 32);
      c.add([img, t]);
      c.setData('h', h).setData('w', hw).setData('hh', hh);
      this.layer.add(c);
      homes.push(c);
    });

    const ay = this.portrait ? top + 330 : top + 230;
    const animal = this.fitImage(this.target.asset, this.W / 2, ay, 260, 260);
    animal.setInteractive({ draggable: true, useHandCursor: true });
    this.input.setDraggable(animal);
    this.layer.add(animal);
    this.tweens.add({ targets: animal, y: ay - 14, duration: 700, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    const home0 = { x: animal.x, y: ay };
    const hit = (x        , y        ) => homes.find((c) => Math.abs(x - c.x) < c.getData('w') / 2 && Math.abs(y - c.y) < c.getData('hh') / 2 + 30);

    animal.on('dragstart', () => { this.tweens.killTweensOf(animal); animal.setScale(animal.getData('baseScale') * 1.1); Audio.sfx('pop'); });
    animal.on('drag', (_p     , x        , y        ) => {
      animal.setPosition(x, y);
      for (const c of homes) c.setScale(c === hit(x, y) ? 1.06 : 1);
    });
    animal.on('dragend', () => {
      animal.setScale(animal.getData('baseScale'));
      const c = hit(animal.x, animal.y);
      for (const h of homes) h.setScale(1);
      if (c && c.getData('h').id === this.target.habitat) {
        this.busy = true;
        animal.disableInteractive();
        this.tweens.add({ targets: animal, x: c.x, y: c.y - 10, scale: animal.getData('baseScale') * 0.7, duration: 300, ease: 'Back.easeOut' });
        this.good(c.x, c.y);
        Audio.say(`Đúng rồi! ${this.target.name} sống ở ${c.getData('h').name.toLowerCase()}.`);
        this.nextRound(1500);
      } else {
        if (c) this.miss(c, `${this.target.name} không sống ở ${c.getData('h').name.toLowerCase()} đâu. Thử nơi khác nhé!`);
        this.tweens.add({ targets: animal, x: home0.x, y: home0.y, duration: 300, ease: 'Back.easeOut' });
      }
    });
    this.time.delayedCall(250, () => this.say(this.instruction()));
  }
}
return { AnimalMatchScene };
})();

/* ══════════ games/Memory.ts ══════════ */
M.Memory = (function () {
// ── Game 2: Lật thẻ ghi nhớ ──
// Cấp 1–5: 2, 3, 4, 6, 8 cặp. Không có đồng hồ đếm ngược.
const { AssetLoader } = M.AssetLoader;
const { Audio } = M.Audio;
const { MiniGame, shuffle } = M.MiniGame;
class MemoryScene extends MiniGame {
  open        = [];
  found = 0;
  pairs = 2;
  constructor() { super('Memory'); }

  get play() { return AssetLoader.data('play'); }
  assets() { const P = this.play; return [...P.animals.map((a     ) => a.asset), 'card-back', 'card-front']; }
  instruction() { return 'Lật hai thẻ. Nếu giống nhau là tìm được một cặp!'; }

  buildRound() {
    this.pairs = [2, 3, 4, 6, 8][this.level - 1];
    this.open = []; this.found = 0;
    const animals = shuffle(this.play.animals         ).slice(0, this.pairs);
    const deck = shuffle([...animals, ...animals]);
    const n = deck.length;
    let cols        ;
    if (this.portrait) cols = n <= 4 ? 2 : n <= 12 ? 3 : 4;
    else cols = n <= 4 ? n : n <= 6 ? 3 : n <= 8 ? 4 : n <= 12 ? 4 : 6;
    const rows = Math.ceil(n / cols);
    const top = this.top + 20, bottom = this.H - (this.portrait ? 200 : 40);
    const availH = bottom - top, availW = this.W - (this.portrait ? 80 : 300);
    const ch = Math.min(260, availH / rows - 18), cw = Math.min(ch * 0.8, availW / cols - 18);
    const chh = cw / 0.8;
    deck.forEach((a     , i        ) => {
      const c = i % cols, r = Math.floor(i / cols);
      const rowCount = Math.min(cols, n - r * cols);
      const x = this.W / 2 + (c - (rowCount - 1) / 2) * (cw + 18) + (this.portrait ? 0 : 60);
      const y = top + availH / 2 + (r - (rows - 1) / 2) * (chh + 18);
      const card = this.add.container(x, y);
      const back = this.add.image(0, 0, 'card-back').setDisplaySize(cw, chh);
      const front = this.add.image(0, 0, 'card-front').setDisplaySize(cw, chh).setVisible(false);
      const pic = this.fitImage(a.asset, 0, 0, cw * 0.86, chh * 0.75).setVisible(false);
      card.add([back, front, pic]);
      card.setData({ a, back, front, pic, up: false, done: false });
      card.setSize(cw, chh).setInteractive({ useHandCursor: true });
      card.on('pointerup', () => this.flip(card));
      card.setScale(0);
      this.tweens.add({ targets: card, scale: 1, duration: 300, delay: i * 40, ease: 'Back.easeOut' });
      this.layer.add(card);
    });
    // cấp 1: cho xem trước các thẻ một chút
    if (this.level === 1) this.time.delayedCall(700, () => {
      for (const c of this.layer.list) this.show(c, true);
      this.time.delayedCall(1500, () => { for (const c of this.layer.list) this.show(c, false); });
    });
    this.time.delayedCall(300, () => this.say(this.instruction()));
  }

  show(card     , up         ) {
    card.setData('up', up);
    this.tweens.add({
      targets: card, scaleX: 0, duration: 120, ease: 'Quad.easeIn',
      onComplete: () => {
        card.getData('back').setVisible(!up);
        card.getData('front').setVisible(up);
        card.getData('pic').setVisible(up);
        this.tweens.add({ targets: card, scaleX: 1, duration: 140, ease: 'Quad.easeOut' });
      },
    });
  }

  flip(card     ) {
    if (this.busy || card.getData('up') || card.getData('done') || this.open.length >= 2) return;
    Audio.sfx('flip');
    this.show(card, true);
    this.open.push(card);
    if (this.open.length < 2) return;
    const [a, b] = this.open;
    this.busy = true;
    if (a.getData('a').id === b.getData('a').id) {
      this.time.delayedCall(350, () => {
        for (const c of [a, b]) {
          c.setData('done', true);
          this.tweens.add({ targets: c, scale: 1.12, duration: 160, yoyo: true });
        }
        this.good((a.x + b.x) / 2, (a.y + b.y) / 2, false);
        Audio.say(a.getData('a').name);
        this.open = []; this.busy = false;
        this.found++;
        if (this.found >= this.pairs) this.time.delayedCall(700, () => this.complete());
      });
    } else {
      this.mistakes += 0.5; // nhớ dần là chuyện bình thường: lật sai chỉ tính nửa lần
      this.time.delayedCall(900, () => {
        Audio.sfx('soft');
        this.show(a, false); this.show(b, false);
        this.open = []; this.busy = false;
      });
    }
  }

  complete() {
    // lật sai trong game trí nhớ là bình thường; chuẩn hoá theo số cặp
    this.mistakes = Math.max(0, Math.round(this.mistakes - this.pairs * 0.75));
    super.complete();
  }
}
return { MemoryScene };
})();

/* ══════════ games/ShapePuzzle.ts ══════════ */
M.ShapePuzzle = (function () {
// ── Game 3: Ghép hình — kéo mảnh vào đúng bóng trên khay gỗ ──
// Cấp 1–5: 2 → 6 mảnh; cấp cao có hình gần giống nhau (tròn/bầu dục, vuông/chữ nhật/thoi).
const { AssetLoader } = M.AssetLoader;
const { Audio } = M.Audio;
const { MiniGame, shuffle } = M.MiniGame;
const EASY = ['circle', 'square', 'triangle', 'star', 'heart'];

class ShapePuzzleScene extends MiniGame {
  left = 0;
  slots        = [];
  constructor() { super('ShapePuzzle'); }
  get play() { return AssetLoader.data('play'); }
  assets() { const P = this.play; return [...P.shapes.map((s     ) => s.asset), P.board || 'play-board-wood']; }
  instruction() { return 'Kéo từng mảnh vào cái bóng giống nó nhé!'; }

  buildRound() {
    const P = this.play;
    const n = [2, 3, 4, 5, 6][this.level - 1];
    const all = P.shapes         ;
    const pool = this.level <= 2 ? all.filter((s) => EASY.includes(s.id)) : all;
    const shapes = shuffle(pool).slice(0, n);
    this.left = n; this.slots = [];

    // khay gỗ
    const bw = this.portrait ? 820 : 900, bh = this.portrait ? Math.min(640, this.H - this.top - 540) : 560;
    const bx = this.portrait ? this.W / 2 : this.W / 2 + 170, by = this.portrait ? this.top + 60 + bh / 2 : this.top + 30 + bh / 2 + 40;
    const board = this.add.image(bx, by, P.board || 'play-board-wood').setDisplaySize(bw, bh);
    this.layer.add(board);
    const cols = n <= 2 ? 2 : n <= 4 ? 2 : 3, rows = Math.ceil(n / cols);
    const cell = Math.min((bw - 80) / cols, (bh - 80) / rows);
    const k = Math.min(1, (cell - 30) / 200);
    shuffle(shapes).forEach((s     , i        ) => {
      const c = i % cols, r = Math.floor(i / cols);
      const rowCount = Math.min(cols, n - r * cols);
      const x = bx + (c - (rowCount - 1) / 2) * cell, y = by + (r - (rows - 1) / 2) * cell;
      const sil = this.add.image(x, y, s.asset).setDisplaySize(s.w * k, s.h * k).setTintFill(0x7a5a8c).setAlpha(0.32);
      sil.setData({ s, filled: false });
      this.slots.push(sil);
      this.layer.add(sil);
    });

    // các mảnh ghép: bên trái (ngang) hoặc bên dưới (dọc)
    const pieces = shuffle(shapes);
    if (this.portrait) this.layer.add(this.plate(this.W / 2, by + bh / 2 + 140 + (Math.ceil(n / 3) - 1) * 105, this.W - 60, Math.ceil(n / 3) * 210 + 20, 0xfffaf2, 0.8));
    else this.layer.add(this.plate(n <= 3 ? 250 : 310, this.top + 40 + (this.H - this.top - 220) / 2 + 20, n <= 3 ? 240 : 430, this.H - this.top - 200, 0xfffaf2, 0.8));
    pieces.forEach((s     , i        ) => {
      let x        , y        ;
      if (this.portrait) {
        const pc = Math.min(3, n), pr = Math.ceil(n / pc);
        const c = i % pc, r = Math.floor(i / pc);
        x = this.W / 2 + (c - (Math.min(pc, n - r * pc) - 1) / 2) * 250;
        y = by + bh / 2 + 140 + r * 210 - (pr > 1 ? 0 : 0);
      } else {
        const pc = n <= 3 ? 1 : 2;
        const c = i % pc, r = Math.floor(i / pc), pr = Math.ceil(n / pc);
        x = pc === 1 ? 250 : 210 + c * 200;
        y = this.top + 60 + (r + 0.5) * ((this.H - this.top - 260) / pr) + 20;
      }
      const piece = this.add.image(x, y, s.asset).setDisplaySize(s.w * k * 0.95, s.h * k * 0.95);
      piece.setData({ s, home: { x, y }, base: piece.scale });
      piece.setInteractive({ draggable: true, useHandCursor: true, pixelPerfect: false });
      this.input.setDraggable(piece);
      piece.setAngle(-8 + Math.random() * 16);
      this.layer.add(piece);
      piece.on('dragstart', () => { if (this.busy) return; Audio.sfx('pop'); piece.setScale(piece.getData('base') * 1.1).setAngle(0); this.layer.bringToTop(piece); });
      piece.on('drag', (_p     , px        , py        ) => piece.setPosition(px, py));
      piece.on('dragend', () => this.drop(piece, k));
    });
    this.time.delayedCall(300, () => this.say(this.instruction()));
  }

  drop(piece     , k        ) {
    const s = piece.getData('s');
    const near = this.slots.filter((sl) => !sl.getData('filled')).map((sl) => ({ sl, d: Math.hypot(sl.x - piece.x, sl.y - piece.y) }))
      .sort((a, b) => a.d - b.d)[0];
    const reach = 110 * Math.max(0.7, k) + (this.level <= 2 ? 40 : 0);
    if (near && near.d < reach && near.sl.getData('s').id === s.id) {
      const sl = near.sl;
      sl.setData('filled', true);
      piece.disableInteractive();
      this.tweens.add({ targets: piece, x: sl.x, y: sl.y, scaleX: sl.scaleX, scaleY: sl.scaleY, angle: 0, duration: 200, ease: 'Back.easeOut' });
      Audio.sfx('snap');
      this.good(sl.x, sl.y, false);
      Audio.say(s.name);
      this.tweens.add({ targets: sl, alpha: 0, duration: 200 });
      if (--this.left <= 0) {
        this.good(this.W / 2, this.H / 2);
        this.nextRound(1200);
      }
      return;
    }
    // sai hoặc thả ra ngoài: mảnh quay về chỗ cũ
    if (near && near.d < reach) {
      this.miss(undefined, this.roundMistakes >= 1 ? `Mảnh này là ${s.name.toLowerCase()}. Tìm cái bóng giống nó nhé!` : undefined);
      if (this.roundMistakes >= 2) {
        const right = this.slots.find((sl) => !sl.getData('filled') && sl.getData('s').id === s.id);
        if (right) this.tweens.add({ targets: right, alpha: 0.7, duration: 300, yoyo: true, repeat: 2 });
      }
    }
    const h = piece.getData('home');
    this.tweens.add({ targets: piece, x: h.x, y: h.y, scale: piece.getData('base'), duration: 280, ease: 'Back.easeOut' });
  }
}
return { ShapePuzzleScene };
})();

/* ══════════ games/CountCollect.ts ══════════ */
M.CountCollect = (function () {
// ── Game 4: Đếm và hái — hái đúng số quả, so sánh hai nhóm, phép cộng nhỏ ──
// Cấp 1: 1–3 · cấp 2: 2–5 · cấp 3: 4–7 (lẫn quả khác) · cấp 4: + so sánh · cấp 5: + phép cộng.
const { AssetLoader } = M.AssetLoader;
const { Audio } = M.Audio;
const { MiniGame, shuffle, randInt, FONT } = M.MiniGame;
const NUM = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín', 'mười'];

class CountCollectScene extends MiniGame {
  kind                                = 'collect';
  target = 0; item     ; inBasket        = []; basket     ; countText     ; askText = '';
  constructor() { super('CountCollect'); }
  get play() { return AssetLoader.data('play'); }
  assets() { return (this.play.items         ).map((i) => i.asset); }
  instruction() { return this.askText || this.act.desc; }

  buildRound() {
    const kinds                                    =
      this.level <= 3 ? ['collect'] : this.level === 4 ? ['collect', 'compare', 'collect', 'compare', 'collect'] : ['collect', 'compare', 'add', 'compare', 'add'];
    this.kind = kinds[this.round % kinds.length];
    if (this.kind === 'collect') this.buildCollect();
    else if (this.kind === 'compare') this.buildCompare();
    else this.buildAdd();
  }

  // ───── hái đúng số ─────
  buildCollect() {
    const items = this.play.items         ;
    const [lo, hi] = [[1, 3], [2, 5], [4, 7], [3, 8], [4, 9]][this.level - 1];
    this.target = randInt(lo, hi);
    this.item = items[randInt(0, items.length - 1)];
    const extra = this.level >= 3 ? randInt(2, 4) : 0;
    const total = Math.min(12, this.target + randInt(1, 3));
    const others = shuffle(items.filter((i) => i.id !== this.item.id)).slice(0, 2);
    this.inBasket = [];
    this.askText = `Hái ${this.item.name} bỏ vào giỏ nhé! Cần đủ ${NUM[this.target]}.`;
    this.layer.add(this.label(this.W / 2, this.top + 30, `Hái ${this.target} ${this.item.name}`, 58));

    // vùng quả (trên) và giỏ (dưới phải)
    const field = this.portrait ? { x: 70, y: this.top + 110, w: this.W - 140, h: Math.min(640, this.H - this.top - 110 - 520) } : { x: 300, y: this.top + 90, w: 820, h: 560 };
    this.layer.add(this.plate(field.x + field.w / 2, field.y + field.h / 2, field.w, field.h, 0xf3fbef, 0.85));
    const spots = this.scatter(field, total + extra, 120);
    const list = shuffle([...Array(total).fill(this.item), ...Array.from({ length: extra }, (_, i) => others[i % others.length])]);
    list.forEach((it, i) => {
      const [x, y] = spots[i];
      const s = this.fitImage(it.asset, x, y, 104, 104);
      s.setData({ it, home: { x, y } }).setInteractive({ useHandCursor: true });
      s.setScale(0); this.tweens.add({ targets: s, scale: s.getData('baseScale'), delay: i * 40, duration: 250, ease: 'Back.easeOut' });
      s.on('pointerup', () => this.toggle(s));
      this.layer.add(s);
    });

    const bx = this.portrait ? this.W / 2 : 1320, by = this.portrait ? field.y + field.h + 230 : this.top + 360;
    this.basket = this.drawBasket(bx, by);
    this.countText = this.add.text(bx, by + 140, '0', { fontFamily: FONT, fontSize: '72px', fontStyle: '800', color: '#f28a4e', stroke: '#ffffff', strokeThickness: 12 }).setOrigin(0.5);
    this.layer.add(this.countText);
    const ok = this.bigButton(bx, by + (this.portrait ? 250 : 250), 'Xong rồi!', () => this.checkCollect());
    this.layer.add(ok);
    this.time.delayedCall(300, () => this.say(this.instruction()));
  }

  toggle(s     ) {
    if (this.busy) return;
    const i = this.inBasket.indexOf(s);
    if (i >= 0) {
      this.inBasket.splice(i, 1);
      const h = s.getData('home');
      this.tweens.add({ targets: s, x: h.x, y: h.y, duration: 260, ease: 'Back.easeOut' });
      Audio.sfx('soft');
    } else {
      if (s.getData('it').id !== this.item.id) { this.miss(s, `Đó là ${s.getData('it').name}. Mình cần ${this.item.name} cơ!`); return; }
      this.inBasket.push(s);
      const k = this.inBasket.length - 1;
      const bx = this.basket.x + ((k % 5) - 2) * 44, by = this.basket.y - 50 - Math.floor(k / 5) * 34;
      this.layer.bringToTop(s);
      this.tweens.add({ targets: s, x: bx, y: by, duration: 320, ease: 'Cubic.easeOut' });
      Audio.sfx('pop');
      Audio.say(NUM[this.inBasket.length] || String(this.inBasket.length));
    }
    this.countText.setText(String(this.inBasket.length));
    this.pulse(this.countText, 1.25);
    this.layer.bringToTop(this.basket.front);
  }

  checkCollect() {
    if (this.busy) return;
    const n = this.inBasket.length;
    if (n === this.target) {
      this.good(this.basket.x, this.basket.y - 60);
      Audio.say(`Đúng rồi! Đủ ${NUM[n]} rồi!`);
      this.nextRound(1400);
    } else if (n < this.target) this.miss(this.basket.front, `Trong giỏ mới có ${NUM[n]}. Cần ${NUM[this.target]} cơ, hái thêm nhé!`);
    else this.miss(this.basket.front, `Trong giỏ có ${NUM[n]} rồi, nhiều quá! Chạm vào quả trong giỏ để bỏ bớt nhé.`);
  }

  // ───── so sánh hai nhóm ─────
  buildCompare() {
    const items = shuffle(this.play.items         );
    const a = randInt(1, this.level >= 5 ? 9 : 6);
    let b = randInt(1, this.level >= 5 ? 9 : 6); if (b === a) b = a + (a > 3 ? -randInt(1, 2) : randInt(1, 2));
    const askMore = Math.random() < 0.6;
    this.askText = askMore ? 'Bên nào nhiều hơn?' : 'Bên nào ít hơn?';
    this.layer.add(this.label(this.W / 2, this.top + 30, this.askText, 58));
    const groups = [a, b];
    const want = askMore ? (a > b ? 0 : 1) : (a < b ? 0 : 1);
    groups.forEach((n, gi) => {
      const f = this.portrait
        ? { x: 80, y: this.top + 110 + gi * 560, w: this.W - 160, h: 500 }
        : { x: gi === 0 ? 170 : 870, y: this.top + 110, w: 560, h: 560 };
      const plate = this.plate(f.x + f.w / 2, f.y + f.h / 2, f.w, f.h, 0xfffaf2, 0.92);
      const zone = this.add.zone(f.x + f.w / 2, f.y + f.h / 2, f.w, f.h).setInteractive({ useHandCursor: true });
      this.layer.add([plate, zone]);
      const it = items[gi];
      const spots = this.scatter({ x: f.x + 20, y: f.y + 20, w: f.w - 40, h: f.h - 40 }, n, 115);
      for (const [x, y] of spots) this.layer.add(this.fitImage(it.asset, x, y, 100, 100));
      zone.on('pointerup', () => {
        if (this.busy) return;
        if (gi === want) {
          this.good(zone.x, zone.y);
          Audio.say(`Đúng rồi! Bên này ${askMore ? 'nhiều hơn' : 'ít hơn'}!`);
          this.nextRound(1600);
        } else this.miss(plate, `Mình cùng đếm nhé! Bên này có ${NUM[n]}. Bên kia có ${NUM[groups[1 - gi]]}.`);
      });
    });
    this.time.delayedCall(300, () => this.say(this.instruction()));
  }

  // ───── phép cộng ─────
  buildAdd() {
    const it = (this.play.items         )[randInt(0, 7)];
    const a = randInt(1, 5), b = randInt(1, 4), sum = a + b;
    this.askText = `${NUM[a]} thêm ${NUM[b]} là mấy?`;
    this.layer.add(this.label(this.W / 2, this.top + 30, `${a} + ${b} = ?`, 72));
    const y0 = this.portrait ? this.top + 380 : this.top + 290;
    const gw = this.portrait ? 360 : 460;
    [a, b].forEach((n, gi) => {
      const cx = this.portrait ? this.W / 2 + (gi === 0 ? -200 : 200) : this.W / 2 + (gi === 0 ? -330 : 330);
      this.layer.add(this.plate(cx, y0, gw, 360, 0xfffaf2, 0.9));
      const spots = this.scatter({ x: cx - gw / 2 + 20, y: y0 - 160, w: gw - 40, h: 320 }, n, 110);
      for (const [x, y] of spots) this.layer.add(this.fitImage(it.asset, x, y, 96, 96));
    });
    this.layer.add(this.label(this.W / 2, y0, '+', 110));
    const opts = shuffle([sum, sum + 1, Math.max(1, sum - 1) === sum ? sum + 2 : Math.max(1, sum - 1)].filter((v, i, arr) => arr.indexOf(v) === i));
    while (opts.length < 3) opts.push(sum + opts.length + 1);
    opts.forEach((v, i) => {
      const bx = this.W / 2 + (i - 1) * 240, by = this.portrait ? this.H - 380 : this.H - 150;
      const c = this.add.container(bx, by);
      const g = this.add.circle(0, 0, 90, 0xffd96b).setStrokeStyle(8, 0xffffff);
      const t = this.add.text(0, -4, String(v), { fontFamily: FONT, fontSize: '96px', fontStyle: '800', color: '#4b3a5e' }).setOrigin(0.5);
      c.add([g, t]); c.setSize(180, 180).setInteractive({ useHandCursor: true });
      c.on('pointerup', () => {
        if (this.busy) return;
        if (v === sum) { this.good(bx, by); Audio.say(`${NUM[a]} thêm ${NUM[b]} là ${NUM[sum]}!`); this.nextRound(1600); }
        else this.miss(c, 'Mình cùng đếm tất cả các quả nhé!');
      });
      this.layer.add(c);
    });
    this.time.delayedCall(300, () => this.say(this.instruction()));
  }

  // ───── tiện ích ─────
  scatter(f                                                , n        , gap        )                     {
    const pts                     = [];
    for (let tries = 0; pts.length < n && tries < 4000; tries++) {
      const x = f.x + 60 + Math.random() * (f.w - 120), y = f.y + 60 + Math.random() * (f.h - 120);
      const g = tries > 2500 ? gap * 0.7 : gap;
      if (pts.every(([px, py]) => Math.hypot(px - x, py - y) > g)) pts.push([x, y]);
    }
    while (pts.length < n) pts.push([f.x + f.w / 2 + (pts.length % 4) * 30, f.y + f.h / 2]);
    return pts;
  }

  drawBasket(x        , y        ) {
    const back = this.add.graphics();
    back.fillStyle(0x99643f, 1).fillEllipse(x, y - 40, 260, 70);
    const front = this.add.graphics();
    front.fillStyle(0x4c3876, 0.15).fillEllipse(x + 6, y + 78, 250, 40);
    front.fillStyle(0xcf9161, 1).lineStyle(6, 0x99643f, 1);
    front.beginPath(); front.moveTo(x - 130, y - 40); front.lineTo(x + 130, y - 40); front.lineTo(x + 100, y + 70); front.lineTo(x - 100, y + 70); front.closePath(); front.fillPath(); front.strokePath();
    front.lineStyle(4, 0xe6b386, 1);
    for (let i = -2; i <= 2; i++) { front.lineBetween(x + i * 44, y - 34, x + i * 36, y + 64); }
    front.lineBetween(x - 118, y - 2, x + 118, y - 2); front.lineBetween(x - 108, y + 34, x + 108, y + 34);
    front.lineStyle(10, 0x99643f, 1).strokeEllipse(x, y - 40, 260, 40);
    this.layer.add([back, front]);
    return { x, y, back, front };
  }
}
return { CountCollectScene };
})();

/* ══════════ games/Builder.ts ══════════ */
M.Builder = (function () {
// ── Game 5: Bé xây dựng — xếp khối có trọng lực (Matter.js có sẵn trong Phaser) ──
// Không có một đáp án đúng duy nhất. Thử thách tuỳ chọn: tháp chạm cờ, nhà có mái, tự do.
const { AssetLoader } = M.AssetLoader;
const { Audio } = M.Audio;
const { Ui } = M.Ui;
const { MiniGame, FONT } = M.MiniGame;
const K = 1.35;   // phóng to khối cho tay bé dễ cầm
const CHALLENGES = [
  { id: 'tower', name: 'Tháp chạm cờ', say: 'Xây một cái tháp thật cao, chạm tới lá cờ nhé!' },
  { id: 'house', name: 'Ngôi nhà có mái', say: 'Xây một ngôi nhà, nhớ đặt mái nhà lên trên cùng nhé!' },
  { id: 'free', name: 'Tự do sáng tạo', say: 'Bé muốn xây gì cũng được! Xong thì bấm "Xong rồi" nhé.' },
];

class BuilderScene extends MiniGame {
  ground     ; tray        = []; blocks        = []; dragging      = null; dragDef      = null;
  challenge = 'tower'; flagY = 0; flag     ; trayRect = { x: 0, y: 0, w: 0, h: 0 }; achieved = false; stableT = 0; placed = 0;
  constructor() { super({ key: 'Builder', physics: { default: 'matter', matter: { gravity: { y: 1.1 }, enableSleeping: true } } }); }

  get play() { return AssetLoader.data('play'); }
  placePet() { if (this.petSprite) this.petSprite.setScale(this.portrait ? 0.9 : 1).setPosition(this.portrait ? this.W - 90 : this.W - 230, this.H - (this.portrait ? 300 : 70)); }
  assets() { const P = this.play; return [...P.blocks.map((b     ) => b.asset), P.ground || 'block-ground']; }
  instruction() { return CHALLENGES.find((c) => c.id === this.challenge) .say; }

  setup() {
    this.placed = 0;
    this.input.on('pointermove', (p     ) => this.moveDrag(p));
    this.input.on('pointerup', (p     ) => this.endDrag(p));
    this.events.on('update', () => this.checkGoal());
  }

  relayout() {
    // đổi chiều màn hình: giữ nguyên công trình là khó → dựng lại sân, xoá khối
    this.startRound(true);
  }

  buildRound() {
    for (const b of this.blocks) b.destroy();
    this.blocks = [];
    this.matter.world.setBounds(0, -2000, this.W, this.H + 2000 - (this.portrait ? 300 : 70), 64, true, true, false, false);
    // mặt đất
    const gy = this.H - (this.portrait ? 300 : 70);
    const groundImg = this.add.image(this.W / 2, gy, this.play.ground || 'block-ground').setOrigin(0.5, 0);
    groundImg.setDisplaySize(this.W + 40, 60 * 1.2 * (this.W / 1200));
    this.layer.add(groundImg);
    this.ground = this.matter.add.rectangle(this.W / 2, gy + 200, this.W + 400, 400, { isStatic: true, friction: 1 });
    this.layer.add(this.add.rectangle(this.W / 2, gy + 30 + 400, this.W + 40, 800, 0x9b7453).setOrigin(0.5, 0));

    // khay khối
    const defs = this.play.blocks         ;
    this.tray = [];
    if (this.portrait) this.trayRect = { x: 20, y: gy + 50, w: this.W - 40, h: 230 };
    else this.trayRect = { x: 20, y: this.top + 10, w: 230, h: gy - this.top - 20 };
    const R = this.trayRect;
    this.layer.add(this.plate(R.x + R.w / 2, R.y + R.h / 2, R.w, R.h, 0xfffaf2, 0.9));
    const cols = this.portrait ? 7 : 2, rows = Math.ceil(defs.length / cols);
    defs.forEach((d     , i        ) => {
      const c = i % cols, r = Math.floor(i / cols);
      const cw = R.w / cols, ch = R.h / rows;
      const x = R.x + cw * (c + 0.5), y = R.y + ch * (r + 0.5);
      const img = this.fitImage(d.asset, x, y, cw - 16, ch - 14);
      img.setInteractive({ useHandCursor: true }).setData('def', d);
      img.on('pointerdown', (p     ) => this.startDrag(p, d, null));
      this.layer.add(img);
      this.tray.push(img);
    });

    // cờ đích (thử thách tháp)
    this.flagY = gy - (this.portrait ? 640 : 470);
    const fx = this.portrait ? this.W - 90 : this.W - 110;
    const flag = this.add.container(0, 0);
    const pole = this.add.rectangle(fx, (this.flagY + gy) / 2, 8, gy - this.flagY, 0x99643f);
    const cloth = this.add.triangle(fx + 4, this.flagY + 22, 0, 0, 0, 44, 64, 22, 0xf58aa8).setOrigin(0, 0.5);
    const line = this.add.graphics();
    line.lineStyle(4, 0xffffff, 0.8);
    for (let x = R.x + R.w + 20; x < fx - 10; x += 36) line.lineBetween(x, this.flagY, x + 18, this.flagY);
    flag.add([line, pole, cloth]);
    this.flag = flag;
    this.layer.add(flag);
    this.tweens.add({ targets: cloth, scaleX: 0.85, duration: 500, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    this.flag.setVisible(this.challenge === 'tower');
    this.achieved = false;
    this.buildBarExtras();
    this.time.delayedCall(300, () => this.say(this.instruction()));
  }

  buildBarExtras() {
    const p = document.getElementById('panel'); if (!p) return;
    let ex = p.querySelector('.builder-ex')               ;
    if (!ex) { ex = document.createElement('div'); ex.className = 'builder-ex'; p.appendChild(ex); }
    ex.innerHTML = `<div class="seg">${CHALLENGES.map((c) => `<button data-ch="${c.id}" class="${c.id === this.challenge ? 'on' : ''}">${Ui.esc(c.name)}</button>`).join('')}</div>
      <button class="btn" data-b="clear">Dọn hết</button><button class="btn accent" data-b="done">Xong rồi!</button>`;
    ex.onclick = (e     ) => {
      const b = e.target.closest('button'); if (!b) return;
      Audio.sfx('tap');
      if (b.dataset.ch) { this.challenge = b.dataset.ch; this.achieved = false; this.flag.setVisible(this.challenge === 'tower'); this.buildBarExtras(); this.say(this.instruction()); }
      else if (b.dataset.b === 'clear') { for (const k of this.blocks) k.destroy(); this.blocks = []; this.achieved = false; }
      else if (b.dataset.b === 'done') this.finishBuild();
    };
  }

  finishBuild() {
    if (this.done) return;
    if (this.blocks.length < 3) { this.say('Đặt thêm vài khối nữa rồi bấm "Xong rồi" nhé!'); return; }
    this.complete({ noAdapt: true });
  }

  // ───── kéo thả ─────
  startDrag(p     , def     , from     ) {
    if (this.done || this.dragging) return;
    const w = this.cameras.main.getWorldPoint(p.x, p.y);
    if (from) { from.destroy(); this.blocks = this.blocks.filter((b) => b !== from); }
    const img = this.add.image(w.x, w.y, def.asset).setScale(0.5 * K).setDepth(500).setAlpha(0.92);
    this.dragging = img; this.dragDef = def;
    Audio.sfx('pop');
  }
  moveDrag(p     ) {
    if (!this.dragging) return;
    const w = this.cameras.main.getWorldPoint(p.x, p.y);
    this.dragging.setPosition(w.x, w.y);
    this.dragging.setTint(this.inTray(w.x, w.y) ? 0xff9b9b : 0xffffff);
  }
  endDrag(_p     ) {
    if (!this.dragging) return;
    const img = this.dragging, def = this.dragDef;
    this.dragging = null; this.dragDef = null;
    const { x, y } = img; img.destroy();
    if (this.inTray(x, y)) { Audio.sfx('soft'); return; }   // thả lại vào khay = cất đi
    this.spawnBlock(def, x, y);
  }
  inTray(x        , y        ) { const R = this.trayRect; return x > R.x && x < R.x + R.w && y > R.y && y < R.y + R.h; }

  spawnBlock(def     , x        , y        ) {
    const opts      = { friction: 0.9, frictionStatic: 1, restitution: 0.02, density: 0.002, chamfer: def.body === 'rect' ? { radius: 3 } : undefined };
    const tw = def.w * 2, th = def.h * 2;   // kích thước texture (@2x)
    if (def.body === 'triangle') opts.shape = { type: 'fromVerts', verts: [{ x: 0, y: th }, { x: tw / 2, y: 0 }, { x: tw, y: th }] };
    else if (def.body === 'semicircle') {
      const verts = []; for (let i = 0; i <= 12; i++) { const a = Math.PI * i / 12; verts.push({ x: tw / 2 - Math.cos(a) * tw / 2, y: th - Math.sin(a) * th }); }
      opts.shape = { type: 'fromVerts', verts };
    }
    const b = this.matter.add.image(x, y, def.asset, undefined, opts);
    b.setScale(0.5 * K);
    if (opts.shape) {
      // Matter đặt thân theo trọng tâm → dời điểm neo ảnh cho khớp
      const body = b.body;
      const cx = (body.bounds.min.x + body.bounds.max.x) / 2, cy = (body.bounds.min.y + body.bounds.max.y) / 2;
      const dx = body.position.x - cx, dy = body.position.y - cy;
      b.setOrigin(0.5 + dx / b.displayWidth, 0.5 + dy / b.displayHeight);
    }
    b.setData('def', def);
    b.setInteractive({ useHandCursor: true });
    b.on('pointerdown', (p     ) => this.startDrag(p, def, b));
    this.blocks.push(b);
    this.placed++;
    Audio.sfx('place');
  }

  // ───── kiểm tra thử thách ─────
  checkGoal() {
    if (this.done || this.achieved || this.dragging || this.challenge === 'free') return;
    const resting = this.blocks.filter((b) => b.body && b.body.speed < 0.15);
    if (resting.length !== this.blocks.length || !this.blocks.length) { this.stableT = 0; return; }
    let ok = false;
    if (this.challenge === 'tower') ok = this.blocks.some((b) => b.body.bounds.min.y <= this.flagY);
    else if (this.challenge === 'house') {
      const roofs = this.blocks.filter((b) => b.getData('def').body !== 'rect');
      const gy = this.H - (this.portrait ? 300 : 70);
      ok = roofs.some((r) => {
        const below = this.blocks.filter((b) => b !== r && b.getData('def').body === 'rect' && Math.abs(b.x - r.x) < r.displayWidth * 0.6 && b.y > r.y);
        return below.length >= 2 && r.body.bounds.max.y < gy - 80;
      });
    }
    if (ok) {
      this.stableT += this.game.loop.delta;
      if (this.stableT > 900) {
        this.achieved = true;
        const top = this.blocks.reduce((a, b) => (b.y < a.y ? b : a));
        this.good(top.x, top.y - 40);
        this.confetti();
        this.say(this.challenge === 'tower' ? 'Oa, tháp cao chạm tới cờ rồi!' : 'Ngôi nhà đẹp quá! Có cả mái nữa!');
        const t = this.add.text(this.W / 2, this.top + 40, '★ Hoàn thành thử thách! ★', { fontFamily: FONT, fontSize: '54px', fontStyle: '800', color: '#f28a4e', stroke: '#fff', strokeThickness: 10 }).setOrigin(0.5).setDepth(900);
        this.tweens.add({ targets: t, scale: { from: 0.4, to: 1 }, duration: 400, ease: 'Back.easeOut' });
        this.time.delayedCall(2600, () => t.destroy());
      }
    } else this.stableT = 0;
  }
}
return { BuilderScene };
})();

/* ══════════ games/Sort.ts ══════════ */
M.Sort = (function () {
// ── Hoạt động thêm: Phân loại rác (Ngôi Làng Kỹ Năng) · Biển sạch (Đại Dương Khám Phá) ──
// Một scene, hai bộ nội dung — thêm bộ mới chỉ cần thêm mode.
const { AssetLoader } = M.AssetLoader;
const { Audio } = M.Audio;
const { MiniGame, shuffle } = M.MiniGame;
const SORT_NAMES                         = {
  'trash-bottle': 'chai nhựa', 'trash-can': 'lon nước', 'trash-paper': 'giấy vụn', 'trash-box': 'hộp giấy',
  'trash-banana-peel': 'vỏ chuối', 'trash-apple-core': 'lõi táo', 'trash-leaf': 'lá khô', 'trash-eggshell': 'vỏ trứng', 'trash-bag': 'túi ni lông',
  'sea-crab': 'bạn cua', 'sea-jellyfish': 'bạn sứa', 'sea-octopus': 'bạn bạch tuộc', 'animal-fish': 'bạn cá', 'animal-turtle': 'bạn rùa',
};

class SortScene extends MiniGame {
  queue           = []; current      = null; bins        = []; left = 0; floaters        = []; boat     ;
  constructor() { super('Sort'); }
  get play() { return AssetLoader.data('play'); }
  assets() {
    const S = this.play.sort;
    return [...S.recycle, ...S.organic, ...S.oceanTrash, ...S.seaLife, 'bin-recycle', 'bin-organic', 'sort-boat'];
  }
  instruction() {
    return this.mode === 'ocean' ? 'Chạm vào rác để nhặt lên thuyền. Các bạn sinh vật biển thì để yên nhé!'
      : 'Rác tái chế bỏ thùng xanh dương, rác hữu cơ bỏ thùng xanh lá nhé!';
  }

  buildRound() { if (this.mode === 'ocean') this.buildOcean(); else this.buildTrash(); }

  // ───── phân loại rác ─────
  buildTrash() {
    const S = this.play.sort;
    const n = [4, 6, 8, 10, 12][this.level - 1];
    const pool = [...S.recycle, ...S.organic];
    this.queue = shuffle(Array.from({ length: n }, (_, i) => pool[i % pool.length]));
    this.left = n;
    this.layer.add(this.label(this.W / 2, this.top + 30, 'Bỏ rác vào đúng thùng', 54));
    const by = this.H - (this.portrait ? 260 : 60);
    const defs = [
      { key: 'bin-recycle', kind: 'recycle', name: 'Tái chế', x: this.W / 2 - (this.portrait ? 220 : 330) },
      { key: 'bin-organic', kind: 'organic', name: 'Hữu cơ', x: this.W / 2 + (this.portrait ? 220 : 330) },
    ];
    this.bins = defs.map((d) => {
      const img = this.fitImage(d.key, d.x, by, 300, 360).setOrigin(0.5, 0.95);
      const t = this.label(d.x, by + 30, d.name, 40);
      this.layer.add([img, t]);
      return { ...d, img };
    });
    // hình nhỏ minh hoạ dưới mỗi thùng (cấp thấp)
    if (this.level <= 2) {
      this.layer.add(this.fitImage(S.recycle[0], defs[0].x + 110, by - 300, 70, 70));
      this.layer.add(this.fitImage(S.organic[0], defs[1].x + 110, by - 300, 70, 70));
    }
    this.nextItem();
    this.time.delayedCall(300, () => this.say(this.instruction()));
  }

  nextItem() {
    const key = this.queue.shift();
    if (!key) { this.complete(); return; }
    const S = this.play.sort;
    const kind = S.recycle.includes(key) ? 'recycle' : 'organic';
    const x = this.W / 2, y = this.portrait ? this.top + 380 : this.top + 240;
    const it = this.fitImage(key, x, y, 200, 200);
    it.setData({ key, kind, home: { x, y } });
    it.setInteractive({ draggable: true, useHandCursor: true });
    this.input.setDraggable(it);
    it.setScale(0);
    this.tweens.add({ targets: it, scale: it.getData('baseScale'), duration: 300, ease: 'Back.easeOut' });
    it.on('drag', (_p     , px        , py        ) => { it.setPosition(px, py); for (const b of this.bins) b.img.setScale(b.img.getData('baseScale') * (this.overBin(it) === b ? 1.08 : 1)); });
    it.on('dragstart', () => Audio.sfx('pop'));
    it.on('dragend', () => this.dropItem(it));
    this.layer.add(it);
    this.current = it;
    if (this.level <= 2) this.time.delayedCall(400, () => Audio.say(SORT_NAMES[key]));
  }
  overBin(it     ) { return this.bins.find((b) => Math.abs(it.x - b.x) < 150 && it.y > b.img.y - 380 && it.y < b.img.y + 20); }

  dropItem(it     ) {
    const b = this.overBin(it);
    for (const x of this.bins) x.img.setScale(x.img.getData('baseScale'));
    if (b && b.kind === it.getData('kind')) {
      it.disableInteractive();
      this.tweens.add({ targets: it, x: b.x, y: b.img.y - 250, scale: 0.1, duration: 280, ease: 'Quad.easeIn', onComplete: () => it.destroy() });
      this.tweens.add({ targets: b.img, scaleY: b.img.getData('baseScale') * 0.92, duration: 100, yoyo: true, delay: 250 });
      this.good(b.x, b.img.y - 280, Math.random() < 0.4);
      this.left--;
      this.time.delayedCall(500, () => this.nextItem());
    } else {
      if (b) {
        const name = SORT_NAMES[it.getData('key')];
        this.miss(b.img, it.getData('kind') === 'recycle' ? `${cap(name)} tái chế được, bỏ thùng xanh dương nhé!` : `${cap(name)} là rác hữu cơ, bỏ thùng xanh lá nhé!`);
      }
      const h = it.getData('home');
      this.tweens.add({ targets: it, x: h.x, y: h.y, duration: 300, ease: 'Back.easeOut' });
    }
  }

  // ───── biển sạch ─────
  buildOcean() {
    const S = this.play.sort;
    const nT = [4, 5, 6, 8, 10][this.level - 1], nL = [2, 3, 4, 5, 6][this.level - 1];
    this.left = nT;
    this.layer.add(this.label(this.W / 2, this.top + 30, 'Nhặt hết rác dưới biển', 54));
    const bx = this.portrait ? this.W / 2 : this.W - 230, byy = this.portrait ? this.H - 250 : this.H - 140;
    this.boat = this.fitImage('sort-boat', bx, byy, 380, 240);
    this.layer.add(this.boat);
    this.tweens.add({ targets: this.boat, y: byy - 8, angle: 2, duration: 1300, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    const things = shuffle([
      ...Array.from({ length: nT }, (_, i) => ({ key: S.oceanTrash[i % S.oceanTrash.length], trash: true })),
      ...Array.from({ length: nL }, (_, i) => ({ key: S.seaLife[i % S.seaLife.length], trash: false })),
    ]);
    const area = this.portrait ? { x: 60, y: this.top + 120, w: this.W - 120, h: this.H - this.top - 520 } : { x: 300, y: this.top + 110, w: this.W - 700, h: this.H - this.top - 200 };
    const pts                     = [];
    for (let t = 0; pts.length < things.length && t < 3000; t++) {
      const x = area.x + Math.random() * area.w, y = area.y + Math.random() * area.h;
      if (pts.every(([a, b]) => Math.hypot(a - x, b - y) > (t > 2000 ? 100 : 150))) pts.push([x, y]);
    }
    things.forEach((th, i) => {
      const [x, y] = pts[i] || [area.x + area.w / 2, area.y + area.h / 2];
      const s = this.fitImage(th.key, x, y, th.trash ? 140 : 170, th.trash ? 140 : 170);
      s.setData(th).setInteractive({ useHandCursor: true });
      s.setAngle(th.trash ? Math.random() * 40 - 20 : 0);
      this.tweens.add({ targets: s, y: y - 18, x: x + (Math.random() - 0.5) * 30, duration: 1400 + Math.random() * 900, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
      s.on('pointerup', () => this.tapOcean(s));
      this.layer.add(s);
    });
    this.time.delayedCall(300, () => this.say(this.instruction()));
  }

  tapOcean(s     ) {
    if (this.busy) return;
    if (s.getData('trash')) {
      s.disableInteractive();
      this.tweens.killTweensOf(s);
      Audio.sfx('whoosh');
      this.tweens.add({ targets: s, x: this.boat.x + (Math.random() - 0.5) * 80, y: this.boat.y - 40, scale: s.getData('baseScale') * 0.4, angle: 360, duration: 520, ease: 'Cubic.easeIn', onComplete: () => { s.destroy(); this.sparkle(this.boat.x, this.boat.y - 40, 6); } });
      Audio.sfx('pop');
      if (--this.left <= 0) {
        this.busy = true;
        this.time.delayedCall(700, () => { this.say('Biển sạch rồi! Các bạn sinh vật biển cảm ơn bạn!'); this.complete(); });
      }
    } else {
      // không phạt: bạn sinh vật biển vẫy chào
      this.mistakes += 0.5;
      Audio.sfx('bloop');
      this.tweens.add({ targets: s, angle: { from: -12, to: 12 }, duration: 120, yoyo: true, repeat: 3, onComplete: () => s.setAngle(0) });
      this.say(`Mình là ${SORT_NAMES[s.getData('key')]}, mình sống ở biển! Hãy nhặt rác thôi nhé.`);
    }
  }
}
const cap = (s        ) => s.charAt(0).toUpperCase() + s.slice(1);
return { SORT_NAMES, SortScene };
})();

/* ══════════ games/Pattern.ts ══════════ */
M.Pattern = (function () {
// ── Hoạt động: Tìm quy luật (Núi Toán Học) — xem dãy hình lặp lại, chọn hình còn thiếu ──
// Cấp 1: AB, ô trống cuối, 2 lựa chọn · cấp 2: + AAB, 3 lựa chọn · cấp 3: + ABB, ABC
// cấp 4: ô trống ở giữa dãy, 4 lựa chọn · cấp 5: + AABB, ABCD, hai ô trống.
const { AssetLoader } = M.AssetLoader;
const { Audio } = M.Audio;
const { MiniGame, shuffle, randInt } = M.MiniGame;
const UNITS                           = {
  1: ['AB'],
  2: ['AB', 'AAB'],
  3: ['AAB', 'ABB', 'ABC'],
  4: ['AAB', 'ABB', 'ABC', 'AABB'],
  5: ['ABC', 'AABB', 'ABCD', 'ABBC'],
};
// nốt nhạc cho từng chữ trong quy luật: bé "nghe" được nhịp lặp lại
const PITCH                         = { A: 523, B: 659, C: 784, D: 988 };

                                                

class PatternScene extends MiniGame {
  seq          = []; letters = ''; blanks           = []; cells        = []; options        = []; cell = 150;
  constructor() { super('Pattern'); }
  get play() { return AssetLoader.data('play'); }
  assets() { const P = this.play; return [...P.items.map((i     ) => i.asset), ...P.shapes.map((s     ) => s.asset), ...P.animals.slice(0, 8).map((a     ) => a.asset)]; }
  instruction() { return this.blanks.length > 1 ? 'Dãy hình lặp lại theo quy luật. Tìm các hình còn thiếu nhé!' : 'Dãy hình lặp lại theo quy luật. Hình nào còn thiếu nhỉ?'; }

  /** Bộ đồ vật cho một vòng: đồ ăn, hình khối, hoặc bạn thú. */
  pool()          {
    const P = this.play;
    const sets            = [
      P.items.map((i     ) => ({ asset: i.asset, name: i.name })),
      P.shapes.filter((s     ) => s.w === s.h).map((s     ) => ({ asset: s.asset, name: s.name.toLowerCase() })),
      P.animals.slice(0, 8).map((a     ) => ({ asset: a.asset, name: 'bạn ' + a.name.toLowerCase() })),
    ];
    return shuffle(sets[this.round % sets.length]);
  }

  buildRound() {
    const unit = UNITS[this.level][randInt(0, UNITS[this.level].length - 1)];
    const kinds = [...new Set(unit.split(''))];
    const things = this.pool();
    const map                        = {};
    kinds.forEach((k, i) => (map[k] = things[i]));
    const len = Math.max(6, Math.min(unit.length * 3, unit.length >= 4 ? 8 : unit.length * 2 + (this.level >= 3 ? unit.length : 1)));
    this.letters = Array.from({ length: len }, (_, i) => unit[i % unit.length]).join('');
    this.seq = this.letters.split('').map((k) => map[k]);
    // vị trí ô trống
    if (this.level <= 3) this.blanks = [len - 1];
    else if (this.level === 4) this.blanks = [randInt(unit.length, len - 1)];
    else { const a = randInt(unit.length, len - 2); this.blanks = [a, randInt(a + 1, len - 1)]; }

    this.layer.add(this.label(this.W / 2, this.top + 30, this.blanks.length > 1 ? 'Tìm các hình còn thiếu' : 'Hình nào còn thiếu?', 54));

    // dãy hình: một hàng (ngang) hoặc hai hàng (dọc khi dãy dài)
    const rows = this.portrait && len > 5 ? 2 : 1;
    const perRow = Math.ceil(len / rows);
    this.cell = Math.min(180, (this.W - 100) / perRow);
    const y0 = this.portrait ? this.top + 260 : this.top + 250;
    const rowGap = this.cell + 30;
    this.layer.add(this.plate(this.W / 2, y0 + (rows - 1) * rowGap / 2, perRow * this.cell + 50, rows * rowGap + 20, 0xfffaf2, 0.85));
    this.cells = this.seq.map((t, i) => {
      const r = Math.floor(i / perRow), c = i % perRow, n = Math.min(perRow, len - r * perRow);
      const x = this.W / 2 + (c - (n - 1) / 2) * this.cell, y = y0 + r * rowGap;
      const blank = this.blanks.includes(i);
      const box = this.add.graphics();
      this.drawBox(box, x, y, blank);
      const img = this.fitImage(t.asset, x, y, this.cell * 0.72, this.cell * 0.72);
      img.setData('i', i);
      if (blank) img.setVisible(false);
      else {
        img.setScale(0);
        this.tweens.add({ targets: img, scale: img.getData('baseScale'), delay: i * 90, duration: 260, ease: 'Back.easeOut', onStart: () => this.note(this.letters[i], 0.08) });
      }
      const q = blank ? this.label(x, y, '?', this.cell * 0.5, '#9b85d9') : null;
      this.layer.add([box, img, ...(q ? [q] : [])]);
      return { x, y, box, img, q, filled: !blank };
    });

    // lựa chọn: các hình trong dãy + hình lạ
    const nOpt = [2, 3, 3, 4, 4][this.level - 1];
    const needed = [...new Set(this.blanks.map((b) => this.seq[b]))];
    const inSeq = kinds.map((k) => map[k]).filter((t) => !needed.includes(t));
    const extra = things.filter((t) => !kinds.some((k) => map[k] === t));
    const opts = shuffle([...needed, ...shuffle([...inSeq, ...extra]).slice(0, Math.max(0, nOpt - needed.length))]);
    const oy = this.portrait ? y0 + rows * rowGap + 260 : this.H - 170;
    const ow = Math.min(230, (this.W - 120) / opts.length);
    this.layer.add(this.plate(this.W / 2, oy, opts.length * ow + 40, ow + 20, 0xf3fbef, 0.85));
    this.options = opts.map((t, i) => {
      const x = this.W / 2 + (i - (opts.length - 1) / 2) * ow;
      const img = this.fitImage(t.asset, x, oy, ow * 0.7, ow * 0.7);
      img.setData({ t, home: { x, y: oy } }).setInteractive({ useHandCursor: true, draggable: true });
      this.input.setDraggable(img);
      img.on('pointerup', (p     ) => { if (p.getDistance() < 12) this.choose(img); });
      img.on('dragstart', () => { if (!this.busy) { Audio.sfx('pop'); this.layer.bringToTop(img); } });
      img.on('drag', (_p     , px        , py        ) => { if (!this.busy) img.setPosition(px, py); });
      img.on('dragend', (p     ) => { if (p.getDistance() >= 12) this.dropOn(img); });
      this.layer.add(img);
      return img;
    });
    this.time.delayedCall(len * 90 + 300, () => this.say(this.instruction()));
  }

  drawBox(g     , x        , y        , blank         , ok = false) {
    const s = this.cell * 0.86;
    g.clear();
    g.fillStyle(ok ? 0xe3f6d6 : blank ? 0xf1ebfb : 0xffffff, 1).fillRoundedRect(x - s / 2, y - s / 2, s, s, 22);
    g.lineStyle(5, ok ? 0x7cc96a : blank ? 0xc7b5f0 : 0xeadfce, 1).strokeRoundedRect(x - s / 2, y - s / 2, s, s, 22);
  }

  note(letter        , vol = 0.12) {
    if (!this.sys.isActive()) return;
    Audio.tone(PITCH[letter] || 600, 0.22, vol);
  }

  /** Ô trống tiếp theo (bé chạm vào lựa chọn thì điền ô này). */
  nextBlank() { return this.blanks.find((b) => !this.cells[b].filled); }

  choose(img     ) { const b = this.nextBlank(); if (b !== undefined) this.tryFill(img, b); }
  dropOn(img     ) {
    const open = this.blanks.filter((b) => !this.cells[b].filled)
      .map((b) => ({ b, d: Math.hypot(this.cells[b].x - img.x, this.cells[b].y - img.y) })).sort((a, z) => a.d - z.d)[0];
    if (open && open.d < this.cell) this.tryFill(img, open.b);
    else this.goHome(img);
  }
  goHome(img     ) { const h = img.getData('home'); this.tweens.add({ targets: img, x: h.x, y: h.y, duration: 260, ease: 'Back.easeOut' }); }

  tryFill(img     , b        ) {
    if (this.busy) return;
    const want = this.seq[b], got = img.getData('t')         , cell = this.cells[b];
    if (got === want) {
      cell.filled = true;
      this.busy = true;
      this.tweens.add({ targets: img, x: cell.x, y: cell.y, duration: 240, ease: 'Cubic.easeOut', onComplete: () => {
        img.setPosition(img.getData('home').x, img.getData('home').y).setScale(0);
        this.tweens.add({ targets: img, scale: img.getData('baseScale'), duration: 200 });
        cell.img.setVisible(true); cell.q?.destroy(); this.drawBox(cell.box, cell.x, cell.y, false, true);
        this.pulse(cell.img, 1.15);
        this.good(cell.x, cell.y, false);
        this.busy = false;
        if (this.nextBlank() === undefined) this.finishRound();
      } });
    } else {
      // gợi ý: chỉ ra phần lặp lại ngay trước ô trống
      const unitLen = this.unitLength();
      const ref = b - unitLen >= 0 ? b - unitLen : b + unitLen;
      this.miss(img, this.roundMistakes >= 1 ? `Nhìn ô cách ${unitLen} ô phía trước xem. Đó là ${this.seq[ref].name}!` : 'Chưa đúng rồi. Nhìn kỹ dãy hình lặp lại nhé!');
      if (this.roundMistakes >= 2 && this.cells[ref]) this.pulse(this.cells[ref].img, 1.3);
      this.goHome(img);
    }
  }

  unitLength() {
    for (let k = 1; k <= this.letters.length; k++) if (this.letters.split('').every((c, i) => c === this.letters[i % k])) return k;
    return this.letters.length;
  }

  /** Cả dãy "hát" lại từng hình, rồi sang vòng mới. */
  finishRound() {
    this.busy = true;
    this.cells.forEach((c, i) => this.time.delayedCall(i * 140, () => { this.note(this.letters[i]); this.pulse(c.img, 1.18); }));
    if (Math.random() < 0.6) this.say('Đúng quy luật rồi!', false);
    this.petReact('happy');
    this.nextRound(this.cells.length * 140 + 700);
  }
}
return { PatternScene };
})();

/* ══════════ games/Coloring.ts ══════════ */
M.Coloring = (function () {
// ── Hoạt động: Bé tô màu (Thị Trấn Sáng Tạo) ──
// Cấp 1–2: tô tự do — chọn bút, chạm vào ô để tô; tô hết các ô là xong.
// Cấp 3–5: tô theo mẫu — tranh mẫu nhỏ ở góc, mỗi ô phải đúng màu của mẫu.
const { Audio } = M.Audio;
const { Store } = M.Store;
const { MiniGame } = M.MiniGame;
const { PICTURES, CRAYONS, crayon, Picture, Region, Detail } = M.Pictures;
const INK = 0x4b3a5e, BLANK = 0xffffff;

class ColoringScene extends MiniGame {
  pic          = PICTURES[0];
  copy = false;
  color = CRAYONS[2];
  painted                         = {};
  regionGfx                      = {};
  crayonObjs        = [];
  S = 600; ox = 0; oy = 0; k = 1; maskG      = null;
  constructor() { super('Coloring'); }

  init(data     ) {
    super.init(data);
    this.painted = {}; this.pic = null       ;
  }

  instruction() {
    return this.copy ? 'Nhìn tranh mẫu ở góc, chọn bút đúng màu rồi chạm vào từng ô để tô nhé!'
      : 'Chọn một cây bút màu, rồi chạm vào bức tranh để tô. Bé thích màu nào cũng được!';
  }

  setup() {
    this.copy = this.level >= 3;
    // ưu tiên tranh bé chưa tô gần đây
    const pool = PICTURES.filter((p) => p.diff <= Math.min(3, Math.ceil(this.level / 2) + (this.level >= 4 ? 1 : 0)));
    const recent = (Store.p?.history || []).filter((h) => h.act === this.act.id).length;
    this.pic = pool[(recent + Math.floor(Math.random() * pool.length)) % pool.length];
  }

  /** Đổi chiều màn hình: giữ màu đã tô. */
  relayout() { this.startRound(true); }

  buildRound() {
    this.regionGfx = {}; this.crayonObjs = [];
    const portrait = this.portrait;
    const TS = portrait ? 170 : 250;   // cỡ tranh mẫu
    if (portrait && this.copy) this.layer.add(this.label((this.W - TS - 60) / 2, this.top + 80, `Tô ${this.pic.name.toLowerCase()}\ngiống tranh mẫu`, 46));
    else this.layer.add(this.label(this.W / 2, this.top + 26, this.copy ? `Tô ${this.pic.name.toLowerCase()} giống tranh mẫu` : `Tô màu ${this.pic.name.toLowerCase()}`, 50));

    // khung tranh
    if (portrait) {
      // trên: (tranh mẫu) · giữa: tranh · dưới: một hàng bút, chừa góc dưới cho bạn thú
      this.oy = this.top + (this.copy ? 250 : 90);
      this.S = Math.min(this.W - 80, this.H - this.oy - 430);
      this.ox = (this.W - this.S) / 2;
    } else {
      // trái: tranh mẫu (hoặc chỗ trống cho bạn thú) · giữa: tranh · phải: hộp bút
      const left = this.copy ? 300 : 200, right = 420;
      this.S = Math.min(this.H - this.top - 110, this.W - left - right - 60);
      this.ox = left + (this.W - left - right - this.S) / 2; this.oy = this.top + 80;
    }
    this.k = this.S / 600;
    this.layer.add(this.plate(this.ox + this.S / 2, this.oy + this.S / 2, this.S + 36, this.S + 36, 0xffffff, 1, 30));
    this.maskG?.destroy();
    const mask = this.maskG = this.make.graphics({}, false).fillStyle(0xffffff).fillRoundedRect(this.ox, this.oy, this.S, this.S, 18);
    const picBox = this.add.container(0, 0);
    picBox.setMask(mask.createGeometryMask());
    this.layer.add(picBox);
    for (const r of this.pic.regions) {
      const g = this.add.graphics().setPosition(this.ox, this.oy).setScale(this.k);
      g.setInteractive(new Phaser.Geom.Polygon(r.pts), Phaser.Geom.Polygon.Contains);
      g.input.cursor = 'pointer';
      g.on('pointerup', (p     ) => { if (p.getDistance() < 30) this.paint(r, p); });
      this.regionGfx[r.id] = g;
      this.drawRegion(r);
      picBox.add(g);
    }
    const det = this.add.graphics().setPosition(this.ox, this.oy).setScale(this.k);
    this.drawDetails(det, this.pic.details, 1);
    picBox.add(det);

    // tranh mẫu
    if (this.copy) {
      const ts = TS;
      const tx = portrait ? this.W - ts - 45 : 45, ty = portrait ? this.top - 10 : this.top + 120;
      this.layer.add(this.plate(tx + ts / 2, ty + ts / 2 + 22, ts + 24, ts + 70, 0xfffaf2, 1, 22));
      const t = this.add.graphics().setPosition(tx, ty + 34).setScale(ts / 600);
      for (const r of this.pic.regions) this.fillPoly(t, r.pts, crayon(r.c).color, 7);
      this.drawDetails(t, this.pic.details, 1.4);
      this.layer.add([t, this.label(tx + ts / 2, ty + 12, 'Tranh mẫu', 30)]);
    }

    // bút màu
    const n = CRAYONS.length;
    if (portrait) {
      const cw = (this.W - 40) / n, y = this.oy + this.S + 170;
      this.layer.add(this.plate(this.W / 2, y + 10, this.W - 20, 230, 0xfffaf2, 0.9, 30));
      CRAYONS.forEach((c, i) => this.addCrayon(c, this.W / 2 + (i - (n - 1) / 2) * cw, y, false));
    } else {
      const cols = 2, rows = Math.ceil(n / cols), ch = Math.min(112, (this.S + 20) / rows);
      const cx = this.W - 220, y0 = this.oy + this.S / 2 - ((rows - 1) * ch) / 2;
      this.layer.add(this.plate(cx, this.oy + this.S / 2, 400, rows * ch + 40, 0xfffaf2, 0.9, 30));
      CRAYONS.forEach((c, i) => this.addCrayon(c, cx - 90 + (i % cols) * 190 - (i % cols) * 10, y0 + Math.floor(i / cols) * ch, true));
    }
    this.selectCrayon(this.color, false);
    this.time.delayedCall(300, () => this.say(this.instruction()));
  }

  fillPoly(g     , pts       , color        , lw        ) {
    g.fillStyle(color, 1).fillPoints(pts, true, true);
    g.lineStyle(lw, INK, 1).strokePoints(pts, true, true);
  }
  drawRegion(r        , flash = false) {
    const g = this.regionGfx[r.id]; if (!g) return;
    g.clear();
    const c = this.painted[r.id];
    this.fillPoly(g, r.pts, flash ? 0xfff0b3 : c ?? BLANK, 5 / this.k);
  }
  drawDetails(g     , ds          , wk        ) {
    for (const d of ds) {
      if (d.k === 'line') g.lineStyle((d.w || 4) * wk, INK, 1).strokePoints(d.pts, false, false);
      else g.fillStyle(d.fill ?? INK, 1).fillCircle(d.x, d.y, d.r);
    }
  }

  /** Bút sáp: thân + đầu nhọn, nằm ngang (ngang) hoặc đứng (dọc). */
  addCrayon(c                                             , x        , y        , horizontal         ) {
    const box = this.add.container(x, y);
    const g = this.add.graphics();
    const dark = Phaser.Display.Color.IntegerToColor(c.color).darken(25).color;
    if (horizontal) {
      g.fillStyle(0x4c3876, 0.15).fillRoundedRect(-44, -18, 88, 44, 12);
      g.fillStyle(c.color, 1).fillRoundedRect(-48, -22, 72, 44, 12);
      g.fillTriangle(22, -16, 22, 16, 50, 0);
      g.fillStyle(dark, 1).fillRect(-30, -22, 10, 44).fillRect(-6, -22, 10, 44);
      g.fillStyle(0xffffff, 0.4).fillRoundedRect(-42, -16, 56, 8, 4);
      g.lineStyle(4, INK, 1).strokeRoundedRect(-48, -22, 72, 44, 12).strokeTriangle(24, -16, 24, 16, 50, 0);
      box.setSize(110, 60).setScale(1.3);
    } else {
      g.fillStyle(0x4c3876, 0.15).fillRoundedRect(-18, -40, 44, 96, 12);
      g.fillStyle(c.color, 1).fillRoundedRect(-22, -28, 44, 80, 12);
      g.fillTriangle(-16, -26, 16, -26, 0, -60);
      g.fillStyle(dark, 1).fillRect(-22, -6, 44, 10).fillRect(-22, 20, 44, 10);
      g.fillStyle(0xffffff, 0.4).fillRoundedRect(-16, -20, 8, 64, 4);
      g.lineStyle(4, INK, 1).strokeRoundedRect(-22, -28, 44, 80, 12).strokeTriangle(-16, -28, 16, -28, 0, -60);
      box.setSize(70, 130).setScale(1.4);
    }
    box.add(g);
    box.setInteractive({ useHandCursor: true });
    box.setData({ c, home: { x, y }, horizontal });
    box.on('pointerup', () => { Audio.sfx('tap'); this.selectCrayon(c); });
    this.crayonObjs.push(box);
    this.layer.add(box);
  }
  selectCrayon(c                                             , speak = true) {
    this.color = c;
    for (const b of this.crayonObjs) {
      const on = b.getData('c').id === c.id, h = b.getData('home');
      this.tweens.add({ targets: b, x: h.x - (on && b.getData('horizontal') ? 26 : 0), y: h.y - (on && !b.getData('horizontal') ? 26 : 0), scale: (b.getData('horizontal') ? 1.3 : 1.4) * (on ? 1.15 : 1), duration: 160, ease: 'Back.easeOut' });
    }
    if (speak) Audio.say('Màu ' + c.name);
  }

  paint(r        , p     ) {
    if (this.busy) return;
    const want = crayon(r.c);
    if (this.copy && this.color.id !== want.id) {
      if (this.painted[r.id] === want.color) return;
      this.miss(undefined, this.roundMistakes >= 1 ? `Trong tranh mẫu, ${r.name} màu ${want.name}. Chọn bút ${want.name} nhé!` : `Ô này trong tranh mẫu không phải màu ${this.color.name} đâu.`);
      if (this.roundMistakes >= 2) { const b = this.crayonObjs.find((o) => o.getData('c').id === want.id); if (b) this.tweens.add({ targets: b, angle: { from: -10, to: 10 }, duration: 90, yoyo: true, repeat: 3, onComplete: () => b.setAngle(0) }); }
      return;
    }
    const first = this.painted[r.id] === undefined;
    this.painted[r.id] = this.color.color;
    this.drawRegion(r, true);
    this.time.delayedCall(70, () => this.drawRegion(r));
    Audio.sfx(first ? 'pop' : 'tap');
    const wp = this.cameras.main.getWorldPoint(p.x, p.y);
    this.sparkle(wp.x, wp.y, 6);
    if (this.isDone()) this.finishPicture();
  }

  isDone() {
    return this.pic.regions.filter((r) => !r.opt).every((r) => this.painted[r.id] !== undefined && (!this.copy || this.painted[r.id] === crayon(r.c).color));
  }

  finishPicture() {
    this.busy = true;
    this.say(this.copy ? 'Giống hệt tranh mẫu luôn! Bé tô đẹp quá!' : 'Bức tranh đẹp quá! Bé là hoạ sĩ nhí!');
    this.good(this.ox + this.S / 2, this.oy + this.S / 2, false);
    this.time.delayedCall(1300, () => this.complete());
  }

  hint() {
    if (!this.copy) { this.say(this.instruction()); return; }
    const r = this.pic.regions.find((x) => !x.opt && this.painted[x.id] !== crayon(x.c).color);
    if (!r) return;
    this.say(`Tô ${r.name} màu ${crayon(r.c).name} nhé!`);
    let n = 0;
    this.time.addEvent({ delay: 180, repeat: 5, callback: () => { this.drawRegion(r, n++ % 2 === 0); } });
  }
}
return { ColoringScene };
})();

/* ══════════ games/PetCare.ts ══════════ */
M.PetCare = (function () {
// ── Hoạt động: Chăm bạn thú (Ngôi Làng Kỹ Năng) ──
// Bạn đồng hành của bé nghĩ trong bong bóng: đói, khát, lấm bùn, buồn ngủ, muốn chơi, lông rối.
// Bé chọn đúng đồ (kéo vào bạn thú hoặc chạm) — lấm bùn / lông rối thì phải chà, chải cho sạch.
// Cấp 1: 3 lượt, 3 đồ, nói tên đồ cần · cấp 5: 6 lượt, 6 đồ, chỉ có bong bóng gợi ý.
const { AssetLoader } = M.AssetLoader;
const { Audio } = M.Audio;
const { MiniGame, shuffle, randInt } = M.MiniGame;
const EASY = ['hungry', 'thirsty', 'sleepy', 'play', 'dirty'];

class PetCareScene extends MiniGame {
  needs         = []; care       = null       ;
  phase                              = 'choose';
  tools        = []; fx     ; spots        = []; bubble     ; scrubber      = null;
  px = 0; feet = 0; ps = 2.4;
  constructor() { super('PetCare'); }
  get careList()         { return AssetLoader.data('play').care; }
  assets() { return this.careList.flatMap((c) => [c.need, c.tool]); }
  instruction() {
    if (this.phase === 'scrub') return this.care.id === 'dirty' ? 'Kéo bọt biển chà lên các vết bùn nhé!' : 'Kéo lược chải lên chỗ lông rối nhé!';
    return this.care ? `${this.care.say} Bạn ấy cần gì nhỉ? Kéo đồ vào bạn ấy nhé!` : this.act.desc;
  }

  setup() {
    this.rounds = [3, 4, 5, 5, 6][this.level - 1];
    const pool = this.level <= 2 ? this.careList.filter((c) => EASY.includes(c.id)) : this.careList;
    // không lặp lại nhu cầu liền nhau
    this.needs = [];
    while (this.needs.length < this.rounds) {
      for (const c of shuffle(pool)) if (this.needs.length < this.rounds && this.needs[this.needs.length - 1] !== c) this.needs.push(c);
    }
    this.fx = this.add.container(0, 0).setDepth(820);
    this.updateDots();
  }

  // bạn thú to ở giữa màn hình (thay cho bạn nhỏ ở góc)
  placePet() {
    const s = this.petSprite; if (!s) return;
    this.ps = this.portrait ? 3.1 : 2.3;
    this.px = this.portrait ? this.W / 2 - 40 : this.W * 0.4;
    this.feet = this.portrait ? this.H - 560 : this.H - 250;
    s.setScale(this.ps).setPosition(this.px, this.feet);
  }
  get petH() { return 160 * this.ps; }
  /** Tâm thân bạn thú (để đặt vết bùn, kiểm tra thả đồ). */
  get body() { return { x: this.px, y: this.feet - this.petH * 0.4, rx: this.petH * 0.28, ry: this.petH * 0.3 }; }

  buildRound() {
    this.care = this.needs[this.round];
    this.phase = 'choose'; this.scrubber = null;
    this.fx.removeAll(true); this.spots = [];
    this.tweens.killTweensOf(this.petSprite);
    this.placePet();
    this.petPlay('idle-front');
    this.layer.add(this.label(this.W / 2, this.top + 30, 'Bạn thú cần gì nhỉ?', 54));

    // bong bóng ý nghĩ
    const b = this.body;
    const bx = this.px + this.petH * 0.5, by = this.feet - this.petH * 0.98;
    const g = this.add.graphics();
    g.fillStyle(0x4c3876, 0.12).fillEllipse(bx + 6, by + 10, 230, 190);
