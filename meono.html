<html lang="vi">

<title>Exploding Kittens — Mèo Nổ</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1020'/%3E%3Ccircle cx='16' cy='18' r='9' fill='%23ff4d6d'/%3E%3Cpath d='M9 12l2-7 4 4zM23 12l-2-7-4 4z' fill='%23ff4d6d'/%3E%3Ccircle cx='12.5' cy='17' r='1.8' fill='%230b1020'/%3E%3Ccircle cx='19.5' cy='17' r='1.8' fill='%230b1020'/%3E%3Cpath d='M16 7c1-3 3-3 4-5' stroke='%23ffd166' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg0: #0b1020; --bg1: #141a33; --glass: rgba(255,255,255,.06); --glass2: rgba(255,255,255,.1); --line: rgba(255,255,255,.12);
  --txt: #eef2ff; --muted: #9aa3c7; --pri: #ff4d6d; --pri2: #ff8a5b; --ok: #22c55e; --warn: #fbbf24;
  --cw: 86px; --r: 16px;
}
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: var(--txt);
  background: radial-gradient(1200px 600px at 20% -10%, #2a2f6a 0%, transparent 60%), radial-gradient(900px 500px at 110% 110%, #4a1d3f 0%, transparent 60%), linear-gradient(180deg, var(--bg0), var(--bg1));
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; overscroll-behavior: none;
  display: grid; grid-template-columns: 100%; grid-template-rows: auto auto minmax(0, 1fr) auto auto auto;
  grid-template-areas: "top" "opps" "table" "hint" "hand" "bar";
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
h1, h2, h3, .ttl, .btn { font-family: 'Outfit', 'Be Vietnam Pro', sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:disabled { opacity: .35; cursor: default; }
[hidden] { display: none !important; }
::-webkit-scrollbar { display: none; }

/* ── top ── */
.top { grid-area: top; display: flex; align-items: center; gap: 8px; padding: 10px 14px 6px; max-width: 1000px; width: 100%; margin: 0 auto; }
.ib { width: 40px; height: 40px; flex: 0 0 auto; border-radius: 12px; display: grid; place-items: center; background: var(--glass); border: 1px solid var(--line); color: var(--txt); text-decoration: none; font-size: 18px; font-weight: 700; backdrop-filter: blur(10px); transition: background .15s; }
.ib:hover { background: var(--glass2); }
.top h1 { font-size: 20px; font-weight: 800; letter-spacing: .3px; flex: 1; white-space: nowrap; min-width: 0; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; }
.top h1 small { overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 480px) { .top h1 { font-size: 17px; } .top { gap: 6px; } .ib { width: 36px; height: 36px; font-size: 16px; } }
.top h1 b { color: var(--pri); }
.top h1 small { display: block; font-family: 'Be Vietnam Pro'; font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: 0; }

/* ── opponents ── */
.opps { grid-area: opps; display: flex; justify-content: center; align-items: flex-start; gap: 10px; padding: 8px 10px 4px; flex-wrap: wrap; }
.opp { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; width: 92px; padding: 8px 6px 7px; background: var(--glass); border: 1px solid var(--line); border-radius: var(--r); backdrop-filter: blur(10px); transition: transform .25s, box-shadow .25s, opacity .3s; }
.opp .av { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; background: linear-gradient(135deg, #2a3160, #1b2046); border: 2px solid var(--line); position: relative; }
.opp.turn { transform: translateY(-3px); box-shadow: 0 0 0 2px var(--pri), 0 12px 30px rgba(255,77,109,.25); background: rgba(255,77,109,.08); }
.opp.turn .av { border-color: var(--pri); animation: ring 1.4s ease-in-out infinite; }
@keyframes ring { 50% { box-shadow: 0 0 0 6px rgba(255,77,109,.25); } }
.opp.dead { opacity: .45; } .opp.dead .av { filter: grayscale(1); }
.opp.hit { animation: hit .45s ease-out; }
@keyframes hit { 15% { transform: translate(-5px, 2px) rotate(-3deg); } 40% { transform: translate(5px, -3px) rotate(3deg); } 70% { transform: translate(-3px, 1px); } }
.opp .nm { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.opp .ct { font-size: 11px; color: var(--muted); font-weight: 500; }
.opp .ct b { color: var(--txt); font-weight: 700; }
.opp .tl { position: absolute; top: -8px; right: -6px; background: var(--pri); color: #fff; font-size: 11px; font-weight: 800; border-radius: 999px; padding: 1px 7px; box-shadow: 0 4px 12px rgba(255,77,109,.5); }
.opp .bub { position: absolute; top: -30px; left: 50%; transform: translateX(-50%) translateY(6px); white-space: nowrap; background: #fff; color: #111; border-radius: 10px; padding: 3px 9px; font-size: 12px; font-weight: 600; pointer-events: none; opacity: 0; transition: opacity .2s, transform .2s; z-index: 3; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
.opp .bub.on { opacity: 1; transform: translateX(-50%) translateY(0); }
.opp .bub::after { content: ''; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px; background: #fff; transform: translateX(-50%) rotate(45deg); }

/* ── table ── */
.table-wrap { grid-area: table; min-height: 0; display: flex; justify-content: center; padding: 8px 12px 4px; }
#table { position: relative; width: 100%; max-width: 820px; height: 100%; min-height: 150px; border-radius: 28px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(12px); display: grid; grid-template-columns: 1fr auto auto 1fr; grid-template-rows: 1fr; gap: 6px 16px; align-items: center; padding: 12px 14px 42px; overflow: hidden; }
#table::before { content: ''; position: absolute; inset: 0; background: radial-gradient(500px 220px at 50% 50%, rgba(255,77,109,.12), transparent 70%); pointer-events: none; }
#table.shake { animation: shake .5s ease-out; }
@keyframes shake { 15% { transform: translate(-7px, 3px); } 30% { transform: translate(6px, -5px); } 45% { transform: translate(-5px, -2px); } 60% { transform: translate(4px, 3px); } 80% { transform: translate(-1px, 1px); } }
.pile { display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; z-index: 1; }
.pile .lbl { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 1.2px; text-transform: uppercase; }
#deck { grid-column: 2; } #disc { grid-column: 3; }
.deckbox { position: relative; width: var(--cw); height: calc(var(--cw) * 1.45); cursor: pointer; }
.deckbox .bk { position: absolute; inset: 0; border-radius: 14px; background: linear-gradient(145deg, #2b3270, #171b3a); border: 1px solid rgba(255,255,255,.18); display: grid; place-items: center; box-shadow: 0 10px 25px rgba(0,0,0,.35); }
.deckbox .bk:nth-child(1) { transform: translate(6px, 6px); opacity: .6; } .deckbox .bk:nth-child(2) { transform: translate(3px, 3px); opacity: .8; }
.deckbox .bk:last-child::before { content: ''; position: absolute; inset: 8px; border-radius: 10px; border: 1.5px dashed rgba(255,255,255,.2); }
.deckbox .bk:last-child svg { width: 60%; }
.deckbox.hot .bk:last-child { box-shadow: 0 0 0 2px var(--pri), 0 0 30px rgba(255,77,109,.6); }
.deckbox.hot { animation: bob 1.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-5px); } }
.deckbox .cnt { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); background: #fff; color: #111; border-radius: 999px; font-size: 11px; font-weight: 700; padding: 2px 9px; white-space: nowrap; box-shadow: 0 4px 12px rgba(0,0,0,.4); }
.discbox { width: var(--cw); height: calc(var(--cw) * 1.45); border-radius: 14px; border: 1.5px dashed rgba(255,255,255,.2); display: grid; place-items: center; position: relative; }
.discbox .card { position: absolute; inset: -1px; width: auto; height: auto; }
.discbox .card.under { transform: rotate(-7deg) translateX(-4px); opacity: .6; }
.discbox .card.top { transform: rotate(4deg); }
#known { grid-column: 1; justify-self: end; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; z-index: 1; }
.chip { background: var(--glass2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: 600; white-space: nowrap; backdrop-filter: blur(8px); }
.chip.red { background: rgba(255,77,109,.25); border-color: rgba(255,77,109,.6); }
.chip.org { background: rgba(255,107,0,.25); border-color: rgba(255,107,0,.6); }
.chip.hd { font-size: 10px; color: var(--muted); background: none; border: 0; padding: 0 4px; }
#info { grid-column: 4; justify-self: start; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; z-index: 1; }
#toast { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%) translateY(10px); max-width: calc(100% - 24px); font-size: 12.5px; font-weight: 600; background: rgba(255,255,255,.14); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .25s, transform .25s; z-index: 2; pointer-events: none; backdrop-filter: blur(8px); }
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── card ── */
.card { --c: #999; width: var(--cw); height: calc(var(--cw) * 1.45); flex: 0 0 auto; border-radius: 14px; background: linear-gradient(180deg, #1c2246, #11152d); border: 1px solid rgba(255,255,255,.14); position: relative; display: flex; flex-direction: column; align-items: center; box-shadow: 0 8px 20px rgba(0,0,0,.35); overflow: hidden; transition: transform .18s, box-shadow .18s; cursor: pointer; }
.card::before { content: ''; position: absolute; inset: 0; background: radial-gradient(120% 70% at 50% 0%, color-mix(in srgb, var(--c) 45%, transparent), transparent 60%); pointer-events: none; }
.card .art { width: 100%; height: 56%; flex: 0 0 auto; display: grid; place-items: center; position: relative; }
.card .art svg { width: 86%; height: 92%; filter: drop-shadow(0 4px 6px rgba(0,0,0,.4)); }
.card .ttl { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .3px; text-align: center; padding: 0 4px; line-height: 1.1; color: #fff; overflow-wrap: anywhere; max-width: 100%; }
.card .ttl.long { font-size: 8px; letter-spacing: 0; padding: 0 2px; }
.card .sub { font-size: 9px; color: var(--c); font-weight: 700; margin-top: 1px; text-align: center; }
.card .info { position: absolute; top: 5px; left: 5px; width: 18px; height: 18px; border-radius: 50%; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.3); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; z-index: 3; font-family: 'Outfit'; transition: background .15s, transform .15s; }
.card .info:hover { background: var(--c); transform: scale(1.15); }
.card.small .info, .card.fly .info, .discbox .card.under .info { display: none; }
.card::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: 5px; height: 2px; border-radius: 2px; background: var(--c); opacity: .7; }
.card.sel { transform: translateY(-18px) scale(1.04); box-shadow: 0 0 0 2px var(--c), 0 16px 30px rgba(0,0,0,.5), 0 0 24px color-mix(in srgb, var(--c) 60%, transparent); z-index: 2; }
@keyframes pop { from { transform: translateY(40px) scale(.6); opacity: 0; } }
.card.small { --cw: 68px; } .card.small .ttl { font-size: 8.5px; } .card.small .ttl.long { font-size: 7.2px; }
.card.big { --cw: 130px; } .card.big .ttl { font-size: 13px; } .card.big .ttl.long { font-size: 11px; } .card.big .sub { font-size: 11px; }
.card.fly { position: fixed; z-index: 50; pointer-events: none; transition: transform .55s cubic-bezier(.3,.9,.3,1), opacity .5s; margin: 0; }

/* ── hand ── */
.hand-wrap { grid-area: hand; display: flex; flex-direction: column; align-items: center; }
.hand-title { font-size: 11px; font-weight: 600; color: var(--muted); padding-top: 4px; letter-spacing: .5px; }
.hand { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 1000px; padding: 22px 0 12px; }
.hand .hrow { display: flex; overflow-x: auto; overflow-y: hidden; padding: 20px 16px 0; margin-top: -20px; gap: 8px; width: 100%; -webkit-overflow-scrolling: touch; scroll-padding: 0 16px; }
.hand .hrow > .card:first-child { margin-left: auto; } .hand .hrow > .card:last-child { margin-right: auto; }
.hand .hrow.tight { gap: 0; } .hand .hrow.tight .card + .card { margin-left: calc(-1 * var(--ov, 26px)); }
.hand .card.sel { z-index: 3; }
.hand.off .card { cursor: default; } .hand.off .card:not(.sel) { filter: saturate(.6) brightness(.8); }
.hand .card.playable:not(.sel):hover { transform: translateY(-8px); }

/* ── bar ── */
#hint { grid-area: hint; justify-self: center; font-size: 13px; font-weight: 600; color: var(--muted); text-align: center; min-height: 20px; margin: 6px 16px 0; padding: 4px 16px; border-radius: 999px; max-width: calc(100% - 32px); line-height: 1.35; transition: background .2s, color .2s; }
.bar { grid-area: bar; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 6px 14px 14px; max-width: 1000px; width: 100%; margin: 0 auto; }
.btn { border-radius: 999px; padding: 12px 22px; font-weight: 800; font-size: 15px; background: var(--glass2); border: 1px solid var(--line); color: var(--txt); backdrop-filter: blur(10px); transition: transform .1s, box-shadow .15s, background .15s; white-space: nowrap; letter-spacing: .2px; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn.pri { background: linear-gradient(135deg, var(--pri), var(--pri2)); border: 0; color: #fff; flex: 1; max-width: 280px; box-shadow: 0 8px 24px rgba(255,77,109,.4); }
.btn.pri:disabled { box-shadow: none; }
.btn.grn { background: linear-gradient(135deg, #22c55e, #86efac); color: #052e16; border: 0; }
.btn.sm { padding: 9px 16px; font-size: 13px; }

/* ── nope ── */
#nopebar { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 20; width: min(92vw, 440px); background: rgba(10,12,30,.92); border: 1px solid rgba(255,77,109,.5); color: #fff; border-radius: 20px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.6), 0 0 30px rgba(255,77,109,.25); backdrop-filter: blur(14px); animation: pop .25s ease-out; }
#nopebar .ring { width: 46px; height: 46px; flex: 0 0 auto; border-radius: 50%; display: grid; place-items: center; font-size: 20px; background: conic-gradient(var(--pri) var(--p, 100%), rgba(255,255,255,.1) 0); position: relative; }
#nopebar .ring::after { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: #0f1330; }
#nopebar .ring span { position: relative; z-index: 1; }
#nopebar .nt { font-size: 13px; font-weight: 500; flex: 1; line-height: 1.3; }
#nopebar .nt b { color: var(--pri); }
#nopebar .nb { display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto; }
#nopebar .btn { background: linear-gradient(135deg, var(--pri), #c2185b); border: 0; padding: 10px 16px; box-shadow: 0 6px 18px rgba(255,77,109,.45); }
#nopebar .btn.pass { background: var(--glass2); border: 1px solid var(--line); box-shadow: none; padding: 7px 16px; font-size: 13px; font-weight: 700; }

/* ── dialogs ── */
.ov { position: fixed; inset: 0; background: rgba(5,7,20,.7); z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; animation: fade .2s; backdrop-filter: blur(6px); }
@keyframes fade { from { opacity: 0; } }
.dlg { background: linear-gradient(180deg, #1a2048, #11152d); border: 1px solid var(--line); border-radius: 24px; padding: 22px 18px 18px; width: min(94vw, 500px); max-height: 92vh; overflow: auto; box-shadow: 0 30px 80px rgba(0,0,0,.6); text-align: center; animation: pop .3s cubic-bezier(.2,1.4,.4,1); }
.dlg.wide { width: min(96vw, 760px); }
.dlg h2 { font-size: 24px; font-weight: 800; margin-bottom: 4px; line-height: 1.1; }
.dlg h2 b { color: var(--pri); }
.dlg h3 { font-size: 15px; font-weight: 700; margin: 14px 0 6px; text-align: left; color: var(--warn); }
.dlg p { font-size: 13px; color: var(--muted); font-weight: 500; margin-bottom: 10px; line-height: 1.4; }
.dlg .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
.dlg .cards { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 8px 0; }
.dlg .cards .card:hover { transform: translateY(-4px); }
.dlg .cards .card.sel { transform: translateY(-8px); }
.dlg .cards .card .num { position: absolute; top: 6px; left: 6px; width: 20px; height: 20px; border-radius: 50%; background: var(--pri); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; z-index: 2; }
.dlg .tgt { display: flex; flex-direction: column; align-items: center; gap: 3px; background: var(--glass2); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; min-width: 100px; transition: background .15s, transform .1s; }
.dlg .tgt:hover { background: rgba(255,255,255,.16); } .dlg .tgt:active { transform: scale(.97); }
.dlg .tgt .av { font-size: 30px; } .dlg .tgt .nm { font-size: 13px; font-weight: 700; } .dlg .tgt .ct { font-size: 11px; color: var(--muted); }
.dlg input[type=range] { width: 100%; margin: 10px 0 4px; accent-color: var(--pri); }
.dlg .pos { font-size: 17px; font-weight: 700; }
.dlg input[type=text] { font: inherit; font-weight: 600; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; text-align: center; background: rgba(0,0,0,.25); color: var(--txt); outline: none; }
.dlg input[type=text]:focus { border-color: var(--pri); }
.dlg .lab { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin: 14px 0 6px; }
.dlg .opt { display: flex; gap: 6px; justify-content: center; }
.dlg .opt button { min-width: 46px; height: 42px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass); font-weight: 700; font-size: 15px; color: var(--txt); }
.dlg .opt button.on { background: linear-gradient(135deg, var(--pri), var(--pri2)); border-color: transparent; color: #fff; }
.dlg .sw { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--glass); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-top: 8px; text-align: left; }
.dlg .sw .t { font-size: 13px; font-weight: 700; } .dlg .sw .d { font-size: 11px; color: var(--muted); }
.dlg .sw .tog { width: 46px; height: 26px; border-radius: 999px; background: rgba(255,255,255,.15); position: relative; flex: 0 0 auto; transition: background .2s; }
.dlg .sw .tog::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; }
.dlg .sw .tog.on { background: var(--ok); } .dlg .sw .tog.on::after { transform: translateX(20px); }
.dlg .rules { text-align: left; font-size: 13px; line-height: 1.45; color: #d7dcf5; }
.dlg .rules li { margin: 4px 0 4px 18px; }
.dlg .rules b { color: var(--warn); }
.dlg .rank { text-align: left; margin: 10px auto; max-width: 320px; }
.dlg .rank div { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-radius: 12px; font-weight: 600; }
.dlg .rank div:first-child { background: linear-gradient(135deg, rgba(251,191,36,.3), rgba(251,191,36,.1)); border: 1px solid rgba(251,191,36,.5); }
.dlg .stats { font-size: 12px; color: var(--muted); font-weight: 600; }
.cinfo { display: flex; gap: 16px; align-items: center; text-align: left; }
.cinfo .card { cursor: default; flex: 0 0 auto; }
.cinfo .en { font-family: 'Outfit'; font-weight: 900; font-size: 20px; text-transform: uppercase; line-height: 1.05; }
.cinfo .vi { font-size: 14px; font-weight: 700; color: var(--warn); margin-top: 2px; }
.cinfo .ds { font-size: 13.5px; color: #d7dcf5; line-height: 1.45; margin-top: 8px; }
.cinfo .tip { font-size: 12px; color: var(--muted); line-height: 1.4; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
.cinfo .n { display: inline-block; margin-top: 8px; font-size: 11px; font-weight: 700; background: var(--glass2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
/* ── trang thư viện bài ── */
body.cards { display: block; overflow: auto; }
.page { max-width: 1040px; margin: 0 auto; padding: 16px 16px 60px; }
.page .ph { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.page h1 { font-size: 26px; font-weight: 900; flex: 1; } .page h1 b { color: var(--pri); }
.page .lead { color: var(--muted); font-size: 13.5px; line-height: 1.5; margin-bottom: 18px; }

let G = null, GEN = 0, locked = true, sel = new Set(), stats = store.get('ek.stats', { games: 0, wins: 0 });

function newGame(opt) {

    (ip >= 0 ? `<div class="chip org">Imploding ngửa ở lá #${ip + 1}</div>` : '') +
    (G.players.length > 2 && G.dir < 0 ? `<div class="chip">Chiều đảo</div>` : '') +

  const hand = $('#hand'); hand.innerHTML = '';

  const cw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cw')) || 86;
  const avail = hand.clientWidth - 32, hn = p.hand.length;
  const perRow = Math.max(1, Math.floor((avail + 8) / (cw + 8)));
  const rows = hn > perRow ? 2 : 1, perR = Math.ceil(hn / rows);

let toastT = 0;

// ═══════════════════════════ tổ hợp ═══════════════════════════
function catMatch(cards) {

}
function comboOf(cards) {

  const m = catMatch(cards);
  if (ts.length === 2 && m) return { kind: 'pair', type: m, cards };
  if (ts.length === 3 && m) return { kind: 'triple', type: m, cards };

}

}
function comboHint(a) {

  if (a.kind === 'triple') return 'Bộ ba mèo: gọi tên 1 loại bài, người bị chọn phải đưa nếu có.';

    hint(G.turnsLeft > 1 ? `Bị Attack: phải chơi ${G.turnsLeft} lượt! Đánh bài hoặc rút 1 lá.` : 'Chọn bài để đánh, hoặc rút 1 lá để kết thúc lượt');

// ═══════════════════════════ máy chơi ═══════════════════════════
async function botTurn(p) {
  let guard = 0; const g = GEN;
  while (!G.over && cur() === p && guard++ < 8) {
    const a = botDecide(p);
    if (!a) break;
    a.actor = G.players.indexOf(p);
    await sleep(500 + rnd(500));
    if (g !== GEN) return;
    const r = await playAction(a);
    if (g !== GEN || G.over) return;
    if (r.consumed) return;
    if (cur() !== p || r.endTurn) { queueTurn(); return; }
    await sleep(350);
  }
  if (G.over || cur() !== p) return;
  await sleep(500);
  if (g !== GEN) return;
  await drawCard(p);
  if (g === GEN && !G.over) consumeTurn();
}
function botDecide(p) {
  const i = G.players.indexOf(p), hasD = has(p, 'defuse');
  const risk = G.deck.length ? kittensInDeck() / G.deck.length : 0;
  const ip = implodePos();
  const top = ip === 0 ? 'implode' : p.mem[0];
  const topDanger = isKitten(top), topSafe = top && !isKitten(top);
  const bottomDanger = ip >= 0 && ip === G.deck.length - 1;
  const single = t => has(p, t) ? { kind: 'single', type: t, cards: p.hand.filter(c => c.t === t).slice(0, 1) } : null;
  const others = alive().filter(q => q !== p && q.hand.length);
  const target = () => { const best = others.slice().sort((a, b) => b.hand.length - a.hand.length); return G.players.indexOf(chance(.7) ? best[0] : pick(others)); };
  const cats = {}; for (const c of p.hand) if (TYPES[c.t].cat && !TYPES[c.t].feral) (cats[c.t] = cats[c.t] || []).push(c);
  const ferals = p.hand.filter(c => c.t === 'feral');
  const groups = Object.values(cats).sort((a, b) => b.length - a.length);
  const mkCombo = n => { for (const gr of groups) { if (gr.length + ferals.length >= n) return gr.slice(0, n).concat(ferals.slice(0, Math.max(0, n - gr.length))); } return ferals.length >= n ? ferals.slice(0, n) : null; };
  const triple = mkCombo(3), pair = mkCombo(2);
  const want = () => { for (const t of ['defuse', 'attack', 'skip', 'nope', 'future']) if (!has(p, t) || t === 'defuse') return t; return 'shuffle'; };
  const atk = () => { if (has(p, 'attack')) return single('attack'); if (has(p, 'targeted') && others.length) return { ...single('targeted'), target: target() }; return null; };
  const escapeTurn = () => { const a = atk(); if (a) return a; if (has(p, 'skip')) return single('skip'); if (has(p, 'reverse') && alive().length > 2) return single('reverse'); if (has(p, 'bottom') && !bottomDanger) return single('bottom'); if (has(p, 'shuffle') && top !== 'implode') return single('shuffle'); return null; };

  if (topDanger) {
    const e = escapeTurn(); if (e) return e;
    if (top === 'implode' && has(p, 'alter')) return single('alter');
    if (top === 'implode' && has(p, 'shuffle')) return single('shuffle');
    if (!hasD && triple && others.length) return { kind: 'triple', type: catMatch(triple), cards: triple, target: target(), want: 'defuse' };
    if (!hasD && has(p, 'favor') && others.length) return { ...single('favor'), target: target() };
    if (!hasD && pair && others.length) return { kind: 'pair', type: catMatch(pair), cards: pair, target: target() };
    return null;
  }
  if (!top && risk > 0.1 && chance(.85)) { if (has(p, 'future')) return single('future'); if (has(p, 'alter')) return single('alter'); }
  const danger = !topSafe && (risk >= 0.3 || (!hasD && risk > 0.15));
  if (danger) {
    const a = atk(); if (a && chance(.8)) return a;
    if (has(p, 'skip') && chance(.75)) return single('skip');
    if (has(p, 'bottom') && !bottomDanger && chance(.6)) return single('bottom');
    if (has(p, 'reverse') && alive().length > 2 && chance(.5)) return single('reverse');
    if (!hasD && has(p, 'shuffle') && chance(.4)) return single('shuffle');
  }
  if (G.turnsLeft > 1 && !topSafe) {
    const a = atk(); if (a && chance(.7)) return a;
    if (has(p, 'skip') && chance(.5)) return single('skip');
  }
  if (others.length) {
    if (triple && chance(hasD ? .45 : .8)) return { kind: 'triple', type: catMatch(triple), cards: triple, target: target(), want: want() };
    if (pair && chance(hasD ? .3 : .6)) return { kind: 'pair', type: catMatch(pair), cards: pair, target: target() };
    if (has(p, 'favor') && chance(hasD ? .25 : .55)) return { ...single('favor'), target: target() };
    if (!topSafe && chance(.18)) { const a = atk(); if (a) return a; }
  }
  const uniq = new Map(); for (const c of p.hand) if (!uniq.has(c.t)) uniq.set(c.t, c);
  if (uniq.size >= 5 && p.hand.length >= 8 && G.discard.some(c => c.t === 'defuse') && !hasD && chance(.7)) {
    const pickC = G.discard.find(c => c.t === 'defuse');
    const cards = [...uniq.values()].filter(c => c.t !== 'defuse' && c.t !== 'nope').slice(0, 5);
    if (cards.length === 5) return { kind: 'five', cards, pick: pickC };
  }
  return null;
}
function botInsertPos(p) {
  const n = G.deck.length;
  if (G.turnsLeft > 1) return Math.min(n, 2 + rnd(Math.max(1, n - 2)));
  const r = Math.random();
  if (r < .55) return 0;
  if (r < .75) return Math.min(n, 1);
  return rnd(n + 1);
}
function botAlter(cards) {
  const idx = cards.map((c, i) => i);
  return idx.sort((a, b) => (isKitten(cards[a].t) ? 1 : 0) - (isKitten(cards[b].t) ? 1 : 0));
}
function botGiveCard(p) {
  const pri = ['cat1', 'cat2', 'cat3', 'cat4', 'cat5', 'feral', 'shuffle', 'favor', 'future', 'alter', 'reverse', 'skip', 'bottom', 'attack', 'targeted', 'nope', 'defuse'];
  const singles = pri.filter(t => count(p, t) === 1 && TYPES[t].cat);
  const t = singles[0] || pri.find(t => has(p, t));
  return p.hand.find(c => c.t === t) || p.hand[0];
}
function botWantsNope(p, i, a, n) {
  const next = nextAlive(a.actor), mine = a.actor === i;
  const top = implodePos() === 0 ? 'implode' : p.mem[0];
  let want = 0;
  if (n % 2 === 0) {
    if (mine) return false;
    if (a.kind === 'single' && a.type === 'attack' && next === i) want = .7;
    else if (a.kind === 'single' && a.type === 'targeted' && a.target === i) want = .8;
    else if (a.kind === 'single' && a.type === 'favor' && a.target === i) want = .6;
    else if ((a.kind === 'pair' || a.kind === 'triple') && a.target === i) want = a.kind === 'triple' && a.want === 'defuse' ? .85 : .55;
    else if (a.kind === 'single' && ['skip', 'reverse', 'bottom'].includes(a.type) && isKitten(top)) want = next === i ? .3 : .55;
    else if (a.kind === 'single' && (a.type === 'shuffle' || a.type === 'alter') && p.mem.length) want = .35;
    else if (a.kind === 'five' && a.pick && a.pick.t === 'defuse') want = .4;
    else want = .05;
  } else {
    if (mine) want = .6;
    else if (a.kind === 'single' && (a.type === 'attack' || a.type === 'targeted') && next !== i && a.target !== i) want = .15;
    else want = .03;
  }
  if (count(p, 'nope') > 1) want += .1;
  return chance(want);
}

// ═══════════════════════════ âm thanh (tự tổng hợp) ═══════════════════════════
let actx = null, muted = store.get('ek.mute', false), noiseBuf = null;
function audio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } if (actx.state === 'suspended') actx.resume().catch(() => {}); return actx; }
const unlockAudio = () => { if (!muted && (!actx || actx.state !== 'running')) audio(); };
document.addEventListener('pointerdown', unlockAudio, true);
document.addEventListener('keydown', unlockAudio, true);
function sndT() { if (muted || SPEED === 0) return 0; const ctx = audio(); return ctx && ctx.state === 'running' ? ctx.currentTime + 0.005 : 0; }
function nburst(t, vol, freq, q, len, type = 'bandpass') {
  if (!noiseBuf) { noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  src.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.001, t + len);
  src.connect(f).connect(g).connect(actx.destination); src.start(t); src.stop(t + len + 0.02);
}
function tone(t, freq, vol, len, type = 'sine', to) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + len);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.005); g.gain.exponentialRampToValueAtTime(0.001, t + len);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + len + 0.02);
}
function playDeal() { const t = sndT(); if (t) { nburst(t, 0.25, 2400, 0.8, 0.07); nburst(t + 0.04, 0.1, 900, 1, 0.05); } }
function playCard() { const t = sndT(); if (t) { nburst(t, 0.3, 1800, 1, 0.06); tone(t, 520, 0.08, 0.08, 'triangle', 700); } }
function playClick() { const t = sndT(); if (t) tone(t, 900, 0.06, 0.04, 'square'); }
function playNope() { const t = sndT(); if (t) { tone(t, 220, 0.25, 0.18, 'sawtooth', 160); tone(t + 0.05, 180, 0.2, 0.2, 'square', 120); } }
function playSteal() { const t = sndT(); if (t) { tone(t, 600, 0.12, 0.08, 'triangle', 900); tone(t + 0.09, 900, 0.12, 0.1, 'triangle', 1300); } }
function playShuffle() { const t = sndT(); if (t) for (let i = 0; i < 6; i++) nburst(t + i * 0.06, 0.18, 1500 + rnd(800), 1, 0.05); }
function playDefuse() { const t = sndT(); if (t) { nburst(t, 0.3, 4000, 0.5, 0.45, 'highpass'); tone(t + 0.1, 500, 0.12, 0.3, 'sine', 900); } }
function playFuse() { const t = sndT(); if (t) { for (let i = 0; i < 7; i++) tone(t + i * 0.12, 1200 + i * 150, 0.07, 0.06, 'square'); nburst(t, 0.15, 6000, 0.7, 0.8, 'highpass'); } }
function playBoom() { const t = sndT(); if (t) { nburst(t, 0.9, 120, 0.5, 0.9, 'lowpass'); nburst(t, 0.5, 900, 0.6, 0.5); tone(t, 90, 0.5, 0.7, 'sine', 30); } }
function playTurn() { const t = sndT(); if (t) { tone(t, 660, 0.14, 0.09, 'triangle'); tone(t + 0.1, 990, 0.14, 0.14, 'triangle'); } }
function playWin() { const t = sndT(); if (t) [523, 659, 784, 1047].forEach((f, i) => tone(t + i * 0.12, f, 0.18, 0.25, 'triangle')); }
function playLose() { const t = sndT(); if (t) [392, 330, 262].forEach((f, i) => tone(t + i * 0.2, f, 0.18, 0.3, 'sawtooth')); }
function updMute() { $('#muteBtn').textContent = muted ? '🔇' : '🔊'; }
$('#muteBtn').addEventListener('click', () => { muted = !muted; store.set('ek.mute', muted); updMute(); if (!muted) { audio(); playClick(); } });
updMute();

if (/[?&]cards/.test(location.search)) renderGalleryPage(); else showSetup();
