<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="Học Đếm Số">
<link rel="apple-touch-icon" href="icon.png">
<title>Học Đếm Số</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23ff6b6b'/%3E%3Cstop offset='50%25' stop-color='%23ffd32a'/%3E%3Cstop offset='100%25' stop-color='%2326de81'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23bg)'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Arial Rounded MT Bold%2C Arial%2C sans-serif' font-size='20' font-weight='bold' fill='white'%3E123%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- MENU: chọn trò chơi -->
<div class="screen" id="screen-menu">
  <h1 class="menu-title">Học Đếm Số</h1>
  <div class="menu-cards">
    <button class="menu-card" data-mode="find" style="--c:#ff6b6b"><span class="menu-icon">🔍</span><span class="menu-name" id="menu-find">Tìm Số</span></button>
    <button class="menu-card" data-mode="learn" style="--c:#20bf6b"><span class="menu-icon">✋</span><span class="menu-name" id="menu-learn">Tập Đếm</span></button>
  </div>
</div>

<!-- TÌM SỐ 1: show the target number -->
<div class="screen hidden" id="screen-show">
  <div class="prompt-label" id="show-label">Hãy tìm số này nhé!</div>
  <div class="big-number" id="target-display"></div>
  <div class="dots-row" id="dots-row"></div>
  <button class="btn-ready" id="btn-ready">Tôi sẵn sàng! ▶</button>
</div>

<!-- TÌM SỐ 2: pick the number -->
<div class="screen hidden" id="screen-pick">
  <div class="pick-label" id="pick-label"></div>
  <div class="number-grid" id="number-grid"></div>
</div>

<!-- TẬP ĐẾM: đếm theo bàn tay -->
<div class="screen hidden" id="screen-learn">
  <div class="prompt-label" id="learn-label"></div>
  <div class="big-number learn-number" id="learn-number"></div>
  <div class="hands" id="hands"></div>
  <div class="learn-actions">
    <button class="btn-ready" id="btn-turn">Con đếm nào! ▶</button>
    <button class="btn-ready hidden" id="btn-watch">Xem lại 👀</button>
  </div>
</div>

<!-- THẮNG -->
<div class="screen hidden" id="screen-win">
  <div class="confetti-wrap" id="confetti"></div>
  <div class="win-emoji" id="win-emoji">🎉</div>
  <div class="win-title" id="win-title">Giỏi lắm!</div>
  <div class="win-sub" id="win-sub"></div>
  <button class="btn-again" id="btn-again">Chơi tiếp! 🔄</button>
</div>

<button class="lang-btn" id="btn-lang" aria-label="Đổi ngôn ngữ / Change language"></button>
<button class="home-back hidden" id="btn-menu" aria-label="Chọn trò chơi">‹</button>

<script src="game.js"></script>
</body>
</html>
