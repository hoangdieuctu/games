<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink: #2a1a10;
  --paper: #fbf3e2;
  --paper2: #f3e4c4;
  --red: #9e2a1f;
  --red2: #c2412d;
  --gold: #e4b04a;
  --gold2: #ffd98a;
  --jade: #2f7f6f;
  --muted: #7b6550;
  --line: rgba(122, 72, 30, .25);
  --shadow: 0 18px 50px rgba(20, 8, 0, .45);
}
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #1a0f0a; color: var(--ink);
  font-family: 'Be Vietnam Pro', system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
button { font: inherit; cursor: pointer; border: 0; color: inherit; background: none; }
input, textarea { font: inherit; user-select: text; -webkit-user-select: text; }
.serif { font-family: 'Noto Serif', Georgia, serif; }
[hidden] { display: none !important; }

/* ── HUD ── */
#hud {
  position: fixed; left: 0; right: 0; top: 0; z-index: 5;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
  padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
  pointer-events: none;
}
#hud > * { pointer-events: auto; }
.place {
  background: linear-gradient(180deg, rgba(40, 18, 8, .72), rgba(40, 18, 8, .5));
  border: 1px solid rgba(228, 176, 74, .45);
  color: #fbe6b8; border-radius: 12px; padding: 7px 12px 8px;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  min-width: 0;
}
.place .t { font-family: 'Noto Serif', serif; font-weight: 700; font-size: 15px; letter-spacing: .02em; white-space: nowrap; }
.place .s { font-size: 11.5px; opacity: .85; margin-top: 1px; white-space: nowrap; display: flex; gap: 10px; }
.hud-btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.hb {
  width: 40px; height: 40px; border-radius: 12px; font-size: 18px; line-height: 1;
  background: rgba(40, 18, 8, .62); border: 1px solid rgba(228, 176, 74, .4); color: #fbe6b8;
  display: grid; place-items: center; position: relative;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  transition: transform .12s, background .2s;
}
.hb:active { transform: scale(.92); }
.hb .badge {
  position: absolute; right: -4px; top: -4px; min-width: 17px; height: 17px; padding: 0 4px;
  border-radius: 9px; background: var(--red2); color: #fff; font-size: 10.5px; font-weight: 800;
  display: grid; place-items: center; border: 1.5px solid #fbe6b8;
}

/* ── giảng đường ── */
#lect {
  position: fixed; z-index: 6; left: 50%; top: max(64px, calc(env(safe-area-inset-top) + 56px)); transform: translateX(-50%);
  width: min(640px, calc(100vw - 24px)); background: rgba(24, 10, 4, .92); border: 1px solid rgba(228, 176, 74, .55);
  border-radius: 14px; box-shadow: 0 14px 40px rgba(0,0,0,.5); color: #fbe6b8; overflow: hidden;
}
#lect .lh { display: flex; justify-content: space-between; padding: 8px 12px; font-weight: 700; font-size: 13px; background: rgba(120, 40, 14, .45); }
#lect .lv { position: relative; aspect-ratio: 16 / 9; background: #000; }
#lect .lv iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
#lect .lw { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 6px; padding: 12px; background: radial-gradient(circle at 50% 40%, #3a2312, #120804); }
#lect .lt { font-size: 14px; } #lect .lc { font: 800 clamp(36px, 9vw, 58px) 'Be Vietnam Pro', sans-serif; color: #ffd98a; letter-spacing: .04em; }
#lect .ln { font-size: 12.5px; opacity: .85; font-family: 'Noto Serif', serif; }
#lect .li { padding: 8px 12px 10px; font-size: 13px; line-height: 1.45; } #lect .li b { display: block; color: #ffe2a0; }
#lect .li span { font-size: 12px; opacity: .85; } #lect a { color: #ffd98a; }
#lect.min .lv { height: 0; aspect-ratio: auto; } #lect.min .li span { display: none; }

/* ── bản đồ nhỏ ── */
#mini {
  position: fixed; z-index: 5; left: max(12px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom));
  width: 120px; height: 111px; border-radius: 12px; border: 1.5px solid rgba(228, 176, 74, .6);
  box-shadow: 0 6px 18px rgba(0,0,0,.4); background: #2f5c2e; cursor: pointer;
}
@media (max-width: 520px) { #mini { width: 84px; height: 78px; bottom: max(90px, env(safe-area-inset-bottom)); } }

/* ── prompt / action area ── */
#actions {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 0 12px max(16px, env(safe-area-inset-bottom));
  pointer-events: none;
}
#actions > * { pointer-events: auto; }
.act-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.act {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 20px; border-radius: 999px; font-weight: 800; font-size: 15px;
  background: linear-gradient(180deg, #d8573c, #9e2a1f); color: #fff6df;
  border: 1.5px solid #ffd98a; box-shadow: 0 8px 24px rgba(80, 20, 0, .45), inset 0 1px 0 rgba(255,255,255,.3);
  animation: pop .25s ease-out;
  transition: transform .1s;
}
.act:active { transform: scale(.95); }
.act.ghost { background: rgba(40, 18, 8, .66); border-color: rgba(228,176,74,.5); color: #fbe6b8; font-weight: 600; }
.act.gold { background: linear-gradient(180deg, #ffe39a, #d79a2b); color: #4a2408; }
.act kbd {
  font: 700 11px 'Be Vietnam Pro', sans-serif; padding: 2px 6px; border-radius: 6px;
  background: rgba(0,0,0,.22); border: 1px solid rgba(255,255,255,.25);
}
@media (hover: none) { .act kbd { display: none; } }
.hint {
  color: #fbe6b8; font-size: 13px; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,.8);
  background: rgba(30, 12, 4, .45); padding: 6px 12px; border-radius: 10px; max-width: 520px;
}
@keyframes pop { from { transform: translateY(10px) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }

/* hold button (thỉnh chuông / gõ mõ) */
.holdbtn {
  width: 96px; height: 96px; border-radius: 50%; position: relative;
  background: radial-gradient(circle at 40% 35%, #ffe7a8, #d39a2c 60%, #8d5a12);
  border: 3px solid #fff1c9; box-shadow: 0 10px 30px rgba(60, 20, 0, .55);
  color: #4a2408; font-weight: 800; font-size: 13px; line-height: 1.15; text-align: center;
  display: grid; place-items: center; touch-action: none;
}
.holdbtn svg { position: absolute; inset: -9px; width: calc(100% + 18px); height: calc(100% + 18px); transform: rotate(-90deg); pointer-events: none; }
.holdbtn.down { transform: scale(.94); }

/* ── sheet / modal ── */
#sheetWrap {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
  background: rgba(20, 8, 2, .45); padding: 16px;
  animation: fade .2s ease-out;
}
#sheetWrap.bottom { place-items: end center; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet {
  width: min(460px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: auto;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.7), transparent 60%),
    linear-gradient(180deg, var(--paper), var(--paper2));
  border-radius: 18px; box-shadow: var(--shadow);
  border: 1px solid rgba(160, 100, 40, .35);
  padding: 22px 20px 18px; position: relative;
  animation: rise .28s cubic-bezier(.2, .9, .3, 1.2);
}
.sheet.wide { width: min(560px, 100%); }
.sheet::before {
  content: ''; position: absolute; inset: 6px; border-radius: 13px; pointer-events: none;
  border: 1px solid rgba(180, 120, 40, .3);
}
@keyframes rise { from { transform: translateY(24px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet h2 {
  font-family: 'Noto Serif', serif; font-size: 22px; color: var(--red); text-align: center;
  letter-spacing: .01em; margin-bottom: 4px;
}
.sheet .sub { text-align: center; color: var(--muted); font-size: 13.5px; line-height: 1.5; margin-bottom: 14px; }
.sheet .x {
  position: absolute; right: 12px; top: 12px; width: 32px; height: 32px; border-radius: 50%;
  font-size: 18px; color: var(--muted); display: grid; place-items: center; z-index: 2;
}
.sheet .x:hover { background: rgba(0,0,0,.06); }
.orn { display: flex; align-items: center; gap: 10px; justify-content: center; color: var(--gold); margin: 2px 0 10px; font-size: 12px; }
.orn::before, .orn::after { content: ''; height: 1px; width: 60px; background: linear-gradient(90deg, transparent, var(--gold)); }
.orn::after { transform: scaleX(-1); }
.btn {
  padding: 11px 18px; border-radius: 12px; font-weight: 800; font-size: 14.5px;
  background: linear-gradient(180deg, #d8573c, #9e2a1f); color: #fff6df;
  border: 1px solid #7a1e12; box-shadow: 0 4px 12px rgba(120, 30, 10, .3), inset 0 1px 0 rgba(255,255,255,.25);
  transition: transform .1s, filter .15s;
}
.btn:active { transform: scale(.96); }
.btn:disabled { filter: grayscale(.8) opacity(.55); cursor: not-allowed; }
.btn.alt { background: #fff8e8; color: var(--red); border-color: rgba(158, 42, 31, .35); box-shadow: none; }
.btn.gold { background: linear-gradient(180deg, #ffe39a, #d79a2b); color: #4a2408; border-color: #a8721a; }
.row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
.row .btn { flex: 1 1 120px; }
.field { display: block; width: 100%; padding: 11px 13px; border-radius: 11px; border: 1px solid var(--line); background: #fffdf6; color: var(--ink); font-size: 15px; outline: none; }
.field:focus { border-color: var(--red2); box-shadow: 0 0 0 3px rgba(194, 65, 45, .15); }
textarea.field { resize: none; min-height: 76px; line-height: 1.45; }
.label { font-size: 12.5px; font-weight: 700; color: var(--muted); margin: 12px 0 6px; letter-spacing: .02em; }
.note { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 10px; text-align: center; }
.note.warn { color: var(--red); font-weight: 600; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.chip {
  padding: 9px 14px; border-radius: 999px; background: #fffaf0; border: 1.5px solid var(--line);
  font-weight: 700; font-size: 14px; color: var(--ink); transition: all .15s;
}
.chip.on { background: var(--red); color: #fff6df; border-color: var(--red); box-shadow: 0 3px 10px rgba(158, 42, 31, .3); }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.sw { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1.5px var(--line); position: relative; }
.sw.on { box-shadow: 0 0 0 3px var(--red2); }
.sw.on::after { content: '✓'; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-weight: 800; text-shadow: 0 1px 2px rgba(0,0,0,.6); }

/* shop grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 9px; }
.item {
  background: #fffaf0; border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 8px 9px;
  text-align: center; transition: all .15s; position: relative;
}
.item .ic { font-size: 30px; line-height: 1.1; height: 36px; display: grid; place-items: center; }
.item .nm { font-weight: 800; font-size: 13.5px; margin-top: 4px; }
.item .ds { font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.35; }
.item.on { border-color: var(--jade); background: #eefaf4; box-shadow: 0 3px 12px rgba(47, 127, 111, .2); }
.item.on::after { content: '✓'; position: absolute; right: 7px; top: 5px; color: var(--jade); font-weight: 800; }
.item.bad { animation: shake .35s; border-color: var(--red2); }
@keyframes shake { 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }

/* checklist */
.checklist { display: grid; gap: 6px; }
.ck {
  display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 12px;
  background: #fffaf0; border: 1px solid var(--line); text-align: left; width: 100%;
}
.ck .ic { font-size: 20px; width: 28px; text-align: center; }
.ck .nm { flex: 1; font-weight: 700; font-size: 14px; }
.ck .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; margin-top: 1px; }
.ck .st { font-size: 12px; font-weight: 800; color: var(--red2); white-space: nowrap; }
.ck.done { background: #eefaf4; border-color: rgba(47,127,111,.35); }
.ck.done .st { color: var(--jade); }
.stats { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
.stat { flex: 1; background: #fffaf0; border: 1px solid var(--line); border-radius: 12px; padding: 8px 6px; text-align: center; }
.stat b { display: block; font-size: 20px; color: var(--red); font-family: 'Noto Serif', serif; }
.stat span { font-size: 11px; color: var(--muted); }

/* xăm */
.xam-stage { position: relative; display: grid; place-items: center; margin-top: 10px; }
.xam-stage canvas { display: block; width: 100%; max-width: 440px; height: auto; aspect-ratio: 800 / 520; touch-action: none; cursor: grab; }
.lasam {
  background:
    radial-gradient(ellipse at 50% 30%, rgba(255, 220, 140, .25), transparent 60%),
    linear-gradient(180deg, #b8321f, #8c1f14);
  color: #ffeec4; border-radius: 12px; padding: 18px 16px 16px; position: relative;
  border: 2px solid #e8b04a; box-shadow: inset 0 0 0 4px #8c1f14, inset 0 0 0 5px rgba(232, 176, 74, .7);
  text-align: center;
}
.lasam .no { font-family: 'Noto Serif', serif; font-size: 13px; letter-spacing: .25em; text-transform: uppercase; opacity: .85; }
.lasam .grade { display: inline-block; margin: 6px 0 10px; padding: 3px 12px; border-radius: 99px; background: #ffd98a; color: #6b1a0e; font-weight: 800; font-size: 13px; }
.lasam .verse { font-family: 'Noto Serif', serif; font-style: italic; font-size: 17px; line-height: 1.65; }
.lasam .mean { font-size: 13.5px; line-height: 1.55; margin-top: 12px; text-align: left; background: rgba(0,0,0,.15); padding: 10px 12px; border-radius: 9px; }
.lasam .mean b { color: #ffd98a; }

/* thiền */
#zen {
  position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 30%, rgba(8, 4, 2, .55) 100%);
  animation: fade 1s ease-out;
}
.breath {
  width: 180px; height: 180px; border-radius: 50%; display: grid; place-items: center; text-align: center;
  background: radial-gradient(circle, rgba(255, 236, 190, .3), rgba(255, 210, 120, .08) 70%);
  border: 2px solid rgba(255, 230, 170, .6); color: #fff3d6;
  box-shadow: 0 0 60px rgba(255, 210, 120, .35);
  transition: transform 4s ease-in-out;
  font-family: 'Noto Serif', serif; text-shadow: 0 1px 6px rgba(0,0,0,.6);
}
.breath b { font-size: 22px; display: block; }
.breath span { font-size: 12.5px; opacity: .85; }

/* toast */
#toasts { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); z-index: 30; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(92vw, 460px); }
.toast {
  background: rgba(36, 16, 6, .88); color: #fbe6b8; border: 1px solid rgba(228, 176, 74, .5);
  padding: 9px 14px; border-radius: 12px; font-size: 13.5px; line-height: 1.45; text-align: center;
  box-shadow: 0 8px 24px rgba(0,0,0,.35); animation: pop .25s ease-out;
  transition: opacity .4s, transform .4s;
}
.toast.out { opacity: 0; transform: translateY(-8px); }

/* intro: vừa đúng một màn hình */
#intro {
  position: fixed; inset: 0; z-index: 25; display: flex; justify-content: center;
  padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  background: radial-gradient(ellipse at 50% 30%, rgba(40, 14, 4, .35), rgba(16, 6, 2, .82));
  overflow: auto;
}
.intro-card { width: min(1080px, 100%); height: 100%; min-height: 540px; display: flex; flex-direction: column; text-align: center; min-width: 0; }
.intro-head { flex: none; padding: 2px 0 8px; }
.intro-title {
  font-family: 'Noto Serif', serif; font-weight: 700; color: #ffe2a0; font-size: clamp(24px, 6vw, 36px); line-height: 1.15;
  text-shadow: 0 2px 0 #6b1a0e, 0 0 30px rgba(255, 190, 90, .45); letter-spacing: .02em;
}
.intro-sub {
  color: #fbe6b8; opacity: .9; margin: 4px auto 0; font-size: 13px; line-height: 1.45; max-width: 680px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.intro-title, .intro-sub { transition: opacity .35s, transform .35s; }
.intro-card.fly .intro-title, .intro-card.fly .intro-sub { opacity: 0; transform: translateY(6px); }
.intro-grid { flex: 1; min-height: 0; display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
@media (min-width: 820px) { .intro-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.mapcol { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.itabs { display: none; flex: none; margin: 0 auto 8px; padding: 3px; gap: 3px; border-radius: 13px; background: rgba(40, 18, 8, .6); border: 1px solid rgba(228, 176, 74, .4); }
.itabs button { padding: 8px 16px; border-radius: 10px; color: #fbe6b8; font-weight: 700; font-size: 13.5px; }
.itabs button.on { background: linear-gradient(180deg, #ffe39a, #d79a2b); color: #4a2408; }
@media (max-width: 819px) {
  .itabs { display: inline-flex; align-self: center; }
  #intro .intro-card[data-tab="map"] .charpanel, #intro .intro-card[data-tab="char"] .mapcol { display: none; }
  .opt { grid-template-columns: 50px minmax(0, 1fr); gap: 6px; }
  .seg .chip { font-size: 12.5px; }
  .charpanel .sw { width: 27px; height: 27px; }
  .charpanel .swatches { gap: 5px; flex-wrap: nowrap; }
  .intro-actions .btn { font-size: 14px; padding-left: 8px; padding-right: 8px; }
}
.intro-actions { flex: none; display: flex; gap: 8px; margin-top: 10px; }
.intro-actions .btn { flex: 1; }
@media (min-width: 820px) { .intro-actions { width: calc(50% - 6px); margin-left: auto; } }

/* khung chọn nhân vật */
.intro-card .sheet.charpanel { width: 100%; max-height: none; min-height: 0; overflow: auto; text-align: left; display: flex; flex-direction: column; gap: 10px; padding: 12px; }
.stage {
  position: relative; flex: 1 1 auto; min-height: 170px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line);
  background: radial-gradient(ellipse at 50% 92%, rgba(255, 214, 120, .75), transparent 45%), linear-gradient(180deg, #f6ead2, #ecd6ac);
}
.stage::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(160, 90, 40, .06) 0 2px, transparent 2px 46px); pointer-events: none; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.stage .rn { position: absolute; left: 10px; top: 9px; font-size: 12px; font-weight: 700; color: #6a3a1a; background: rgba(255, 250, 240, .8); border: 1px solid var(--line); padding: 3px 9px; border-radius: 99px; }

// ── giới hạn 40 người toàn hệ thống: một máy điều phối tự bầu qua PeerJS ──
// Ai mở giảng đường đầu tiên giữ mã LOBBY_ID và giữ sổ chỗ ngồi; những người sau nối vào xin chỗ.
// Máy điều phối thoát thì những người còn lại tự giành lại mã và xin chỗ lại.
const LOBBY_ID = 'dichua-giangduong-phaphoa-v1';
const lobby = { peer: null, conn: null, coord: false, ready: false, connecting: null, want: false, seated: false, pos: 0, count: 0, queueLen: 0, offline: false, cb: null, members: new Map() };
function lobbyEnsure() {
  if (lobby.ready) return Promise.resolve();
  if (lobby.connecting) return lobby.connecting;
  lobby.connecting = loadPeerJs().then(() => new Promise((ok, bad) => {
    const p = new Peer(LOBBY_ID, { debug: 0 }); let fin = false;
    const t = setTimeout(() => { if (!fin) { fin = true; try { p.destroy(); } catch (e) {} bad(new Error('timeout')); } }, 8000);
    p.on('open', () => { if (fin) return; fin = true; clearTimeout(t); becomeCoord(p); ok(); });
    p.on('error', err => {
      if (fin) return; fin = true; clearTimeout(t); try { p.destroy(); } catch (e) {}

}
function lobbyJoinClient() {
  return new Promise((ok, bad) => {
    const p = lobby.peer = new Peer({ debug: 0 }); let fin = false;
    const t = setTimeout(() => { if (!fin) { fin = true; bad(new Error('timeout')); } }, 9000);
    p.on('open', () => {
      const c = p.connect(LOBBY_ID, { reliable: true });
      c.on('open', () => { if (fin) return; fin = true; clearTimeout(t); lobby.conn = c; lobby.coord = false; ok(); });
      c.on('data', d => lobbyMsg(d));
      const lost = () => { if (lobby.conn !== c) return; lobby.conn = null; lobby.ready = false; lobbyLost(); };
      c.on('close', lost); c.on('error', lost);
    });
    p.on('error', err => { if (!fin) { fin = true; clearTimeout(t); bad(err); } });
  });
}

}

    if (litter.some(l => Math.hypot(l.x - x, l.y - y) < 70)) continue;

}

const CHANT = ['Nam', 'mô', 'A', 'Di', 'Đà', 'Phật'];

function hitMo() {

  const gap = T - chant.lastT; chant.lastT = T;

    const g = chant.gaps, avg = g.reduce((a, b) => a + b, 0) / (g.length || 1), dev = g.reduce((a, b) => a + Math.abs(b - avg), 0) / (g.length || 1);
    if (g.length >= 5 && dev < .09) addFloat(me.x, me.y - 105, 'Đều tay 🪷', '#ffe08a', 13);

    $('zen').hidden = false; sndBowl(.4); setBreath(0);

}
const BREATH = [['Hít vào', 4, 1.45], ['Giữ', 2, 1.45], ['Thở ra', 6, 1]];
function setBreath(i) {
  const b = $('breath'), [txt, d, sc] = BREATH[i];
  $('bTxt').textContent = txt; b.style.transitionDuration = d + 's'; b.style.transform = `scale(${sc})`;
}
function updateZen(dt) {
  zen.t += dt; zen.pt += dt;
  if (zen.pt >= BREATH[zen.phase][1]) {
    zen.pt = 0; zen.phase = (zen.phase + 1) % 3;
    if (zen.phase === 0) { zen.breaths++; $('bCnt').textContent = `${zen.breaths} hơi thở · còn ${Math.max(0, Math.ceil((zen.dur - zen.t) / 60 * 10) / 10)} phút`; }
    setBreath(zen.phase);
  }
  if (zen.t >= zen.dur) endZen(true);
}
function endZen(full) {
  $('zen').hidden = true; mode = 'free'; me.pose = 'stand'; AU.zen = false;
  if (AU.music) AU.music.gain.setTargetAtTime(.5, AU.ctx.currentTime, 1);
  sndBowl(.45);
  if (zen.breaths >= 3) { done('zen'); merit(Math.min(15, zen.breaths)); }
  toast(full ? `🧘 Bạn đã thiền ${Math.round(zen.dur / 60)} phút với ${zen.breaths} hơi thở. Thân tâm nhẹ nhàng.` : zen.breaths >= 3 ? `🧘 ${zen.breaths} hơi thở an lạc.` : 'Thử ngồi thêm vài hơi thở nữa nhé.');
  renderActions(true);
}

// ═══════════════════════════ đi chùa cùng bạn bè (PeerJS) ═══════════════════════════
// Hình sao: chủ phòng (id 'h') nối với từng khách. Khách gửi hello {name, look},
// st {x,d,p,b} ~10 lần/giây và ev {k:...} khi làm lễ. Chủ phòng gom vị trí gửi ps
// cho mọi người, chuyển tiếp ev kèm from, và gửi welcome (ảnh chụp cảnh) cho khách mới.
const PEERJS_URL = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js';
const ROOM_PREFIX = 'dichua-annhien-';
const freshNet = () => ({ on: false, host: false, code: null, peer: null, conn: null, conns: new Map(), myId: 'me', seq: 0, sendT: 0, lastSt: '', timer: 0 });
let net = freshNet();
function randCode() { return Array.from(crypto.getRandomValues(new Uint8Array(6)), b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join(''); }
function loadPeerJs() {
  if (window.Peer) return Promise.resolve();
  return new Promise((ok, bad) => { const s = document.createElement('script'); s.src = PEERJS_URL; s.onload = ok; s.onerror = () => { s.remove(); bad(new Error('peerjs')); }; document.head.appendChild(s); });
}
const showCode = c => String(c || '').toUpperCase();
const inviteUrl = () => location.href.split('#')[0] + '#room=' + net.code;
function parseCode(s) {
  s = String(s || '').trim(); const m = /room=([a-z0-9]+)/i.exec(s);
  s = (m ? m[1] : s).toLowerCase().replace(/[^a-z0-9]/g, '').replace(/1/g, 'i').replace(/0/g, 'o');
  return /^[a-z0-9]{4,16}$/.test(s) ? s : null;
}
const myLook = () => ({ r: S.robe, h: S.hair, g: S.gender || 'f', a: S.age || 'adult' });
const validLook = l => lookOf(Number.isInteger(l && l.r) ? clamp(l.r, 0, ROBES.length - 1) : 0, Number.isInteger(l && l.h) ? clamp(l.h, 0, 2) : 0, l && l.g === 'm' ? 'm' : 'f', l && ['child', 'old'].includes(l.a) ? l.a : 'adult');
const POSES = new Set(['stand', 'walk', 'bow', 'hold', 'kneel', 'kneelbow', 'sit', 'pull', 'reach', 'bench', 'chant', 'pick', 'water', 'sweep']);
const num = (v, a, b, d = 0) => (typeof v === 'number' && isFinite(v) ? clamp(v, a, b) : d);

function netSend(msg) {
  if (!net.on) return;
  if (net.host) { msg = Object.assign({ from: 'h' }, msg); if (msg.t === 'ev') broadcast(msg); }
  else if (net.conn && net.conn.open) try { net.conn.send(msg); } catch (e) {}
}
function broadcast(msg, except) { for (const c of net.conns.keys()) if (c !== except && c.open) try { c.send(msg); } catch (e) {} }
function stOf(p) { return [p.x | 0, p.dir < 0 ? -1 : 1, POSES.has(p.pose) ? p.pose : 'stand', +(p.bow || 0).toFixed(2), p.y | 0, SCENE_IDS.indexOf(p.scene), p.back ? 1 : p.front ? 2 : 0]; }
function netTick(dt) {
  if (!net.on) return;
  net.sendT -= dt;
  if (net.sendT > 0) return;
  net.sendT = .1;
  if (net.host) {
    // khách im lặng quá 8 giây (tắt tab, mất mạng) thì coi như đã rời
    const tnow = performance.now();
    for (const [c, id] of net.conns) { const r = remotes.get(id); if (r && tnow - r.seen > 8000) { c._lost && c._lost(); try { c.close(); } catch (e) {} } }
    const l = [['h', ...stOf(me)]];
    for (const [id, r] of remotes) l.push([id, r.tx | 0, r.dir, r.pose, +(r.bowT || 0).toFixed(2), r.ty | 0, SCENE_IDS.indexOf(r.scene), r.back ? 1 : r.front ? 2 : 0]);
    broadcast({ t: 'ps', l });
  } else if (net.conn && net.conn.open) {
    const st = stOf(me), sig = st.join(',');
    net.hb = (net.hb || 0) + 1;
    if (sig !== net.lastSt || net.hb > 10) { net.lastSt = sig; net.hb = 0; try { net.conn.send({ t: 'st', s: st }); } catch (e) {} }
  }
}
function addRemote(id, name, look, x) {
  if (id === net.myId) return null;
  let r = remotes.get(id);
  if (!r) {
    let h = 0; for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) % 997;
    const sx = 1260 + (h % 80);
    r = { id, name, look: validLook(look), scene: 'out', x: sx, tx: sx, y: 2290, ty: 2290, dir: 1, back: true, ph: 0, pose: 'stand', bow: 0, bowT: 0 };
    remotes.set(id, r);
    if (started) toast(`🙏 ${esc(r.name)} đã vào chùa.`);
  } else { r.name = name; r.look = validLook(look); }
  updateHud();
  return r;
}
function applySt(r, s) {
  if (!r || !Array.isArray(s)) return;
  r.tx = num(s[0], 0, 2600, r.tx); r.dir = s[1] < 0 ? -1 : 1; r.pose = POSES.has(s[2]) ? s[2] : 'stand'; r.bowT = num(s[3], 0, 1); r.ty = num(s[4], 0, 2400, r.ty);
  r.scene = SCENE_IDS[s[5]] || 'out'; if (r.pose !== 'walk') { r.back = s[6] === 1; r.front = s[6] === 2; }
  if (r.pose === 'hold') { r.held = 'incense'; r.heldN = 3; } else r.held = r.pose === 'water' ? 'can' : null;
  r.pour = r.pose === 'water' ? { x: POUR_DX - 3, y: -31 } : null;
}
// áp dụng sự kiện từ người khác
function applyEv(from, d) {
  const r = remotes.get(from);
  const who = r ? r.name : 'Bạn';
  switch (d.k) {
    case 'bell': { const p = num(d.p, .1, 1, .5); bell.byNpc = true; strikeBell(p, false); sndBell(p, BELL_POS); break; }
    case 'incense': addIncense(num(d.n, 1, 5, 3) | 0, num(d.x, CENSER_X - 25, CENSER_X + 25, CENSER_X), from); break;
    case 'offer': if (Array.isArray(d.items)) d.items.forEach(i => OFFERABLE.includes(i) && altar.add(i)); break;
    case 'ribbon': {
      const slot = num(d.slot, 0, RIBBON_SLOTS.length - 1) | 0, color = RIB_COLORS[d.color] ? d.color : 'red';
      otherRibbons.push({ slot, color, text: cleanText(d.text, 80), name: who }); while (otherRibbons.length > 60) otherRibbons.shift();
      break;
    }
    case 'fish': { let x = num(d.x, 0, 2600, POND.cx), y = num(d.y, 0, 2400, POND.cy); if (!inPond(x, y, 20)) ({ x, y } = pondPointNear(x, y, 50)); const type = ['koi', 'gold', 'turtle'].includes(d.type) ? d.type : 'koi'; releaseFish(x - 40, y - 30, x, y, type, false); break; }
    case 'lantern': addLantern(...pondXY(d.x, d.y), ['pink', 'gold', 'white'].includes(d.col) ? d.col : 'pink', cleanText(d.text, 60), who); break;
    case 'say': if (r) say(r, cleanText(d.text, 80) || '🙏'); break;
    case 'mo': if (r && r.scene === me.scene) sndMo(.45, r.x); break;
    case 'bowl': if (r && r.scene === me.scene) sndBowl(.25, r.x); break;
  }
}
function pondXY(x, y) { x = num(x, 0, 2600, POND.cx); y = num(y, 0, 2400, POND.cy); if (!inPond(x, y, 24)) ({ x, y } = pondPointNear(x, y, 40)); return [x, y]; }
function snapshot() {
  const ribbons = [...S.ribbons.map(r => ({ slot: r.slot, color: r.color, text: r.text, name: me.name })), ...otherRibbons].slice(-60);
  return {
    ribbons, altar: [...altar],
    lanterns: lanterns.map(l => ({ x: l.x | 0, y: l.y | 0, col: l.col, text: l.text, name: l.name })),
    incense: incense.filter(s => T - s.t0 < s.life).map(s => ({ x: s.x | 0, n: s.n, age: Math.round(T - s.t0) })),
  };
}
function applySnapshot(w) {
  if (!w || typeof w !== 'object') return;
  if (Array.isArray(w.ribbons)) for (const r of w.ribbons.slice(-60)) otherRibbons.push({ slot: num(r.slot, 0, RIBBON_SLOTS.length - 1) | 0, color: RIB_COLORS[r.color] ? r.color : 'red', text: cleanText(r.text, 80), name: cleanText(r.name, 16) });
  if (Array.isArray(w.altar)) w.altar.forEach(i => OFFERABLE.includes(i) && altar.add(i));
  if (Array.isArray(w.lanterns)) for (const l of w.lanterns.slice(-28)) addLantern(...pondXY(l.x, l.y), ['pink', 'gold', 'white'].includes(l.col) ? l.col : 'pink', cleanText(l.text, 60), cleanText(l.name, 16));
  if (Array.isArray(w.incense)) for (const s of w.incense.slice(-20)) { addIncense(num(s.n, 1, 5, 3) | 0, num(s.x, CENSER_X - 25, CENSER_X + 25, CENSER_X), 'x'); incense[incense.length - 1].t0 = T - num(s.age, 0, 300); }
}

  if (net.on) return openRoomInfo();
  openSheet(`<h2>Đi chùa cùng bạn bè</h2><div class="sub">Tạo phòng rồi gửi link cho người thân, bạn bè. Mọi người sẽ thấy nhau đi lại, nghe tiếng chuông, thấy hương và hoa đăng của nhau.</div>
    <div class="row" style="margin-top:4px"><button class="btn" id="nHost">🛕 Tạo phòng mới</button></div>

function openRoomInfo() {
  const people = [`<span><i style="background:#ffe08a"></i>${esc(me.name)} (bạn)</span>`, ...[...remotes.values()].map(r => `<span><i style="background:${r.look.robe.c}"></i>${esc(r.name)}</span>`)].join('');
  openSheet(`<h2>Phòng ${net.host ? 'của bạn' : 'đi chùa'}</h2><div class="sub">${net.host ? 'Gửi mã hoặc link này cho bạn bè để cùng vào chùa.' : 'Bạn đang đi chùa cùng mọi người.'}</div>
    <div class="code-big">${showCode(net.code)}</div>

    <div class="row"><button class="btn gold" id="nCopy">🔗 Sao chép link mời</button>${navigator.share ? '<button class="btn alt" id="nShare">📤 Chia sẻ</button>' : ''}</div>

  q('#nCopy').onclick = async () => { try { await navigator.clipboard.writeText(inviteUrl()); q('#nCopy').textContent = '✓ Đã sao chép'; } catch (e) { prompt('Sao chép link này:', inviteUrl()); } };
  if (q('#nShare')) q('#nShare').onclick = () => navigator.share({ title: 'Đi chùa online cùng mình', text: `Vào ${TEMPLE.name} đi chùa cùng mình nhé 🙏`, url: inviteUrl() }).catch(() => {});
  q('#nLeave').onclick = () => { leaveOnline(); closeSheet(); toast('Bạn đã rời phòng, tiếp tục đi chùa một mình.'); };
}
function netStatus(emoji, title, msg, retry) {
  openSheet(`<div style="text-align:center;font-size:40px">${emoji}</div><h2>${title}</h2><div class="sub">${msg}</div>
    <div class="row">${retry ? '<button class="btn" id="nRetry">Thử lại</button>' : ''}<button class="btn alt" id="nCancel">${retry ? 'Đi một mình' : 'Huỷ'}</button></div>`);
  if (retry) q('#nRetry').onclick = retry;
  q('#nCancel').onclick = () => { leaveOnline(); closeSheet(); };
}
function closeNet() {
  clearTimeout(net.timer);
  if (net.conn) { try { net.conn.send({ t: 'bye' }); net.conn.close(); } catch (e) {} }
  for (const c of net.conns.keys()) { try { c.send({ t: 'bye' }); c.close(); } catch (e) {} }
  if (net.peer) try { net.peer.destroy(); } catch (e) {}
}
function leaveOnline() {
  closeNet(); net = freshNet(); remotes.clear(); otherRibbons.length = 0;
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  updateHud();
}
function startNet(host, code) { closeNet(); remotes.clear(); net = freshNet(); net.on = true; net.host = host; net.code = code; return net; }

async function hostOnline(tries = 0) {
  const n = startNet(true, randCode());
  n.myId = 'h'; n.nextId = 1;
  netStatus('🛕', 'Đang tạo phòng', 'Đang kết nối máy chủ tìm bạn…');
  try { await loadPeerJs(); } catch (e) { if (net === n) netStatus('😕', 'Không tải được', 'Không tải được phần chơi online. Kiểm tra mạng rồi thử lại nhé.', () => hostOnline()); return; }
  if (net !== n) return;
  const peer = n.peer = new Peer(ROOM_PREFIX + n.code, { debug: 0 });
  let opened = false;
  peer.on('open', () => {
    if (net !== n) return; opened = true;
    history.replaceState(null, '', location.pathname + location.search + '#room=' + n.code);
    updateHud(); openRoomInfo();
  });
  peer.on('connection', c => {
    if (net !== n) return c.close();
    c.on('data', d => { if (net === n) hostMsg(c, d); });
    const lost = () => {
      if (net !== n || !n.conns.has(c)) return;
      const id = n.conns.get(c); n.conns.delete(c);
      const r = remotes.get(id); remotes.delete(id);
      broadcast({ t: 'leave', id });
      if (r) toast(`${esc(r.name)} đã rời chùa.`);
      updateHud();
    };
    c._lost = lost;
    c.on('close', lost); c.on('error', lost);
  });
  peer.on('disconnected', () => setTimeout(() => { if (net === n && !peer.destroyed && peer.disconnected) peer.reconnect(); }, 1500));
  peer.on('error', err => {
    if (net !== n) return;
    if (err.type === 'unavailable-id' && tries < 3) return hostOnline(tries + 1);
    if (opened) return;
    netStatus('😕', 'Không tạo được phòng', err.type === 'browser-incompatible' ? 'Trình duyệt này không hỗ trợ chơi online. Thử Chrome, Safari hoặc Firefox bản mới nhé.' : 'Không kết nối được máy chủ tìm bạn. Kiểm tra mạng rồi thử lại nhé.', () => hostOnline());
  });
}
function hostMsg(c, d) {
  if (!d || typeof d !== 'object') return;
  if (d.t === 'hello') {
    if (net.conns.has(c)) return;
    if (net.conns.size >= 11) { try { c.send({ t: 'full' }); } catch (e) {} setTimeout(() => c.close(), 400); return; }
    const id = 'g' + net.nextId++, name = cleanText(d.name, 16) || 'Bạn ' + id.slice(1);
    net.conns.set(c, id);
    const r = addRemote(id, name, d.look, 170);
    r.seen = performance.now();
    const players = [{ id: 'h', name: me.name, look: myLook() }, ...[...remotes.values()].filter(p => p.id !== id).map(p => ({ id: p.id, name: p.name, look: { r: ROBES.indexOf(p.look.robe), h: p.look.hair, g: p.look.gender, a: p.look.age } }))];
    try { c.send({ t: 'welcome', id, players, world: snapshot(), temple: TEMPLE.id, tod: todIdx }); } catch (e) {}
    broadcast({ t: 'join', id, name, look: { r: ROBES.indexOf(r.look.robe), h: r.look.hair, g: r.look.gender, a: r.look.age }, x: 170 }, c);
    return;
  }
  const id = net.conns.get(c); if (!id) return;
  const r = remotes.get(id);
  if (r) r.seen = performance.now();
  if (d.t === 'st') applySt(r, d.s);
  else if (d.t === 'ev' && typeof d.k === 'string') { applyEv(id, d); broadcast(Object.assign({}, d, { from: id }), c); }
  else if (d.t === 'bye') c.close();
}
async function joinOnline(code) {
  const n = startNet(false, code);
  netStatus('🌐', 'Đang vào phòng', `Đang tìm phòng <b>${showCode(code)}</b>…`);
  const retry = () => joinOnline(code);
  try { await loadPeerJs(); } catch (e) { if (net === n) netStatus('😕', 'Không tải được', 'Không tải được phần chơi online. Kiểm tra mạng rồi thử lại nhé.', retry); return; }
  if (net !== n) return;
  const peer = n.peer = new Peer({ debug: 0 });
  n.timer = setTimeout(() => { if (net === n && !n.conn) netStatus('😕', 'Không nối được', 'Không nối được với chủ phòng. Có thể mạng chặn kết nối trực tiếp, thử đổi wifi hoặc 4G nhé.', retry); }, 20000);
  peer.on('open', () => {
    if (net !== n) return;
    const c = peer.connect(ROOM_PREFIX + code, { reliable: true });
    c.on('open', () => { if (net !== n) return c.close(); clearTimeout(n.timer); n.conn = c; c.send({ t: 'hello', name: me.name, look: myLook() }); });
    c.on('data', d => { if (net === n && n.conn === c) guestMsg(d); });
    const lost = () => {
      if (net !== n || n.conn !== c) return;
      n.conn = null; remotes.clear(); updateHud();
      netStatus('😕', 'Mất kết nối', n.closed ? 'Chủ phòng đã đóng phòng.' : 'Mất kết nối với chủ phòng.', n.closed ? null : retry);
    };
    c.on('close', lost); c.on('error', lost);
  });
  peer.on('error', err => {
    if (net !== n || n.conn) return;
    clearTimeout(n.timer);
    if (err.type === 'peer-unavailable') netStatus('🔍', 'Không tìm thấy phòng', `Không có phòng nào mang mã <b>${showCode(code)}</b>. Kiểm tra lại mã, hoặc chủ phòng đã thoát.`, () => { leaveOnline(); openNetMenu(showCode(code)); });
    else netStatus('😕', 'Không vào được phòng', 'Không kết nối được máy chủ tìm bạn. Kiểm tra mạng rồi thử lại nhé.', retry);
  });
}
function guestMsg(d) {
  if (!d || typeof d !== 'object') return;
  if (d.t === 'welcome') {
    net.myId = String(d.id || 'x');
    history.replaceState(null, '', location.pathname + location.search + '#room=' + net.code);
    remotes.clear();
    if (Array.isArray(d.players)) for (const p of d.players.slice(0, 12)) addRemote(String(p.id), cleanText(p.name, 16) || 'Bạn', p.look, p.x);
    if (typeof d.temple === 'string' && d.temple !== TEMPLE.id && TEMPLES.some(t => t.id === d.temple)) { setTemple(d.temple); toast(`🛕 Chủ phòng đang ở ${esc(TEMPLE.name)}, bạn đã vào cùng.`, 4500); }
    applySnapshot(d.world);
    if (Number.isInteger(d.tod)) setTod(d.tod, true);
    closeSheet(); updateHud();
    toast(`🛕 Đã vào phòng ${showCode(net.code)} cùng ${remotes.size} người.`);
  } else if (d.t === 'join') addRemote(String(d.id), cleanText(d.name, 16) || 'Bạn', d.look, d.x);
  else if (d.t === 'leave') { const r = remotes.get(String(d.id)); remotes.delete(String(d.id)); if (r) toast(`${esc(r.name)} đã rời chùa.`); updateHud(); }
  else if (d.t === 'ps' && Array.isArray(d.l)) {
    for (const row of d.l.slice(0, 12)) { if (!Array.isArray(row)) continue; const id = String(row[0]); if (id === net.myId) continue; applySt(remotes.get(id), row.slice(1)); }
  } else if (d.t === 'ev' && typeof d.k === 'string') { if (String(d.from) !== net.myId) applyEv(String(d.from), d); }
  else if (d.t === 'tod' && Number.isInteger(d.i)) { if (d.i !== todIdx) { setTod(d.i, true); toast(`${TODS[todIdx].ic} Chủ phòng đã chuyển sang ${TODS[todIdx].n.toLowerCase()}`, 2200); } }
  else if (d.t === 'full') netStatus('🙏', 'Phòng đã đủ người', 'Phòng này đã đủ 12 người. Bạn có thể tạo phòng riêng nhé.', null);
  else if (d.t === 'bye') net.closed = true;
}

// chùa Một Cột: điện vuông trên một cột đá giữa hồ, cầu thang gạch bên trái
function drawOnePillar(g) {

// nhà phố Sài Gòn (nhà ống), toà nhà cao phía sau
function drawHouse(g, seed, tall) {
  const r = seeded(seed * 3 + 7), y = GROUND, w = 100 + r() * 40, h = tall ? 230 + r() * 80 : 150 + r() * 90, x0 = -w / 2;
  const col = pick(['#f2d27a', '#e8a58a', '#a9cfe0', '#f4efe2', '#c9e0b0', '#e8c4d8']);
  g.fillStyle = 'rgba(0,0,0,.2)'; g.fillRect(x0 + 6, y - 6, w, 8);
  g.fillStyle = grad(g, x0, 0, x0 + w, 0, [shade(col, .92), col, shade(col, .85)]); g.fillRect(x0, y - h, w, h);
  g.fillStyle = shade(col, .7); g.fillRect(x0 - 3, y - h - 8, w + 6, 10);
  const floors = Math.floor((h - 50) / 48);
  for (let f = 0; f < floors; f++) {
    const fy = y - 60 - f * 48;
    for (let k = 0; k < 2; k++) { const wx = x0 + w * (.18 + k * .42); g.fillStyle = '#3a4a5a'; g.fillRect(wx, fy - 30, w * .24, 26); g.fillStyle = 'rgba(200,230,250,.4)'; g.fillRect(wx + 2, fy - 28, w * .1, 22); g.fillStyle = pick(['#3a7a5a', '#7a4a3a', '#5a5a7a']); g.fillRect(wx - 4, fy - 30, 4, 26); g.fillRect(wx + w * .24, fy - 30, 4, 26); }
    g.fillStyle = '#5a5048'; g.fillRect(x0 + 6, fy, w - 12, 3); for (let x = x0 + 8; x < x0 + w - 8; x += 6) g.fillRect(x, fy - 10, 1.5, 10);
    if (r() < .6) { g.fillStyle = '#4a8a3a'; g.beginPath(); g.arc(x0 + 14 + r() * (w - 28), fy - 4, 6, 0, TAU); g.fill(); }
  }
  g.fillStyle = '#2a2a30'; g.fillRect(x0 + 10, y - 46, w - 20, 46);
  g.fillStyle = pick(['#c0392b', '#2a7ab8', '#e8a020', '#2f9f6f']); g.fillRect(x0 + 6, y - 56, w - 12, 14);
  g.fillStyle = 'rgba(255,255,255,.85)'; for (let x = x0 + 14; x < x0 + w - 16; x += 9) g.fillRect(x, y - 51, 5, 4);
}
// xe máy đỗ bên đường
function drawBike(g, seed) {
